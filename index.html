."}, "117": {"Man hat weniger Kontrolle über Daten und Hardware": "In der Private Cloud hat man mehr Kontrolle über Daten und Hardware, nicht weniger.", "Sie bringt grundsätzlich DSGVO-Probleme mit sich": "Die Private Cloud erleichtert eher die DSGVO-Einhaltung, weil Daten im eigenen Haus bleiben.", "Man ist stärker vom Cloud-Anbieter abhängig": "Abhängigkeit vom Anbieter (Lock-in) ist eher ein Nachteil der Public Cloud."}, "118": {"Vertraulichkeit": "Vertraulichkeit betrifft unbefugtes Lesen; Ransomware zielt vor allem aufs Unbenutzbarmachen.", "Integrität": "Integrität betrifft unbemerkte Veränderung; Ransomware verschlüsselt offen, um den Zugriff zu sperren.", "Authentizität": "Authentizität betrifft die Echtheit von Absender oder Daten, nicht deren Nutzbarkeit."}, "119": {"Verfügbarkeit": "Verfügbarkeit leidet z. B. durch DDoS; Sniffing liest nur mit und stört nichts.", "Integrität": "Integrität wäre verletzt, wenn Daten verändert würden – Sniffing liest nur passiv mit.", "Authentizität": "Authentizität wird z. B. durch Spoofing angegriffen, nicht durch bloßes Mitlesen."}, "120": {"Verfügbarkeit": "Verfügbarkeit sichert man mit Redundanz, Backups und USV, nicht mit Hashes.", "Vertraulichkeit": "Vertraulichkeit sichert Verschlüsselung; ein Hash verbirgt keine Daten.", "Authentizität": "Für Authentizität braucht es zusätzlich einen Schlüssel (Signatur, HMAC)."}, "121": {"Virus": "Ein Virus braucht ein Wirtsprogramm und verbreitet sich erst, wenn dieses ausgeführt wird.", "Trojaner": "Ein Trojaner tarnt sich als nützliches Programm und verbreitet sich nicht selbst.", "Scareware": "Scareware erschreckt Nutzer mit falschen Warnungen, um sie zu Kauf oder Klick zu bringen."}, "122": {"Zero-Day-Exploits (unbekannte Lücken)": "Zero-Day-Exploits sind gefährlich, aber vergleichsweise selten.", "DDoS-Angriffe auf Webserver": "DDoS-Angriffe stören die Verfügbarkeit, sind aber nicht die häufigste Ursache.", "Honeypots im Firmennetz": "Honeypots sind Abwehrwerkzeuge, keine Ursache von Sicherheitsvorfällen."}, "123": {"RSA": "RSA ist ein asymmetrisches Verfahren mit Public und Private Key.", "ECC": "ECC (elliptische Kurven) ist ein asymmetrisches Verfahren.", "SHA-256": "SHA-256 ist eine Hashfunktion, kein Verschlüsselungsverfahren."}, "124": {"Mit Bobs Private Key": "Bobs Private Key kennt nur Bob – damit entschlüsselt oder signiert er.", "Mit dem eigenen Private Key": "Mit dem eigenen Private Key signiert man; jeder könnte mit dem Public Key entschlüsseln.", "Mit dem eigenen Public Key": "Mit dem eigenen Public Key Verschlüsseltes könnte Bob nicht entschlüsseln."}, "125": {"Hash mit dem Public Key des Empfängers verschlüsseln": "Mit dem Public Key des Empfängers verschlüsselt man vertrauliche Daten – das ist keine Signatur.", "Nachricht mit dem eigenen Public Key verschlüsseln": "Was man mit dem eigenen Public Key verschlüsselt, kann nur man selbst öffnen – kein Herkunftsnachweis.", "Hash bilden und mit dem Sitzungsschlüssel (AES) verschlüsseln": "Ein Sitzungsschlüssel ist symmetrisch und beweist nicht, wer unterschrieben hat."}, "126": {"10": "10 wäre ein Schlüssel pro Person – symmetrisch braucht aber jedes Paar einen eigenen.", "20": "20 Schlüssel (2 je Person) bräuchte man asymmetrisch.", "90": "90 = 10 × 9 zählt jedes Paar doppelt – es fehlt das Teilen durch 2."}, "127": {"AES alleine": "AES allein ist rein symmetrisch – das Problem des Schlüsselaustauschs bleibt.", "RSA alleine": "RSA allein ist asymmetrisch und für große Datenmengen zu langsam.", "Diffie-Hellman alleine": "Diffie-Hellman tauscht nur einen Schlüssel aus und verschlüsselt selbst keine Daten."}, "128": {"Man wählt bei mehreren Möglichkeiten immer die teuerste Maßnahme": "Das Maximumprinzip bezieht sich auf den Schutzbedarf, nicht auf die Kosten von Maßnahmen.", "Es gilt der Durchschnitt des Schutzbedarfs aller Anwendungen": "Ein Durchschnitt würde hohen Schutzbedarf verwässern – genau das soll vermieden werden.", "Redundanz senkt den Schutzbedarf automatisch eine Stufe": "Eine Absenkung durch Redundanz ist der Verteilungseffekt und muss begründet werden."}, "129": {"SHA-256": "SHA-256 gehört zur SHA-2-Familie und gilt als sicher.", "SHA-384": "SHA-384 gehört zur SHA-2-Familie und gilt als sicher.", "SHA-512": "SHA-512 gehört zur SHA-2-Familie und gilt als sicher."}, "130": {"Ein Passwort-Tresor für Administratoren": "Ein Passwort-Tresor ist ein Passwortmanager.", "Ein Virenscanner für E-Mail-Anhänge": "Virenscanner für Anhänge sind Mail-Gateways bzw. Antivirus-Lösungen.", "Eine Backup-Methode mit Köderdateien": "Köderdateien gegen Ransomware (Canary-Dateien) sind ein Frühwarnsystem, keine Backup-Methode."}, "131": {"Die Registrierungsstelle (RA)": "Die RA prüft die Identität des Antragstellers, signiert aber nicht selbst.", "Der Domain-Registrar (DENIC)": "DENIC vergibt .de-Domains, keine Zertifikate.", "Der Browserhersteller (Root Store)": "Browserhersteller pflegen nur Listen vertrauenswürdiger Root-CAs."}, "132": {"Ein Angriff, der am selben Tag erkannt und sofort gepatcht wird": "Am selben Tag gepatcht hieße: Der Hersteller hatte schon eine Lösung – das ist kein Zero-Day.", "Eine Lücke, die seit Jahren bekannt ist und längst gepatcht wurde": "Lange bekannte, gepatchte Lücken nennt man N-Day bzw. bekannte Schwachstellen.", "Ein Exploit, der nur am Tag der Veröffentlichung eines Patches wirkt": "Zero-Day bedeutet null Tage Vorlauf für den Hersteller, nicht einen Patch-Tag."}, "133": {"IDS blockiert Angriffe aktiv, Honeypot meldet sie nur an die Firewall": "Aktives Blockieren macht ein IPS; ein Honeypot lockt an und beobachtet.", "IDS lockt Angreifer an, Honeypot überwacht den gesamten Netzverkehr": "Die Rollen sind vertauscht – das IDS überwacht, der Honeypot ist der Köder.", "IDS prüft nur Mails auf Malware, Honeypot nur den Webverkehr": "Ein IDS überwacht Netz- oder Hostverkehr allgemein, nicht nur Mails."}, "134": {"1. Januar 2016": "Am 1.1.2016 galt noch das alte Recht; die DSGVO trat erst im Mai 2016 in Kraft.", "25. Mai 2020": "2020 ist zwei Jahre zu spät – da wurde nur der erste Evaluierungsbericht fällig.", "1. Januar 2018": "Anfang 2018 lief noch die Übergangsfrist; sie endete erst im Mai."}, "135": {"24 Stunden": "24 Stunden ist strenger als die DSGVO – so kurz sind z. B. Frühwarnungen nach NIS2.", "7 Tagen": "7 Tage sind zu lang – die DSGVO verlangt eine Meldung binnen drei Tagen.", "30 Tagen": "Rund 30 Tage (1 Monat) gelten für Auskunftsersuchen Betroffener, nicht für Datenpannen."}, "136": {"Bis 300.000 € unabhängig vom Umsatz": "300.000 € war die Obergrenze im alten BDSG vor der DSGVO.", "Bis 10 Mio. € oder 2 % des Jahresumsatzes": "10 Mio. € oder 2 % gelten für weniger schwere Verstöße (Art. 83 Abs. 4).", "Bis 1 Mio. € oder 1 % des Jahresumsatzes": "1 Mio. € oder 1 % ist in der DSGVO keine Bußgeldstufe."}, "137": {"Nein": "Über den Provider lässt sich die Person hinter einer IP ermitteln – das macht sie personenbezogen.", "Nur bei IPv6": "Auch IPv4-Adressen sind personenbezogen, wenn eine Zuordnung möglich ist.", "Nur wenn statisch": "Auch dynamische IP-Adressen gelten laut EuGH als personenbezogen."}, "138": {"Zugangskontrolle": "Zugangskontrolle betrifft die Anmeldung an IT-Systemen, nicht das Betreten von Räumen.", "Zugriffskontrolle": "Zugriffskontrolle regelt Rechte auf Daten innerhalb der Systeme.", "Weitergabekontrolle": "Weitergabekontrolle schützt Daten bei Übertragung und Transport."}, "139": {"Zutrittskontrolle": "Zutrittskontrolle betrifft den physischen Zutritt zu Räumen, z. B. Schlüssel und Pförtner.", "Zugriffskontrolle": "Zugriffskontrolle setzt nach dem Login an und regelt Rechte auf Daten.", "Eingabekontrolle": "Eingabekontrolle protokolliert Änderungen an Daten, sie regelt keinen Login."}, "140": {"Zugangskontrolle": "Zugangskontrolle regelt, ob man sich anmelden darf, nicht welche Daten man sieht.", "Zutrittskontrolle": "Zutrittskontrolle betrifft den physischen Zutritt zu Räumen.", "Trennungsgebot": "Das Trennungsgebot verlangt die getrennte Verarbeitung von Daten unterschiedlicher Zwecke."}, "141": {"Weitergabekontrolle": "Weitergabekontrolle schützt Daten bei Übertragung und Transport.", "Auftragskontrolle": "Auftragskontrolle sichert die weisungsgemäße Verarbeitung durch Dienstleister.", "Verfügbarkeitskontrolle": "Verfügbarkeitskontrolle schützt vor Datenverlust, z. B. durch Backup und USV."}, "142": {"Weitergabekontrolle": "Weitergabekontrolle sichert die Übertragung, nicht die vertragliche Bindung eines Dienstleisters.", "Eingabekontrolle": "Eingabekontrolle protokolliert, wer Daten eingegeben oder geändert hat.", "Zutrittskontrolle": "Zutrittskontrolle betrifft den physischen Zutritt zu Räumen."}, "143": {"Daten vor dem Speichern komprimieren und deduplizieren": "Komprimieren spart Speicherplatz, reduziert aber nicht die Menge personenbezogener Angaben.", "Personenbezogene Daten nur verschlüsselt speichern": "Verschlüsselung ist eine Schutzmaßnahme (TOM), keine Minimierung.", "Nur besonders sensible Daten (Art. 9) erfassen": "Art.-9-Daten sind besonders geschützt und sollten gerade möglichst wenig erhoben werden."}, "144": {"Nie – eine Löschung muss immer sofort erfolgen": "Das Recht auf Löschung hat Ausnahmen, z. B. gesetzliche Aufbewahrungspflichten.", "Wenn der Aufwand für die Löschung zu hoch ist": "Hoher Aufwand ist kein zulässiger Grund, eine Löschung zu verweigern.", "Wenn die Daten älter als ein Jahr sind": "Das Alter der Daten ist kein Ablehnungsgrund – eher ein Grund zum Löschen."}, "145": {"Alle Daten des Unternehmens vor Verlust": "Schutz aller Unternehmensdaten vor Verlust ist Aufgabe von Datensicherheit und Backup.", "Die IT-Systeme vor Ausfall und Angriffen": "Schutz der IT-Systeme vor Ausfall und Angriffen ist IT-Sicherheit.", "Geschäftsgeheimnisse vor der Konkurrenz": "Geschäftsgeheimnisse schützt das Geschäftsgeheimnisgesetz, nicht der Datenschutz."}, "146": {"Zugangskontrolle": "Zugangskontrolle betrifft die Anmeldung an IT-Systemen.", "Eingabekontrolle": "Eingabekontrolle protokolliert, wer Daten eingegeben oder geändert hat.", "Trennungsgebot": "Das Trennungsgebot verlangt die getrennte Verarbeitung von Daten unterschiedlicher Zwecke."}, "147": {"Kopfgesteuerte Schleife (SOLANGE … TUE)": "Kopfgesteuerte Schleifen prüfen vorher und können 0-mal laufen.", "Zählschleife (FÜR i VON 1 BIS n)": "Eine Zählschleife mit n = 0 läuft gar nicht, weil sie vor jedem Durchlauf prüft.", "Foreach-Schleife (FÜR JEDES … IN)": "Eine Foreach-Schleife über eine leere Menge läuft 0-mal."}, "148": {"Rechteck": "Das Rechteck steht im PAP für eine Operation bzw. Verarbeitung.", "Oval": "Das Oval kennzeichnet Start und Ende (Grenzstelle).", "Parallelogramm": "Das Parallelogramm steht für Ein- und Ausgabe."}, "149": {"Raute": "Die Raute steht im PAP für eine Verzweigung.", "Kreis": "Der Kreis ist eine Übergangsstelle (Konnektor) zwischen Diagrammteilen.", "Rechteck": "Das Rechteck steht für eine Operation bzw. Verarbeitung."}, "150": {"Schleifen": "Schleifen sind im Struktogramm als eigene Blöcke vorgesehen (kopf- und fußgesteuert).", "Verzweigungen": "Verzweigungen stellt man als Block mit Dreieck und Ja/Nein-Spalten dar.", "Sequenzen": "Sequenzen sind die einfachsten Blöcke – Rechtecke untereinander."}, "151": {"Integer": "Integer speichert ganze Zahlen.", "String": "String speichert Zeichenketten.", "Float": "Float speichert Gleitkommazahlen."}, "152": {"Zeilen vor dem Gruppieren": "Zeilen vor dem Gruppieren filtert WHERE.", "Spalten nach dem SELECT": "Spalten wählt man im SELECT aus – HAVING filtert keine Spalten.", "Sortierte Zeilen nach ORDER BY": "ORDER BY sortiert nur das Ergebnis und steht nach HAVING."}, "153": {"Fehlermeldung, WHERE ist Pflicht": "WHERE ist in SQL optional – deshalb ist DELETE ohne WHERE so gefährlich.", "Nur die erste Zeile wird gelöscht": "DELETE ohne Bedingung begrenzt nichts auf eine einzelne Zeile.", "Die Tabelle samt Struktur wird entfernt": "Tabelle samt Struktur entfernt DROP TABLE; DELETE lässt die Struktur stehen."}, "154": {"Auf eine andere Datenbank auf demselben Server": "Fremdschlüssel verweisen auf Tabellen in derselben Datenbank, nicht auf andere Datenbanken.", "Auf eine andere Spalte in derselben Zeile": "Ein Bezug auf eine Spalte derselben Zeile ist kein Fremdschlüssel.", "Auf einen Index derselben Tabelle": "Ein Index beschleunigt Suchen, ist aber kein Ziel eines Fremdschlüssels."}, "155": {"SUM": "SUM addiert die Werte einer Spalte.", "MAX": "MAX liefert den größten Wert einer Spalte.", "AVG": "AVG berechnet den Durchschnitt einer Spalte."}, "156": {"UPDATE SET": "UPDATE … SET ändert vorhandene Datensätze.", "ALTER TABLE": "ALTER TABLE ändert die Struktur der Tabelle, z. B. Spalten.", "ADD ROW INTO": "ADD ROW INTO gibt es in SQL nicht."}, "157": {"Variable, Funktion, Klasse": "Variable, Funktion und Klasse sind Programmbausteine, keine Kontrollstrukturen.", "Eingabe, Verarbeitung, Ausgabe": "Eingabe, Verarbeitung, Ausgabe ist das EVA-Prinzip.", "Anweisung, Sprung, Unterprogramm": "Sprünge (GOTO) sind in der strukturierten Programmierung gerade verpönt."}, "158": {"Mindestens 1-mal": "Mindestens 1-mal gilt für fußgesteuerte Schleifen.", "Genau 1-mal": "Genau 1-mal ist bei keiner Schleifenart garantiert – sie hängt von der Bedingung ab.", "Mindestens 2-mal": "Mindestens 2-mal ist bei keiner Schleifenart garantiert."}, "159": {"Der Auftragnehmer (Wie und womit)": "Der Auftragnehmer schreibt das Pflichtenheft (Wie und womit).", "Der Projektleiter des Lieferanten": "Der Projektleiter des Lieferanten steht auf Auftragnehmerseite.", "Der Lenkungsausschuss": "Der Lenkungsausschuss entscheidet und steuert, schreibt aber keine Anforderungen."}, "160": {"Was der Kunde will (Anforderungen aus Kundensicht)": "Was der Kunde will, steht im Lastenheft.", "Die Rechnungen und Zahlungsfristen des Projekts": "Rechnungen und Zahlungsfristen gehören in Vertrag und Buchhaltung.", "Die Arbeitszeiten und Urlaube des Projektteams": "Arbeitszeiten und Urlaube regelt die Ressourcenplanung."}, "161": {"Zeit, Personal, Risiko": "Personal und Risiko sind wichtige Größen, gehören aber nicht zum magischen Dreieck.", "Kosten, Nutzen, Risiko": "Kosten, Nutzen und Risiko sind Themen der Wirtschaftlichkeitsbetrachtung.", "Planung, Steuerung, Kontrolle": "Planung, Steuerung und Kontrolle sind Aufgaben des Projektmanagements."}, "162": {"Modern": "„Modern“ ist kein SMART-Kriterium.", "Machbar": "Die Machbarkeit steckt in A und R (akzeptiert, realistisch), nicht im M.", "Mittelfristig": "Die zeitliche Komponente ist das T (terminiert)."}, "163": {"Alle Vorgänge mit der längsten Einzeldauer": "Die längste Einzeldauer sagt nichts über Puffer aus.", "Alle Vorgänge mit freiem Puffer größer 0": "Vorgänge mit Puffer können sich verschieben – sie sind gerade nicht kritisch.", "Alle Vorgänge mit den höchsten Kosten": "Kosten spielen für den kritischen Pfad keine Rolle, nur Zeiten."}, "164": {"GP = FEZ − FAZ": "FEZ − FAZ ergibt die Dauer des Vorgangs.", "GP = SEZ + Dauer": "SEZ + Dauer ergibt keinen Puffer, sondern einen Zeitpunkt nach dem spätesten Ende.", "GP = FAZ − SEZ": "FAZ − SEZ ergibt meist einen negativen Wert ohne Bedeutung."}, "165": {"FEZ = SAZ − Dauer": "SAZ − Dauer ist keine Netzplanformel; der SAZ selbst ergibt sich aus SEZ − Dauer.", "FEZ = FAZ − Dauer": "Vom frühesten Anfang abzuziehen ergibt einen Zeitpunkt vor dem Start.", "FEZ = SEZ + Dauer": "SEZ gehört zur Rückwärtsrechnung und taugt nicht zur Berechnung des FEZ."}, "166": {"1–2 Tage": "1–2 Tage sind viel zu kurz – täglich findet nur das Daily Scrum statt.", "2–3 Monate": "2–3 Monate wären zu lang für schnelles Feedback.", "6–12 Monate": "6–12 Monate entsprechen klassischen Projektphasen, nicht Sprints."}, "167": {"Es kommt ganz ohne Planungsphase aus": "Auch das V-Modell beginnt mit Anforderungen und Planung.", "Es arbeitet in festen Sprints von 2–4 Wochen": "Feste Sprints gehören zu Scrum.", "Alle Phasen laufen gleichzeitig nebeneinander": "Das V-Modell arbeitet sequenziell, nicht mit parallelen Phasen."}, "168": {"Die Kosten der Vorgänge als Tortendiagramm": "Kostenanteile zeigt man in Torten- oder Balkendiagrammen, nicht im Gantt.", "Die Rollen und Zuständigkeiten im Team": "Rollen und Zuständigkeiten zeigen RACI-Matrix oder Organigramm.", "Den Netzplan mit Puffern und Vorgängern": "Der Netzplan ist eine eigene Darstellung mit Knoten und Puffern."}, "169": {"Größter SAZ aller Nachfolger": "Der größte SAZ würde frühere Nachfolger verspäten – entscheidend ist der früheste Zwang.", "Kleinster FEZ aller Nachfolger": "FEZ gehört zur Vorwärtsrechnung, nicht zur Rückwärtsrechnung.", "Größter FEZ aller Vorgänger": "Die Rückwärtsrechnung blickt auf Nachfolger, nicht Vorgänger, und nutzt keine FEZ."}, "170": {"Es ist einmalig und neuartig": "Einmaligkeit ist ein Kernmerkmal von Projekten.", "Es ist zeitlich begrenzt (Start/Ende)": "Zeitliche Begrenzung ist ein Kernmerkmal von Projekten.", "Es hat ein klares Ziel und Budget": "Klares Ziel und Budget sind typische Projektmerkmale."}, "171": {"Durch die Lieferung der Ware und die Übergabe des Lieferscheins": "Lieferung und Lieferschein erfüllen einen bereits geschlossenen Vertrag.", "Durch das Angebot des Verkäufers allein (eine Willenserklärung)": "Ein Angebot ist nur ein Antrag – ohne Annahme entsteht kein Vertrag.", "Durch die vollständige Bezahlung des vereinbarten Preises": "Die Bezahlung erfüllt den Vertrag, sie schließt ihn nicht."}, "172": {"Freiwilliges Versprechen des Herstellers, meist 2 bis 5 Jahre": "Ein freiwilliges Versprechen des Herstellers ist eine Garantie.", "Rückgabe innerhalb von 14 Tagen ohne Angabe von Gründen": "Rückgabe binnen 14 Tagen ohne Grund ist das Widerrufsrecht bei Fernabsatz.", "Gesetzliche Pflicht, 6 Monate ab Übergabe an Verbraucher": "Die Gewährleistung dauert länger; 6 Monate war die frühere Frist der Beweislastumkehr."}, "173": {"Rücktritt vom Vertrag (Geld zurück)": "Rücktritt ist erst möglich, wenn die Nacherfüllung scheitert.", "Minderung des Kaufpreises": "Minderung ist nachrangig und erst nach gescheiterter Nacherfüllung möglich.", "Schadensersatz statt der Leistung": "Schadensersatz statt der Leistung setzt eine erfolglose Frist zur Nacherfüllung voraus."}, "174": {"50 %": "Bei 50 % wäre die Hälfte der Gewichtung gar nicht vergeben.", "200 %": "Bei 200 % würden Kriterien in Summe doppelt zählen.", "10 %": "Bei 10 % bliebe der Großteil der Gewichtung offen."}, "175": {"Dem Leasingnehmer": "Der Leasingnehmer nutzt das Gerät nur – er ist Besitzer, nicht Eigentümer.", "Dem Hersteller": "Der Hersteller verkauft das Gerät an den Leasinggeber.", "Der Bank des Nutzers": "Die Bank des Nutzers ist am Leasingvertrag nicht beteiligt."}, "176": {"352,00 €": "352 ist der Verbrauch in kWh – der Strompreis ist noch nicht eingerechnet.", "52,80 €": "52,80 € entspricht dem halben Wert, etwa mit 4 h/Tag gerechnet.", "1.056,00 €": "1.056 € ist um den Faktor 10 zu hoch – ein Kommafehler."}, "177": {"Nach ca. 1,6 Jahren": "Ca. 1,6 ergibt sich aus der umgedrehten Division (Ersparnis ÷ Preis) mit Kommafehler.", "Nach ca. 4 Jahren": "4 Jahre ergäben sich erst bei 100 € Ersparnis pro Jahr.", "Nach ca. 10 Jahren": "10 Jahre ergäben sich bei nur 40 € Ersparnis pro Jahr."}, "178": {"Sofortiges Eigentum am Gerät": "Eigentum erhält man bei Miete nie – das bietet nur der Kauf.", "Abschreibung über die Nutzungsdauer": "Abschreiben kann nur der Eigentümer, also beim Kauf.", "Geringste Gesamtkosten über Jahre": "Über lange Zeit ist Miete meist teurer als Kauf."}, "179": {"Angebote ausschließlich nach dem Preis": "Ausschließlich nach Preis vergleicht ein reiner Preis- bzw. Kostenvergleich.", "Angebote nur nach der Lieferzeit": "Nur die Lieferzeit wäre ein einzelnes Kriterium ohne Gewichtung.", "Den Gewinn der einzelnen Lieferanten": "Den Gewinn der Lieferanten kennt der Käufer nicht und bewertet ihn nicht."}, "180": {"Lieferverzug": "Lieferverzug ist eine Störung: Der Verkäufer liefert nicht rechtzeitig.", "Annahmeverzug": "Annahmeverzug ist eine Störung: Der Käufer nimmt die Ware nicht an.", "Zahlungsverzug": "Zahlungsverzug ist eine Störung: Der Käufer zahlt nicht rechtzeitig."}, "181": {"Listeneinkaufspreis − Rabatt": "Listeneinkaufspreis − Rabatt ergibt den Zieleinkaufspreis.", "Selbstkosten + Gewinn": "Selbstkosten + Gewinn ergeben den Barverkaufspreis.", "Zieleinkaufspreis − Skonto": "Zieleinkaufspreis − Skonto ergibt den Bareinkaufspreis."}, "182": {"Vom Listeneinkaufspreis": "Vom Listeneinkaufspreis wird der Rabatt abgezogen.", "Vom Einstandspreis": "Der Einstandspreis enthält schon die Bezugskosten – Skonto ist da längst abgezogen.", "Vom Selbstkostenpreis": "Der Selbstkostenpreis gehört zur Verkaufskalkulation."}, "183": {"Auf den Listenpreis": "Vom Listenpreis wird Rabatt abgezogen, darauf wird nichts aufgeschlagen.", "Auf den Barverkaufspreis": "Der Barverkaufspreis entsteht erst nach dem Gewinnaufschlag.", "Auf den Nettoverkaufspreis": "Nach dem Nettoverkaufspreis kommt nur noch die Umsatzsteuer."}, "184": {"Auf den Einstandspreis": "Auf den Einstandspreis kommen zuerst die Handlungskosten.", "Auf den Bruttoverkaufspreis": "Der Bruttoverkaufspreis ist das Endergebnis inklusive USt.", "Auf den Listeneinkaufspreis": "Der Listeneinkaufspreis ist der Startpunkt der Bezugskalkulation."}, "185": {"Vom Hundert": "Vom Hundert rechnet man Zuschläge auf einen bekannten Grundwert, z. B. Gewinn.", "Auf Hundert": "Auf Hundert rechnet man, wenn ein vermehrter Wert gegeben ist.", "Vom Tausend": "Vom Tausend (Promille) kommt in der Handelskalkulation nicht vor."}, "186": {"99,96 €": "99,96 € entsteht durch 98 × 1,02 – Skonto vom Hundert statt im Hundert.", "96,04 €": "96,04 € entsteht durch Abziehen von 2 % – die Richtung ist falsch.", "100,96 €": "100,96 € passt zu keiner Rechenregel der Skontoberechnung."}, "187": {"30 €": "30 € sind die gesamten Frachtkosten, nicht pro Stück.", "0,30 €": "0,30 € entsteht durch Teilen durch 100 statt durch 10.", "10 €": "10 ist die Stückzahl, nicht der Betrag pro Stück."}, "188": {"Bezahlt mit Bargeld": "„Bar“ bezieht sich auf einen Preisnachlass, nicht auf Zahlung mit Bargeld.", "Vor Abzug von Rabatt": "Der Rabatt wird vorher abgezogen; ohne Rabattabzug spricht man vom Listenpreis.", "Inklusive Umsatzsteuer": "Inklusive Umsatzsteuer heißt „brutto“, nicht „bar“."}, "189": {"Vom Selbstkostenpreis": "Auf die Selbstkosten kommt zunächst der Gewinn.", "Vom Einstandspreis": "Der Einstandspreis gehört zur Einkaufsseite.", "Vom Barverkaufspreis": "Auf den Barverkaufspreis folgen noch Skonto und Rabatt."}, "190": {"Fracht, Zoll und Verpackung": "Fracht, Zoll und Verpackung sind Bezugskosten.", "Lieferantenrabatt und Skonto": "Rabatt und Skonto sind Preisnachlässe, keine Kosten.", "Umsatzsteuer und Vorsteuer": "Umsatzsteuer und Vorsteuer sind durchlaufende Posten, keine Kosten."}, "191": {"Einkaufs-, Lager-, Versandkalkulation": "Lager und Versand sind Kostenarten, keine Kalkulationsstufen.", "Netto-, Brutto-, Tarakalkulation": "Netto, Brutto und Tara sind Gewichts- bzw. Preisbegriffe.", "Angebots-, Auftrags-, Rechnungskalkulation": "Angebot, Auftrag und Rechnung sind Belege im Verkaufsprozess."}, "192": {"Bareinkaufspreis + Gewinn": "Bareinkaufspreis + Gewinn überspringt Bezugs- und Handlungskosten.", "Listenpreis + Bezugskosten": "Listenpreis + Bezugskosten lässt Rabatt, Skonto und Handlungskosten außer Acht.", "Nettoverkaufspreis − USt": "Der Nettoverkaufspreis enthält noch keine USt – davon kann man sie nicht abziehen."}, "193": {"Problem": "Ein Problem wäre die dahinterliegende Ursache wiederholter Störungen.", "Change": "Ein Change ist eine geplante Änderung, kein Workaround für eine akute Störung.", "Service Request": "Ein Service Request ist eine Standardanfrage ohne Störung."}, "194": {"Incident": "Ein Incident ist eine einzelne Störung – die wiederkehrende Ursache ist mehr.", "Change": "Ein Change wäre erst die geplante Behebung, z. B. ein Treiber-Update.", "Service Request": "Ein Service Request ist eine Standardanfrage ohne Störung."}, "195": {"Incident": "Ein vergessenes Passwort ist keine Störung des Dienstes.", "Problem": "Ein Problem ist die Ursache wiederholter Incidents.", "Change": "Ein Change verändert die Infrastruktur geplant; ein Reset ist ein Standardvorgang."}, "196": {"Vertrag mit dem Kunden (extern)": "Ein Vertrag mit dem Kunden ist ein SLA.", "Vertrag mit einem externen Lieferanten": "Ein Vertrag mit externen Lieferanten ist ein Underpinning Contract (UC).", "Vereinbarung über Softwarelizenzen": "Lizenzvereinbarungen sind z. B. EULA oder Volumenlizenzverträge."}, "197": {"Zeit bis das Problem gelöst ist": "Die Zeit bis zur Lösung ist die Lösungs- bzw. Wiederherstellungszeit.", "Zeit bis zur Eskalation an Level 2": "Eskalationszeiten sind eigene Schwellwerte im Prozess.", "Zeit bis zur Freigabe des Changes": "Freigabezeiten gehören zum Change Management."}, "198": {"Weitergabe an ein höheres Fachlevel": "Weitergabe an ein höheres Fachlevel ist funktionale Eskalation.", "Weitergabe an den Hersteller-Support": "Hersteller-Support ist ebenfalls funktionale Eskalation an einen externen Level.", "Rückgabe an den Anwender zur Prüfung": "Rückgabe an den Anwender ist eine Rückfrage, keine Eskalation."}, "199": {"Plan, Do, Control, Act": "Das C steht für Check (prüfen), nicht für Control.", "Prepare, Do, Check, Adjust": "Prepare und Adjust gehören nicht zum Deming-Kreis.", "Plan, Deliver, Check, Archive": "Deliver und Archive gehören nicht zum Deming-Kreis."}, "200": {"ISO 9001": "ISO 9001 ist die Norm für Qualitätsmanagement.", "ISO 14001": "ISO 14001 ist die Norm für Umweltmanagement.", "ISO 20000-1": "ISO 20000-1 ist die Norm für IT-Service-Management."}, "201": {"ca. 20–30 cm": "20–30 cm ist viel zu nah und belastet die Augen.", "ca. 1–1,5 m": "1–1,5 m ist zu weit – man müsste die Schrift stark vergrößern.", "ca. 30–40 cm": "30–40 cm entspricht eher dem Abstand zu Buch oder Smartphone."}, "202": {"Direkt vor dem Fenster": "Direkt vor dem Fenster blendet das Gegenlicht.", "Mit dem Rücken zum Fenster": "Mit dem Rücken zum Fenster spiegelt sich das Fenster im Monitor.", "Schräg im 45°-Winkel": "Auch schräg zum Fenster entstehen Blendung und Spiegelungen."}, "203": {"Auf jedes beliebige Gerät übertragbar": "Frei übertragbar sind Retail-Lizenzen (Vollversionen).", "Nur als monatliches Abo erhältlich": "Monatliche Abos sind Subscription-Lizenzen.", "Quellcode ist offen und frei änderbar": "Offenen, änderbaren Quellcode bieten Open-Source-Lizenzen."}, "204": {"Nichts – alles ist ohne Bedingungen erlaubt": "Die GPL hat Bedingungen – fast bedingungslos sind z. B. Public Domain oder MIT-Lizenz.", "Eine monatliche Gebühr pro Installation": "Die GPL verlangt keine Lizenzgebühren.", "Nutzung nur privat, nicht in Firmen": "Die GPL erlaubt ausdrücklich auch die kommerzielle Nutzung."}, "205": {"3,65 Tage": "3,65 Tage Ausfall pro Jahr entsprechen 99 % Verfügbarkeit.", "52,56 Minuten": "52,56 Minuten Ausfall pro Jahr entsprechen 99,99 % Verfügbarkeit.", "5,26 Minuten": "5,26 Minuten Ausfall pro Jahr entsprechen 99,999 % Verfügbarkeit."}, "206": {"Zugriffslizenz je Gerät": "Eine Zugriffslizenz je Gerät ist eine Device CAL.", "Lizenz je Prozessorkern": "Lizenzen je Kern sind core-basierte Serverlizenzen.", "Lizenz je Serverinstanz": "Lizenzen je Instanz betreffen die Serverlizenz, nicht den Zugriff."}, "207": {"Grüner Punkt (Duales System)": "Der Grüne Punkt kennzeichnet Verpackungen im Dualen System.", "CE-Zeichen am Typenschild": "Das CE-Zeichen bestätigt EU-Konformität, nicht die Entsorgungspflicht.", "Blauer Engel (Umweltzeichen)": "Der Blaue Engel ist ein Umweltzeichen für besonders umweltfreundliche Produkte."}, "208": {"Stufe 1": "Stufe 1 ist für allgemeine, nicht sensible Daten gedacht.", "Stufe 5": "Stufe 5 ist für geheim zu haltende Daten mit sehr hohem Schutzbedarf.", "Stufe 7": "Stufe 7 ist für streng geheime Daten (höchste Sicherheit)."}, "209": {"Papier": "Papier hat nach DIN 66399 die Kennung P.", "Optische Datenträger": "Optische Datenträger haben die Kennung O.", "Film": "Film (z. B. Mikrofilm) hat die Kennung F."}, "210": {"H": "H steht für Festplatten mit magnetischen Scheiben.", "O": "O steht für optische Datenträger wie CD und DVD.", "T": "T steht für Magnetbänder und Disketten."}, "211": {"IT-Energie ÷ Gesamtenergie": "IT-Energie ÷ Gesamtenergie ist der Kehrwert (DCiE).", "Gesamtenergie − Energie der IT": "Eine Differenz ergibt den Overhead in kWh, keine Kennzahl als Verhältnis.", "Kühlenergie ÷ Energie der IT": "Nur die Kühlung zu betrachten lässt USV-Verluste, Beleuchtung usw. weg."}, "212": {"Lautstärke von Netzteillüftern": "Lautstärke wird in dB angegeben und nicht über 80 PLUS bewertet.", "Recyclinganteil von Gehäusen": "Recyclinganteile bewerten Umweltzeichen wie der Blaue Engel.", "Standby-Verbrauch von Monitoren": "Standby-Verbrauch regeln EU-Ökodesign-Vorgaben bzw. Energy Star."}, "213": {"Der Wertstoffhof, immer kostenlos und ohne Nachweis": "Wertstoffhöfe nehmen in der Regel nur Geräte aus Privathaushalten an.", "Die normale Müllabfuhr mit dem Restmüll": "Elektrogeräte dürfen nie in den Restmüll.", "Niemand – der Betrieb muss sie selbst lagern": "Das ElektroG verpflichtet die Hersteller zur Rücknahme."}, "214": {"Ein Foto des Geräts vor der Abholung": "Ein Foto belegt nicht, dass die Daten sicher gelöscht wurden.", "Die Originalverpackung des Herstellers": "Die Originalverpackung spielt für die Entsorgung keine Rolle.", "Die Garantiekarte bzw. der Kaufbeleg": "Garantiekarte und Kaufbeleg betreffen Gewährleistung, nicht Datenschutz."}, "215": {"Bildschirmschoner statt Monitor-Standby verwenden": "Bildschirmschoner verbrauchen Strom – Standby spart deutlich mehr.", "PCs nachts laufen lassen statt täglich neu starten": "Nachts laufende PCs verschwenden Energie.", "Den Serverraum möglichst kalt (16 °C) klimatisieren": "Zu kalte Klimatisierung verbraucht unnötig Energie; üblich sind ca. 18–27 °C."}, "216": {"Mini-ITX": "Mini-ITX misst ca. 17 × 17 cm.", "Micro-ATX": "Micro-ATX misst ca. 24,4 × 24,4 cm.", "Extended ATX": "Extended ATX misst ca. 30,5 × 33 cm."}, "217": {"Sie passen in jedes ATX-Gehäuse und nutzen nur Standardanschlüsse": "Gerade das Gegenteil: Proprietäre Boards passen oft nur in ein bestimmtes Gehäuse.", "Sie haben keinen eigenen Chipsatz und sind deshalb deutlich langsamer": "Proprietäre Boards haben einen normalen Chipsatz und sind nicht langsamer.", "Sie unterstützen weder PCIe-Karten noch moderne M.2-SSDs": "Viele proprietäre Boards bieten durchaus PCIe- und M.2-Steckplätze."}, "218": {"In Servern (für Hot-Swap-Karten)": "Server nutzen für Erweiterungskarten PCI-X bzw. PCIe.", "In Grafikkarten (als Speicheranbindung)": "Grafikspeicher ist direkt auf der Karte angebunden, nicht über Mini-PCI.", "In Smartphones (für das Funkmodul)": "Smartphones nutzen integrierte SoCs, keine Mini-PCI-Steckplätze."}, "219": {"128 Gbit/s": "128 Gbit/s entspricht nur einer einzelnen Lane (128 GT/s).", "512 Gbit/s": "512 Gbit/s erreicht PCIe 5.0 x16 (32 GT/s × 16).", "1.024 Gbit/s": "1.024 Gbit/s erreicht PCIe 6.0 x16 (64 GT/s × 16)."}, "220": {"Das fertige Bild, das an den Monitor geht": "Das fertige Bild liegt im Framebuffer.", "Den Grafiktreiber für das Betriebssystem": "Treiber liegen im Betriebssystem, nicht im Grafikspeicher.", "Die BIOS-Einstellungen der Grafikkarte": "Die Grundeinstellungen liegen im Video-BIOS (Flash) der Karte."}, "221": {"Ein Sockel, auf dem zwei CPUs nebeneinander Platz finden": "Zwei CPU-Sockel bilden ein Dual-Socket-Mainboard, kein SoC.", "Ein besonders schneller Grafikspeicher direkt auf der GPU": "Schneller Speicher direkt an der GPU ist z. B. HBM.", "Ein Chipsatz, der North- und South-Bridge zusammenfasst": "Ein Chipsatz aus North- und South-Bridge enthält weder CPU noch GPU."}, "222": {"iMacs und Mac Studios": "iMacs und Mac Studios nutzen die M-Serie.", "Apple Watches": "Apple Watches nutzen die S-Serie.", "Server im Rechenzentrum": "Die A-Serie ist ein Mobilchip, nicht für Rechenzentrumsserver gedacht."}, "223": {"FireWire": "FireWire (IEEE 1394) ist ein älterer, inzwischen eingestellter Standard.", "PCIe 4.0": "PCIe wird über USB4 getunnelt, ist aber nicht der Partner im Zusammenschluss.", "HDMI 2.1": "HDMI ist eine Display-Schnittstelle und kein Teil von USB4."}, "224": {"16": "16 entspricht keiner USB-Grenze – die 7-Bit-Geräteadresse erlaubt deutlich mehr.", "64": "64 wären nur 6 Bit – USB-Geräteadressen haben 7 Bit.", "255": "255 wären 8 Bit – USB-Geräteadressen haben nur 7 Bit."}, "225": {"1 m": "1 m ist eine übliche Kabellänge, aber nicht die Grenze.", "15 m": "15 m gehen nur mit aktiven Verlängerungen bzw. Hubs.", "30 m": "30 m ist die maximale Gesamtstrecke mit 5 Hubs (6 × 5 m)."}, "226": {"USB-Daten werden über WLAN übertragen, ganz ohne Kabel zum Gerät": "Kabellose Übertragung wäre Wireless USB bzw. ein WLAN-Druckserver.", "USB-Netzteile liefern damit bis zu 240 W an angeschlossene Geräte": "240 W liefert USB Power Delivery 3.1 (EPR), nicht OTG.", "Ein einziger Port überträgt gleichzeitig Monitor- und Netzwerksignal": "Bild und Netzwerk über einen Port ermöglichen Alt-Modes bzw. Dockingstationen."}, "227": {"SRAM": "SRAM ist statischer Speicher (Cache), nicht der erste taktsynchrone Arbeitsspeicher.", "DDR-RAM": "DDR-RAM kam erst um 2000 auf und überträgt zweimal pro Takt.", "EDO-RAM": "EDO-RAM war asynchron und ein Vorgänger von SDRAM."}, "228": {"100 Mbit/s mit Cat 5": "100 Mbit/s mit Cat 5 ist 100BASE-TX (Fast Ethernet).", "10 Gbit/s mit Cat 6A": "10 Gbit/s mit Cat 6A ist 10GBASE-T.", "1 Gbit/s mit Cat 5e": "1 Gbit/s mit Cat 5e ist 1000BASE-T."}, "229": {"STP (Shielded Twisted Pair)": "STP hat eine Schirmung der einzelnen Adernpaare.", "S/FTP (Screened/Foiled Twisted Pair)": "S/FTP hat einen Geflechtschirm gesamt plus Folie je Paar.", "F/UTP (Foiled/Unshielded Twisted Pair)": "F/UTP hat einen Folien-Gesamtschirm, nur die Paare sind ungeschirmt."}, "230": {"Die maximale Segmentgröße (MSS), die der Sender verwenden darf": "Die MSS wird als TCP-Option beim Verbindungsaufbau ausgehandelt.", "Die Anzahl der Router, die das Segment noch passieren darf": "Die Hop-Begrenzung ist das TTL-Feld im IP-Header.", "Die Zeit, nach der ein unbestätigtes Segment erneut gesendet wird": "Die Wartezeit bis zur Neuübertragung ist der Retransmission Timeout, kein Header-Feld."}, "231": {"Es zählt die verbleibenden Router-Hops bis zum Verwerfen herunter": "Das Herunterzählen der Hops übernimmt das TTL-Feld.", "Es gibt die Priorität (Dienstgüte) des Pakets für Router an": "Die Priorität steht im Feld ToS bzw. DSCP.", "Es enthält die Prüfsumme des Headers zur Fehlererkennung": "Die Prüfsumme steht im Feld Header Checksum."}, "232": {"Die TTL, damit das Paket nicht endlos kreist": "Die TTL steht im IP-Header, nicht im Ethernet-Trailer.", "Der Zielport des Dienstes beim Empfänger": "Zielports stehen im TCP- bzw. UDP-Header.", "Die IP-Adresse des Standardgateways": "Das Gateway steht in keinem Header – im Frame steht höchstens dessen MAC als Ziel."}, "233": {"Alle Geräte hören das Medium ab und senden; bei Kollision wird wiederholt": "Abhören und Wiederholen nach Kollision beschreibt CSMA/CD.", "Der Switch teilt jedem Gerät feste Zeitfenster zu, in denen es senden darf": "Feste Zeitfenster sind Zeitmultiplex (TDMA).", "Ein zentraler Master fragt die Geräte nacheinander ab, ob sie senden wollen": "Zentrales Abfragen durch einen Master heißt Polling."}, "234": {"ADSL": "ADSL ist asymmetrisch – Download deutlich schneller als Upload.", "VDSL": "VDSL ist asymmetrisch mit höheren Raten als ADSL.", "VDSL2": "VDSL2 ist ebenfalls asymmetrisch, oft mit Vectoring."}, "235": {"Von der Anzahl der Telefone im Haushalt": "Telefone im Haushalt beeinflussen die DSL-Bandbreite nicht.", "Vom WLAN-Standard des Routers beim Kunden": "Der WLAN-Standard begrenzt nur das Heimnetz, nicht die DSL-Synchronrate.", "Von der Uhrzeit und der Auslastung am Abend": "Die Abendauslastung senkt den Durchsatz, nicht die physikalisch erreichbare Bandbreite."}, "236": {"Alle Geräte hängen an einem zentralen Switch – fällt er aus, ist das ganze Netz gestört": "Alle Geräte an einem zentralen Switch beschreibt die Stern-Topologie.", "Alle Geräte hängen an einem gemeinsamen Kabel, das an beiden Enden terminiert ist": "Ein gemeinsames, beidseitig terminiertes Kabel beschreibt die Bus-Topologie.", "Die Daten laufen in eine Richtung im Kreis, jedes Gerät gibt sie an das nächste weiter": "Daten im Kreis von Gerät zu Gerät beschreibt die Ring-Topologie."}, "237": {"Standleitung (T1/E1)": "Standleitungen (T1/E1) verbinden Standorte über weite Strecken.", "Satellitenverbindung": "Satellitenverbindungen sind WAN-Anbindungen für abgelegene Orte.", "VPN über das Internet": "Ein VPN über das Internet ist eine gängige WAN-Kopplung."}, "238": {"ARP": "ARP löst IP-Adressen in MAC-Adressen auf.", "RIP": "RIP ist ein Distanzvektor-Routingprotokoll.", "WINS": "WINS löste NetBIOS-Namen auf, vergab aber keine Adressen."}, "239": {"1 Stunde": "1 Stunde ist eher bei Gast-WLANs üblich.", "24 Stunden": "24 Stunden ist bei vielen Routern üblich, Windows Server nutzt aber länger.", "30 Tage": "30 Tage ist für eine Standard-Lease unüblich lang."}, "240": {"Standardgateway (Router)": "Das Standardgateway ist DHCP-Option 3.", "DNS-Server für die Namensauflösung": "Der DNS-Server ist DHCP-Option 6.", "Domänenname des Netzes": "Der Domänenname ist DHCP-Option 15."}, "241": {"Die Uhrzeit aller Rechner im Netz synchronisieren": "Zeitsynchronisation übernimmt NTP bzw. der Windows-Zeitdienst.", "IP-Adressen automatisch an die Clients vergeben": "Adressvergabe übernimmt DHCP.", "IP-Adressen in MAC-Adressen auflösen (veraltet)": "IP-in-MAC-Auflösung übernimmt ARP – und das ist nicht veraltet."}, "242": {"Managementdiensten": "Managementdienste sind z. B. Monitoring, Softwareverteilung oder Backup-Verwaltung.", "Kommunikationsdiensten": "Kommunikationsdienste sind z. B. E-Mail, VoIP und Videokonferenz.", "Business-Anwendungen": "Business-Anwendungen sind fachliche Programme wie ERP oder CRM."}, "243": {"Infrastrukturdiensten": "Infrastrukturdienste sind z. B. DNS, DHCP oder Verzeichnisdienste – sie stellen die Grundfunktionen des Netzes bereit.", "Kommunikationsdiensten": "Kommunikationsdienste sind z. B. E-Mail, VoIP oder Chat – also Dienste für den Austausch zwischen Personen.", "Business-Anwendungen": "Business-Anwendungen sind z. B. ERP oder CRM – sie unterstützen Geschäftsprozesse, nicht den IT-Betrieb."}, "244": {"Das BSI": "Das BSI ist für IT-Sicherheit zuständig, nicht für die Vergabe von Funkfrequenzen.", "Die ITU": "Die ITU koordiniert Frequenzen weltweit, die verbindliche Zuteilung in Deutschland erfolgt aber national.", "Die Wi-Fi Alliance": "Die Wi-Fi Alliance zertifiziert WLAN-Geräte auf Kompatibilität, sie vergibt keine Frequenzen."}, "245": {"13": "13 Kanäle sind in Europa bzw. Deutschland zugelassen, in den USA nur 11.", "14": "Kanal 14 gibt es nur in Japan und dort nur für das alte 802.11b.", "12": "12 ist keine reguläre Kanalanzahl eines Regulierungsgebiets – Kanal 12 und 13 sind in den USA nicht frei."}, "246": {"Vollduplex wie ein Switch – beides gleichzeitig": "Alle Teilnehmer teilen sich ein Medium (Funkkanal) – gleichzeitiges Senden und Empfangen wie am Switchport geht nicht.", "Je nach Kanal mal Voll-, mal Halbduplex": "Die Duplexart hängt nicht vom Kanal ab – auf jedem Kanal wird abwechselnd gesendet und empfangen.", "Nur bei WPA3 Vollduplex, sonst Halbduplex": "WPA3 ist ein Sicherheitsverfahren und ändert nichts am Funkzugriff – WLAN bleibt Halbduplex."}, "247": {"Ein gefälschter Access Point, über den ein Angreifer Daten mitliest": "Das beschreibt einen Evil Twin bzw. Rogue AP – ein Angriff, keine Anmeldeseite.", "Ein zusätzlicher Funkkanal im 6-GHz-Band für Gäste und Besucher": "Ein Captive Portal ist eine Webseite, kein Funkkanal – es funktioniert in jedem Band.", "Eine Firewall-Regel, die das Gäste-VLAN vom Firmennetz trennt": "Die Trennung von Gäste-VLAN und Firmennetz ist eine Segmentierungsmaßnahme, kein Captive Portal."}, "248": {"Ein Client wechselt nahtlos zwischen zwei Access Points, ohne Verbindungsabbruch": "Das ist Roaming – ein normaler WLAN-Vorgang, kein Angriffsverhalten.", "Ein Paket springt über mehrere Router seitlich zum Ziel im anderen Netz": "Das ist normales Routing über mehrere Hops, keine seitliche Ausbreitung im Netz.", "Ein Angreifer verschafft sich auf einem Gerät höhere Rechte (Admin statt User)": "Das ist Privilege Escalation (Rechteausweitung) – vertikal statt seitlich zu weiteren Geräten."}, "249": {"Die IP-Adresse des Clients im WLAN": "Die IP-Adresse vergibt DHCP erst nach erfolgreicher WLAN-Verbindung.", "Das Zertifikat des RADIUS-Servers": "Das RADIUS-Zertifikat stellt eine CA aus; es wird bei 802.1X geprüft, nicht im Handshake erzeugt.", "Die SSID und das Kennwort des WLANs": "SSID und Kennwort werden vom Admin konfiguriert, nicht im Handshake erzeugt."}, "250": {"Schutz gegen Brute-Force-Angriffe auf das Passwort": "Schutz gegen Offline-Brute-Force bietet SAE (WPA3-Personal), nicht OWE.", "Anmeldung per Zertifikat statt per Passwort": "Anmeldung per Zertifikat ist 802.1X mit EAP-TLS (Enterprise), OWE kennt gar keine Anmeldung.", "Verstecken der SSID vor fremden Geräten": "Eine versteckte SSID ist kein Schutzmechanismus und hat mit OWE nichts zu tun."}, "251": {"Per RADIUS direkt; der Client schickt seine Daten ohne Umweg an den Server": "RADIUS spricht nur der AP (Authenticator) mit dem Server – der Client hat vor der Anmeldung noch keinen Netzzugang.", "Per DHCP; die Anmeldung läuft über Option 82 des Relay-Agents": "DHCP läuft erst nach der Anmeldung; Option 82 enthält nur Relay-Infos wie den Switchport.", "Per HTTPS-Login auf einer Anmeldeseite des Access Points (Captive Portal)": "Ein Captive Portal ist eine Weblösung für Gäste-WLANs, kein 802.1X-Verfahren."}, "252": {"Ein Banking-Trojaner, der Zugangsdaten stahl": "Banking-Trojaner wie Zeus stahlen Zugangsdaten – ILOVEYOU überschrieb Dateien und verschickte sich selbst.", "Eine Ransomware, die Festplatten verschlüsselte": "Ransomware wie WannaCry verschlüsselt Daten für Lösegeld – ILOVEYOU forderte kein Lösegeld.", "Ein DDoS-Botnetz aus gekaperten Kameras": "Ein Botnetz aus Kameras war Mirai (2016) – 2000 gab es solche IoT-Geräte kaum."}, "253": {"Mit einem einzelnen Hochleistungsserver": "Ein einzelner Server wäre ein DoS – das „D“ in DDoS steht für viele verteilte Angreifer.", "Mit gekaperten Cloud-Servern bei Amazon": "Der Angriff kam nicht aus gekaperten Cloud-Servern, sondern vom Mirai-Botnetz aus Kameras und Routern.", "Mit einem Wurm auf Windows-Desktop-PCs": "Mirai infizierte Linux-basierte IoT-Geräte mit Standardpasswörtern, keine Windows-PCs."}, "254": {"Sie wird sofort und endgültig gelöscht": "Löschen ist eine eigene Aktion – in der Quarantäne bleibt die Datei erhalten und kann wiederhergestellt werden.", "Sie wird automatisch desinfiziert und freigegeben": "Quarantäne heißt Isolation; eine Freigabe erfolgt nur manuell nach Prüfung, nicht automatisch.", "Sie wird umbenannt und bleibt am Ursprungsort": "Bliebe die Datei am Ursprungsort, könnte sie weiter ausgeführt werden – sie wird in einen geschützten Bereich verschoben."}, "255": {"Nur Malware, deren Signatur bereits bekannt ist": "Das ist die signaturbasierte Erkennung – sie findet nur bereits bekannte Malware.", "Nur Dateien, die verschlüsselt gespeichert sind": "Verschlüsselung ist kein Malware-Merkmal; Heuristik bewertet das Verhalten bzw. den Code.", "Nur Makros in Office-Dokumenten": "Makros werden auch geprüft, Heuristik ist aber nicht auf Office-Dokumente beschränkt."}, "256": {"Es verschlüsselt den gesamten Datenverkehr und bremst so das Netz": "Ein IDS verschlüsselt nichts – es liest den Verkehr nur mit und wertet ihn aus.", "Es blockiert Angriffe selbst und ersetzt dadurch die Firewall": "Selbst blockieren kann ein IPS; ein IDS meldet nur und ersetzt keine Firewall.", "Es funktioniert nur mit IPv4 und erkennt keinen IPv6-Verkehr": "Moderne IDS werten auch IPv6-Verkehr aus – das ist kein typischer Nachteil."}, "257": {"Durch einen Stromausfall im Rechenzentrum": "Ein Stromausfall betrifft die Verfügbarkeit, er leitet keinen Verkehr über einen Angreifer um.", "Durch den Ausfall einer Platte im RAID 5": "Ein Plattenausfall im RAID 5 ist ein Hardwaredefekt, kein Angriff auf die Kommunikation.", "Durch einen Akkuwechsel an der USV": "Ein Akkuwechsel an der USV ist Wartung und hat mit dem Umleiten von Verkehr nichts zu tun."}, "258": {"Er beschleunigt das Netzwerk durch Caching": "Caching ist Aufgabe eines Proxys oder CDN, ein Honeypot beschleunigt nichts.", "Er ersetzt das Backup der echten Server": "Ein Honeypot enthält keine echten Daten und kann daher kein Backup ersetzen.", "Er vergibt den Angreifern IP-Adressen": "IP-Adressen vergibt DHCP; ein Honeypot ist nur ein Lockziel für Angreifer."}, "259": {"Eine Strafe der Aufsichtsbehörde nach einem Verstoß": "Strafen sind Bußgelder der Aufsichtsbehörde – die DSFA ist eine vorbeugende Prüfung durch den Verantwortlichen.", "Ein Backup-Konzept für personenbezogene Daten": "Ein Backup-Konzept sichert die Verfügbarkeit, es bewertet keine Risiken für Betroffene.", "Ein Vertrag mit einem externen Dienstleister": "Ein Vertrag mit einem Dienstleister ist der AV-Vertrag (Art. 28), keine Folgenabschätzung."}, "260": {"Ja, er braucht ein Zertifikat der IHK als Datenschutzbeauftragter": "IHK-Lehrgänge gibt es, sie sind aber freiwillig – das Gesetz verlangt nur Fachkunde.", "Ja, er braucht eine Zertifizierung durch das BSI nach ISO 27001": "ISO 27001 zertifiziert ein ISMS von Organisationen, keine Personen als Datenschutzbeauftragte.", "Nur, wenn das Unternehmen mehr als 10 Mitarbeiter beschäftigt": "Die Mitarbeiterzahl entscheidet nur, ob ein DSB benannt werden muss (ab 20 Personen), nicht über ein Zertifikat."}, "261": {"Besitzermerkmale": "Besitzmerkmale sind z. B. Auto, Immobilien oder Konten – keine Beurteilungen einer Person.", "Onlinedaten": "Onlinedaten sind z. B. IP-Adressen, Cookies oder Login-Daten.", "Physische Merkmale": "Physische Merkmale sind z. B. Größe, Augenfarbe oder Fingerabdruck."}, "262": {"Genau 8 Kontrollmaßnahmen, die alle vollständig umgesetzt werden müssen": "Die 8 Kontrollen stammen aus dem alten BDSG (Anlage zu § 9) – die DSGVO nennt keinen festen Katalog.", "BitLocker bzw. Festplattenverschlüsselung auf allen Geräten ist Pflicht": "Verschlüsselung wird in Art. 32 nur als Beispiel genannt, ein bestimmtes Produkt ist nicht vorgeschrieben.", "Passwörter mit mindestens 12 Zeichen und Wechsel alle 90 Tage": "Konkrete Passwortregeln stehen nicht in der DSGVO; regelmäßige Zwangswechsel rät das BSI sogar ab."}, "263": {"Abwarten, bis sich ein Betroffener beschwert": "Abwarten ist unzulässig – die Meldung muss binnen 72 Stunden nach Bekanntwerden erfolgen.", "Nur die zuständige IHK informieren": "Die IHK ist keine Datenschutzbehörde und nimmt keine Meldungen von Datenpannen entgegen.", "Nur den internen Datenschutzbeauftragten informieren": "Der DSB berät intern, die Meldepflicht gegenüber der Aufsichtsbehörde bleibt trotzdem bestehen."}, "264": {"Legacy-Systeme mit eigenem Kernel": "Legacy-Systeme mit eigenem Kernel brauchen eine VM – Container teilen den Kernel des Hosts.", "Windows und Linux gleichzeitig auf einem Kernel": "Container nutzen den Host-Kernel; Windows und Linux zugleich auf einem Kernel ist nicht möglich.", "Hardware-Emulation alter Rechner": "Hardware-Emulation alter Rechner leisten Emulatoren wie QEMU, keine Container."}, "265": {"Sie hat von allen Virtualisierungsarten den geringsten Overhead": "Den geringsten Overhead haben Container bzw. Paravirtualisierung – Vollvirtualisierung muss Hardware nachbilden.", "Alle VMs teilen sich einen gemeinsamen Kernel und starten schnell": "Einen gemeinsamen Kernel teilen Container; bei Vollvirtualisierung hat jede VM ihr eigenes OS.", "Das Gast-OS spricht über Hypercalls direkt mit dem Hypervisor": "Hypercalls nutzt die Paravirtualisierung – dafür muss das Gast-OS angepasst sein."}, "266": {"Sie starten zu langsam für wechselnde Lasten": "Container starten in Sekunden – langsamer Start ist eher ein Merkmal von VMs.", "Sie brauchen zu viel RAM, weil jeder ein ganzes OS hat": "Ein ganzes OS pro Instanz haben VMs; Container enthalten nur Anwendung und Bibliotheken.", "Sie unterstützen keine Netzwerkverbindungen": "Container haben eigene virtuelle Netzwerkschnittstellen und kommunizieren problemlos."}, "267": {"Im Netz nur noch private IP-Adressen verwenden": "Private IP-Adressen betreffen das Netzdesign, nicht den Ort, an dem die Daten verarbeitet werden.", "Die Cloud nur nachts außerhalb der Arbeitszeit nutzen": "Die Uhrzeit der Nutzung ändert nichts am Speicherort und an der Rechtslage der Daten.", "Auf Backups in der Cloud ganz verzichten": "Ohne Backups leidet die Verfügbarkeit; das Datenschutzproblem des Anbieterstandorts bleibt."}, "268": {"Der Rabatt in Prozent, den der Lieferant beim Einkauf der Waren gewährt": "Das ist der Lieferantenrabatt – er mindert den Einkaufspreis, verteilt aber keine Betriebskosten.", "Der Prozentsatz der Umsatzsteuer, der auf den Nettoverkaufspreis kommt": "Die Umsatzsteuer ist eine Steuer und hat mit der Kalkulation der Handlungskosten nichts zu tun.", "Ein Prozentsatz, mit dem der Händler seinen Gewinn auf die Selbstkosten aufschlägt": "Das ist der Gewinnzuschlag – er kommt erst nach den Selbstkosten in der Kalkulation."}, "269": {"2001:db8:0:0:1::1": "Nach RFC 5952 muss bei gleich langen Nullblöcken der erste mit :: gekürzt werden.", "2001:DB8::1:0:0:1": "RFC 5952 verlangt Kleinbuchstaben – DB8 in Großbuchstaben ist gültig, aber nicht die Normschreibweise.", "2001:db8::1::1": "Zwei :: in einer Adresse sind ungültig, weil die Zahl der Nullblöcke nicht mehr eindeutig ist."}, "270": {"http://2001:db8::1:8080/": "Ohne Klammern ist :8080 nicht vom letzten Adressblock zu unterscheiden.", "http://(2001:db8::1):8080/": "Runde Klammern sind in URLs nicht vorgesehen – IPv6-Adressen stehen in eckigen Klammern.", "http://2001:db8::1/8080": "/8080 wäre ein Pfad auf dem Server, kein Port."}, "271": {"DHCPv6 (Dynamic Host Configuration)": "DHCPv6 vergibt Adressen und Optionen, löst aber keine IP- in MAC-Adressen auf.", "RARP (Reverse Address Resolution)": "RARP ist ein veraltetes IPv4-Protokoll, das zur MAC die IP sucht – also umgekehrt.", "IGMP (Internet Group Management)": "IGMP verwaltet Multicast-Gruppen bei IPv4; bei IPv6 übernimmt das MLD."}, "272": {"DHCPv6-Offer vom DHCP-Server": "Bei DHCPv6 heißt das Angebot Advertise, und bei SLAAC ist gar kein DHCP-Server beteiligt.", "ARP-Reply vom Standardgateway": "ARP gibt es bei IPv6 nicht, und es liefert ohnehin nur MAC-Adressen.", "DNS-Antwort mit AAAA-Record": "Ein AAAA-Record löst Namen auf und sagt nichts über das eigene Netzpräfix."}, "273": {"Anycast an die nächstgelegene Adresse": "Anycast erreicht nur das nächstgelegene Gerät einer Gruppe, nicht alle.", "Unicast an die Link-Local-Adresse fe80::1": "Unicast geht an genau ein Gerät; fe80::1 ist meist nur die Link-Local-Adresse des Routers.", "Der Broadcast bleibt wie bei IPv4 erhalten": "IPv6 kennt keinen Broadcast mehr – stattdessen gibt es Multicast-Gruppen."}, "274": {"Variabel 20 bis 60 Byte": "Variable 20 bis 60 Byte hat der IPv4-Header – IPv6 nutzt dafür Extension Header.", "Fest 20 Byte": "20 Byte ist die Mindestgröße des IPv4-Headers, nicht die des IPv6-Headers.", "Fest 64 Byte": "64 Byte ist die minimale Ethernet-Framegröße, nicht die Größe des IPv6-Headers."}, "275": {"Flow Label": "Das Flow Label kennzeichnet zusammengehörige Pakete eines Datenstroms.", "Traffic Class": "Traffic Class entspricht dem ToS-/DSCP-Feld von IPv4 für QoS.", "Next Header": "Next Header entspricht dem Protocol-Feld von IPv4 (z. B. TCP oder UDP)."}, "276": {"64": "64 Netze ergeben 6 Bit, also ein /58 – von /56 bis /64 sind es aber 8 Bit.", "128": "128 Netze ergeben 7 Bit (/57) – von /56 bis /64 sind es 8 Bit, also 2^8.", "65.536": "65.536 /64-Netze hätte man bei einem /48 (16 Bit Unterschied)."}, "277": {"Verschlüsselung aller IPv6-Pakete mit IPsec": "Privacy Extensions ändern nur die Adresse; Verschlüsselung leistet IPsec separat.", "Verstecken der IPv6-Adresse hinter einem NAT": "IPv6 braucht kein NAT; die Privacy Extensions verbergen nur die MAC in der Adresse.", "Sperren von Zugriffen aus dem Internet auf den Host": "Eingehende Zugriffe sperrt die Firewall, nicht die Art der Interface-ID."}, "278": {"Keine IPv6-Adresse – der Anschluss läuft nur über IPv4 mit Provider-NAT": "Umgekehrt: Bei DS-Lite gibt es native IPv6, nur IPv4 läuft über Provider-NAT.", "Doppelte Geschwindigkeit, weil IPv4 und IPv6 parallel gebündelt werden": "IPv4 wird bei DS-Lite in IPv6 getunnelt – das bündelt nichts und verdoppelt keine Bandbreite.", "Eine eigene öffentliche IPv4 und IPv6, beide voll von außen erreichbar": "Eine eigene öffentliche IPv4 gibt es bei Dual Stack, nicht bei DS-Lite."}, "279": {"Die zuerst eingetragene Route": "Die Reihenfolge der Einträge spielt keine Rolle – es zählt die genaueste Route.", "Die mit dem kürzesten Präfix": "Das kürzeste Präfix ist die ungenaueste Route; gewählt wird die spezifischste.", "Immer die Default-Route 0.0.0.0/0": "Die Default-Route wird nur genommen, wenn keine genauere Route passt."}, "280": {"Distanzvektor-Protokoll, Interior (IGP)": "Distanzvektor-Protokoll ist z. B. RIP – OSPF kennt die komplette Netztopologie.", "Link-State-Protokoll, Exterior (EGP)": "OSPF ist ein Link-State-Protokoll, arbeitet aber innerhalb eines autonomen Systems (IGP).", "Pfadvektor-Protokoll, Exterior (EGP)": "Pfadvektor und EGP beschreibt BGP, nicht OSPF."}, "281": {"OSPF": "OSPF ist ein IGP für das Routing innerhalb eines autonomen Systems.", "RIP": "RIP ist ein einfaches IGP für kleine Netze mit maximal 15 Hops.", "EIGRP": "EIGRP ist ein IGP (ursprünglich von Cisco) für Unternehmensnetze, nicht für das Internet."}, "282": {"Bandbreite der Leitung": "Die Bandbreite fließt in die Kosten von OSPF ein, nicht in RIP.", "Verzögerung in Millisekunden": "Die Verzögerung nutzt EIGRP als Metrik, RIP zählt nur Hops.", "Kosten aus Bandbreite und Last": "Eine Kombination aus Bandbreite, Last u. a. nutzt EIGRP – RIP kennt nur die Hop-Anzahl."}, "283": {"Loopback-Route: Verkehr an den eigenen Rechner zurück": "Loopback ist 127.0.0.0/8 bzw. ::1, nicht 0.0.0.0/0.", "Broadcast-Route: Pakete an alle Netze gleichzeitig senden": "Broadcast ist 255.255.255.255; Router leiten Broadcasts nicht in alle Netze weiter.", "Blackhole-Route: Verkehr an ungültige Adressen verwerfen": "Eine Blackhole-Route (Null-Route) zeigt auf ein Null-Interface, nicht auf 0.0.0.0/0."}, "284": {"Hohe Protokolllast durch regelmäßige Updates": "Regelmäßige Updates und Protokolllast gibt es nur bei dynamischem Routing.", "Router tauschen Routen ungefragt mit Nachbarn aus": "Statische Routen werden manuell eingetragen – kein Austausch mit Nachbarn.", "Höherer CPU- und RAM-Bedarf auf den Routern": "Statisches Routing spart gerade CPU und RAM, weil kein Routingprotokoll läuft."}, "285": {"Als Unicast an das Standardgateway": "Die MAC des Ziels ist ja unbekannt – deshalb fragt ARP per Broadcast alle im Netz.", "Als Multicast an ff02::1": "ff02::1 ist eine IPv6-Multicast-Adresse; ARP gibt es nur bei IPv4.", "Als Unicast an den DNS-Server": "Der DNS-Server löst Namen auf, keine IP- in MAC-Adressen."}, "286": {"Ein Router antwortet stellvertretend für ein anderes Netz": "Das ist Proxy-ARP – ein Router antwortet stellvertretend für Adressen in anderen Netzen.", "Eine ARP-Anfrage, die keine Antwort bekommt": "Eine unbeantwortete Anfrage ist einfach ein erfolgloser ARP-Request.", "Ein ARP-Eintrag, der nie aus dem Cache verfällt": "Ein Eintrag ohne Ablauf ist ein statischer ARP-Eintrag."}, "287": {"Nach der MAC des Zielrechners": "Die MAC eines Rechners in einem anderen Netz ist lokal nicht erreichbar – ARP bleibt im eigenen Netz.", "Nach der MAC des DNS-Servers": "Der DNS-Server löst nur den Namen auf; die Frames gehen an das Gateway.", "Nach gar keiner – dann wird kein ARP benutzt": "Auch für fremde Netze braucht der PC eine MAC – nämlich die des Gateways."}, "288": {"Weil der Client die Server-IP nicht kennt": "Durch den Offer kennt der Client die Server-IP schon (Server Identifier) – der Broadcast informiert alle Server.", "Weil Unicast in UDP nicht möglich ist": "UDP kann sehr wohl Unicast; die DHCP-Erneuerung (Renew) läuft sogar per Unicast.", "Damit der Router die Anfrage ins Internet leitet": "Router leiten Broadcasts nicht weiter; DHCP-Pakete bleiben im LAN oder gehen über ein Relay."}, "289": {"Dynamisch mit kurzer Lease-Dauer": "Bei kurzer Lease kann der Drucker eine neue IP bekommen – Clients finden ihn dann nicht mehr.", "Automatisch über APIPA (169.254.x.x)": "APIPA ist eine Notlösung ohne DHCP-Server; die Adresse ist zufällig und nicht geroutet.", "Dynamisch aus dem Pool mit langer Lease": "Auch bei langer Lease ist die IP nicht garantiert – erst eine Reservierung bindet sie fest."}, "290": {"TCP 67 (Server) und 68 (Client)": "DHCP nutzt UDP, nicht TCP – der Client hat anfangs noch keine IP für eine Verbindung.", "UDP 53 (Server) und 54 (Client)": "UDP 53 ist DNS; Port 54 hat keine Bedeutung für DHCP.", "UDP 546 (Server) und 547 (Client)": "546/547 gehören zu DHCPv6 – und dort ist 547 der Server, 546 der Client."}, "291": {"Er leitet alle Anfragen an den Provider weiter": "Das macht ein Forwarder – er hält keine eigene Kopie der Zone.", "Er löst nur Rückwärtsanfragen (PTR) auf": "PTR-Anfragen beantwortet eine Reverse-Zone; ein Secondary kann jede Zonenart halten.", "Er ist nur für die Root-Zone zuständig": "Die Root-Zone liegt auf den Root-Servern; Secondary ist eine Rolle für beliebige Zonen."}, "292": {"Zu einem Namen die IPv4-Adresse": "Name zu IPv4-Adresse liefert der A-Record.", "Den Mailserver einer Domain": "Den Mailserver einer Domain nennt der MX-Record.", "Die zuständigen Nameserver einer Zone": "Die zuständigen Nameserver stehen im NS-Record."}, "293": {"Bei jeder Anfrage aus dem Internet": "Normale Anfragen laufen schneller über UDP 53, auch aus dem Internet.", "Nur bei IPv6-Anfragen (AAAA)": "AAAA-Anfragen sind meist klein und laufen ganz normal über UDP.", "Wenn der Client keinen Cache hat": "Ob ein Cache vorhanden ist, beeinflusst nicht das Transportprotokoll."}, "294": {"Rekursiv – jeder Server fragt selbst weiter": "Rekursiv fragt nur der Client seinen Resolver; Root- und TLD-Server liefern bloß Verweise.", "Per Broadcast an alle Server gleichzeitig": "DNS nutzt keinen Broadcast – jeder Server wird gezielt per Unicast angefragt.", "Gar nicht – er nutzt nur die HOSTS-Datei": "Die HOSTS-Datei ist eine lokale Ergänzung, ersetzt aber nicht die DNS-Abfrage."}, "295": {"Die IPv6-Adresse des Webservers": "Die IPv6-Adresse steht im AAAA-Record.", "Der Alias-Name für eine andere Domain": "Ein Alias auf einen anderen Namen ist ein CNAME-Record.", "Die Seriennummer der Zone": "Die Seriennummer der Zone steht im SOA-Record."}, "296": {"Er steht vor den Clients und verbirgt sie beim Surfen vor dem Internet": "Das ist ein Forward-Proxy – er arbeitet für die Clients, nicht für die Server.", "Er verschlüsselt den gesamten Verkehr zwischen zwei Standorten im Tunnel": "Das beschreibt ein Site-to-Site-VPN, keinen Proxy.", "Er verteilt den Clients automatisch Proxy-Einstellungen per PAC-Datei": "PAC-Dateien werden per WPAD oder GPO verteilt, nicht vom Reverse-Proxy."}, "297": {"Über den MX-Record der eigenen Domain im DNS": "Der MX-Record nennt den Mailserver einer Domain, keine Proxy-Einstellungen.", "Über ARP-Anfragen an das Standardgateway": "ARP löst nur IP- in MAC-Adressen auf und überträgt keine Konfiguration.", "Über die HOSTS-Datei auf dem Proxy-Server": "Die HOSTS-Datei auf dem Proxy betrifft nur dessen eigene Namensauflösung, nicht die Clients."}, "298": {"Es arbeitet nur auf Schicht 2 und filtert dort MAC-Adressen statt URLs": "Ein SWG arbeitet auf Anwendungsebene (Schicht 7) und filtert URLs und Inhalte.", "Es verschlüsselt alle Verbindungen der Clients automatisch per VPN-Tunnel": "Ein SWG prüft Webverkehr, es baut keine VPN-Tunnel für Clients auf.", "Es ersetzt den DNS-Server und löst alle Namen selbst auf": "Namensauflösung bleibt Aufgabe des DNS-Servers; ein SWG ersetzt ihn nicht."}, "299": {"Die echte IP des Clients und einen Proxy-Hinweis": "Das ist ein transparenter Proxy – er bietet keinerlei Anonymität.", "Die echte IP des Clients, aber keinen Proxy-Hinweis": "Echte IP ohne Proxy-Hinweis wäre wie eine Direktverbindung – das ist keine Anonymisierung.", "Eine verborgene IP, aber erkennbar einen Proxy": "Das ist ein normaler anonymer Proxy (Anonymous) – Elite verbirgt auch den Proxy selbst."}, "300": {"Der Angreifer überflutet den DNS-Server mit Anfragen": "Das ist ein DoS-Angriff auf DNS, keine Manipulation von ARP-Tabellen.", "Gefälschte DHCP-Angebote verteilen falsche Gateways": "Das ist DHCP-Spoofing über einen Rogue-DHCP-Server.", "Der Angreifer errät die WLAN-Passphrase per Wörterbuch": "Das ist ein Wörterbuchangriff auf das WLAN-Passwort."}, "301": {"Spanning Tree Protocol": "STP verhindert Schleifen bei redundanten Verbindungen, prüft aber keine ARP-Antworten.", "Link Aggregation (LACP)": "LACP bündelt mehrere Links zu einem logischen Link – kein Sicherheitsmerkmal.", "Port Mirroring (SPAN)": "Port Mirroring kopiert Verkehr zur Analyse, verhindert aber nichts."}, "302": {"Es verschlüsselt alle DNS-Anfragen per TLS": "Verschlüsselung per TLS leisten DoT bzw. DoH – DNSSEC signiert nur, verschlüsselt nicht.", "Es beschleunigt die Namensauflösung per Cache": "Caching beschleunigt jeder Resolver; DNSSEC macht die Auflösung eher etwas langsamer.", "Es verhindert DDoS-Angriffe auf DNS-Server": "DNSSEC sichert die Echtheit der Antworten, schützt aber nicht vor Überlastung."}, "303": {"Viele große ICMP-Echo-Pakete überlasten die Leitung des Opfers": "Das beschreibt einen ICMP-Flood (Ping-Flood) – ohne TCP-Verbindungsaufbau.", "Gefälschte DNS-Antworten füllen den Cache des Resolvers mit falschen Daten": "Das ist DNS-Cache-Poisoning, ein Angriff auf die Namensauflösung.", "Viele vollständig aufgebaute Verbindungen senden extrem langsam Daten": "Das ist ein Slow-Rate-Angriff wie Slowloris – bei SYN-Flooding wird der Handshake nie vollendet."}, "304": {"MX, CNAME und PTR": "MX nennt den Mailserver, CNAME einen Alias, PTR den Namen zur IP – keiner prüft Absender.", "A, AAAA und NS": "A, AAAA und NS dienen der Namensauflösung und Delegation, nicht der Absenderprüfung.", "SOA, SRV und CAA": "SOA verwaltet die Zone, SRV nennt Dienste, CAA erlaubte Zertifizierungsstellen – kein Mailschutz."}, "305": {"Ein stärkerer Virenscanner auf dem Mailserver": "CEO-Fraud nutzt meist keine Malware, sondern Täuschung – der Scanner erkennt das nicht.", "Längere Passwörter für die Buchhaltung": "Beim CEO-Fraud werden keine Passwörter geknackt, sondern Mitarbeiter zu Überweisungen verleitet.", "Mails nur noch verschlüsselt senden": "Verschlüsselung schützt vor Mitlesen, nicht vor einer gefälschten Anweisung."}, "306": {"Wie viel Datenverlust maximal akzeptabel ist": "Das ist der RPO (Recovery Point Objective).", "Wie oft ein Restore-Test stattfinden muss": "Restore-Tests gehören zum Backup-Konzept, der RTO legt nur die maximale Ausfallzeit fest.", "Wie lange Backups aufbewahrt werden": "Die Aufbewahrungsdauer heißt Retention, nicht RTO."}, "307": {"Restore muss in 1 Stunde fertig sein": "Die maximale Wiederherstellungszeit beschreibt der RTO, nicht der RPO.", "Backups 1 Stunde lang aufbewahren": "Die Aufbewahrungsdauer (Retention) hat mit dem RPO nichts zu tun.", "Nur einmal am Tag voll sichern": "Bei täglicher Sicherung könnten bis zu 24 Stunden Daten verloren gehen – mehr als 1 Stunde."}, "308": {"Null Kopien auf dem Produktivsystem": "Kopien auf dem Produktivsystem werden in der Regel nicht ausgeschlossen – die 0 zählt Fehler.", "Null Minuten Ausfallzeit beim Restore": "Ausfallzeit ist Thema des RTO; die 0 betrifft verifizierte Backups.", "Null ungesicherte Änderungen (RPO 0)": "RPO 0 ist eine Anforderung an die Sicherungshäufigkeit, nicht Teil der 3-2-1-1-0-Regel."}, "309": {"Einmal pro Woche ein Vollbackup auf Band": "Ein wöchentliches Vollbackup ist das Gegenteil von kontinuierlich – das RPO wäre bis zu 7 Tage.", "Nur geänderte Dateien seit dem letzten Vollbackup": "Das ist ein differenzielles Backup, das zu festen Zeiten läuft.", "Ein Snapshot vor jedem Windows-Update": "Ein Snapshot vor Updates ist eine punktuelle Sicherung, keine laufende Datensicherung."}, "310": {"ca. 99,0 %": "99,0 % ergäbe sich erst bei rund 5 h Reparaturzeit – richtig: 500 / 501,5 ≈ 99,7 %.", "ca. 99,97 %": "99,97 % wäre eine Reparaturzeit von nur ca. 9 Minuten – eine 9 zu viel.", "ca. 98,5 %": "98,5 % entspräche einer Reparaturzeit von über 7 Stunden, nicht 1,5 h."}, "311": {"ca. 8,8 Stunden": "8,8 Stunden pro Jahr erlaubt 99,9 % – eine 9 weniger.", "ca. 5,3 Minuten": "5,3 Minuten pro Jahr erlaubt 99,999 % – eine 9 mehr.", "ca. 87,6 Stunden": "87,6 Stunden pro Jahr erlaubt nur 99 % Verfügbarkeit."}, "312": {"Die mittlere Zeit zwischen zwei Ausfällen": "Die Zeit zwischen zwei Ausfällen ist die MTBF.", "Die mittlere Reparaturzeit": "Die mittlere Reparaturzeit ist die MTTR.", "Die maximale Dauer eines Backups": "Die Dauer eines Backups heißt Backup-Fenster, das ist keine MTTx-Kennzahl."}, "313": {"Mindestens 5 km": "5 km war die frühere Empfehlung, die das BSI 2018 auf 200 km angehoben hat.", "Mindestens 50 km": "50 km reichen nicht, weil regionale Katastrophen beide Standorte treffen könnten.", "Mindestens 1.000 km": "1.000 km verlangt das BSI nicht – das würde auch die Latenz für Spiegelungen stark erhöhen."}, "314": {"Welche Firewall-Regeln überflüssig oder zu offen sind": "Das ist ein Firewall-Audit bzw. Regelwerk-Review, keine BIA.", "Wie hoch die Eintrittswahrscheinlichkeit von Angriffen ist": "Eintrittswahrscheinlichkeiten bewertet die Risikoanalyse; die BIA betrachtet die Auswirkungen.", "Welche Mitarbeiter welche Adminrechte benötigen": "Das regelt ein Berechtigungskonzept, nicht die BIA."}, "315": {"Großvater-Vater-Sohn": "GFS nutzt feste Zyklen (täglich, wöchentlich, monatlich), keine exponentiellen Abstände.", "Forever Incremental": "Forever Incremental ist eine Sicherungsart (nur Änderungen), kein Rotationsschema.", "Round Robin (Ringtausch)": "Round Robin nutzt alle Medien gleich oft im festen Kreislauf."}, "316": {"12": "12 wäre 2 × 6 – richtig ist n · (n − 1) / 2 = 6 · 5 / 2.", "30": "30 ist n · (n − 1) ohne Halbieren – so zählt man jede Leitung doppelt.", "36": "36 ist n² – dabei würde sogar jeder Knoten mit sich selbst verbunden."}, "317": {"Bus mit Abschlusswiderständen": "Die Bus-Topologie mit Koaxkabel und Abschlusswiderständen ist veraltet (10BASE2/5).", "Ring mit Token Passing": "Token Ring ist eine veraltete Technik und wurde von Ethernet verdrängt.", "Vollvermaschung aller PCs": "Vollvermaschung aller PCs wäre viel zu aufwendig – sie gibt es eher im WAN-Kern."}, "318": {"5": "5 Schichten hat das Hybridmodell, in dem die Netzzugangsschicht aufgeteilt wird.", "7": "7 Schichten hat das OSI-Modell.", "3": "3 Schichten wären zu wenig – das DoD-Modell trennt Netzzugang, Internet, Transport und Anwendung."}, "319": {"Schicht 2 – Sicherung": "Schicht 2 entspricht der Netzzugangsschicht des DoD-Modells (zusammen mit Schicht 1).", "Schicht 4 – Transport": "Schicht 4 entspricht der Transportschicht des DoD-Modells (TCP/UDP).", "Schicht 7 – Anwendung": "Schicht 7 gehört zur Anwendungsschicht des DoD-Modells (zusammen mit 5 und 6)."}, "320": {"Paket (IP-Paket)": "Pakete sind die Dateneinheit auf Schicht 3 (Vermittlung).", "Segment (TCP-Segment)": "Segmente sind die Dateneinheit auf Schicht 4 (Transport).", "Bits (Bitstrom)": "Bits werden auf Schicht 1 (Bitübertragung) übertragen."}, "321": {"Es verstärkt das Signal aktiv, damit Strecken über 100 m möglich werden": "Ein Patchfeld ist passiv und verstärkt nichts – dafür bräuchte man aktive Technik wie Switches.", "Es trennt Broadcast-Domänen und leitet zwischen VLANs weiter wie ein Router": "VLAN-Routing macht ein Router oder Layer-3-Switch; das Patchfeld verbindet nur Kabel.", "Es versorgt alle angeschlossenen Endgeräte per PoE mit Strom": "PoE liefert ein PoE-Switch oder Injektor, ein Patchfeld ist rein passiv."}, "322": {"CSMA/CD – Kollisionen erkennen": "CSMA/CD nutzte das klassische Ethernet; im Funk lassen sich Kollisionen beim Senden nicht erkennen.", "Token Passing – nur mit Token senden": "Token Passing ist das Verfahren von Token Ring bzw. FDDI.", "Polling – der AP fragt jeden Client ab": "Polling (PCF) ist im Standard vorgesehen, wird aber praktisch nicht verwendet."}, "323": {"Ein Router arbeitet auf Schicht 2, ein Gateway auf Schicht 1": "Ein Router arbeitet auf Schicht 3, nicht 2; ein Gateway kann bis Schicht 7 reichen.", "Ein Gateway verbindet nur Geräte im selben Netz": "Für Verbindungen im selben Netz braucht man einen Switch – Gateways verbinden verschiedene Netze.", "Es gibt keinen – beides sind exakt dasselbe Gerät": "Im Alltag wird es oft gleichgesetzt, aber ein Gateway kann auch zwischen Protokollen übersetzen."}, "324": {"Ein Wunsch, der unrealistisch ist": "Ein Wunsch ohne Kaufkraft bleibt ein Bedürfnis – unrealistisch ist kein Kriterium.", "Die Menge, die tatsächlich gekauft wurde": "Die tatsächlich gekaufte Menge ist die Nachfrage bzw. der Absatz.", "Ein Grundbedürfnis wie Essen und Trinken": "Grundbedürfnisse wie Essen sind Existenzbedürfnisse – erst mit Kaufkraft werden sie zu Bedarf."}, "325": {"Minimalprinzip": "Beim Minimalprinzip ist das Ziel fest und der Mitteleinsatz soll möglichst gering sein.", "Optimumprinzip": "Beim Optimumprinzip sind Mittel und Ziel beide variabel – hier ist das Budget aber fest.", "Maximumprinzip (BSI)": "Das Maximumprinzip des BSI bestimmt den Schutzbedarf, es ist kein ökonomisches Prinzip."}, "326": {"Primärer Sektor (Urproduktion)": "Zum primären Sektor gehören Land-, Forstwirtschaft und Bergbau.", "Sekundärer Sektor (Weiterverarbeitung)": "Zum sekundären Sektor gehören Industrie und Handwerk, die Güter herstellen.", "Öffentlicher Sektor (Staat)": "Öffentlicher Sektor ist eine Einteilung nach Eigentum, nicht nach den drei Wirtschaftssektoren."}, "327": {"Substitutionsgüter": "Substitutionsgüter ersetzen sich gegenseitig (z. B. Butter und Margarine).", "Inferiore Güter": "Inferiore Güter werden bei steigendem Einkommen weniger nachgefragt.", "Freie Güter": "Freie Güter sind unbegrenzt verfügbar und kostenlos, wie Luft."}, "328": {"Ein Nachfrageüberhang – der Preis steigt": "Ein Nachfrageüberhang entsteht, wenn der Preis unter dem Gleichgewichtspreis liegt.", "Ein Gleichgewicht – nichts ändert sich": "Im Gleichgewicht stimmen Angebot und Nachfrage überein – bei höherem Preis nicht.", "Ein Monopol – der Preis bleibt fest": "Ein Monopol ist eine Marktform und entsteht nicht durch einen zu hohen Preis."}, "329": {"Polypol": "Im Polypol gibt es viele Anbieter und viele Nachfrager.", "Angebotsmonopol": "Im Angebotsmonopol gibt es nur einen einzigen Anbieter.", "Nachfrageoligopol": "Beim Nachfrageoligopol gibt es wenige Nachfrager, nicht wenige Anbieter."}, "330": {"Boden": "Boden ist ein ursprünglicher (originärer) Produktionsfaktor.", "Arbeit": "Arbeit ist ein originärer Produktionsfaktor, der nicht erst hergestellt werden muss.", "Natur (Umwelt)": "Natur bzw. Umwelt ist ebenfalls originär – nur Kapital wird erst produziert."}, "331": {"Energie sparen senkt Kosten und schont die Umwelt": "Hier fördern sich beide Ziele gegenseitig – das ist Zielharmonie.", "Mehr Umsatz erhöht den Gewinn": "Mehr Umsatz unterstützt meist den Gewinn – auch das ist Zielharmonie.", "Weiterbildung hat keinen Einfluss auf den Gewinn": "Ohne Einfluss auf das andere Ziel spricht man von Zielneutralität, nicht von einem Konflikt."}, "332": {"Anbieter hätten billiger verkauft und gewinnen die Differenz": "Das ist die Produzentenrente aus Sicht der Anbieter.", "Käufer zahlen mehr, als ihnen das Gut wert ist": "Wer mehr zahlt, als ihm das Gut wert ist, kauft gar nicht erst – das ist keine Rente.", "Der Staat erstattet Verbrauchern einen Teil der Steuern": "Steuererstattungen sind staatliche Transfers und keine Konsumentenrente."}, "333": {"Güter, die besonders hochwertig verarbeitet sind": "Inferior heißt „minderwertig“ – es geht um die Reaktion auf Einkommen, nicht um Qualität.", "Güter, deren Nachfrage bei steigendem Einkommen steigt": "Das sind normale bzw. superiore Güter.", "Güter, die sich gegenseitig ergänzen": "Sich ergänzende Güter sind Komplementärgüter."}, "334": {"Sicherheitsbedürfnisse": "Sicherheitsbedürfnisse stehen auf der zweiten Stufe direkt über den Grundbedürfnissen.", "Soziale Bedürfnisse": "Soziale Bedürfnisse stehen in der Mitte der Pyramide.", "Ich-Bedürfnisse (Wertschätzung)": "Ich-Bedürfnisse stehen auf der vierten Stufe, direkt unter der Selbstverwirklichung."}, "335": {"Der Staat plant Produktion, Mengen und Preise für alle Unternehmen": "Das ist die Zentralverwaltungs- bzw. Planwirtschaft.", "Der Staat greift nie ein, der Markt regelt alles allein": "Das ist die freie Marktwirtschaft ohne sozialen Ausgleich.", "Alle großen Unternehmen gehören dem Staat und werden zentral gelenkt": "Staatseigentum mit zentraler Lenkung kennzeichnet die Planwirtschaft."}, "336": {"ALTER TABLE … MODIFY …": "ALTER TABLE ändert die Struktur einer Tabelle, nicht die Daten.", "INSERT INTO … VALUES …": "INSERT INTO fügt neue Datensätze hinzu, ändert aber keine vorhandenen.", "MODIFY … SET … WHERE …": "MODIFY ist kein eigenständiger SQL-Befehl, nur ein Zusatz bei ALTER TABLE in manchen Systemen."}, "337": {"Alle Zeilen der linken Tabelle, auch wenn kein Partner existiert": "Das ist ein LEFT (OUTER) JOIN.", "Alle Zeilen beider Tabellen, auch wenn kein Partner existiert": "Das ist ein FULL OUTER JOIN.", "Jede Zeile der einen mit jeder Zeile der anderen Tabelle kombiniert": "Das ist ein CROSS JOIN (kartesisches Produkt)."}, "338": {"SUM()": "SUM() bildet die Summe, nicht den Durchschnitt.", "MEAN()": "MEAN() gibt es in Standard-SQL nicht – das ist eine Funktion aus Statistiksprachen.", "COUNT()": "COUNT() zählt die Zeilen bzw. Werte."}, "339": {"ORDER BY spalte ASC": "ASC sortiert aufsteigend und ist ohnehin der Standard.", "SORT BY spalte DOWN": "SORT BY und DOWN sind keine Standard-SQL-Schlüsselwörter.", "GROUP BY spalte DESC": "GROUP BY fasst Zeilen für Aggregatfunktionen zusammen, es sortiert nicht."}, "340": {"Ein einzelner Wahrheitswert, der nur wahr oder falsch sein kann": "Das ist ein Boolean.", "Eine Schleife mit einer festen Anzahl von Durchläufen": "Das ist eine Zählschleife (FOR-Schleife).", "Eine Funktion, die keinen Rückgabewert liefert": "Das ist eine Prozedur (void-Funktion)."}, "341": {"= vergleicht, == weist zu": "Genau umgekehrt: = weist zu, == vergleicht.", "Beides weist zu, == nur bei Zahlen": "== weist nie zu, es vergleicht immer – auch bei Texten und anderen Datentypen.", "Es gibt keinen Unterschied": "Der Unterschied ist wichtig; ein vertauschtes = in einer Bedingung ist ein typischer Fehler."}, "342": {"Char (einzelnes Zeichen, z. B. CHAR(1))": "CHAR(1) speichert nur ein einzelnes Zeichen, keine Zahl mit Nachkommastellen.", "String (Zeichenkette, z. B. VARCHAR(10))": "Als Text kann man mit dem Preis nicht rechnen oder richtig sortieren.", "Boolean (wahr/falsch, z. B. BIT oder BOOL)": "Boolean kennt nur wahr/falsch und kann keinen Betrag speichern."}, "343": {"Jede Tabelle hat genau einen Fremdschlüssel": "Die Anzahl der Fremdschlüssel ist für die Normalformen ohne Bedeutung.", "Es gibt keine transitiven Abhängigkeiten": "Das ist die 3. Normalform.", "Jedes Nichtschlüsselattribut hängt vom ganzen Schlüssel ab": "Das ist die 2. Normalform (volle funktionale Abhängigkeit)."}, "344": {"Raute": "Die Raute steht im PAP für eine Verzweigung bzw. Entscheidung.", "Parallelogramm": "Das Parallelogramm steht für Ein- und Ausgabe.", "Rechteck mit doppelten Seitenlinien": "Das Rechteck mit doppelten Seitenlinien ist ein Unterprogrammaufruf."}, "345": {"Sie läuft viermal": "Viermal wäre es nur bei VON 1 BIS 4 oder bei „kleiner als 5“ – die 5 zählt mit.", "Sie läuft sechsmal": "Sechsmal wäre es bei VON 0 BIS 5 – hier beginnt die Zählung bei 1.", "Sie läuft, bis i größer als 6 ist": "Die Schleife endet, wenn i größer als 5 wird, nicht erst bei 6."}, "346": {"Er verschlüsselt die Tabelle": "Verschlüsselung ist Aufgabe der Datenbank- oder Dateisystemsicherheit, nicht des Schlüssels.", "Er sortiert die Tabelle automatisch": "Die Reihenfolge der Ausgabe bestimmt ORDER BY, nicht der Primärschlüssel.", "Er verweist auf eine andere Tabelle": "Auf eine andere Tabelle verweist der Fremdschlüssel."}, "347": {"Ein fester Wert, der sich während des Programms nie ändert": "Das ist eine Konstante.", "Eine Bedingung, die in einer Verzweigung geprüft wird": "Das ist eine Bedingung bzw. ein logischer Ausdruck.", "Ein Kommentar im Quelltext, den der Compiler ignoriert": "Das ist ein Kommentar."}, "348": {"Initialisierung": "Die Initialisierung ist die erste Phase vor der Definition und Planung.", "Abschluss": "Der Abschluss kommt erst nach der Durchführung.", "Definition": "Die Definition kommt vor der Planung, nicht danach."}, "349": {"Ein Vorgang mit besonders langer Dauer im Netzplan": "Ein Meilenstein hat keine Dauer – lange Vorgänge sind normale Vorgänge.", "Der teuerste Arbeitsschritt im gesamten Projekt": "Ein Meilenstein ist ein Prüfpunkt, kein Arbeitsschritt mit Kosten.", "Ein Arbeitspaket auf der untersten Ebene des PSP": "Das unterste Element im PSP ist das Arbeitspaket."}, "350": {"Wie weit er sich verschieben lässt, ohne das Projektende zu verzögern": "Das ist der Gesamtpuffer.", "Die Zeit zwischen zwei Meilensteinen": "Zwischen zwei Meilensteinen liegt einfach eine Projektphase, kein Puffer.", "Die Pause zwischen zwei Sprints": "Sprints sind ein Scrum-Begriff; in Scrum folgen Sprints ohne Pause direkt aufeinander."}, "351": {"Der Scrum Master": "Der Scrum Master sorgt für den Prozess und räumt Hindernisse aus, er priorisiert nicht.", "Das Entwicklungsteam": "Das Team wählt im Sprint Planning Einträge aus, priorisiert das Backlog aber nicht.", "Der Kunde selbst": "Der Kunde ist Stakeholder; seine Interessen vertritt der Product Owner."}, "352": {"Ein tägliches Review mit dem Kunden zum Sprint-Ergebnis": "Das Ergebnis mit dem Kunden wird im Sprint Review am Sprintende besprochen.", "Die tägliche Planung aller Aufgaben des ganzen Sprints": "Die Planung des ganzen Sprints findet einmal im Sprint Planning statt.", "Ein täglicher Statusbericht an die Geschäftsführung": "Das Daily ist für das Team, nicht für einen Bericht an die Geschäftsführung."}, "353": {"Die zeitliche Abfolge der Vorgänge als Balken": "Das zeigt ein Gantt- bzw. Balkendiagramm.", "Die Kosten der Arbeitspakete pro Monat": "Das zeigt ein Kostenplan.", "Die Abhängigkeiten der Vorgänge mit Puffern": "Das zeigt ein Netzplan."}, "354": {"Welche Aktien die Firma an Partnern hält": "Beteiligungen an Partnern betreffen die Finanzen und nicht die Projektbeteiligten.", "Welche Hardware und Software beschafft wird": "Die Beschaffung von Hardware und Software ist Teil der Ressourcenplanung.", "Welche Arbeitspakete auf dem kritischen Pfad liegen": "Der kritische Pfad wird in der Netzplantechnik ermittelt."}, "355": {"Ein bereits eingetretenes Problem, das sofort gelöst werden muss": "Ein bereits eingetretenes Problem ist ein Issue bzw. Problem, kein Risiko mehr.", "Eine sichere Kostensteigerung, die schon feststeht": "Ein Risiko ist unsicher; eine feststehende Kostensteigerung wird direkt eingeplant.", "Ein Fehler im Pflichtenheft, der vor der Abnahme auffällt": "Ein entdeckter Fehler ist ein Mangel, der behoben werden muss – kein mögliches Ereignis."}, "356": {"Alle Anforderungen stehen zu Projektbeginn fest": "Feste Anforderungen zu Beginn kennzeichnen das Wasserfallmodell.", "Phasen laufen streng nacheinander ohne Rücksprung": "Streng aufeinanderfolgende Phasen beschreiben das Wasserfallmodell.", "Ein Lastenheft ersetzt jede Abstimmung mit dem Kunden": "Agil setzt gerade auf laufende Abstimmung mit dem Kunden statt auf ein starres Lastenhef
