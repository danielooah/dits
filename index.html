<title>DiTs</title>
<style>
:root{--bg:#e8e5e0;--karte:#f5f3ef;--rand:#d2cec7;--text:#1c1917;--leicht:#6f6a63;--akzent:#2c2927;--akzent2:#4b4743;--akzenttext:#fff;--marke:#e61923;--feld:#fff;--feldlesen:#f1eee9;--neutral:#dcd8d0;--hover:#ebe8e2;--feldrand:#aea89e;--gefahr:#c62828;
--okf:#d5ecd2;--oks:#a8d9ab;--wf:#fbebb5;--ws:#f4d975;--nf:#f6d1cb;--ns:#eea39b;--wahl:#2c2927;--wahltext:#fff;--sym:#2c2927;--symtext:#fff}
[data-thema=dunkel]{--bg:#121012;--karte:#1c191c;--rand:#2f2b30;--text:#f1eff1;--leicht:#a29ea6;--akzent:#f1eff1;--akzent2:#cfcbd2;--akzenttext:#171317;--marke:#ff4651;--feld:#141214;--feldlesen:#181618;--neutral:#2b282c;--hover:#2c292e;--feldrand:#5d5962;--gefahr:#ff7b72;
--okf:#1f3b2a;--oks:#2f6a45;--wf:#453c19;--ws:#7a6a1f;--nf:#4a2427;--ns:#8a3a3d;--wahl:#45414a;--wahltext:#f1eff1;--sym:#36323a;--symtext:#f1eff1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
#kopf{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;border-bottom:1px solid var(--rand)}
.marke{display:flex;align-items:center;gap:10px}.marke b{display:block;font-size:20px;line-height:1.1}.marke small{display:block;font-size:11px;color:var(--leicht)}
.punkt{width:14px;height:14px;border-radius:50%;background:var(--marke);flex:none}
.schalter{width:44px;height:24px;border-radius:12px;background:var(--feldrand);position:relative;align-self:center}
.schalter i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--karte);transition:left .2s}
.schalter.an{background:var(--akzent)}.schalter.an i{left:23px;background:var(--akzenttext)}
.stufe{grid-column:1/3;display:flex;flex-direction:column;gap:4px;cursor:pointer}.stufe>div:first-child{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stufe b{font-size:14px}.stufe span{font-size:12px;color:var(--leicht)}
#app{max-width:680px;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom))}
.leiste{display:flex;align-items:center;gap:10px;margin:4px 0 12px}.leiste h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--leicht);margin:0;flex:1}
#rechts{font-weight:700;font-size:14px;color:var(--leicht);font-variant-numeric:tabular-nums}#rechts.rot{color:var(--gefahr)}
.zurueck{width:38px;height:38px;border-radius:10px;background:var(--karte);border:1px solid var(--rand);text-align:center;font-size:18px}
.karte{background:var(--karte);border:1px solid var(--rand);border-radius:14px;padding:16px;margin-bottom:12px}
.karte.mini{padding:12px 14px}.karte.mini p{margin:4px 0 0}
.abschnitt{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--leicht);margin-bottom:6px}.abschnitt.klein{margin-top:14px}.mt{margin-top:18px}
.leicht{color:var(--leicht)}.klein{font-size:13px}.mitte{text-align:center;display:block;margin:10px auto}
.zeile{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0}.gross{font-size:22px}
.balken{height:7px;border-radius:4px;background:var(--neutral);overflow:hidden;margin:6px 0 10px}.balken i{display:block;height:100%;background:var(--akzent);border-radius:4px;transition:width .4s}
.balken.rot i{background:var(--marke)}.balken.gruen i{background:var(--oks)}.balken.gelb i{background:var(--ws)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 12px;border-radius:9px;background:var(--neutral);font-size:14px}.chip em{font-style:normal;color:var(--leicht);font-size:12px;margin-left:4px}
.kacheln{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kachel{background:var(--feldlesen);border:1px solid var(--rand);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:104px}
.kachel:active{background:var(--hover)}.kachel .sym{width:34px;height:34px;border-radius:8px;background:var(--sym);color:var(--symtext);display:grid;place-items:center;font-weight:700;font-size:17px;margin-bottom:6px}
.kachel b{font-size:16px}.kachel em{font-style:normal;font-size:12px;font-weight:700;color:var(--leicht)}
details summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}details summary::-webkit-details-marker{display:none}
.themenliste{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.thema{display:flex;justify-content:space-between;gap:6px;padding:9px 10px;border-radius:9px;background:var(--neutral);font-size:13px}.thema em{font-style:normal;font-size:11px;font-weight:700;color:var(--leicht)}
.thema.an{background:var(--wahl);color:var(--wahltext);font-weight:700}.thema.an em{color:var(--wahltext)}
.link{color:var(--text);text-decoration:underline;font-size:14px;margin-top:8px}
.knopf{display:inline-flex;justify-content:center;align-items:center;padding:12px 18px;border-radius:11px;background:var(--karte);border:1px solid var(--rand);font-weight:600;margin-top:10px}
.knopf.akzent{background:var(--akzent);color:var(--akzenttext);border-color:var(--akzent)}.knopf.breit{display:flex;width:100%}
.knopf.ja{background:var(--oks);border-color:var(--oks);color:var(--text)}.knopf.nein{background:var(--ns);border-color:var(--ns);color:var(--text)}.knopf.gefahr{color:var(--gefahr);border-color:var(--gefahr)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--leicht);background:var(--neutral);padding:3px 9px;border-radius:6px}
.frage{font-size:19px;line-height:1.35;margin:10px 0 14px}.frage-text{margin:6px 0 12px}
.optionen{display:grid;gap:8px}.opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:11px;background:var(--neutral);min-height:52px}
.opt .nr{flex:none;width:28px;height:28px;border-radius:7px;background:var(--sym);color:var(--symtext);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.richtig{background:var(--oks)}.opt.falsch{background:var(--ns)}.opt.grau{color:var(--leicht)}.opt.grau .nr{background:var(--rand);color:var(--leicht)}
.rueck{border-radius:12px;padding:14px;margin-top:12px}.rueck.ok{background:var(--okf)}.rueck.nein{background:var(--nf)}.rueck p{margin:6px 0 2px}.rueck ol{margin:8px 0 4px;padding-left:20px}.rueck li{margin:3px 0}
.runde{margin-top:14px}
.ergebnis{text-align:center;padding:10px 0}.riesig{font-size:44px;font-weight:800}.reihe{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.wischkarte{background:var(--feld);border:1px solid var(--feldrand);border-radius:16px;padding:22px 18px;min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:8px 0 12px;transition:transform .25s,background .25s;touch-action:pan-y;user-select:none}
.wischkarte.gross{min-height:300px}.wischkarte h3{font-size:20px;margin:10px 0}.wischkarte.ok{background:var(--okf)}.wischkarte.nein{background:var(--nf)}.wischkarte.hinten{background:var(--feldlesen)}
.wischkarte.neigt-l{box-shadow:-6px 0 0 var(--ns)}.wischkarte.neigt-r{box-shadow:6px 0 0 var(--oks)}
.wischkarte .antwort{font-size:17px}.fragez{font-size:28px;font-weight:800;color:var(--marke)}.hinweis{color:var(--gefahr);font-size:14px;margin:6px 0 0}
.paar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.paar .knopf{margin:0;padding:16px;font-size:17px}
.liste{display:grid;gap:8px}.eintrag{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--feldlesen);border:1px solid var(--rand);border-radius:12px;padding:12px 14px}
.eintrag b{display:block}.eintrag small{color:var(--leicht);font-size:12px}.eintrag em{font-style:normal;font-weight:700;font-size:13px;white-space:nowrap}.eintrag.hl{border-color:var(--akzent)}
.brett{display:grid;grid-template-columns:1fr 1fr;gap:8px}.brett>div{display:grid;gap:8px;align-content:start}
.feld{background:var(--neutral);border-radius:10px;padding:12px 8px;min-height:54px;font-size:14px;text-align:center;transition:all .15s}
.feld.gewaehlt{background:var(--wahl);color:var(--wahltext)}.feld.weg{opacity:0;pointer-events:none}.feld.fehl{background:var(--ns)}
.gegeben{background:var(--feldlesen);border:1px solid var(--rand);border-radius:12px;padding:12px 14px}.gz{display:grid;grid-template-columns:minmax(84px,max-content) 1fr;gap:4px 14px;padding:3px 0;font-size:14px}.gz span{color:var(--leicht)}.gz b{text-align:left}
[hidden]{display:none!important}
.eingabe{display:flex;gap:8px;align-items:center}.eingabe input{flex:1;min-width:0;padding:13px;border-radius:11px;border:1.5px solid var(--feldrand);background:var(--feld);color:var(--text);font:inherit;font-size:18px}
.eingabe input:focus{outline:none;border-color:var(--akzent)}.eingabe .knopf{margin:0}.eingabe span{color:var(--leicht);font-weight:700}
.kalk{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.kalk td{padding:2px 0}.kalk td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.kalk .summe td{font-weight:700}.kalk .notiz td{font-size:11px;color:var(--leicht);padding-bottom:4px}
.scroll{overflow-x:auto;margin-top:8px}.subnetze{border-collapse:collapse;font-size:12px;white-space:nowrap}.subnetze th{text-align:left;color:var(--leicht);font-size:10px;padding:2px 10px 2px 0}
.subnetze td{padding:2px 10px 2px 0;font-variant-numeric:tabular-nums}.subnetze tr.mark td{font-weight:700}
textarea{width:100%;padding:12px;border-radius:11px;border:1.5px solid var(--feldrand);background:var(--feld);color:var(--text);font:inherit;font-size:16px;resize:vertical}
textarea:focus{outline:none;border-color:var(--akzent)}textarea:disabled{background:var(--feldlesen)}
.szenario p{margin:8px 0 0;font-size:14px}
.krit{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;background:var(--neutral);margin-bottom:6px;font-size:14px}.krit em{font-style:normal;margin-left:auto;font-weight:700;font-size:12px;white-space:nowrap}
.krit .box{flex:none;width:20px;height:20px;border-radius:5px;border:2px solid var(--feldrand);background:var(--feld)}.krit.an{background:var(--oks)}.krit.an .box{background:var(--akzent);border-color:var(--akzent)}
.statzeile{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:13px}.statzeile .balken{margin:7px 0}.statzeile b{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--akzent);color:var(--akzenttext);padding:10px 18px;border-radius:12px;font-weight:600;transition:all .3s;z-index:9;max-width:90vw}
.toast.an{opacity:1;transform:translate(-50%,0)}

body.unter #kopf{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px;gap:4px 12px}
body.unter .marke small{display:none}body.unter .marke b{font-size:17px}body.unter .punkt{width:11px;height:11px}
body.unter .stufe b{font-size:13px}body.unter .stufe .balken{height:4px;margin:2px 0 0}body.unter .schalter{transform:scale(.85)}
.weiterleiste{position:sticky;bottom:0;z-index:4;margin:14px -14px 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 22%)}
.weiterleiste .knopf{margin:0;padding:15px;font-size:17px}
.knopf.weich{background:var(--wahl);color:var(--wahltext);border-color:var(--wahl)}
.faellig{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin:6px 0 2px;padding:11px 14px;border-radius:11px;background:var(--neutral)}
.faellig b{display:block;font-size:15px}.faellig small{display:block;font-size:12px;color:var(--leicht)}.faellig em{font-style:normal;font-size:22px;color:var(--leicht)}
details.themen summary .abschnitt{margin:0}details.themen:not([open]){padding-top:13px;padding-bottom:13px}
.kachel:last-child:nth-child(odd){grid-column:1/3}
.rliste{display:grid;gap:6px;margin-bottom:6px}.rzeile{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;background:var(--okf);font-size:15px}
.rzeile .nr{flex:none;width:26px;height:26px;border-radius:7px;background:var(--sym);color:var(--symtext);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.rf{min-height:48px;font-size:15px}
.lueckentab{border-collapse:collapse;font-size:13px;margin-bottom:6px;min-width:100%}
.lueckentab th,.lueckentab td{border:1px solid var(--rand);padding:7px 8px;text-align:left;vertical-align:top}
.lueckentab tr:first-child th{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--leicht);background:var(--feldlesen)}
.lueckentab td.akt{background:var(--ws);font-weight:800;text-align:center}.lueckentab td.offen{background:var(--feldlesen);color:var(--leicht);text-align:center}
.lueckentab tr+tr th{white-space:nowrap}.lueckentab td.ok{background:var(--okf)}.lueckentab td.nein{background:var(--nf)}
.balken.schwach{background:var(--nf)}.rotschrift{color:var(--gefahr)}

.wleiste{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.wleiste .knopf{flex:1;margin:0}
.wsuche{display:flex;gap:8px;margin:0 0 14px}.wsuche input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border-radius:11px;border:1px solid var(--rand);background:var(--feld);color:var(--text)}.wsuche .knopf{margin:0}
.karte.wissen{padding:6px 16px 14px;margin-bottom:12px}.wh{font-size:17px;margin:18px 0 6px}.wp{margin:6px 0;line-height:1.5;font-size:15px}
.wl{margin:4px 0 8px;padding-left:22px;line-height:1.5;font-size:15px}.wl li{margin:3px 0}
.wformel{white-space:pre-line;background:var(--feldlesen);border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:700;font-size:15px;line-height:1.5}
.wcode{background:var(--feldlesen);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:12px;white-space:pre-wrap;overflow-x:auto}
.kontext{background:var(--feldlesen);border:1px solid var(--rand);border-radius:10px;padding:10px 12px;margin:10px 0 4px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.kontext.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;overflow-x:auto;white-space:pre}
.sicher{margin-top:12px;padding:9px 14px;border-radius:10px;background:var(--neutral);color:var(--leicht);font-weight:700;font-size:13px}.sicher.an{background:var(--akzent);color:var(--akzenttext)}
.opt.gewaehlt{background:var(--akzent);color:var(--akzenttext)}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ab .opt{justify-content:center;font-weight:700;min-height:64px;text-align:center}
.luecke{color:var(--marke)}
.zwz{display:grid;grid-template-columns:1fr 92px auto;gap:6px 8px;align-items:center;padding:4px 0;font-size:14px}.zwz input{padding:8px;border-radius:8px;border:1.5px solid var(--feldrand);background:var(--feld);color:var(--text);font:inherit;width:100%}.zwz em{font-style:normal;color:var(--leicht)}.zwz b{grid-column:1/-1;font-size:13px}.zwz b:empty{display:none}
.verlauf{position:relative;display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:130px;align-items:end}.vb{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}.vb i{width:100%;min-height:2px;border-radius:3px 3px 0 0;background:var(--neutral)}.vb i.rot{background:var(--marke)}.vb i.gruen{background:var(--oks)}.vb small{font-size:9px;color:var(--leicht);height:15px}
.vziel{position:absolute;left:0;right:0;border-top:1.5px dashed var(--leicht)}
.chip.an{background:var(--akzent);color:var(--akzenttext)}
.datum{padding:10px;border-radius:10px;border:1.5px solid var(--feldrand);background:var(--feld);color:var(--text);font:inherit;width:100%}
.wtipp{background:var(--feldlesen);border-left:4px solid var(--marke);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:15px;line-height:1.5}.wtipp small{display:block;color:var(--marke);font-weight:800;font-size:11px;letter-spacing:.05em}
.grafik{margin:10px 0}.grafik svg{width:100%;height:auto;display:block;font-family:inherit}
.wtab{border-collapse:collapse;font-size:13px;margin:8px 0;min-width:100%}.wtab th,.wtab td{border:1px solid var(--rand);padding:6px 8px;text-align:left;vertical-align:top}
.wtab tr:first-child th{background:var(--feldlesen);font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--leicht)}
.formel{background:var(--karte);border:1px solid var(--rand);border-radius:14px;padding:12px 14px;margin:0 0 10px}.formel small{color:var(--leicht);font-weight:700;font-size:12px}
.formel b{display:block;font-size:16px;line-height:1.45;margin:4px 0}.formel p{margin:4px 0}.formel .link{padding:0;margin:0}
mark{background:var(--ws);color:inherit;border-radius:3px;padding:0 2px}
.rueck .link{margin:8px 0 0;padding:0}

.plan{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;margin:6px 0;border-radius:11px;background:var(--neutral);font-size:15px}.plan em{margin-left:auto;font-style:normal;color:var(--leicht)}.plan.fertig{background:var(--okf);color:var(--leicht)}
.ampel{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rand);margin-right:7px;vertical-align:middle}.ampel.gruen{background:var(--oks)}.ampel.gelb{background:#e0b43c}.ampel.rot{background:var(--marke)}
.wochenpunkte{display:flex;justify-content:space-between;margin:12px 4px 2px}.wochenpunkte span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--leicht)}.wochenpunkte i{width:14px;height:14px;border-radius:50%;background:var(--neutral)}.wochenpunkte .gruen i{background:var(--oks)}.wochenpunkte .gelb i{background:#e0b43c}.wochenpunkte .zukunft i{background:transparent;border:1px solid var(--rand)}.wochenpunkte .heute{font-weight:800;color:var(--text)}
.lfeld{display:flex;flex-direction:column;gap:4px;margin:10px 0}.lfeld span{font-size:13px;font-weight:700}.lfeld input{font-size:17px;padding:11px 12px;border-radius:10px;border:1px solid var(--rand);background:var(--feld);color:var(--text)}
.mono{font-family:ui-monospace,Consolas,monospace}.kursiv{font-style:italic}
.reihe.klein{justify-content:flex-start;gap:14px;margin-top:6px}
.dialog{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;padding:12px}.dialog .karte{width:100%;margin:0}.dialog textarea{width:100%;margin:10px 0;padding:10px;border-radius:10px;border:1px solid var(--rand);background:var(--feld);color:var(--text);font:inherit}
.opt.pz{margin-bottom:8px;width:100%}.wtab tr.fett td{font-weight:800}
#inhalt{padding-bottom:110px}
@media print{header,.kopf,.wissenleiste,.chips,.knopf,#weiterleiste,.stufe{display:none!important}body{background:#fff;color:#000}.formel{break-inside:avoid;border:1px solid #ccc}}

</head>
<body>
<header id="kopf"></header>

<script>
const INHALTE = {"themen": {"hw": "Hardware", "spe": "Speicher, Backup & USV", "osi": "OSI, Ports & Switching", "ip": "IP & Subnetting", "wlan": "WLAN", "dienste": "Netzwerkdienste", "fw": "Firewall, NAT & VPN", "virt": "Virtualisierung & Cloud", "sec": "IT-Sicherheit", "dsgvo": "Datenschutz & DSGVO", "prog": "Programmieren & SQL", "pm": "Projektmanagement", "kauf": "Angebot & Kauf", "hk": "Handelskalkulation", "service": "IT-Service & Qualität", "green": "Entsorgung & Green IT", "wiso": "Wirtschaft (WiSo, AP2)"}, "kurz": {"hw": "Hardware", "spe": "Speicher & Backup", "osi": "OSI & Ports", "ip": "IP & Subnetting", "wlan": "WLAN", "dienste": "Netzwerkdienste", "fw": "Firewall & VPN", "virt": "Virtualisierung", "sec": "IT-Sicherheit", "dsgvo": "DSGVO", "prog": "Programmieren", "pm": "Projektmanagement", "kauf": "Angebot & Kauf", "hk": "Handelskalkulation", "service": "IT-Service", "green": "Green IT", "wiso": "WiSo (AP2)"}, "quiz": [["hw", "Welcher Cache ist am kleinsten und am schnellsten?", "L1-Cache", "L2-Cache|L3-Cache|L4-Cache", "L1 ist am kleinsten und schnellsten, L3 am größten und langsamsten – alle sind schneller als RAM."], ["hw", "Aus welcher Speicherart besteht der CPU-Cache?", "SRAM", "DRAM|SDRAM|EEPROM", "SRAM muss nicht aufgefrischt werden, ist schnell und teuer → ideal für den Cache. DRAM ist günstig → Arbeitsspeicher."], ["hw", "Mit welcher Spannung arbeitet DDR4-RAM?", "1,2 V", "1,5 V|1,1 V|1,8 V", "DDR3 = 1,5 V, DDR4 = 1,2 V, DDR5 = 1,1 V. Jede Generation braucht weniger Spannung."], ["hw", "Wie heißt das Modul zum Chip DDR4-3200?", "PC4-25600", "PC4-3200|PC4-12800|PC5-25600", "Rechentrick: Chip-Zahl × 8 Byte. 3200 × 8 = 25.600 MB/s → PC4-25600."], ["hw", "Welcher Teil der CPU rechnet und vergleicht?", "Rechenwerk (ALU)", "Steuerwerk (CU)|Speicherwerk (RAM)|Befehlszähler (PC)", "Die ALU rechnet arithmetisch und logisch. Das Steuerwerk holt und dekodiert Befehle."], ["hw", "Wo steckt die frühere North-Bridge in modernen PCs?", "In der CPU", "Auf der Grafikkarte|In der South-Bridge|Im Super-I/O-Chip", "Die North-Bridge (CPU, RAM, Grafik) ist in die CPU gewandert. Übrig bleibt ein Chip: PCH (Intel) bzw. FCH (AMD)."], ["hw", "Wie viele GT/s pro Lane schafft PCIe 4.0?", "16 GT/s", "8 GT/s|32 GT/s|5 GT/s", "PCIe 3.0 = 8, 4.0 = 16, 5.0 = 32 GT/s. Faustregel: Jede Generation verdoppelt."], ["hw", "Wie schnell ist USB 2.0 (Hi-Speed)?", "480 Mbit/s", "12 Mbit/s|5 Gbit/s|100 Mbit/s", "USB 1.1 = 12 Mbit/s, USB 2.0 = 480 Mbit/s, USB 3.0 (3.2 Gen 1x1) = 5 Gbit/s."], ["hw", "Welcher Mainboard-Formfaktor misst ca. 17 × 17 cm?", "Mini-ITX", "Micro-ATX|ATX|Extended ATX", "Mini-ITX: 17 × 17 cm, sparsam, oft passiv gekühlt. Micro-ATX: 24,4 × 24,4 cm."], ["hw", "Was bedeutet Hyper-Threading (Intel) bzw. SMT (AMD)?", "Ein physischer Kern bearbeitet zwei Threads", "Zwei CPUs teilen sich ein Mainboard|Der Takt wird unter Last verdoppelt|Der RAM überträgt zweimal pro Takt", "Hyper-Threading/SMT: ein physischer Kern, zwei Threads. „Zweimal pro Takt“ ist DDR."], ["hw", "Bis zu welcher Leistung geht USB Power Delivery ab Version 3.1?", "240 W", "100 W|60 W|15 W", "USB-PD liefert bis 100 W, ab USB-PD 3.1 bis 240 W."], ["hw", "Was macht der RAM, wenn der Strom weg ist?", "Er verliert alle Daten (flüchtig)", "Er behält die Daten bis zum nächsten Start|Er sichert den Inhalt in die Auslagerungsdatei|Er hält die Daten per CMOS-Batterie", "RAM ist flüchtig. Wird er knapp, lagert das OS in die Auslagerungsdatei aus (virtueller Speicher)."], ["spe", "Welche Sicherungsart braucht zur Wiederherstellung die Vollsicherung plus ALLE folgenden Sicherungen der Reihe nach?", "Inkrementell", "Differenziell|Vollsicherung|Kopiesicherung", "Inkrementell sichert nur Änderungen seit der letzten Sicherung – deshalb braucht man jedes Inkrement."], ["spe", "Eine differenzielle Sicherung sichert …", "Änderungen seit der letzten Vollsicherung", "Änderungen seit der letzten Sicherung (egal welcher)|Änderungen seit der letzten differenziellen Sicherung|alle Daten, unabhängig von Änderungen", "Differenziell wächst täglich; Wiederherstellung = Vollsicherung + letzte differenzielle."], ["spe", "Was besagt die 3-2-1-Regel?", "3 Kopien, 2 verschiedene Medien, 1 Kopie außer Haus", "3 Generationen, 2 Bänder, 1 Kopie im Serverschrank|3 Kopien, 2 davon auf demselben NAS, 1 Kopie im RAID|3 Medien, 2 Kopien, 1 Kopie im selben Brandabschnitt", "3 Kopien, 2 Medien, 1 offline/extern – schützt vor Ransomware und Brand."], ["spe", "Was beschreibt der RPO?", "Wie viel Datenverlust maximal akzeptabel ist", "Wie schnell das System wieder laufen muss|Wie lange ein System im Jahr insgesamt ausfallen darf|Wie lange Sicherungen aufbewahrt werden müssen", "RPO = maximaler Datenverlust (bestimmt, wie oft gesichert wird). RTO = wie schnell es wieder laufen muss."], ["spe", "Welche USV hat eine Umschaltzeit von 0 ms?", "Online / Doppelwandler (VFI)", "Offline / Standby (VFD)|Line-Interactive (VI)|Standby mit Sinus-Wechselrichter (VFD)", "Bei VFI läuft der Strom immer über Gleich- und Wechselrichter, der Akku hängt am Zwischenkreis – es gibt nichts umzuschalten."], ["spe", "Eine USV hat 1500 VA bei cos φ = 0,6. Wie viel Wirkleistung liefert sie?", "900 W", "1500 W|2500 W|600 W", "Wirkleistung = VA × Leistungsfaktor = 1500 × 0,6 = 900 W."], ["spe", "Auf welcher Ebene greift ein Server auf ein SAN zu?", "Blockebene – wie eine lokale Platte", "Dateiebene über SMB oder NFS wie ein Netzlaufwerk|Nur über USB wie eine externe Platte|Über HTTP-Downloads vom Speichersystem", "SAN = eigenes Speichernetz (iSCSI, Fibre Channel), Blockebene. NAS = Dateiebene im LAN."], ["spe", "RAID 5 mit 4 Platten à 2 TB – wie viel ist nutzbar?", "6 TB", "8 TB|4 TB|2 TB", "RAID 5: (n − 1) × kleinste Platte = 3 × 2 TB = 6 TB."], ["spe", "Warum ersetzt RAID kein Backup?", "Es schützt nicht vor Löschen, Ransomware oder Brand", "Weil RAID die Daten langsamer schreibt als ein Backup|Weil RAID nur mit SSDs zuverlässig funktioniert|Weil RAID nur die Metadaten der Dateien speichert", "RAID schützt nur vor Plattenausfall."], ["spe", "Wie viele Platten braucht RAID 6 mindestens?", "4", "3|2|5", "RAID 6: mind. 4 Platten, (n − 2) × kleinste nutzbar, 2 Platten dürfen ausfallen."], ["spe", "Wofür steht beim Generationenprinzip der „Sohn“?", "Tägliche Sicherung", "Wöchentliche Sicherung|Monatliche Sicherung|Jährliche Sicherung", "Sohn = täglich, Vater = wöchentlich, Großvater = monatlich."], ["spe", "Wie löscht man eine SSD zuverlässig?", "Secure Erase oder physisch zerstören", "Mit einem Degausser entmagnetisieren|Schnellformatierung mit NTFS|Einmal komplett mit Nullen überschreiben", "Degausser und einfaches Überschreiben wirken bei SSDs nicht zuverlässig."], ["osi", "Auf welcher OSI-Schicht arbeitet ein (normaler) Switch?", "Schicht 2 – Sicherung", "Schicht 1 – Bitübertragung|Schicht 3 – Vermittlung|Schicht 4 – Transport", "Der Switch arbeitet mit MAC-Adressen → Schicht 2."], ["osi", "Auf welcher OSI-Schicht arbeitet ein Router?", "Schicht 3 – Vermittlung", "Schicht 2 – Sicherung|Schicht 4 – Transport|Schicht 7 – Anwendung", "Router arbeiten mit IP-Adressen und routen → Schicht 3."], ["osi", "Auf welcher OSI-Schicht arbeitet ein Hub?", "Schicht 1 – Bitübertragung", "Schicht 2 – Sicherung|Schicht 3 – Vermittlung|Schicht 5 – Sitzung", "Ein Hub schickt alles an alle → Schicht 1 (wie Repeater)."], ["osi", "Welche Schicht kümmert sich um Kodierung, Kompression und Verschlüsselung?", "Schicht 6 – Darstellung", "Schicht 5 – Sitzung|Schicht 4 – Transport|Schicht 2 – Sicherung", "Darstellung (Presentation): ASCII, UTF-8, JSON, TLS-Verschlüsselung."], ["osi", "Zu welcher Schicht gehören TCP und UDP?", "Schicht 4 – Transport", "Schicht 3 – Vermittlung|Schicht 5 – Sitzung|Schicht 7 – Anwendung", "Transport: Segmentierung, Reihenfolge, Zuordnung per Port."], ["osi", "Welcher Port gehört zu RDP?", "3389", "3306|5900|22", "3389 = RDP, 3306 = MySQL, 5900 = VNC, 22 = SSH."], ["osi", "Welcher Port gehört zu IMAPS?", "993", "995|143|999", "143 = IMAP, 993 = IMAPS. 995 = POP3S. (999 war ein Fehler in deinen Unterlagen!)"], ["osi", "Welcher Port wird für SMTP-Submission mit STARTTLS genutzt?", "587", "25|110|143", "25 = SMTP Server zu Server, 465 = SMTPS (TLS von Anfang an), 587 = Submission (mit STARTTLS)."], ["osi", "Welcher Port gehört zu Kerberos?", "88", "389|636|445", "88 = Kerberos (Domänenanmeldung), 389 = LDAP, 636 = LDAPS, 445 = SMB."], ["osi", "Welcher Port gehört zu DNS?", "53", "67|123|161", "53 = DNS, 67/68 = DHCP, 123 = NTP, 161 = SNMP."], ["osi", "Was ändert sich an jedem Router auf dem Weg durchs Netz?", "Die MAC-Adressen", "Die IP-Adressen|Die Ports|Die Nutzdaten", "IP-Adressen bleiben gleich, MAC-Adressen ändern sich an jedem Hop."], ["osi", "Wie groß ist ein Ethernet-Frame?", "Maximal 1518 Byte, mindestens 64 Byte", "Immer genau 1518 Byte, egal wie viele Nutzdaten|Maximal 1500 Byte, mindestens 46 Byte|Maximal 9000 Byte, mindestens 64 Byte", "Max. 1518 Byte, davon 1500 Byte Nutzdaten (MTU). Minimum 64 Byte. Mit VLAN-Tag (802.1Q) maximal 1522 Byte."], ["osi", "Wie läuft der TCP-3-Wege-Handshake ab?", "SYN → SYN-ACK → ACK", "ACK → SYN → FIN|SYN → ACK → SYN-ACK|SYN → FIN → ACK", "Client SYN, Server SYN-ACK, Client ACK. Der dritte Schritt beweist den Rückweg."], ["osi", "Welcher dieser Dienste nutzt typischerweise UDP?", "NTP", "SSH|HTTPS|SMTP", "UDP: DNS, DHCP, NTP, SNMP, VoIP, Streaming. TCP: HTTP(S), Mail, FTP, SSH, RDP."], ["osi", "Wie lang darf ein Twisted-Pair-Kupferkabel maximal sein?", "100 m", "30 m|500 m|1000 m", "Max. 100 m wegen Dämpfung und Übersprechen."], ["osi", "Welche Kupferkategorie ist für 10GBASE-T bei 500 MHz spezifiziert?", "Cat 6A", "Cat 5e|Cat 6|Cat 8", "Cat 6A: 500 MHz, 10 Gbit/s. Cat 6 nur bis 55 m mit 10 Gbit/s."], ["osi", "Was stimmt zu Singlemode-Glasfaser?", "Dünner Kern, bis 10–100 km, höchste Bandbreite über Distanz", "Dicker Kern, nur ca. 300 m, für kurze Strecken|Langsamer als Multimode, dafür günstiger|Wird durch elektromagnetische Störungen stark beeinflusst", "Singlemode = dünn, weit, schnell. Multimode = dicker Kern, kürzere Strecken, günstiger."], ["osi", "Wie lang ist eine MAC-Adresse?", "48 Bit", "32 Bit|64 Bit|128 Bit", "48 Bit = 12 Hex-Zeichen. Erste 24 Bit Hersteller (OUI), letzte 24 Bit Gerätenummer."], ["osi", "Womit trennt man Broadcast-Domänen?", "Router oder VLAN", "Layer-2-Switch oder Bridge (ohne VLANs)|Hub oder Repeater|Access Point oder Medienkonverter", "Alles an einem Switch ist eine Broadcast-Domäne. Trennung nur per Router oder VLAN."], ["osi", "Welcher Standard beschreibt VLANs?", "IEEE 802.1Q", "IEEE 802.1X|IEEE 802.3af|IEEE 802.11ac", "802.1Q = VLAN-Tagging. 802.1X = Port-Anmeldung, 802.3af = PoE."], ["osi", "Was verhindert Spanning Tree (STP)?", "Schleifen und Broadcast-Stürme bei redundanter Verkabelung", "Doppelte IP-Adressen bei statischer Vergabe im Netz|Unverschlüsselten Verkehr zwischen zwei Switches|Zu lange Kabelwege durch automatisches Umleiten", "STP wählt eine Root Bridge und blockiert redundante Wege, bis einer ausfällt."], ["osi", "Was ist ein Trunk-Port?", "Ein Port, der mehrere VLANs getaggt überträgt", "Ein Port, der ein einzelnes VLAN ungetaggt überträgt|Ein Port, der den Verkehr anderer Ports spiegelt|Ein Port, der Endgeräte per 802.1X anmeldet", "Trunk = tagged, mehrere VLANs (zwischen Switches/Router). Access = untagged, ein VLAN."], ["osi", "Was macht ICMP?", "Meldet Fehler und Diagnose (z. B. Ping)", "Sendet verlorene Pakete erneut (Fehlerkorrektur)|Löst IP-Adressen in MAC-Adressen auf|Baut Verbindungen per Handshake auf", "ICMP meldet nur. Neusenden macht TCP."], ["osi", "Was ist ein Socket?", "IP-Adresse + Port + Protokoll", "MAC-Adresse + IP-Adresse + Port|IP-Adresse + Subnetzmaske + Gateway|Portnummer + Protokoll (ohne IP)", "Eine Verbindung ist eindeutig durch das 5-Tupel: Quell-IP, Quell-Port, Ziel-IP, Ziel-Port, Protokoll."], ["osi", "Wo gehören Bridge und CSMA/CD im OSI-Modell hin?", "Schicht 2", "Schicht 1|Schicht 3|Schicht 4", "Beides Schicht 2 (Sicherung). In deinen Unterlagen stand fälschlich Schicht 1."], ["ip", "Welcher private Adressbereich gehört zur Klasse B?", "172.16.0.0/12", "172.16.0.0/16|10.0.0.0/8|192.168.0.0/16", "172.16.0.0 bis 172.31.255.255 = /12. (In deinen Unterlagen stand fälschlich /16.)"], ["ip", "Ein PC hat die Adresse 169.254.12.7. Was bedeutet das?", "Kein DHCP-Server erreichbar (APIPA)", "Private Adresse aus dem DHCP-Pool (RFC 1918)|Loopback-Adresse für Tests am eigenen Host|Öffentliche Adresse, vom Provider vergeben", "169.254.0.0/16 = APIPA, selbst vergeben, kein Gateway, nicht routbar."], ["ip", "Welche Subnetzmaske entspricht /26?", "255.255.255.192", "255.255.255.128|255.255.255.224|255.255.255.240", "26 Einsen: das letzte Oktett 11000000 = 192."], ["ip", "Wie viele nutzbare Hosts hat ein /27-Netz?", "30", "32|62|14", "Host-Bits = 32 − 27 = 5 → 2⁵ − 2 = 30."], ["ip", "Wie lautet die Netzadresse von 192.168.16.52/25?", "192.168.16.0", "192.168.16.128|192.168.16.52|192.168.0.0", "Blockgröße 128: 52 liegt im Block 0–127 → Netz .0, Broadcast .127."], ["ip", "Wie lautet die Broadcastadresse von 192.168.16.52/25?", "192.168.16.127", "192.168.16.255|192.168.16.128|192.168.16.126", "Alle Host-Bits auf 1 → .127. Nutzbar: .1 bis .126."], ["ip", "Wie lang ist eine IPv6-Adresse?", "128 Bit", "64 Bit|32 Bit|256 Bit", "8 Blöcke à 4 Hex-Ziffern = 128 Bit."], ["ip", "Welches Präfix hat eine IPv6-Link-Local-Adresse?", "fe80::/10", "fc00::/7|2000::/3|ff00::/8", "fe80::/10 = Link-Local (wie APIPA), fc00::/7 = ULA, 2000::/3 = Global Unicast, ff00::/8 = Multicast."], ["ip", "Wie kürzt man 2001:0db8:0000:0000:0000:8a2e:0370:7334 korrekt?", "2001:db8::8a2e:370:7334", "2001:db8:0:8a2e:370:7334|2001:db8::8a2e::370:7334|21:db8::8a2e:37:7334", "Führende Nullen weg, eine längste Null-Folge durch :: ersetzen – nur einmal pro Adresse."], ["ip", "Wie viele /64-Netze stecken in einem /48-Präfix?", "65.536", "256|16|4.096", "64 − 48 = 16 Bit → 2¹⁶ = 65.536 Netze."], ["ip", "Lokales Netz funktioniert, Internet ist auch per IP-Adresse nicht erreichbar. Wahrscheinlichste Ursache?", "Gateway fehlt oder ist falsch", "DNS-Server fehlt oder ist falsch|IP-Adresse ist doppelt vergeben|Subnetzmaske ist zu groß gewählt", "Ohne Gateway kommt man nicht aus dem eigenen Netz raus."], ["ip", "Zugriff per IP klappt, per Name nicht. Ursache?", "DNS fehlt oder ist falsch", "Gateway fehlt oder ist falsch|DHCP-Server ist ausgefallen|Netzwerkkabel ist defekt", "Namensauflösung = DNS."], ["ip", "Ein /24 soll in 8 Subnetze geteilt werden. Welche neue CIDR?", "/27", "/25|/26|/28", "2³ = 8 → 3 Bits borgen: 24 + 3 = /27, je 30 Hosts, Blockgröße 32."], ["ip", "Was bedeutet Dual Stack?", "Geräte haben IPv4 und IPv6 parallel", "Zwei Router für Ausfallsicherheit (Redundanz)|Zwei gebündelte Netzwerkkarten pro PC|IPv6-Pakete werden in IPv4 getunnelt", "Dual Stack = beides parallel (DNS: A- und AAAA-Record). Tunneling = ein Protokoll im anderen."], ["ip", "Was ist die IPv6-Loopback-Adresse?", "::1", "fe80::1|ff02::1|fc00::1", "::1 entspricht 127.0.0.1. ff02::1 = alle Knoten (Multicast)."], ["ip", "Wie prüft ein Host, ob ein Ziel im eigenen Netz liegt?", "UND-Verknüpfung von IP und Subnetzmaske", "Per DNS-Anfrage an den eingetragenen DNS-Server|Per Ping an das Standardgateway und Auswertung der TTL|ODER-Verknüpfung von IP-Adresse und Gateway", "IP AND Maske = Netzadresse. Gleich → direkt per ARP, sonst über das Gateway."], ["wlan", "Welche Kanäle im 2,4-GHz-Band überlappen sich nicht?", "1, 6, 11", "1, 4, 7|3, 6, 9|2, 5, 8, 11", "Kanalraster 5 MHz, ein Kanal ist ca. 20–22 MHz breit → erst 5 Kanäle Abstand (25 MHz) sind sicher überlappungsfrei: 1, 6, 11. In Europa geht bei reinem OFDM auch 1, 5, 9, 13."], ["wlan", "Welcher Standard ist Wi-Fi 6?", "802.11ax", "802.11ac|802.11n|802.11g", "n = Wi-Fi 4, ac = Wi-Fi 5, ax = Wi-Fi 6/6E."], ["wlan", "Auf welcher Frequenz funkt 802.11ac?", "5 GHz", "2,4 GHz|60 GHz|2,4 und 5 GHz", "802.11ac nur 5 GHz. 802.11n nutzt 2,4 + 5 GHz."], ["wlan", "Welches Verfahren ist in Minuten geknackt?", "WEP", "WPA2|WPA3|EAP-TLS", "WEP: gleicher Schlüssel für die ganze Sitzung – unsicher."], ["wlan", "Was bringt WPA3 neu?", "SAE als Schutz gegen Brute Force", "TKIP als neue Verschlüsselung|Versteckte SSID als Pflicht|MAC-Filter auf jedem Access Point", "WPA3 (seit 2018): SAE gegen Brute Force, OWE für offene Netze."], ["wlan", "Welche Rolle hat der Access Point bei 802.1X?", "Authenticator", "Supplicant|Authentication Server|Root Bridge", "Supplicant = Client, Authenticator = AP/Controller, Authentication Server = RADIUS."], ["wlan", "Warum ist ein MAC-Filter unsicher?", "Die MAC steht im Klartext und lässt sich fälschen", "Die MAC wird mit WEP verschlüsselt und ist dadurch schwach|Er blockiert alle Geräte, die IPv6 verwenden|Er funktioniert nur im 5-GHz-Band, nicht im 2,4-GHz-Band", "MAC-Adressen sind im Header lesbar und leicht zu spoofen."], ["wlan", "Welche EAP-Methode wird empfohlen?", "EAP-TLS mit Zertifikaten auf beiden Seiten", "PEAP mit WEP-Verschlüsselung für ältere Geräte|PSK mit möglichst langem gemeinsamem Passwort|MAC-Authentifizierung mit freigegebener Geräteliste", "EAP-TLS ist am sichersten. PEAP-MSCHAPv2 nutzt Benutzername/Passwort."], ["wlan", "Wofür steht AAA?", "Authentication, Authorization, Accounting", "Access, Admin, Audit|Authentication, Access, Availability|Account, Address, Alias", "Wer bist du? Was darfst du? Was hast du genutzt?"], ["wlan", "Warum ist WPA-Personal in Firmen problematisch?", "Ein geleakter PSK gibt allen Zugriff, jeder Wechsel betrifft alle Geräte", "Es ist deutlich langsamer als WPA-Enterprise, weil jedes Paket geprüft wird|Es funktioniert nicht mit Laptops, nur mit Smartphones und Tablets|Es verschlüsselt nur die Anmeldung, die Daten laufen danach im Klartext", "Enterprise = Einzelanmeldung, Konto sperren statt alle Geräte umstellen."], ["wlan", "Was ist ein Rogue Access Point?", "Ein gefälschtes WLAN, über das ein Angreifer mitliest", "Ein Access Point, der nur WPA3 unterstützt|Ein offizieller AP im Gäste-VLAN der Firma|Ein Mesh-Repeater, der das Signal verstärkt", "Rogue AP = gefälschtes WLAN."], ["wlan", "Was ist ein Nachteil von 5 GHz gegenüber 2,4 GHz?", "Schlechter durch Wände", "Mehr Störungen durch Bluetooth|Weniger überlappungsfreie Kanäle|Geringere maximale Datenrate", "5 GHz: schnell, weniger Störungen, aber geringere Reichweite durch Wände."], ["wlan", "Warum kommt bei WLAN in der Praxis weniger an als brutto?", "Overhead, Halbduplex, geteilte Bandbreite, Wände, Störungen", "Weil der Router den Durchsatz absichtlich drosselt|Weil WPA2 etwa die Hälfte der Bandbreite verbraucht|Weil der Provider WLAN-Verkehr extra begrenzt", "Bruttowerte sind Laborwerte; real oft nur die Hälfte oder weniger."], ["dienste", "In welcher Reihenfolge läuft DHCP ab?", "Discover → Offer → Request → Acknowledge", "Request → Offer → Discover → Acknowledge|Offer → Discover → Acknowledge → Request|Discover → Request → Offer → Acknowledge", "DORA: Discover, Offer, Request, Acknowledge."], ["dienste", "Wann versucht ein Client zuerst, seine DHCP-Lease zu verlängern?", "Bei 50 % der Laufzeit (T1)", "Bei 87,5 % der Laufzeit (T2)|Erst bei 100 % der Laufzeit|Bei 25 % der Laufzeit (T0)", "T1 = 50 % per Unicast, T2 = 87,5 % per Broadcast, danach neu mit DORA."], ["dienste", "Wofür steht DHCP-Option 3?", "Gateway (Router)", "DNS-Server|Domänenname|NTP-Server", "3 = Gateway, 6 = DNS, 15 = Domänenname, 42 = NTP, 66/67 = PXE."], ["dienste", "Warum braucht man ein DHCP-Relay?", "Router leiten keine Broadcasts weiter", "DHCP ist sonst unverschlüsselt|Damit Clients IPv6 bekommen|Weil Switches DHCP blockieren", "Das Relay („ip helper-address“) schickt die Anfrage als Unicast an den zentralen Server."], ["dienste", "Was steht in einem AAAA-Record?", "IPv6-Adresse", "IPv4-Adresse|Mailserver|Alias-Name", "A = IPv4, AAAA = IPv6, MX = Mail, CNAME = Alias, PTR = Reverse."], ["dienste", "Welcher DNS-Record zeigt auf den Mailserver?", "MX", "PTR|CNAME|SRV", "MX = Mail Exchanger. SRV findet z. B. Domänencontroller."], ["dienste", "Was prüft ein Client, bevor er den DNS-Server fragt?", "DNS-Cache und HOSTS-Datei", "ARP-Cache und Routingtabelle|DHCP-Lease und Standardgateway|Root-Server und TLD-Server", "Die HOSTS-Datei ist lokal und hat Vorrang."], ["dienste", "Wie nennt man mehrere AD-Trees zusammen?", "Forest", "Domäne|OU|Site", "Domänen mit gemeinsamem Namensstamm = Tree, mehrere Trees = Forest."], ["dienste", "Wofür nutzt man OUs im Active Directory?", "Container für Gruppenrichtlinien und Delegation", "Als Ersatz für DNS-Zonen innerhalb der Domäne|Zum Speichern von Backups der Domänencontroller|Als zweite, getrennte Domäne im selben Forest", "OUs sortieren nach Abteilung/Standort, darauf wirken GPOs."], ["dienste", "Ab welcher Zeitabweichung scheitert die Kerberos-Anmeldung?", "Mehr als 5 Minuten", "Mehr als 5 Sekunden|Mehr als 1 Stunde|Mehr als 1 Tag", "Deshalb ist NTP so wichtig."], ["dienste", "Wofür steht SNMP?", "Simple Network Management Protocol", "Simple Network Monitoring Protocol|Secure Network Mail Protocol|Server Name Mapping Protocol", "Management, nicht Monitoring – ein Fehler aus deinen Unterlagen."], ["dienste", "Was ist passives Monitoring?", "Warten auf Meldungen wie SNMP-Traps oder Logs", "Regelmäßig alle Geräte per Ping abfragen|Port-Scans im Netz durchführen und auswerten|Agenten auf allen Servern installieren und abfragen", "Aktiv = selbst abfragen, passiv = warten auf Meldungen, beides = hybrid."], ["dienste", "Was unterscheidet IMAP von POP3?", "Bei IMAP bleiben die Mails auf dem Server, Sync über alle Geräte", "IMAP ist nur zum Senden da, POP3 nur zum Abrufen|Bei POP3 bleiben die Mails auf dem Server, Sync über alle Geräte|IMAP löscht die Mails nach dem Abruf vom Server", "POP3 holt ab und löscht meist. SMTP = senden."], ["dienste", "Welche SNMP-Version verschlüsselt?", "SNMPv3", "SNMPv1|SNMPv2c|SNMPv1 mit Read-Write-Community", "Alte Versionen sind unsicher, nur v3 verschlüsselt."], ["fw", "Welche Regel steht in einer Firewall-Regeltabelle immer am Ende?", "Deny All", "Allow All|Allow LAN to Any|Log All", "Alles, was nicht erlaubt ist, wird verworfen."], ["fw", "Was macht eine Stateful-Inspection-Firewall besonders?", "Sie merkt sich Verbindungen und lässt passende Antworten automatisch durch", "Sie prüft jedes Paket einzeln, ohne sich frühere Pakete zu merken|Sie liest den Inhalt jedes Pakets bis Schicht 7 und filtert URLs|Sie öffnet für Antworten feste Portbereiche, die der Admin vorgibt", "Nur die Startrichtung braucht eine Regel; das 5-Tupel steht in der State-Tabelle."], ["fw", "Wofür ist eine DMZ da?", "Eigenes Segment für öffentlich erreichbare Server", "Eigenes Segment ausschließlich für das Gäste-WLAN|Abgeschottetes Netz nur für Backups und NAS|Sicherer Bereich für interne Drucker und Scanner", "Von der DMZ nur minimale, kontrollierte Zugriffe ins LAN."], ["fw", "Was zeichnet eine Back-to-Back-Firewall aus?", "Zwei Firewalls (ideal von zwei Herstellern) mit DMZ dazwischen", "Eine Firewall mit drei Anschlüssen (LAN, DMZ, WAN) in einem Gerät|Zwei Firewalls parallel im Cluster, nur zur Lastverteilung|Eine Hardware-Firewall plus eine Software-Firewall auf jedem PC", "Zwei Barrieren, hohe Sicherheit, aber teurer."], ["fw", "Was macht PAT (NAT Overload)?", "Viele private IPs teilen sich eine öffentliche, unterschieden über Ports", "Eine private IP wird fest auf eine öffentliche umgesetzt|Viele private IPs werden auf einen Pool öffentlicher IPs verteilt|Die Ports werden verschlüsselt, damit niemand mitliest", "Standard bei jedem DSL-Router."], ["fw", "Was ist Port Forwarding?", "Eine feste DNAT-Regel von außen nach innen", "Ein VPN-Tunnel zwischen zwei Standorten|Eine Firewall-Regel von innen nach außen|Ein VLAN-Trunk zwischen zwei Switches", "z. B. 212.31.20.125:3389 → 10.0.0.9:3389. Braucht zusätzlich eine erlaubende Regel."], ["fw", "Welche Aussage zu NAT stimmt?", "NAT ist kein Sicherheitsfeature", "NAT ersetzt eine Firewall|NAT verschlüsselt den Verkehr|NAT funktioniert nur mit IPv6", "Schutz bringt die Stateful-Policy, nicht NAT."], ["fw", "Welche Technik nutzt man typischerweise für Site-to-Site-VPN?", "IPsec zwischen zwei Routern", "RDP von einem PC zum anderen|SNMP zwischen den Routern|HTTPS im Browser des Benutzers", "Clients brauchen dafür keine Software."], ["fw", "Warum kommt ein SSL-VPN fast überall durch?", "Es nutzt Port 443", "Es nutzt Port 22|Es nutzt Port 500|Es nutzt Port 1194", "443 ist fast nirgends gesperrt."], ["fw", "In welcher Reihenfolge werden Firewall-Regeln geprüft?", "Von oben nach unten, die erste passende gilt", "Von unten nach oben, die letzte passende gilt|Die spezifischste Regel gilt, egal wo sie steht|Alle passenden Regeln, die strengste gewinnt", "Daher gehört Deny All ans Ende."], ["fw", "Was ist East-West-Verkehr?", "Verkehr innerhalb des Netzes", "Verkehr vom LAN ins Internet und zurück|Verkehr aus dem Internet in die DMZ|Verkehr von Remote-Clients über das VPN", "North-South = rein/raus, East-West = intern (Segmentierung, Host-Firewall)."], ["fw", "Welcher Firewall-Typ prüft auch den Inhalt (Payload)?", "Application-Filter / NGFW (Schicht 7)", "Paketfilter (Schicht 3 und 4)|Stateful Inspection (Schicht 4)|Portfilter auf dem Router (Schicht 4)", "NGFW/UTM: IDS/IPS, URL-Filter, TLS-Inspection."], ["fw", "Welchen Port nutzt WireGuard?", "51820 UDP", "1194 UDP|500 UDP|443 TCP", "1194 = OpenVPN, 500/4500 = IPsec."], ["virt", "Welcher Hypervisor ist Typ 1 (Bare Metal)?", "VMware ESXi", "VirtualBox|VMware Workstation|Parallels", "Typ 1: ESXi, Hyper-V, KVM. Typ 2: Workstation, VirtualBox, Parallels."], ["virt", "Wie läuft ein Typ-2-Hypervisor?", "Als Programm auf einem Host-Betriebssystem", "Direkt auf der Hardware ohne Host-Betriebssystem|Als Erweiterung im BIOS bzw. UEFI des Servers|Nur beim Cloud-Anbieter, nicht auf eigenen Geräten", "Hosted, mehr Overhead – gut für Desktop und Test."], ["virt", "Was teilen sich Container?", "Den Kernel des Host-Systems", "Nichts, jeder hat einen eigenen Kernel|Eine eigene virtuelle Hardware je Container|Den Hypervisor (Typ 1) des Hosts", "Container: App + Abhängigkeiten, gleicher Kernel, startet in Sekunden."], ["virt", "Welches Produkt ist ein Beispiel für Paravirtualisierung?", "Xen", "VMware Workstation|VirtualBox|Parallels Desktop", "Bei Paravirtualisierung ist das Gast-OS angepasst und spricht direkt mit dem Hypervisor."], ["virt", "Was verwaltet der Kunde bei IaaS?", "Betriebssystem, Laufzeit, Anwendung und Daten", "Nur die Daten, alles andere der Anbieter|Nichts – alles übernimmt der Anbieter|Server, Speicher und Netzwerk-Hardware", "Bei IaaS stellt der Anbieter Hardware und Virtualisierung."], ["virt", "Was ist ein Beispiel für SaaS?", "Microsoft 365", "Azure Virtual Machines|Google App Engine|Amazon EC2", "SaaS: fertige Anwendung. PaaS: Webserver, Datenbank, Entwicklungsumgebung."], ["virt", "Was verwaltet der Kunde bei PaaS?", "Anwendung und Daten", "Betriebssystem und Anwendung|Nur die Daten|Laufzeit und Middleware", "Bei PaaS übernimmt der Anbieter alles bis einschließlich Laufzeit/Middleware."], ["virt", "Wer ist bei SaaS für den Inhalt der Daten nach DSGVO verantwortlich?", "Immer der Kunde", "Immer der Anbieter|Das Rechenzentrum des Anbieters|Der Datenschutzbeauftragte des Anbieters", "Die Verantwortung für den Dateninhalt bleibt immer beim Kunden."], ["virt", "Was ist eine Hybrid Cloud?", "Private/On-Prem plus Public Cloud, verbunden über VPN oder Standleitung", "Mehrere Public-Cloud-Anbieter parallel, verwaltet über ein Portal|Eine Private Cloud, die ein Dienstleister exklusiv für eine Firma betreibt|Eine Community Cloud, die sich mehrere Behörden gemeinsam teilen", "Mehrere Public-Anbieter = Multi Cloud."], ["virt", "Was bedeutet Pay per Use?", "Nur zahlen, was gerade genutzt wird", "Fester Monatspreis, egal wie viel genutzt wird|Einmalkauf mit dauerhafter Lizenz|Zahlen pro Mitarbeiter, nicht pro Nutzung", "Pay as you Grow = Leistung wächst geplant mit."], ["virt", "Wofür steht DRaaS?", "Disaster Recovery as a Service", "Database Replication as a Service|Desktop Remote as a Service|Data Routing as a Service", "DaaS = virtuelle Desktops, DBaaS = Datenbank."], ["virt", "Was unterscheidet eine VM von einem Container?", "Die VM hat ein eigenes Betriebssystem und ist stärker isoliert", "Container haben ein eigenes Betriebssystem und sind stärker isoliert|VMs starten schneller, weil sie keinen eigenen Kernel laden|Container brauchen mehr RAM, weil sie das ganze OS kopieren", "Container: leichter und schneller, aber weniger isoliert."], ["virt", "Was ist ein Nachteil der Private Cloud gegenüber der Public Cloud?", "Kapazität für Lastspitzen muss dauerhaft gekauft werden", "Man hat weniger Kontrolle über Daten und Hardware|Sie bringt grundsätzlich DSGVO-Probleme mit sich|Man ist stärker vom Cloud-Anbieter abhängig", "Public: bei Bedarf zuschalten und wieder abbauen."], ["sec", "Welches Schutzziel bedroht Ransomware vor allem?", "Verfügbarkeit", "Vertraulichkeit|Integrität|Authentizität", "Daten sind verschlüsselt und nicht mehr nutzbar. Schutz: Offline-Backups."], ["sec", "Welches Schutzziel bedroht Sniffing?", "Vertraulichkeit", "Verfügbarkeit|Integrität|Authentizität", "Mitlesen = Einsicht. Schutz: Verschlüsselung (HTTPS, VPN)."], ["sec", "Welches Schutzziel sichern Hashwerte?", "Integrität", "Verfügbarkeit|Vertraulichkeit|Authentizität", "Kleinste Änderung = ganz anderer Hash → Veränderung erkennbar."], ["sec", "Welche Schadsoftware verbreitet sich eigenständig über das Netzwerk?", "Wurm", "Virus|Trojaner|Scareware", "Ein Virus wird erst beim Öffnen aktiv, ein Wurm verbreitet sich ohne Zutun."], ["sec", "Was gilt als eine der häufigsten Ursachen für Sicherheitsvorfälle?", "Insider (böswillig oder unachtsam)", "Zero-Day-Exploits (unbekannte Lücken)|DDoS-Angriffe auf Webserver|Honeypots im Firmennetz", "Schutz: Rechte nach Need-to-know, Protokollierung, Schulung."], ["sec", "Welches Verfahren ist symmetrisch?", "AES", "RSA|ECC|SHA-256", "RSA und ECC sind asymmetrisch, SHA-256 ist ein Hash."], ["sec", "Mit welchem Schlüssel verschlüsselt man eine Nachricht an Bob?", "Mit Bobs Public Key", "Mit Bobs Private Key|Mit dem eigenen Private Key|Mit dem eigenen Public Key", "Nur Bob kann dann mit seinem Private Key entschlüsseln."], ["sec", "Wie entsteht eine digitale Signatur?", "Hash bilden und mit dem eigenen Private Key verschlüsseln", "Hash mit dem Public Key des Empfängers verschlüsseln|Nachricht mit dem eigenen Public Key verschlüsseln|Hash bilden und mit dem Sitzungsschlüssel (AES) verschlüsseln", "Geprüft wird mit dem Public Key des Absenders → Integrität + Authentizität."], ["sec", "Wie viele Schlüssel braucht man symmetrisch bei 10 Personen?", "45", "10|20|90", "n·(n−1)/2 = 10·9/2 = 45."], ["sec", "Was ist ein Beispiel für hybride Verschlüsselung?", "TLS / HTTPS", "AES alleine|RSA alleine|Diffie-Hellman alleine", "Asymmetrisch einen Sitzungsschlüssel austauschen, dann symmetrisch weiter."], ["sec", "Was besagt das Maximumprinzip (BSI)?", "Ein Server erbt den höchsten Schutzbedarf seiner Anwendungen", "Man wählt bei mehreren Möglichkeiten immer die teuerste Maßnahme|Es gilt der Durchschnitt des Schutzbedarfs aller Anwendungen|Redundanz senkt den Schutzbedarf automatisch eine Stufe", "Redundanz senkt = Verteilungseffekt. Viele kleine Schäden = Kumulationseffekt."], ["sec", "Welcher Hash gilt als unsicher?", "MD5", "SHA-256|SHA-384|SHA-512", "MD5 und SHA-1 gelten als unsicher."], ["sec", "Was ist ein Honeypot?", "Ein Köder-System, das Angreifer anlockt", "Ein Passwort-Tresor für Administratoren|Ein Virenscanner für E-Mail-Anhänge|Eine Backup-Methode mit Köderdateien", "Damit beobachtet man Angriffsmethoden."], ["sec", "Wer stellt ein X.509-Zertifikat aus?", "Eine Zertifizierungsstelle (CA)", "Die Registrierungsstelle (RA)|Der Domain-Registrar (DENIC)|Der Browserhersteller (Root Store)", "Das Gesamtsystem heißt PKI."], ["sec", "Was ist ein Zero-Day-Exploit?", "Ausnutzung einer Lücke, für die es noch keinen Patch gibt", "Ein Angriff, der am selben Tag erkannt und sofort gepatcht wird|Eine Lücke, die seit Jahren bekannt ist und längst gepatcht wurde|Ein Exploit, der nur am Tag der Veröffentlichung eines Patches wirkt", "Schutz: Verhaltenserkennung, Segmentierung, schnell patchen."], ["sec", "Was ist der Unterschied zwischen IDS und Honeypot?", "IDS erkennt verdächtigen Verkehr und alarmiert, Honeypot lockt Angreifer an", "IDS blockiert Angriffe aktiv, Honeypot meldet sie nur an die Firewall|IDS lockt Angreifer an, Honeypot überwacht den gesamten Netzverkehr|IDS prüft nur Mails auf Malware, Honeypot nur den Webverkehr", "NIDS überwacht das Netz, HIDS einen einzelnen Host."], ["dsgvo", "Seit wann gilt die DSGVO?", "25. Mai 2018", "1. Januar 2016|25. Mai 2020|1. Januar 2018", "EU-weit; das BDSG ergänzt sie in Deutschland."], ["dsgvo", "Binnen welcher Frist muss eine Datenpanne der Behörde gemeldet werden?", "72 Stunden", "24 Stunden|7 Tagen|30 Tagen", "Und ggf. die Betroffenen informieren."], ["dsgvo", "Wie hoch kann das Bußgeld bei schweren Verstößen sein?", "Bis 20 Mio. € oder 4 % des weltweiten Jahresumsatzes", "Bis 300.000 € unabhängig vom Umsatz|Bis 10 Mio. € oder 2 % des Jahresumsatzes|Bis 1 Mio. € oder 1 % des Jahresumsatzes", "10 Mio./2 % z. B. bei TOM und Dokumentation. (300.000 € war das alte BDSG.)"], ["dsgvo", "Ist eine IP-Adresse ein personenbezogenes Datum?", "Ja", "Nein|Nur bei IPv6|Nur wenn statisch", "Auch E-Mail, Standort, Cookie-ID gehören dazu."], ["dsgvo", "Abgeschlossener Serverraum und Pförtner sind Beispiele für …", "Zutrittskontrolle", "Zugangskontrolle|Zugriffskontrolle|Weitergabekontrolle", "Zutritt → Zugang → Zugriff: erst in den Raum, dann an den Rechner, dann an die Daten."], ["dsgvo", "Login mit MFA und Passwortrichtlinie sind …", "Zugangskontrolle", "Zutrittskontrolle|Zugriffskontrolle|Eingabekontrolle", "Zugang = wer kann sich am System anmelden."], ["dsgvo", "NTFS-Rechte und Rollen in Anwendungen sind …", "Zugriffskontrolle", "Zugangskontrolle|Zutrittskontrolle|Trennungsgebot", "Zugriff = wer darf welche Daten lesen/ändern."], ["d amm", "Raute|Kreis|Rechteck", "PAP nach DIN 66001."], ["prog", "Was ist im Struktogramm (Nassi-Shneiderman) nicht möglich?", "Sprünge", "Schleifen|Verzweigungen|Sequenzen", "Blöcke werden nur geschachtelt."], ["prog", "Welcher Datentyp speichert wahr/falsch?", "Boolean", "Integer|String|Float", "Integer = Ganzzahl, Float = Kommazahl, String = Text."], ["prog", "Was filtert HAVING?", "Gruppen nach dem GROUP BY", "Zeilen vor dem Gruppieren|Spalten nach dem SELECT|Sortierte Zeilen nach ORDER BY", "WHERE filtert Zeilen vorher, HAVING Gruppen danach."], ["prog", "Was passiert bei DELETE FROM kunde; ohne WHERE?", "Alle Zeilen werden gelöscht", "Fehlermeldung, WHERE ist Pflicht|Nur die erste Zeile wird gelöscht|Die Tabelle samt Struktur wird entfernt", "Beliebte Prüfungsfalle – auch bei UPDATE."], ["prog", "Worauf verweist ein Fremdschlüssel?", "Auf den Primärschlüssel einer anderen Tabelle", "Auf eine andere Datenbank auf demselben Server|Auf eine andere Spalte in derselben Zeile|Auf einen Index derselben Tabelle", "Primärschlüssel identifiziert eine Zeile eindeutig."], ["prog", "Welche SQL-Funktion zählt Zeilen?", "COUNT", "SUM|MAX|AVG", "Aggregatfunktionen: COUNT, SUM, AVG, MIN, MAX."], ["prog", "Mit welchem Befehl fügt man einen Datensatz ein?", "INSERT INTO", "UPDATE SET|ALTER TABLE|ADD ROW INTO", "INSERT INTO kunde (name, ort) VALUES ('Müller', 'Bremen');"], ["prog", "Welche drei Grundstrukturen gibt es?", "Sequenz, Verzweigung, Schleife", "Variable, Funktion, Klasse|Eingabe, Verarbeitung, Ausgabe|Anweisung, Sprung, Unterprogramm", "Alles baut darauf auf."], ["prog", "Wie oft läuft eine kopfgesteuerte Schleife mindestens?", "Eventuell 0-mal", "Mindestens 1-mal|Genau 1-mal|Mindestens 2-mal", "Sie prüft vor dem Durchlauf."], ["pm", "Wer schreibt das Lastenheft?", "Der Auftraggeber (Was und wofür)", "Der Auftragnehmer (Wie und womit)|Der Projektleiter des Lieferanten|Der Lenkungsausschuss", "Pflichtenheft = Auftragnehmer: Wie und womit."], ["pm", "Was steht im Pflichten derbolt 3", "FireWire|PCIe 4.0|HDMI 2.1", "USB4 nutzt die Baumstruktur von USB 3.2 und die Tunnelstruktur von Thunderbolt."], ["hw", "Wie viele Geräte lassen sich über Hubs an einem USB-Port betreiben?", "127", "16|64|255", "Mit jedem weiteren Gerät teilt sich aber die Übertragungsgeschwindigkeit."], ["hw", "Wie lang darf ein USB-2.0-Kabel ohne Verstärker sein?", "5 m", "1 m|15 m|30 m", "Mit aktiven Verstärkern alle 5 m sind bis 30 m möglich."], ["hw", "Was bedeutet USB OTG (On-The-Go)?", "Peripheriegeräte verbinden sich direkt miteinander, z. B. Handy mit Drucker", "USB-Daten werden über WLAN übertragen, ganz ohne Kabel zum Gerät|USB-Netzteile liefern damit bis zu 240 W an angeschlossene Geräte|Ein einziger Port überträgt gleichzeitig Monitor- und Netzwerksignal", "Früher ging USB nur Host ↔ Peripherie (PC zu Drucker)."], ["hw", "Welcher RAM lief 1993 als erster synchron zum Takt des Prozessors?", "SDRAM", "SRAM|DDR-RAM|EDO-RAM", "Synchronous DRAM. DDR ist die Weiterentwicklung mit zwei Übertragungen pro Takt."], ["osi", "Welche Übertragungsrate beschreibt 10BaseT und mit welchem Kabel wurde es hauptsächlich genutzt?", "10 Mbit/s mit Cat 3", "100 Mbit/s mit Cat 5|10 Gbit/s mit Cat 6A|1 Gbit/s mit Cat 5e", "100BaseT = 100 Mbit/s (Cat 5/5e), 1000BaseT = 1 Gbit/s (Cat 5e/6)."], ["osi", "Wie heißt ein Twisted-Pair-Kabel ganz ohne Schirmung?", "UTP (Unshielded Twisted Pair)", "STP (Shielded Twisted Pair)|S/FTP (Screened/Foiled Twisted Pair)|F/UTP (Foiled/Unshielded Twisted Pair)", "Je mehr Schirmung (Folie, Geflecht), desto besser der Schutz gegen elektromagnetische Störungen."], ["osi", "Was gibt die Fenstergröße im TCP-Header an?", "Wie viele Bytes der Sender ohne Bestätigung schicken darf (freier Empfangspuffer)", "Die maximale Segmentgröße (MSS), die der Sender verwenden darf|Die Anzahl der Router, die das Segment noch passieren darf|Die Zeit, nach der ein unbestätigtes Segment erneut gesendet wird", "Damit steuert TCP den Datenfluss."], ["osi", "Wozu dient das Feld „Fragment Offset“ im IP-Header?", "Es gibt die Position eines Fragments im ursprünglichen Paket an", "Es zählt die verbleibenden Router-Hops bis zum Verwerfen herunter|Es gibt die Priorität (Dienstgüte) des Pakets für Router an|Es enthält die Prüfsumme des Headers zur Fehlererkennung", "Mit Identifikation, Flags und Fragment Offset werden zerlegte Pakete wieder zusammengesetzt. Priorität = Type of Service (ToS)."], ["osi", "Was steht am Ende eines Ethernet-Frames?", "Die FCS (Frame Check Sequence) zur Fehlererkennung", "Die TTL, damit das Paket nicht endlos kreist|Der Zielport des Dienstes beim Empfänger|Die IP-Adresse des Standardgateways", "Ethernet-Header: Ziel-/Quell-MAC, Typ (EtherType), Nutzdaten, FCS."], ["osi", "Wie funktioniert Token Passing?", "Nur das Gerät, das das Token besitzt, darf senden – so gibt es keine Kollisionen", "Alle Geräte hören das Medium ab und senden; bei Kollision wird wiederholt|Der Switch teilt jedem Gerät feste Zeitfenster zu, in denen es senden darf|Ein zentraler Master fragt die Geräte nacheinander ab, ob sie senden wollen", "Beispiele: Token Ring und FDDI (Glasfaser-Ring)."], ["osi", "Welcher DSL-Standard hat gleich schnellen Up- und Download?", "SDSL", "ADSL|VDSL|VDSL2", "SDSL = symmetrisch. ADSL, VDSL und VDSL2 sind asymmetrisch."], ["osi", "Wovon hängt die erreichbare DSL-Bandbreite vor allem ab?", "Von der Länge der Kupferleitung bis zum DSLAM", "Von der Anzahl der Telefone im Haushalt|Vom WLAN-Standard des Routers beim Kunden|Von der Uhrzeit und der Auslastung am Abend", "Je weiter entfernt, desto geringer die Bandbreite."], ["osi", "Was zeichnet eine Mesh-Topologie aus?", "Jeder Knoten ist mit mehreren anderen verbunden und leitet Daten weiter – sehr ausfallsicher", "Alle Geräte hängen an einem zentralen Switch – fällt er aus, ist das ganze Netz gestört|Alle Geräte hängen an einem gemeinsamen Kabel, das an beiden Enden terminiert ist|Die Daten laufen in eine Richtung im Kreis, jedes Gerät gibt sie an das nächste weiter", "Einsatz: WLAN-Mesh, Cluster, industrielles IoT."], ["osi", "Welche der folgenden ist KEINE typische WAN-Anbindung?", "Bluetooth", "Standleitung (T1/E1)|Satellitenverbindung|VPN über das Internet", "Bluetooth ist eine Nahbereichsfunktechnik (PAN)."], ["dienste", "Welches Protokoll war der Vorgänger von DHCP?", "BOOTP", "ARP|RIP|WINS", "BOOTP stammt aus den 80er-/90er-Jahren."], ["dienste", "Wie lang ist die Standard-Lease-Dauer eines Windows-DHCP-Servers?", "8 Tage", "1 Stunde|24 Stunden|30 Tage", "Im Gäste-WLAN wählt man eine kürzere Lease."], ["dienste", "Wofür steht DHCP-Option 66?", "TFTP-Server für den PXE-Boot", "Standardgateway (Router)|DNS-Server für die Namensauflösung|Domänenname des Netzes", "Option 67 ist der Name der Bootdatei."], ["dienste", "Wofür war WINS zuständig?", "NetBIOS-Namen in IP-Adressen auflösen (veraltet)", "Die Uhrzeit aller Rechner im Netz synchronisieren|IP-Adressen automatisch an die Clients vergeben|IP-Adressen in MAC-Adressen auflösen (veraltet)", "Heute übernimmt DNS diese Aufgabe."], ["dienste", "DHCP, DNS, NTP, Active Directory und PKI gehören zu den …", "Infrastrukturdiensten", "Managementdiensten|Kommunikationsdiensten|Business-Anwendungen", "Infrastrukturdienste machen das Netz funktionsfähig, Managementdienste beherrschbar, Kommunikationsdienste bringen den Nutzen."], ["dienste", "Monitoring, Logging und Inventar-/Softwareverteilung gehören zu den …", "Managementdiensten", "Infrastrukturdiensten|Kommunikationsdiensten|Business-Anwendungen", "Sie halten das Netz betreibbar und machen Fehler sichtbar."], ["wlan", "Wer legt in Deutschland die nutzbaren Funkfrequenzen fest?", "Die Bundesnetzagentur", "Das BSI|Die ITU|Die Wi-Fi Alliance", "International koordiniert die ITU."], ["wlan", "Wie viele Kanäle hat das 2,4-GHz-Band in den USA?", "11", "13|14|12", "In Europa sind es 13. Überlappungsfrei sind nur 1, 6 und 11."], ["wlan", "Arbeitet WLAN im Voll- oder Halbduplex?", "Halbduplex – Senden und Empfangen nicht gleichzeitig", "Vollduplex wie ein Switch – beides gleichzeitig|Je nach Kanal mal Voll-, mal Halbduplex|Nur bei WPA3 Vollduplex, sonst Halbduplex", "Ein Grund, warum die nutzbare Datenrate deutlich unter dem Bruttowert liegt."], ["wlan", "Was ist ein Captive Portal?", "Eine Anmelde- bzw. Zustimmungsseite, bevor man im Gäste-WLAN surfen darf", "Ein gefälschter Access Point, über den ein Angreifer Daten mitliest|Ein zusätzlicher Funkkanal im 6-GHz-Band für Gäste und Besucher|Eine Firewall-Regel, die das Gäste-VLAN vom Firmennetz trennt", "Ergänzbar mit Zeitfenstern oder Bandbreitenbegrenzung."], ["wlan", "Was bedeutet „Lateral Movement“?", "Malware breitet sich von einem infizierten Gerät seitlich im flachen Netz aus", "Ein Client wechselt nahtlos zwischen zwei Access Points, ohne Verbindungsabbruch|Ein Paket springt über mehrere Router seitlich zum Ziel im anderen Netz|Ein Angreifer verschafft sich auf einem Gerät höhere Rechte (Admin statt User)", "Segmentierung mit Firewall stoppt das."], ["wlan", "Was erzeugt der 4-Way-Handshake bei WPA2/WPA3?", "Sitzungsindividuelle Verschlüsselungsschlüssel", "Die IP-Adresse des Clients im WLAN|Das Zertifikat des RADIUS-Servers|Die SSID und das Kennwort des WLANs", "Bei Enterprise liefert der RADIUS vorher das Schlüsselmaterial."], ["wlan", "Was leistet OWE (Wi-Fi Enhanced Open), das zusammen mit WPA3 eingeführt wurde?", "Verschlüsselung auch in offenen WLANs ohne Passwort", "Schutz gegen Brute-Force-Angriffe auf das Passwort|Anmeldung per Zertifikat statt per Passwort|Verstecken der SSID vor fremden Geräten", "SAE schützt gegen Brute Force, OWE (Opportunistic Wireless Encryption) verschlüsselt offene Netze."], ["wlan", "Wie kommuniziert der Client bei 802.1X mit dem Access Point?", "Per EAPOL (EAP over LAN); der AP leitet die Anmeldung an den RADIUS weiter", "Per RADIUS direkt; der Client schickt seine Daten ohne Umweg an den Server|Per DHCP; die Anmeldung läuft über Option 82 des Relay-Agents|Per HTTPS-Login auf einer Anmeldeseite des Access Points (Captive Portal)", "Bis zur erfolgreichen Anmeldung hat der Client keinen Netzzugriff."], ["sec", "Was war „ILOVEYOU“ (2000)?", "Ein Wurm, der sich per E-Mail weltweit verbreitete", "Ein Banking-Trojaner, der Zugangsdaten stahl|Eine Ransomware, die Festplatten verschlüsselte|Ein DDoS-Botnetz aus gekaperten Kameras", "Code Red (2001) infizierte Server, Zeus (ab 2007) stahl Bankdaten, WannaCry (2017) war Ransomware."], ["sec", "Womit wurde 2016 der DDoS-Angriff auf die DNS-Server von Dyn durchgeführt?", "Mit einem Botnetz aus infizierten IoT-Geräten", "Mit einem einzelnen Hochleistungsserver|Mit gekaperten Cloud-Servern bei Amazon|Mit einem Wurm auf Windows-Desktop-PCs", "Kameras, Router und andere IoT-Geräte mit Standardpasswörtern wurden gekapert."], ["sec", "Was passiert mit einer Datei in der Quarantäne des Virenscanners?", "Sie wird isoliert, damit sie keinen Schaden anrichten kann", "Sie wird sofort und endgültig gelöscht|Sie wird automatisch desinfiziert und freigegeben|Sie wird umbenannt und bleibt am Ursprungsort", "Nach Prüfung kann sie gelöscht oder wieder freigegeben werden."], ["sec", "Was erkennt die heuristische Analyse eines Virenscanners?", "Verdächtiges Verhalten – auch bei noch unbekannter Malware", "Nur Malware, deren Signatur bereits bekannt ist|Nur Dateien, die verschlüsselt gespeichert sind|Nur Makros in Office-Dokumenten", "Signaturen erkennen nur Bekanntes, deshalb kombinieren moderne Scanner beides."], ["sec", "Was ist ein typischer Nachteil eines IDS?", "Es meldet harmlosen Verkehr (falsch-positiv) und kann Angriffe übersehen (falsch-negativ)", "Es verschlüsselt den gesamten Datenverkehr und bremst so das Netz|Es blockiert Angriffe selbst und ersetzt dadurch die Firewall|Es funktioniert nur mit IPv4 und erkennt keinen IPv6-Verkehr", "Deshalb immer in Kombination mit Firewall, Virenschutz usw."], ["sec", "Wodurch wird ein Man-in-the-Middle-Angriff häufig eingeleitet?", "Durch DNS-Spoofing, RIP-Poisoning oder Phishing", "Durch einen Stromausfall im Rechenzentrum|Durch den Ausfall einer Platte im RAID 5|Durch einen Akkuwechsel an der USV", "Schutz: VPN/Verschlüsselung, Härten von DNS, Routern und Switches."], ["sec", "Welchen Zusatznutzen kann ein Honeypot neben dem Beobachten haben?", "Er lenkt Angreifer von den echten Systemen ab", "Er beschleunigt das Netzwerk durch Caching|Er ersetzt das Backup der echten Server|Er vergibt den Angreifern IP-Adressen", "Ein High-Interaction-Honeypot ist realistischer, aber riskanter."], ["dsgvo", "Was ist eine Datenschutz-Folgenabschätzung?", "Eine Risikoprüfung vor besonders riskanten Datenverarbeitungen", "Eine Strafe der Aufsichtsbehörde nach einem Verstoß|Ein Backup-Konzept für personenbezogene Daten|Ein Vertrag mit einem externen Dienstleister", "Sie und die Dokumentation der Maßnahmen sind bei Prüfungen besonders wichtig."], ["dsgvo", "Braucht ein Datenschutzbeauftragter ein offizielles Zertifikat?", "Nein, er muss fachkundig sein, ein Nachweis wird nicht verlangt", "Ja, er braucht ein Zertifikat der IHK als Datenschutzbeauftragter|Ja, er braucht eine Zertifizierung durch das BSI nach ISO 27001|Nur, wenn das Unternehmen mehr als 10 Mitarbeiter beschäftigt", "Er kann intern (Problem: Befangenheit) oder extern (z. B. Anwalt) sein."], ["dsgvo", "Zu welcher Art personenbezogener Daten gehören Schul- und Arbeitszeugnisse?", "Werturteile", "Besitzermerkmale|Onlinedaten|Physische Merkmale", "Besitzermerkmale = Fahrzeug, Immobilie; Onlinedaten = IP, E-Mail, Cookie-ID."], ["dsgvo", "Welche konkreten technischen Maßnahmen schreibt die DSGVO vor?", "Keine konkreten – gefordert sind angemessene TOM nach dem Stand der Technik", "Genau 8 Kontrollmaßnahmen, die alle vollständig umgesetzt werden müssen|BitLocker bzw. Festplattenverschlüsselung auf allen Geräten ist Pflicht|Passwörter mit mindestens 12 Zeichen und Wechsel alle 90 Tage", "Gängig sind z. B. Passwörter, NTFS-Rechte, Verschlüsselung, automatische Bildschirmsperre."], ["dsgvo", "Was muss ein Unternehmen bei einer Datenpanne mit Risiko für die Betroffenen tun?", "Sich selbst bei der zuständigen Datenschutz-Aufsichtsbehörde melden", "Abwarten, bis sich ein Betroffener beschwert|Nur die zuständige IHK informieren|Nur den internen Datenschutzbeauftragten informieren", "Bei Datenpannen gilt die Meldefrist von 72 Stunden."], ["virt", "Wofür eignet sich Container-Virtualisierung besonders?", "Microservices und Cloud-native Anwendungen", "Legacy-Systeme mit eigenem Kernel|Windows und Linux gleichzeitig auf einem Kernel|Hardware-Emulation alter Rechner", "Viele kleine, skalierbare Dienste auf einer Plattform."], ["virt", "Was ist ein Vorteil der Vollvirtualisierung?", "Das Gast-OS muss nicht angepasst werden – gut für Legacy-Systeme", "Sie hat von allen Virtualisierungsarten den geringsten Overhead|Alle VMs teilen sich einen gemeinsamen Kernel und starten schnell|Das Gast-OS spricht über Hypercalls direkt mit dem Hypervisor", "Nachteil: relativ hoher Overhead durch Hardware-Emulation."], ["virt", "Welche Sorge besteht bei Containern in Multi-Tenant-Umgebungen?", "Die Sicherheit, weil alle Container denselben Kernel teilen", "Sie starten zu langsam für wechselnde Lasten|Sie brauchen zu viel RAM, weil jeder ein ganzes OS hat|Sie unterstützen keine Netzwerkverbindungen", "Geringere Isolation als bei VMs."], ["virt", "Wie lässt sich die DSGVO-Sorge bei der Public Cloud verringern?", "Einen Anbieter mit Rechenzentren im europäischen Raum wählen", "Im Netz nur noch private IP-Adressen verwenden|Die Cloud nur nachts außerhalb der Arbeitszeit nutzen|Auf Backups in der Cloud ganz verzichten", "Große Anbieter haben zudem oft bessere Sicherheitsmechanismen als kleine Firmen."], ["hk", "Was ist der Handlungskostenzuschlag?", "Ein Prozentsatz, mit dem die betrieblichen Kosten auf die einzelnen Waren verteilt werden", "Der Rabatt in Prozent, den der Lieferant beim Einkauf der Waren gewährt|Der Prozentsatz der Umsatzsteuer, der auf den Nettoverkaufspreis kommt|Ein Prozentsatz, mit dem der Händler seinen Gewinn auf die Selbstkosten aufschlägt", "Er sollte aus der betrieblichen Kostenrechnung stammen und nicht geschätzt werden."], ["ip", "Welche Schreibweise von 2001:0db8:0000:0000:0001:0000:0000:0001 entspricht RFC 5952?", "2001:db8::1:0:0:1", "2001:db8:0:0:1::1|2001:DB8::1:0:0:1|2001:db8::1::1", "Bei gleich langen Null-Folgen wird die linke durch :: ersetzt, Hex-Buchstaben klein. Zweimal :: ist ungültig."], ["ip", "Wie schreibt man eine IPv6-Adresse mit Port in einer URL?", "http://[2001:db8::1]:8080/", "http://2001:db8::1:8080/|http://(2001:db8::1):8080/|http://2001:db8::1/8080", "Die Adresse steht in eckigen Klammern, sonst wäre der Doppelpunkt vor dem Port nicht vom Adressteil zu unterscheiden."], ["ip", "Welches Protokoll ersetzt bei IPv6 das ARP?", "NDP (Neighbor Discovery, Teil von ICMPv6)", "DHCPv6 (Dynamic Host Configuration)|RARP (Reverse Address Resolution)|IGMP (Internet Group Management)", "NDP nutzt Neighbor Solicitation und Neighbor Advertisement, um zur IPv6-Adresse die MAC zu finden."], ["ip", "Womit erfährt ein Host bei SLAAC sein Präfix?", "Router Advertisement vom Router", "DHCPv6-Offer vom DHCP-Server|ARP-Reply vom Standardgateway|DNS-Antwort mit AAAA-Record", "Der Router schickt RAs mit dem Präfix; die Interface-ID bildet der Host selbst (EUI-64 oder zufällig)."], ["ip", "Was ersetzt bei IPv6 den Broadcast?", "Multicast, z. B. ff02::1 für alle Knoten", "Anycast an die nächstgelegene Adresse|Unicast an die Link-Local-Adresse fe80::1|Der Broadcast bleibt wie bei IPv4 erhalten", "IPv6 kennt keinen Broadcast mehr. ff02::1 erreicht alle Knoten im Segment, ff02::2 alle Router."], ["ip", "Wie groß ist der IPv6-Basis-Header?", "Fest 40 Byte", "Variabel 20 bis 60 Byte|Fest 20 Byte|Fest 64 Byte", "IPv4 hat 20–60 Byte variabel. IPv6 hat einen festen 40-Byte-Header; Zusätze stehen in Extension Headern."], ["ip", "Welches IPv6-Feld ersetzt die TTL von IPv4?", "Hop Limit", "Flow Label|Traffic Class|Next Header", "Das Hop Limit wird an jedem Router um 1 verringert – bei 0 wird das Paket verworfen, wie bei der TTL."], ["ip", "Ein Router bekommt vom Provider ein /56. Wie viele /64-Netze kann er im LAN bilden?", "256", "64|128|65.536", "64 − 56 = 8 Bit für Subnetze → 2⁸ = 256 Netze mit je /64."], ["ip", "Was bewirken die IPv6 Privacy Extensions?", "Zufällige, wechselnde Interface-ID statt aus der MAC", "Verschlüsselung aller IPv6-Pakete mit IPsec|Verstecken der IPv6-Adresse hinter einem NAT|Sperren von Zugriffen aus dem Internet auf den Host", "Ohne sie ließe sich ein Gerät über die aus der MAC gebildete Interface-ID wiedererkennen."], ["ip", "Was ist bei DS-Lite typisch?", "Keine eigene öffentliche IPv4 – Portfreigaben von außen gehen nicht", "Keine IPv6-Adresse – der Anschluss läuft nur über IPv4 mit Provider-NAT|Doppelte Geschwindigkeit, weil IPv4 und IPv6 parallel gebündelt werden|Eine eigene öffentliche IPv4 und IPv6, beide voll von außen erreichbar", "Bei DS-Lite läuft IPv4 getunnelt über ein Carrier-NAT beim Provider. Von außen ist der Anschluss per IPv4 nicht erreichbar."], ["ip", "Welche Route nimmt ein Router, wenn mehrere passen?", "Die mit dem längsten passenden Präfix", "Die zuerst eingetragene Route|Die mit dem kürzesten Präfix|Immer die Default-Route 0.0.0.0/0", "Longest Prefix Match: /24 ist genauer als /16 und gewinnt. Die Default-Route greift nur, wenn nichts anderes passt."], ["ip", "Welche Einordnung von OSPF stimmt?", "Link-State-Protokoll, Interior (IGP)", "Distanzvektor-Protokoll, Interior (IGP)|Link-State-Protokoll, Exterior (EGP)|Pfadvektor-Protokoll, Exterior (EGP)", "OSPF kennt die ganze Topologie (Link-State) und arbeitet innerhalb eines autonomen Systems (IGP)."], ["ip", "Welches Routingprotokoll verbindet die autonomen Systeme im Internet?", "BGP", "OSPF|RIP|EIGRP", "BGP ist das einzige EGP im Einsatz; es ist ein Pfadvektor-Protokoll und nutzt TCP Port 179."], ["ip", "Was ist die Metrik von RIP?", "Hop-Anzahl, maximal 15", "Bandbreite der Leitung|Verzögerung in Millisekunden|Kosten aus Bandbreite und Last", "RIP zählt Router auf dem Weg; 16 Hops gilt als unerreichbar. Deshalb taugt RIP nur für kleine Netze."], ["ip", "Wofür steht die Route 0.0.0.0/0?", "Default-Route: alles, wofür es keine genauere Route gibt", "Loopback-Route: Verkehr an den eigenen Rechner zurück|Broadcast-Route: Pakete an alle Netze gleichzeitig senden|Blackhole-Route: Verkehr an ungültige Adressen verwerfen", "Die Default-Route zeigt meist zum Internet-Router."], ["ip", "Was ist ein Nachteil von statischem Routing?", "Kein automatisches Ausweichen bei einem Leitungsausfall", "Hohe Protokolllast durch regelmäßige Updates|Router tauschen Routen ungefragt mit Nachbarn aus|Höherer CPU- und RAM-Bedarf auf den Routern", "Statische Routen trägt der Admin von Hand ein. Fällt eine Leitung aus, muss er selbst umstellen."], ["dienste", "Wie wird ein ARP-Request verschickt?", "Als Broadcast an ff:ff:ff:ff:ff:ff", "Als Unicast an das Standardgateway|Als Multicast an ff02::1|Als Unicast an den DNS-Server", "Der Fragende kennt die Ziel-MAC ja noch nicht. Die Antwort kommt dann per Unicast."], ["dienste", "Was ist ein Gratuitous ARP?", "Ein Gerät verkündet ungefragt die eigene IP und MAC", "Ein Router antwortet stellvertretend für ein anderes Netz|Eine ARP-Anfrage, die keine Antwort bekommt|Ein ARP-Eintrag, der nie aus dem Cache verfällt", "Wird nach dem Start, einem IP-Wechsel oder Failover gesendet – erkennt Adresskonflikte und aktualisiert Caches."], ["dienste", "Nach welcher MAC fragt ein PC per ARP, wenn das Ziel in einem anderen Netz liegt?", "Nach der MAC des Standardgateways", "Nach der MAC des Zielrechners|Nach der MAC des DNS-Servers|Nach gar keiner – dann wird kein ARP benutzt", "Pakete in fremde Netze gehen an den Router. Auf Schicht 2 braucht es also dessen MAC."], ["dienste", "Warum ist der DHCP-Request ein Broadcast?", "Damit andere DHCP-Server ihr Angebot zurückziehen", "Weil der Client die Server-IP nicht kennt|Weil Unicast in UDP nicht möglich ist|Damit der Router die Anfrage ins Internet leitet", "Der Client kennt die Server-IP aus dem Offer. Per Broadcast erfahren aber alle Server, welches Angebot er nimmt."], ["dienste", "Welche DHCP-Zuordnung passt für einen Netzwerkdrucker?", "Statisch per Reservierung (MAC → feste IP)", "Dynamisch mit kurzer Lease-Dauer|Automatisch über APIPA (169.254.x.x)|Dynamisch aus dem Pool mit langer Lease", "So bleibt die IP immer gleich, die Verwaltung aber zentral im DHCP-Server."], ["dienste", "Welche Ports nutzt DHCP (IPv4)?", "UDP 67 (Server) und 68 (Client)", "TCP 67 (Server) und 68 (Client)|UDP 53 (Server) und 54 (Client)|UDP 546 (Server) und 547 (Client)", "DHCP läuft über UDP 67/68. 546/547 sind die Ports von DHCPv6."], ["dienste", "Was macht ein Secondary-DNS-Server?", "Er hält eine Kopie der Zone per Zonentransfer", "Er leitet alle Anfragen an den Provider weiter|Er löst nur Rückwärtsanfragen (PTR) auf|Er ist nur für die Root-Zone zuständig", "Primary hält die bearbeitbare Zone, Secondary eine Kopie – das bringt Redundanz und verteilt Last."], ["dienste", "Was liefert ein PTR-Record?", "Zu einer IP-Adresse den Namen (Reverse Lookup)", "Zu einem Namen die IPv4-Adresse|Den Mailserver einer Domain|Die zuständigen Nameserver einer Zone", "PTR wird für Rückwärtsauflösung genutzt, z. B. von Mailservern zur Prüfung des Absenders."], ["dienste", "Wann nutzt DNS statt UDP das TCP-Protokoll?", "Bei großen Antworten und bei Zonentransfers", "Bei jeder Anfrage aus dem Internet|Nur bei IPv6-Anfragen (AAAA)|Wenn der Client keinen Cache hat", "Normale Anfragen laufen per UDP 53. Große Antworten und Zonentransfers (AXFR/IXFR) brauchen TCP 53."], ["dienste", "Wie fragt ein Resolver die Root-, TLD- und autoritativen Server ab?", "Iterativ – er bekommt jeweils einen Verweis", "Rekursiv – jeder Server fragt selbst weiter|Per Broadcast an alle Server gleichzeitig|Gar nicht – er nutzt nur die HOSTS-Datei", "Client → Resolver ist rekursiv (fertige Antwort). Resolver → Root/TLD/autoritativ ist iterativ."], ["dienste", "Was steht in einem TXT-Record häufig?", "SPF-, DKIM- oder DMARC-Angaben für E-Mail", "Die IPv6-Adresse des Webservers|Der Alias-Name für eine andere Domain|Die Seriennummer der Zone", "TXT-Records enthalten freien Text, z. B. welche Server Mails für die Domain senden dürfen (SPF)."], ["fw", "Was macht ein Reverse-Proxy?", "Er nimmt Anfragen für Server entgegen und verteilt sie, z. B. auf mehrere Webserver", "Er steht vor den Clients und verbirgt sie beim Surfen vor dem Internet|Er verschlüsselt den gesamten Verkehr zwischen zwei Standorten im Tunnel|Er verteilt den Clients automatisch Proxy-Einstellungen per PAC-Datei", "Reverse-Proxy steht vor den Servern: Lastverteilung, TLS-Terminierung, Caching, Schutz."], ["fw", "Wie kommt ein Client automatisch an die Proxy-Einstellungen?", "Über eine PAC-Datei per WPAD oder Gruppenrichtlinie", "Über den MX-Record der eigenen Domain im DNS|Über ARP-Anfragen an das Standardgateway|Über die HOSTS-Datei auf dem Proxy-Server", "WPAD findet die PAC-Datei per DHCP oder DNS; im Firmennetz geht es auch per GPO."], ["fw", "Was unterscheidet ein Secure Web Gateway von einem einfachen Proxy?", "Es prüft den Verkehr zusätzlich auf Malware, Richtlinien und Datenabfluss", "Es arbeitet nur auf Schicht 2 und filtert dort MAC-Adressen statt URLs|Es verschlüsselt alle Verbindungen der Clients automatisch per VPN-Tunnel|Es ersetzt den DNS-Server und löst alle Namen selbst auf", "SWG = Proxy plus Sicherheitsfunktionen: URL-Filter, Malware-Scan, TLS-Inspektion, DLP."], ["fw", "Was sieht der Zielserver bei einem Elite-Proxy (High Anonymity)?", "Weder die echte IP noch, dass ein Proxy benutzt wird", "Die echte IP des Clients und einen Proxy-Hinweis|Die echte IP des Clients, aber keinen Proxy-Hinweis|Eine verborgene IP, aber erkennbar einen Proxy", "Transparent: IP sichtbar. Anonym: IP verborgen, Proxy erkennbar. Elite: beides verborgen."], ["sec", "Was passiert beim ARP-Spoofing?", "Gefälschte ARP-Antworten leiten Verkehr über den Angreifer", "Der Angr
