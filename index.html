tärer Sektor** abgetrennt."], ["h", "Arbeitsteilung"], ["tab", [["Art", "Erklärung", "Beispiel"], ["Berufsbildung und -spaltung", "Berufe entstehen und spezialisieren sich", "aus dem IT-Beruf werden Systemintegration, Anwendungsentwicklung, Daten- und Prozessanalyse"], ["Betrieblich", "Arbeit im Betrieb aufgeteilt: Abteilungen, Arbeitszerlegung, Fließband", "IT, Einkauf, Vertrieb, Buchhaltung"], ["Überbetrieblich", "Betriebe spezialisieren sich auf Stufen der Wertschöpfung", "Rohstoff → Chiphersteller → PC-Hersteller → Händler"], ["International", "Länder spezialisieren sich (Globalisierung)", "Chips aus Taiwan, Montage in China, Verkauf in Europa"]]], ["li", "**Vorteile:** Spezialisierung, höhere Produktivität, geringere Kosten, Maschineneinsatz. **Nachteile:** Monotonie, Abhängigkeit (Lieferketten), wenig Bezug zum Endprodukt, Arbeitsplatzverlust durch Automatisierung."], ["h", "Markt und Marktformen"], ["p", "Ein **Markt** ist das Zusammentreffen von **Anbietern** (Verkäufern) und **Nachfragern** (Käufern). Dort bildet sich der Preis. Die VWL geht im Modell von rational und berechenbar handelnden Teilnehmern aus."], ["tab", [["Einteilung", "Marktarten"], ["nach Gegenstand", "**Gütermärkte** (Konsum- und Investitionsgüter) und **Faktormärkte** (Arbeitsmarkt, Kapital- bzw. Finanzmarkt, Immobilienmarkt)"], ["nach Ort und Organisation", "Wochenmarkt, Börse, Messe, Online-Marktplatz"], ["nach Zugang", "offene und geschlossene (beschränkte) Märkte"]]], ["p", "**Vollkommener Markt** (Modell, „idealer Markt“): homogene Güter, vollständige Markttransparenz, keine Vorlieben (sachlich, persönlich, räumlich, zeitlich), sofortige Reaktion aller Teilnehmer. Ergebnis: ein einziger Preis, der Gleichgewichtspreis. Reale Märkte sind **unvollkommen** – deshalb kostet dasselbe Produkt an verschiedenen Orten unterschiedlich viel."], ["tab", [["Anbieter \\ Nachfrager", "viele", "wenige", "einer"], ["viele", "Polypol (vollständige Konkurrenz)", "Nachfrageoligopol", "Nachfragemonopol"], ["wenige", "Angebotsoligopol", "zweiseitiges Oligopol", "beschränktes Nachfragemonopol"], ["einer", "Angebotsmonopol", "beschränktes Angebotsmonopol", "zweiseitiges Monopol"]]], ["li", "Beispiele: **Polypol** – Wochenmarkt, Bäckereien; **Angebotsoligopol** – Mineralöl, Mobilfunknetze, Betriebssysteme; **Angebotsmonopol** – Schienennetz, örtliche Wasserversorgung; **Nachfragemonopol** – Staat als Käufer von Militärausrüstung."], ["h", "Preisbildung"], ["grafik", "markt"], ["li", "**Angebotskurve steigt:** Je höher der Preis, desto mehr wollen Anbieter verkaufen. **Nachfragekurve fällt:** Je niedriger der Preis, desto mehr wird gekauft."], ["li", "**Gleichgewichtspreis** im Schnittpunkt: angebotene Menge = nachgefragte Menge, der Markt wird geräumt."], ["li", "Preis **über** dem Gleichgewicht → **Angebotsüberhang** (Käufermarkt) → der Preis sinkt. Preis **darunter** → **Nachfrageüberhang** (Verkäufermarkt) → der Preis steigt."], ["li", "**Konsumentenrente:** Käufer, die mehr gezahlt hätten, sparen die Differenz. **Produzentenrente:** Anbieter, die auch billiger verkauft hätten, bekommen mehr."], ["li", "**Verschiebungen:** Steigt die Nachfrage (Trend, höheres Einkommen), wandert die Nachfragekurve nach rechts → Preis und Menge steigen. Steigen die Kosten der Anbieter, wandert die Angebotskurve nach links → der Preis steigt, die Menge sinkt."], ["h", "Wirtschaftsordnungen"], ["tab", [["Ordnung", "Merkmale"], ["Freie Marktwirtschaft", "Märkte steuern über Preise, Privateigentum, freier Wettbewerb, Staat hält sich heraus"], ["Zentralverwaltungswirtschaft", "der Staat plant Produktion, Mengen und Preise, Kollektiveigentum"], ["Soziale Marktwirtschaft (Deutschland)", "Marktwirtschaft, aber der Staat sichert Wettbewerb (Kartellamt) und sozialen Ausgleich (Sozialversicherung, Kündigungs- und Verbraucherschutz)"]]], ["h", "Zielbereiche und Zielkonflikte"], ["grafik", "ziele"], ["tab", [["Zielbereich", "Beispiele"], ["Ökonomisch", "Gewinn, Umsatz, Marktanteil, Liquidität, Kosten senken"], ["Sozial", "sichere Arbeitsplätze, faire Löhne, Weiterbildung, Arbeitsschutz"], ["Ökologisch", "weniger Energie und CO₂, Recycling, Green IT, ressourcenschonende Produktion"]]], ["li", "**Zielharmonie:** Ein Ziel fördert ein anderes (Energie sparen senkt Kosten und schont die Umwelt). **Zielkonflikt:** Ein Ziel behindert ein anderes (höhere Löhne ↔ Gewinn, teure Filteranlage ↔ Kosten). **Zielneutralität:** keine gegenseitige Wirkung."], ["h", "Übungsaufgaben im IHK-Stil"], ["p", "**Aufgabe 1 (nach WiSo Sommer 2019):** Ordne die Kunden einer IT-Firma jeweils zwei zu den Sektoren: Elektrokaufhaus, Kieswerk, Metallbau, Steuerberatung, Hoch- und Tiefbau, Forstbetrieb."], ["tab", [["Sektor", "Lösung"], ["Primär (Urproduktion)", "Kieswerk, Forstbetrieb"], ["Sekundär (Weiterverarbeitung)", "Metallbau, Hoch- und Tiefbau"], ["Tertiär (Dienstleistung)", "Elektrokaufhaus, Steuerberatung"]]], ["p", "**Aufgabe 2 (nach WiSo Sommer 2020):** Welche Aussage zum Verhalten der Konsumenten trifft zu? (1) Die Bedürfnisse entsprechen immer dem Angebot. (2) Die Nachfrage ist abhängig von der Kaufkraft. (3) In der IT-Branche beeinflusst das Konsumverhalten nie das Angebot. (4) Mehr Nachfrage führt immer zu höheren Preisen. (5) Mehr Angebot führt immer zu niedrigeren Preisen."], ["p", "**Lösung: (2).** Nachfrage = Bedarf mit Kaufkraft. Die anderen Aussagen sind falsch, weil sie „immer“ oder „nie“ behaupten – Preise hängen auch von der jeweils anderen Marktseite ab."]]}}, "erg": {"hw": [["h", "Prozessor im Detail"], ["li", "**Steuerwerk** (Control Unit): holt die Befehle, entschlüsselt sie und steuert die übrigen Einheiten."], ["li", "**Rechenwerk (ALU,** Arithmetic Logic Unit**):** rechnet (Addition, Subtraktion, Multiplikation …) und verknüpft logisch (UND, ODER, NICHT, Vergleiche); setzt dabei Flags (Ergebnis null, Übertrag, negativ)."], ["li", "**Register:** kleinste und schnellste Speicher direkt im Kern – z. B. Befehlszähler (Program Counter), Befehlsregister, Akkumulator, Stack Pointer."], ["li", "**Bussystem:** Datenbus (Daten), Adressbus (wohin), Steuerbus (lesen/schreiben, Takt) verbinden CPU, RAM und Ein-/Ausgabe."], ["p", "**Befehlszyklus:** **Fetch** (Befehl von der Adresse im Befehlszähler holen) → **Decode** (Steuerwerk entschlüsselt) → **Execute** (ALU führt aus) → **Write Back** (Ergebnis in Register oder Speicher); dann zeigt der Befehlszähler auf den nächsten Befehl. Der **Takt** gibt das Tempo vor: 3 GHz = 3 Milliarden Takte pro Sekunde. **Pipelining** bearbeitet mehrere Befehle gleichzeitig in verschiedenen Phasen."], ["li", "**Von-Neumann-Architektur:** Befehle und Daten liegen im selben Speicher und teilen sich einen Bus (Flaschenhals). **Harvard-Architektur:** getrennte Speicher und Busse (Mikrocontroller, getrennter L1-Cache für Befehle und Daten)."], ["li", "**DRAM** speichert in Kondensatoren und muss ständig aufgefrischt werden (Arbeitsspeicher). **SRAM** speichert in Flipflops, ist schneller, aber teurer (Cache)."]], "spe": [["h", "RAID einrichten und im Netz bereitstellen"], ["li", "Festplatten (SATA/SAS) in einen RAID-fähigen Rechner, Server oder ein NAS einbauen.", "1"], ["li", "**Hardware-RAID:** eigener RAID-Controller mit Prozessor und Cache; Array im Controller-BIOS anlegen. **Onboard-/Firmware-RAID:** im BIOS/UEFI (oft Entf, F2 oder F10) den SATA-Modus von AHCI auf **RAID** stellen und im Utility (z. B. Intel RST) das Array anlegen – Treiber nötig, rechnet über die CPU. **Software-RAID:** nach der Installation in der Datenträgerverwaltung bzw. mit Speicherplätzen (Windows) oder mit mdadm (Linux).", "2"], ["li", "Das logische Laufwerk partitionieren und formatieren; passende RAID-Treiber installieren, damit das Betriebssystem es erkennt.", "3"], ["li", "**Bereitstellen:** NAS an den Switch bzw. Router anschließen und im NAS-Menü eine Freigabe (SMB oder NFS) mit Benutzerrechten anlegen – oder am Host-PC eine **statische IP** vergeben und den Ordner freigeben (Windows: Eigenschaften → Freigabe → Erweiterte Freigabe; Linux: Samba).", "4"], ["li", "**Zugreifen:** Netzlaufwerk verbinden mit \\\\Servername\\Freigabe oder \\\\IP-Adresse\\Freigabe.", "5"], ["tipp", "Ein RAID ersetzt kein Backup – es schützt nur vor dem Ausfall einer Platte."], ["p", "Mehr zu Backup-Strategien, RPO/RTO und Verfügbarkeit: Katalog-Thema **Datensicherung und Verfügbarkeit**."], ["h", "USV und Notstromaggregat"], ["tab", [["", "USV", "Notstromaggregat"], ["Energiequelle", "Akkus", "Verbrennungsmotor (meist Diesel)"], ["Umschaltzeit", "keine (Online-USV) bis wenige Millisekunden", "einige Sekunden bis zum Anlaufen"], ["Überbrückungsdauer", "Minuten", "Stunden bis Tage (solange Kraftstoff da ist)"], ["Zusatznutzen", "glättet Spannungsspitzen und -einbrüche", "versorgt ganze Gebäudeteile"]]], ["p", "In Rechenzentren arbeiten beide zusammen: Die USV überbrückt sofort, bis das Aggregat läuft. Regelmäßige Tests (Akkuzustand, Probelauf) gehören dazu."], ["h", "Rechnen im IHK-Stil"], ["p", "Die Musterlösungen der IHK-Aufgaben folgen festen Konventionen. Wer sie kennt, verliert keine Punkte durch Rundung oder Einheiten."], ["tab", [["Regel", "So rechnest du", "Beispiel"], ["Datenmengen", "KiB, MiB, GiB, TiB immer × 1.024", "5 MiB = 5 × 1.024 × 1.024 Byte"], ["Übertragungsraten", "kbit/s, Mbit/s, Gbit/s immer × 1.000", "16 Mbit/s = 16.000.000 bit/s"], ["Engpass", "Die kleinste Rate auf dem Weg zählt (meist der Upload der sendenden Seite)", "Filiale 1 Mbit/s hoch, Zentrale 20 Mbit/s → 1 Mbit/s"], ["Übertragungszeit, Speicher, Akkuanzahl", "aufrunden", "158,4 min → 159 min; 2,1 Akkus → 3"], ["USV-Überbrückungszeit", "abrunden („volle Minuten“)", "37,54 min → 37 min"], ["Sitzungen, Gespräche", "abrunden", "104,2 → 104 Gespräche"], ["Geldbeträge", "kaufmännisch auf 2 Stellen", "119,264 € → 119,26 €"]]], ["li", "**Hot-Spare** nur abziehen, wenn die Aufgabe sie nennt: 6 Arrays à 16 × 3 TiB in RAID 5 = (16 − 1) × 3 × 6 = 270 TiB."], ["li", "**Wiederherstellung:** inkrementell = Vollsicherung + alle Inkremente seit der Vollsicherung; differenziell = Vollsicherung + letzte Differenzielle. Prüfe am Ende, ob eine Zeitvorgabe eingehalten wird – das wird oft gefragt."], ["li", "**Scans:** cm ÷ 2,54 = Zoll, × dpi = Pixel; Pixel × Pixel × Farbtiefe ÷ 8 = Byte je Seite."], ["li", "**USV-Typen:** VFD = Offline/Standby (schaltet erst bei Ausfall um), VI = Line-Interactive (gleicht Unter- und Überspannung mit einem Regler aus), VFI = Online/Doppelwandler (Verbraucher hängen ständig am Wechselrichter, unabhängig von Spannung und Frequenz)."]], "ip": [["h", "CIDR und Routenzusammenfassung"], ["li", "**CIDR** (Classless Inter-Domain Routing, 1993) löst die starren Klassen A/B/C ab: Die Präfixlänge ist frei wählbar und wird als /Zahl angegeben (z. B. 10.0.0.0/22)."], ["li", "**Supernetting / Routenzusammenfassung:** Benachbarte Netze werden zu einer Route zusammengefasst, das spart Einträge in der Routingtabelle: 192.168.0.0/24 + 192.168.1.0/24 → 192.168.0.0/23."], ["li", "Mehr zu IPv6: Katalog-Thema **IPv6 im Detail**. Ablauf von ARP, DHCP und DNS: **ARP, DHCP und DNS im Detail**. Routingprotokolle: **Routing**."], ["h", "RIP im Detail"], ["tab", [["Merkmal", "RIPv1", "RIPv2"], ["Adressierung", "klassenbasiert, keine Masken in Updates", "klassenlos, Masken werden mitgesendet (VLSM)"], ["Versand", "Broadcast", "Multicast 224.0.0.9"], ["Authentifizierung", "nein", "ja"], ["Metrik", "Hops, max. 15 (16 = unerreichbar)", "Hops, max. 15 (16 = unerreichbar)"], ["Update", "alle 30 s, UDP 520", "alle 30 s, UDP 520"]]], ["li", "**Timer:** Nach 180 s ohne Update gilt eine Route als ungültig und wird kurz darauf gelöscht (bei Cisco nach 240 s). **Triggered Updates** melden Änderungen sofort."], ["li", "**Split Horizon:** Eine Route wird nicht über die Schnittstelle zurückgemeldet, über die sie gelernt wurde. Zusammen mit dem Höchstwert 16 bremst das das **Count to Infinity**."], ["li", "Für IPv6 gibt es **RIPng** (UDP 521, Multicast ff02::9)."], ["h", "ICMP-Meldungen und Diagnose"], ["tab", [["Typ", "Name", "Bedeutung"], ["0 / 8", "Echo Reply / Echo Request", "ping"], ["3", "Destination Unreachable", "Netz, Host oder Port nicht erreichbar"], ["5", "Redirect", "„Nimm einen anderen Router im selben Netz“"], ["11", "Time Exceeded", "TTL auf 0 gesunken, Paket verworfen"]]], ["li", "**tracert/traceroute:** schickt Pakete mit TTL 1, 2, 3 … – jeder Router auf dem Weg meldet „Time Exceeded“ und verrät so seine Adresse. Windows nutzt dafür ICMP-Echo, Linux standardmäßig UDP."], ["li", "Bleibt ein Ping unbeantwortet, heißt das nicht zwingend „Host aus“: Firewalls verwerfen ICMP oft absichtlich."], ["li", "Begriffe: Die **Default-Route** 0.0.0.0/0 ist ein Eintrag in der Routingtabelle; das **Default-Gateway** ist die Router-Adresse, die ein Host dafür eingetragen hat."], ["h", "Transfernetze"], ["p", "Ein Transfernetz verbindet nur zwei Router, z. B. Kundenrouter und Provider. Klassisch nimmt man ein **/30** (2 nutzbare Adressen). Nach RFC 3021 geht auf Punkt-zu-Punkt-Strecken auch ein **/31** ohne Netz- und Broadcastadresse; bei IPv6 sind /127 oder /64 üblich."], ["h", "Supernetting – Regeln und Fallen"], ["li", "Die Netze müssen **lückenlos** aufeinanderfolgen, ihre Anzahl muss eine **Zweierpotenz** sein und das erste Netz muss durch die Blockgröße teilbar sein."], ["li", "Die Präfixlänge wird **kürzer** (z. B. vier /24 → ein /22). Ziel sind weniger Routing-Einträge, nicht weniger IP-Adressen."], ["li", "**Falle:** 192.168.1.0/24 und 192.168.2.0/24 ergeben kein /23 – sie liegen in verschiedenen /23-Blöcken. Kleinste gemeinsame Route ist 192.168.0.0/22, die aber auch .0 und .3 einschließt."], ["h", "Kennzahlen der alten Adressklassen"], ["tab", [["Klasse", "Netzbits (fest + frei)", "Netze", "Hosts pro Netz"], ["A", "1 + 7", "126 nutzbar (0 und 127 reserviert)", "2²⁴ − 2 = 16.777.214"], ["B", "2 + 14", "2¹⁴ = 16.384", "2¹⁶ − 2 = 65.534"], ["C", "3 + 21", "2²¹ = 2.097.152", "2⁸ − 2 = 254"]]], ["p", "Die Klassen sind seit CIDR (1993) nur noch Hintergrundwissen – Prüfungsaufgaben nutzen sie aber weiterhin zur Einordnung."], ["h", "IPv6-Multicast genau"], ["p", "Multicast-Adressen beginnen mit **ff**. Danach folgen 4 Bit Flags und 4 Bit **Scope**, der Rest (112 Bit) ist die Gruppen-ID. Einen Broadcast gibt es in IPv6 nicht."], ["tab", [["Scope-Ziffer", "Gültigkeit", "Beispiel"], ["1", "nur die eigene Schnittstelle", "ff01::1"], ["2", "Link (lokales Segment)", "ff02::1 alle Knoten, ff02::2 alle Router"], ["5", "Site", "ff05::2 alle Router der Site"], ["8", "Organisation", "ff08::…"], ["e", "global", "ff0e::…"]]], ["li", "Global Unicast ist korrekt **2000::/3**; für Beispiele und Doku sind **2001:db8::/32** und seit 2024 zusätzlich **3fff::/20** (RFC 9637) reserviert. ULA nutzt man praktisch als **fd00::/8** mit zufälliger 40-Bit-ID."], ["li", "**6to4** und **Teredo** gelten als veraltet. Damit reine IPv6-Netze IPv4-Ziele erreichen, braucht es Übersetzung (**NAT64/DNS64**) – ein Tunnel übersetzt nicht."]], "sec": [["p", "Spoofing-Angriffe im Netz (ARP, IP, DNS, MITM, SYN-Flood) und DNSSEC: Katalog-Thema **Netzwerkangriffe und DNSSEC**."], ["h", "TPM, UEFI und Secure Boot"], ["tab", [["Funktion", "TPM", "UEFI", "Secure Boot"], ["Schlüssel, Passwörter und Zertifikate geschützt speichern", "ja", "–", "–"], ["Virtuelle Smartcard, Zertifikate z. B. für VPN-Anmeldung", "ja", "–", "–"], ["Flexible Bootreihenfolge, Boot-Manager-Einträge", "–", "ja", "–"], ["Warnung bei Temperatur- und Hardwarefehlern", "–", "ja", "–"], ["Nur signierte Bootloader/Systeme starten (gegen Bootkits)", "–", "–", "ja"], ["Nicht signiertes System vom USB-Stick blockieren", "–", "–", "ja"]]], ["p", "Secure Boot ist eine Funktion der UEFI-Firmware. Das TPM misst zusätzlich den Startvorgang und gibt z. B. den BitLocker-Schlüssel nur frei, wenn sich nichts verändert hat."], ["h", "Passwörter und Anmeldung"], ["li", "**Anzahl möglicher Passwörter = Zeichenvorrat ^ Länge.** Fünfstellige PIN: 10⁵ = 100.000. Acht Zeichen aus rund 94 druckbaren Zeichen: etwa 6 × 10¹⁵. Länge wirkt im Exponenten und bringt am meisten."], ["li", "**Prüfung per Hash:** Der Server hasht die Eingabe mit demselben Salt und vergleicht die Hashwerte. Das Klartext-Passwort wird nirgends gespeichert; gestohlene Hashes lassen sich nicht direkt zurückrechnen."], ["li", "**Sperre nach Fehlversuchen:** Eine dauerhafte Sperre stoppt Brute Force, aber Angreifer können damit gezielt Konten lahmlegen, und der Helpdesk muss entsperren. Eine Zeitsperre (z. B. 30 Minuten) bremst Brute Force ebenfalls stark und hebt sich selbst auf."], ["li", "**CAPTCHA:** unterscheidet Menschen von Bots und bremst automatisierte Anmeldeversuche."], ["li", "**Zwei-Faktor:** Faktoren aus verschiedenen Kategorien – Wissen (Passwort), Besitz (Handy, Token, Smartcard), Inhärenz (Fingerabdruck). TOTP-Codes wechseln alle 30 Sekunden und hängen von der Uhrzeit ab."]], "osi": [["p", "Vergleich mit dem TCP/IP- bzw. DoD-Modell und Dateneinheiten je Schicht: Katalog-Themen **TCP/IP- und DoD-Modell** und **Netzwerk-Grundlagen**."], ["h", "Spanning Tree im Detail"], ["p", "Spanning Tree baut aus einem vermaschten Switch-Netz einen schleifenfreien Baum. Die Switches tauschen dazu **BPDUs** aus und entscheiden in vier Schritten:"], ["li", "**Root Bridge:** Der Switch mit der niedrigsten **Bridge-ID** (Priorität, Standard 32768, plus MAC-Adresse). Bei gleicher Priorität gewinnt die kleinere MAC. Man legt die Root Bridge bewusst per Priorität auf einen Core-Switch."], ["li", "**Root Port:** Jeder andere Switch wählt den Port mit den geringsten aufsummierten Pfadkosten zur Root Bridge."], ["li", "**Designated Port:** Pro Netzsegment genau einer – der Port mit den geringsten Kosten zur Root. Bei Gleichstand gewinnt der Switch mit der kleineren Bridge-ID. Alle Ports der Root Bridge sind Designated Ports."], ["li", "**Blockierter Port:** Alle übrigen Ports leiten nicht weiter, empfangen aber weiter BPDUs und springen ein, wenn der aktive Weg ausfällt."], ["tab", [["Linkrate", "Kosten kurz (802.1D)", "Kosten lang (802.1D-2004)"], ["10 Mbit/s", "100", "2.000.000"], ["100 Mbit/s", "19", "200.000"], ["1 Gbit/s", "4", "20.000"], ["10 Gbit/s", "2", "2.000"]]], ["p", "Je schneller der Link, desto **geringer** die Kosten. Die langen Werte ergeben sich aus 20.000.000.000 ÷ Linkrate in kbit/s. Gibt eine Prüfungsaufgabe eine eigene Formel vor, gilt diese."], ["li", "**Portzustände (klassisch):** Blocking → Listening (15 s) → Learning (15 s) → Forwarding. Mit bis zu 20 s Max Age dauert eine Umschaltung 30 bis 50 s. **RSTP** kennt nur Discarding, Learning und Forwarding und schaltet in Sekunden um."], ["li", "**MSTP (802.1s):** mehrere Spanning-Tree-Instanzen für Gruppen von VLANs – so können verschiedene VLANs unterschiedliche Uplinks nutzen."], ["li", "**Ohne Spanning Tree** kreisen Broadcasts endlos, und die Switches sehen dieselbe MAC ständig an wechselnden Ports (MAC-Flapping) – das Netz bricht zusammen."], ["h", "Switches absichern"], ["tab", [["Gefahr", "Was passiert", "Gegenmaßnahme"], ["MAC-Flooding", "Tabelle wird mit gefälschten MACs gefüllt, der Switch flutet danach alles", "Port Security (MAC-Limit pro Port, Sticky MAC)"], ["Fremder Switch / STP-Manipulation", "Angreifer gibt sich als Root Bridge aus und lenkt Verkehr um", "BPDU Guard an Endgeräte-Ports, Root Guard"], ["Rogue-DHCP", "Fremder DHCP-Server verteilt falsches Gateway", "DHCP Snooping (nur vertrauenswürdige Ports antworten)"], ["ARP-Spoofing", "Gefälschte ARP-Antworten leiten Verkehr um", "Dynamic ARP Inspection (nutzt die Snooping-Tabelle)"], ["Unbefugtes Gerät", "Jemand steckt ein Notebook in eine freie Dose", "802.1X am Port, ungenutzte Ports abschalten"], ["Mitlesen der Verwaltung", "Telnet/HTTP übertragen Passwörter im Klartext", "Management nur per SSH, SCP und HTTPS im eigenen VLAN"]]], ["h", "VLANs in der Praxis"], ["li", "**Native VLAN:** Frames ohne Tag auf einem Trunk landen hier (ab Werk VLAN 1). An beiden Enden gleich einstellen und VLAN 1 nicht für Nutzer oder Gäste verwenden."], ["li", "**Router-on-a-Stick:** Ein Router hängt mit einem getaggten Kabel am Switch und hat pro VLAN ein Subinterface als Gateway. Im Firmennetz übernimmt das oft ein Layer-3-Switch."], ["li", "**Access Point mit mehreren SSIDs:** Jede SSID bekommt ein VLAN, der Switchport ist ein Trunk. **Hypervisor:** Portgruppen im virtuellen Switch taggen die Frames der VMs."], ["li", "**Dynamische VLANs:** Heute meist per 802.1X – der RADIUS-Server übergibt nach der Anmeldung die VLAN-ID. Eine von Hand gepflegte MAC-Liste ist die Ausnahme."], ["li", "**Achtung Begriffe:** Bei Cisco ist ein „Trunk“ ein Port mit mehreren getaggten VLANs; bei manchen anderen Herstellern bezeichnet „Trunk“ eine Link-Aggregation."], ["h", "Ethernet-Frame genau betrachtet"], ["tab", [["Feld", "Byte", "Hinweis"], ["Präambel + SFD", "7 + 1", "Takt-Synchronisation, zählt nicht zur Framegröße"], ["Ziel-MAC", "6", "zuerst, damit der Switch früh entscheiden kann"], ["Quell-MAC", "6", "daraus lernt der Switch"], ["VLAN-Tag (optional)", "4", "802.1Q, VLAN-ID 12 Bit"], ["EtherType", "2", "0x0800 IPv4, 0x0806 ARP, 0x86DD IPv6"], ["Nutzdaten", "46–1500", "zu kurze Daten werden aufgefüllt (Padding)"], ["FCS", "4", "CRC-32 über den ganzen Frame ab Ziel-MAC"]]], ["p", "Ein Frame ist also **64 bis 1518 Byte** groß, mit VLAN-Tag bis 1522 Byte; Jumbo Frames (bis ca. 9000 Byte) sind eine Erweiterung. Stimmt die FCS nicht, wird der Frame **verworfen** – Ethernet erkennt Fehler, korrigiert sie aber nicht."], ["li", "**Sonderbits der MAC-Adresse:** Das niederwertigste Bit des ersten Bytes (I/G) kennzeichnet Gruppenadressen (Multicast, Broadcast). Das Bit daneben (U/L) zeigt eine lokal vergebene Adresse – etwa die zufällige „private“ WLAN-MAC moderner Smartphones."], ["h", "Glasfaser: Klassen, Wellenlängen, Module"], ["tab", [["Klasse", "Fasertyp", "Kern", "Typisch"], ["OM1", "Multimode", "62,5 µm", "veraltet, kurze Gigabit-Strecken"], ["OM2", "Multimode", "50 µm", "1 Gbit/s bis ca. 550 m"], ["OM3 / OM4", "Multimode (laseroptimiert)", "50 µm", "10 Gbit/s bis ca. 300 / 400 m"], ["OM5", "Multimode (Breitband)", "50 µm", "mehrere Wellenlängen (SWDM)"], ["OS1 / OS2", "Singlemode", "ca. 9 µm", "Kilometer, 10GBASE-LR 10 km, ER 40 km"]]], ["li", "Multimode arbeitet meist mit 850 nm, Singlemode mit 1310 und 1550 nm. Der Glasmantel misst bei beiden 125 µm."], ["li", "Im dicken Multimode-Kern laufen viele Lichtwege unterschiedlicher Länge (**Modendispersion**), die Pulse verschmieren – deshalb hat **Singlemode** die höhere Bandbreite über Distanz."], ["li", "**Transceiver:** SFP (1 Gbit/s), SFP+ (10), SFP28 (25), QSFP+ (40), QSFP28 (100). Typische Stecker: LC (klein, Duplex) und SC."], ["h", "Kupfer: Kategorie, Schirmung und Längen"], ["li", "Die **Kategorie** beschreibt die spezifizierte Frequenz (Cat 5e 100 MHz … Cat 6A 500 MHz, Cat 7 600 MHz, Cat 7A 1.000 MHz, Cat 8 2.000 MHz) – nicht die Datenrate und nicht die Schirmung."], ["li", "**Schirmungsangabe** nach ISO/IEC 11801: vor dem Schrägstrich der Gesamtschirm, dahinter der Schirm der Adernpaare (U = keiner, F = Folie, S = Geflecht). Beispiele: U/UTP, F/UTP, U/FTP, S/FTP, SF/UTP. Geschirmt werden Paare, nie einzelne Adern."], ["li", "**Cat 7** ist für GG45- bzw. TERA-Stecker spezifiziert; mit RJ45 erreicht die Strecke praktisch Cat-6A-Niveau. Für 25/40GBASE-T braucht es Cat 8 – und das nur bis 30 m."], ["tab", [["Bereich", "verbindet", "Richtwert Länge", "Medium"], ["Primär (Gelände)", "Gebäude untereinander", "bis 1.500 m", "Glasfaser, meist Singlemode"], ["Sekundär (Steigbereich)", "Gebäudeverteiler – Etagenverteiler", "bis 500 m", "Glasfaser, oft Multimode"], ["Tertiär (Etage)", "Etagenverteiler – Anschlussdose", "90 m fest + 10 m Patch", "Kupfer Twisted Pair"]]], ["h", "WAN-Begriffe richtig verwenden"], ["li", "Gleiche Up- und Downloadrate heißt **symmetrisch** (SDSL, Standleitung), unterschiedliche **asymmetrisch** (ADSL, VDSL, Kabel). „Synchron/asynchron“ beschreibt dagegen die Taktung."], ["li", "Aktuelle DSL-Werte: ADSL2+ bis 24 Mbit/s (in Deutschland meist als 16 Mbit/s vermarktet), VDSL2 mit Vectoring bis 100/40 Mbit/s, Supervectoring bis 250/40 Mbit/s. Darüber: Glasfaser (FTTH) oder Kabel."], ["li", "**MPLS:** Router im Providernetz leiten Pakete anhand kurzer Labels weiter (zwischen Schicht 2 und 3). MPLS-VPNs verbinden Standorte im Netz des Providers – nicht über das öffentliche Internet und ohne eigene Verschlüsselung."], ["li", "Klassische Standleitungen wie E1 (2,048 Mbit/s) oder T1 (1,544 Mbit/s, USA) sind weitgehend durch Ethernet-Standleitungen, Glasfaser und SD-WAN ersetzt."], ["h", "Header und TCP im Detail"], ["li", "**IPv4-Header:** 20 bis 60 Byte (IHL zählt 32-Bit-Wörter). Das Protokollfeld nennt den Inhalt: 1 ICMP, 6 TCP, 17 UDP. Die Prüfsumme deckt nur den Header ab und wird an jedem Router neu berechnet, weil die TTL sinkt."], ["li", "**TCP-Header:** 20 bis 60 Byte. Flags: SYN (Aufbau), ACK (Bestätigung), FIN (geordneter Abbau), RST (sofortiger Abbruch), PSH, URG. Die Prüfsumme deckt Header und Daten ab."], ["li", "**MSS:** Im Ethernet passen 1500 − 20 − 20 = **1460 Byte** Nutzdaten in ein Segment."], ["li", "**Flusskontrolle** (Empfangsfenster) schützt den Empfänger, **Staukontrolle** (Slow Start, Congestion Window) das Netz."], ["li", "„Zuverlässig“ heißt bei TCP: bestätigt, geordnet, Verlorenes wird neu gesendet – **nicht** verschlüsselt. Vertraulichkeit bringt erst TLS."], ["li", "**UDP** nutzt man für Echtzeit (VoIP/RTP, Videokonferenz, Online-Spiele) und kurze Anfragen (DNS, DHCP, NTP). Große Streamingdienste liefern meist per HTTPS über TCP; **HTTP/3** läuft über **QUIC** auf UDP."]], "wlan": [["h", "Streams, MIMO und Kanalbreite"], ["li", "Ein **räumlicher Stream** ist ein paralleler Datenstrom über eigene Antennen. Alle Streams laufen **gleichzeitig auf demselben Kanal** – mehr Streams brauchen keine zusätzlichen Kanäle."], ["li", "Mehr Tempo pro Stream bringt die **Kanalbreite** (20/40/80/160, bei Wi-Fi 7 320 MHz) – breite Kanäle belegen aber mehr vom Band."], ["li", "**MU-MIMO** bedient mehrere Clients gleichzeitig mit eigenen Streams (seit 802.11ac Wave 2). **OFDMA** (Wi-Fi 6) teilt einen Kanal in kleine Ressourcen-Einheiten für viele Clients."], ["li", "Heutige Notebooks und Smartphones beherrschen meist 2×2-MIMO; der Client mit den wenigsten Streams begrenzt seine eigene Datenrate."], ["h", "Neuere Standards"], ["tab", [["Name", "IEEE", "Bänder", "Neuerungen"], ["Wi-Fi 6", "802.11ax", "2,4 + 5 GHz", "OFDMA, MU-MIMO auch im Uplink, 1024-QAM, Target Wake Time"], ["Wi-Fi 6E", "802.11ax", "+ 6 GHz", "viele freie, überlappungsfreie Kanäle"], ["Wi-Fi 7", "802.11be", "2,4 + 5 + 6 GHz", "320-MHz-Kanäle, 4096-QAM, Multi-Link Operation (mehrere Bänder gleichzeitig)"]]], ["h", "Kanäle in Deutschland"], ["li", "**2,4 GHz:** Kanäle 1–13 erlaubt (USA 1–11, Kanal 14 nur Japan). Die Kanäle liegen 5 MHz auseinander, sind aber rund 20 MHz breit. Überlappungsfrei sind erst Kanäle mit 5 Nummern Abstand: 1, 6, 11 (bei reinem OFDM in Europa auch 1, 5, 9, 13)."], ["li", "**5 GHz:** seit 802.11a (1999) genutzt, in Deutschland ab 2002 freigegeben. In der EU 19 Kanäle à 20 MHz (36–64 und 100–140). Viele davon verlangen **DFS** (Radar erkennen und ausweichen) und **TPC** (Sendeleistung anpassen)."], ["li", "**6 GHz:** 5.945–6.425 MHz für Wi-Fi 6E und 7 – kaum Altgeräte, dafür geringere Reichweite."], ["h", "Repeater, Mesh und Roaming"], ["li", "Ein **Repeater** mit einem Funkmodul empfängt und sendet nacheinander auf demselben Kanal – der Durchsatz halbiert sich etwa, er wird separat verwaltet."], ["li", "**Mesh:** Die Knoten bilden ein gemeinsam verwaltetes System mit einer SSID, wählen selbst den besten Weg und nutzen oft ein **eigenes Backhaul-Band** (Tri-Band) für die Verbindung untereinander. Am besten: Knoten per Kabel anbinden (Wired Backhaul)."], ["li", "**Roaming-Hilfen:** 802.11k (Nachbar-AP-Liste), 802.11v (AP schlägt Wechsel vor), 802.11r (Fast BSS Transition: schneller Schlüsselwechsel)."], ["h", "Rechenbeispiel Übertragungsdauer"], ["p", "1 GiB über ein WLAN mit 40 Mbit/s, davon 60 % nutzbar: 1 GiB = 1.073.741.824 Byte × 8 = 8.589.934.592 bit. Nutzbare Rate 40 × 0,6 = 24 Mbit/s. 8.589.934.592 ÷ 24.000.000 ≈ 357,9 s = **5 min 58 s**. Achtung: GiB (2³⁰) und GB (10⁹) unterscheiden."]], "fw": [["h", "Mehrere Server hinter einer öffentlichen IP"], ["li", "Pro öffentlicher IP und Port kann eine Port-Forwarding-Regel nur auf ein internes Ziel zeigen."], ["li", "Lösungen: andere externe Ports (z. B. 8443 → zweiter Server), weitere öffentliche IPs oder ein **Reverse-Proxy**, der anhand des Servernamens (SNI bzw. Host-Header) verteilt."], ["li", "Freigegebene Server gehören in die **DMZ** – Port Forwarding öffnet einen Weg nach innen und senkt die Sicherheit, statt sie zu erhöhen."], ["h", "TLS-Inspection"], ["li", "Die Firewall bzw. der Proxy schaltet sich in die HTTPS-Verbindung: Er baut zum Server eine eigene TLS-Verbindung auf und stellt dem Client ein Ersatzzertifikat aus. Die Clients müssen dafür der **CA der Firewall** vertrauen (z. B. per Gruppenrichtlinie verteilt)."], ["li", "Nutzen: Malware und Datenabfluss auch im verschlüsselten Verkehr erkennen. Kosten: Rechenlast, mögliche Störungen bei Zertifikats-Pinning."], ["li", "Vorher klären: Datenschutz und Betriebsrat, Information der Mitarbeiter, Ausnahmen für sensible Bereiche wie Banking oder Gesundheitsportale."], ["h", "Application-Layer-Firewall: Stärken und Grenzen"], ["li", "**Stärken:** erkennt Anwendungen unabhängig vom Port (Deep Packet Inspection), regelt Teilfunktionen (Chat erlaubt, Dateiversand gesperrt), filtert URLs, Viren und Spam."], ["li", "**Grenzen:** höhere Latenz und Rechenlast, teure Hardware und Signatur-Abos, hoher Pflegeaufwand; für eigene Anwendungen müssen oft erst Filter gebaut werden."]], "dsgvo": [["h", "Grundsätze nach Art. 5 DSGVO"], ["tab", [["Grundsatz", "Bedeutung", "Beispiel"], ["Rechtmäßigkeit, Treu und Glauben, Transparenz", "Rechtsgrundlage nach Art. 6, faire und nachvollziehbare Verarbeitung", "Datenschutzhinweis bei der Erhebung"], ["Zweckbindung", "nur für vorher festgelegte, eindeutige Zwecke", "Buchungsdaten nicht für Partnerwerbung"], ["Datenminimierung", "nur so viel wie für den Zweck nötig", "für ein Mail-Angebot keine Postadresse"], ["Richtigkeit", "sachlich richtig, Fehler werden berichtigt", "Adressänderung zeitnah pflegen"], ["Speicherbegrenzung", "nur so lange wie nötig", "Löschung nach Ablauf der Aufbewahrungsfrist"], ["Integrität und Vertraulichkeit", "Schutz durch technische und organisatorische Maßnahmen", "Rechtekonzept, Verschlüsselung"], ["Rechenschaftspflicht (Abs. 2)", "Einhaltung nachweisen können", "Verarbeitungsverzeichnis, TOM-Dokumentation"]]], ["h", "Rechtsgrundlagen nach Art. 6 Abs. 1"], ["p", "Es gilt ein **Verbot mit Erlaubnisvorbehalt**: Jede Verarbeitung ist untersagt, solange keine dieser sechs Grundlagen greift. Die Einwilligung ist nur eine davon."], ["tab", [["Buchstabe", "Grundlage", "Beispiel"], ["a", "Einwilligung", "Newsletter-Anmeldung mit Bestätigung"], ["b", "Vertrag oder vorvertragliche Maßnahme auf Anfrage", "Angebot an eine Interessentin, Abrechnung per Kreditkarte"], ["c", "rechtliche Verpflichtung", "Rechnungen aufbewahren, Meldungen an Behörden"], ["d", "lebenswichtige Interessen", "Notfalldaten an den Rettungsdienst"], ["e", "öffentliche Aufgabe", "Verwaltungsverfahren einer Behörde"], ["f", "berechtigtes Interesse (nach Abwägung)", "Videoüberwachung gegen Diebstahl mit Hinweisschild"]]], ["p", "Für **besondere Kategorien** wie Gesundheitsdaten gilt zusätzlich Art. 9 – meist ist eine ausdrückliche Einwilligung nötig."], ["h", "Privacy by Design und by Default (Art. 25)"], ["li", "**By Design:** Datenschutz wird schon bei Planung und Entwicklung eingebaut – z. B. Pseudonymisierung, Verschlüsselung, Rollenrechte, automatische Löschfristen."], ["li", "**By Default:** Die Voreinstellungen sind so datensparsam wie möglich – Profile nicht öffentlich, Newsletter nicht vorangekreuzt, nur nötige Pflichtfelder."], ["h", "Anonym oder pseudonym?"], ["li", "**Pseudonymisiert:** Namen sind durch Kennungen ersetzt, die Zuordnung liegt getrennt. Der Personenbezug lässt sich wiederherstellen – die DSGVO gilt weiter."], ["li", "**Anonymisiert:** Niemand kann den Bezug mit vertretbarem Aufwand wiederherstellen (z. B. reine Summenstatistik) – die DSGVO gilt nicht mehr."], ["h", "Daten außerhalb der EU"], ["li", "Innerhalb von EU/EWR gilt die DSGVO unmittelbar – Cloud-Standort EU ist deshalb am einfachsten."], ["li", "In ein **Drittland** dürfen Daten nur mit **Angemessenheitsbeschluss** (z. B. EU-US Data Privacy Framework seit 2023 für zertifizierte Unternehmen) oder mit Garantien wie **Standardvertragsklauseln**."], ["h", "Typische Fallbewertungen"], ["tab", [["Vorhaben", "Bewertung"], ["Angebot an Interessentin per Mail, Name und Mail speichern", "zulässig (vorvertraglich, Art. 6 Abs. 1 b)"], ["Daten um Postadresse und Social-Media-Profile ergänzen", "unzulässig (nicht erforderlich, Datenminimierung)"], ["Kundendaten an den Arbeitgeber oder an Werbepartner geben", "unzulässig ohne Einwilligung (Zweckbindung)"], ["Anonyme Auswertung: meiste Fahrten pro Stadt zwischen 16 und 20 Uhr", "zulässig (kein Personenbezug)"], ["Profile aus Bewegungs- und Kreditkartendaten für Werbung", "nur mit Einwilligung"], ["Kreditkartendaten zur Abrechnung an den Zahlungsdienstleister", "zulässig (Vertragserfüllung)"], ["Gesundheitsdaten an eine Uni für eine Studie", "nur mit ausdrücklicher Einwilligung oder anonymisiert"], ["Datenverlust durch Defekt, Stromausfall, Einbruch in den Serverraum", "Datensicherheit (bei personenbezogenen Daten zugleich Datenschutz)"]]], ["li", "**Auskunftsanfragen** sind grundsätzlich binnen eines Monats zu beantworten (Art. 12 Abs. 3)."], ["li", "**Art. 32** nennt als Beispiele für Sicherheitsmaßnahmen ausdrücklich Pseudonymisierung und Verschlüsselung sowie Vertraulichkeit, Integrität, Verfügbarkeit, Belastbarkeit, schnelle Wiederherstellung und regelmäßige Überprüfung. Die bekannte Liste der acht Kontrollen (Zutritt, Zugang, Zugriff …) stammt aus dem alten BDSG."]], "wiso": [["h", "Wirtschaftssubjekte"], ["tab", [["Wirtschaftssubjekt", "Entscheidet über", "Ziel"], ["Private Haushalte", "Konsum und Sparen", "Bedarfsdeckung, Nutzenmaximierung"], ["Unternehmen", "Produktion und Investition", "Gewinnmaximierung"], ["Staat", "Einnahmen, Ausgaben, Regeln", "Sicherheit, Stabilität, soziale Absicherung, Ausgleich sozialer Ungleichheit"]]], ["tab", [["Begriff", "Bedeutung"], ["Konsum", "Kauf und Verbrauch von Gütern und Dienstleistungen zur Bedürfnisbefriedigung"], ["Sparen", "Konsumverzicht: Ersparnis = verfügbares Einkommen − Konsumausgaben"], ["Investition", "Kauf von Sachkapital (Anlagen, Maschinen, Vorräte), um produzieren zu können"], ["Produktion", "Herstellung von Gütern durch Kombination der Produktionsfaktoren Boden, Arbeit, Kapital"]]], ["li", "Ersparnis ist die Voraussetzung für Investitionen: Banken sammeln das Ersparte (**Kapitalsammelstellen**) und geben es als Kredit an Unternehmen weiter."], ["h", "Wirtschaftskreislauf"], ["p", "Das Kreislaufmodell zeigt, wie Güter und Geld zwischen den Wirtschaftssubjekten fließen. **Geld- und Güterströme laufen in entgegengesetzter Richtung** und sind gleich viel wert."], ["tab", [["Strom", "Inhalt", "Beispiel"], ["Güterstrom", "Waren und Dienstleistungen", "Laptop an den Kunden"], ["Faktorstrom", "Produktionsfaktoren Arbeit, Boden, Kapital", "Arbeitskraft an den Arbeitgeber"], ["Geldstrom", "Zahlungen (als Gegenleistung oder ohne, z. B. Steuern)", "Lohn, Konsumausgaben, Steuern"]]], ["h", "Einfacher Kreislauf (2 Sektoren)"], ["grafik", "kreislauf2"], ["li", "Geschlossene Volkswirtschaft ohne Staat, Ausland und Sparen: Alles Einkommen wird ausgegeben, also **Einkommen = Konsumausgaben** (Y = C)."], ["h", "Erweiterter Kreislauf (3 Sektoren)"], ["grafik", "kreislauf3"], ["li", "Mit den Banken als drittem Sektor wird ein Teil des Einkommens gespart: Y = C + S. Das Ersparte fließt als Kredit in Investitionen. Im Gleichgewicht gilt **S = I**."], ["h", "Vollständiger Kreislauf (4 und 5 Sektoren)"], ["grafik", "kreislauf5"], ["tab", [["Modell", "Sektoren", "Volkswirtschaft"], ["einfach", "Haushalte, Unternehmen", "geschlossen"], ["erweitert", "+ Banken (Vermögensänderung)", "geschlossen"], ["4 Sektoren", "+ Staat", "geschlossen (kein Ausland)"], ["5 Sektoren", "+ Ausland", "**offen**"]]], ["li", "**Transferleistungen** sind Zahlungen ohne direkte Gegenleistung: an Haushalte z. B. Kindergeld, BAföG, Wohngeld, Bürgergeld; an Unternehmen heißen sie **Subventionen**."], ["tipp", "Auf der Unterrichtsfolie hieß schon das 4-Sektoren-Modell „offene Volkswirtschaft“. Offen ist eine Volkswirtschaft aber erst mit dem **Ausland** (5 Sektoren). In der Grafik der Folie waren außerdem in jeder Farbe Geld- und Güterströme gemischt."], ["h", "Volkswirtschaftliche Gesamtrechnung (VGR)"], ["p", "Die VGR erfasst zahlenmäßig, was in einer Volkswirtschaft in einem Zeitraum passiert – sie ist der „Kassensturz“ des Wirtschaftskreislaufs."], ["li", "Sie zeigt **Entstehung** (wo wurde produziert?), **Verwendung** (Konsum, Investitionen, Staat, Außenbeitrag) und **Verteilung** (Löhne vs. Gewinne und Vermögenseinkommen) – plus Vermögensbildung und Finanzierung."], ["li", "Nutzen: Grundlage für Wirtschaftspolitik, Prognosen, Tarifverhandlungen, internationale Vergleiche und Unternehmensentscheidungen. In Deutschland erstellt sie das **Statistische Bundesamt**."], ["h", "BIP und BNE"], ["tab", [["Kennzahl", "Prinzip", "misst"], ["Bruttoinlandsprodukt (BIP)", "**Inlandsprinzip**", "Wert aller im Inland hergestellten Waren und Dienstleistungen (ohne Vorleistungen) – egal, wer sie herstellt"], ["Bruttonationaleinkommen (BNE, früher Bruttosozialprodukt)", "**Inländerprinzip**", "Einkommen aller Inländer – auch wenn es im Ausland verdient wurde"]]], ["formel", "BNE = BIP + Einkommen der Inländer aus dem Ausland − Einkommen der Ausländer aus dem Inland"], ["li", "**Nominal** = in aktuellen Preisen, **real** = preisbereinigt (ohne Inflation). Wirtschaftswachstum wird am realen BIP gemessen."], ["tipp", "Auf der Unterrichtsfolie standen Bruttosozialprodukt, Bruttonationaleinkommen und Bruttoinlandsprodukt als Gleichsetzung in einer Überschrift. Nur BSP und BNE sind dasselbe – das BIP folgt dem Inlandsprinzip."], ["h", "Einkommensarten"], ["tab", [["Produktionsfaktor", "Einkommen", "Beispiel"], ["Arbeit", "Lohn bzw. Gehalt", "Monatsgehalt, Stundenlohn"], ["Boden", "Rente (Grundrente), Pacht, Miete", "Pacht für ein Feld, Miete für ein Büro"], ["Kapital", "Zins (bzw. Dividende)", "Zinsen auf Tagesgeld"], ["unternehmerische Tätigkeit", "Gewinn", "Gewinn des Inhabers"]]], ["li", "**Lohn** wird meist nach Stunden oder Leistung berechnet, **Gehalt** ist ein fester Monatsbetrag. Beides wird nach Abzug von Steuern und Sozialabgaben ausgezahlt (netto)."], ["li", "**Zins** zahlt der Schuldner dem Gläubiger für überlassenes Kapital."], ["li", "**Transfereinkommen** gibt es ohne Gegenleistung im Wirtschaftsprozess: gesetzliche Altersrente (im Umlageverfahren aus den Beiträgen der heute Arbeitenden), Kindergeld, Arbeitslosengeld, BAföG."], ["tipp", "Auf der Folie wurde „Rente“ als Auszahlung der eigenen Beiträge erklärt und „Einkommen“ mit dem Unternehmerlohn gleichgesetzt. Richtig: Die gesetzliche Rente ist ein Transfereinkommen; die Einkommensart des Unternehmers heißt **Gewinn** (Unternehmerlohn ist nur ein kalkulatorischer Kostenposten)."], ["h", "Marktformen"], ["grafik", "marktformen"], ["p", "Marktformen werden nach der **Zahl der Anbieter und Nachfrager** eingeteilt (Marktformenschema)."], ["tab", [["Anbieter ↓ / Nachfrager →", "einer", "wenige", "viele"], ["einer", "zweiseitiges (bilaterales) Monopol – z. B. ein Rüstungshersteller und die Bundeswehr", "beschränktes Angebotsmonopol – Spezialgerät für wenige Kliniken", "Angebotsmonopol – Netzbetreiber im eigenen Netzgebiet, Patentinhaber"], ["wenige", "beschränktes Nachfragemonopol – wenige Hersteller, ein Abnehmer", "zweiseitiges Oligopol – Flugzeughersteller und Fluggesellschaften", "Angebotsoligopol – Mineralölkonzerne, Mobilfunknetzbetreiber"], ["viele", "Nachfragemonopol – Staat kauft Einsatzmaterial", "Nachfrageoligopol – wenige Molkereien, viele Milchbauern", "Polypol – Wertpapierbörse, Wochenmarkt"]]], ["tab", [["Marktform", "Preisspielraum", "Merkmale"], ["Monopol", "groß, aber begrenzt durch Nachfrage und Kartellrecht", "keine Konkurrenz, Anbieter ist Preisfixierer"], ["Oligopol", "mittel, Anbieter beobachten sich gegenseitig", "Preise voneinander abhängig, Gefahr von Absprachen (Kartell) oder Preiskampf"], ["Polypol", "gering; auf einem vollkommenen Markt keiner", "Anbieter ist Preisnehmer und Mengenanpasser"]]], ["li", "**Vollständige Konkurrenz** = Polypol auf einem **vollkommenen Markt** (gleichartige Güter, volle Markttransparenz, keine Vorlieben, sofortige Reaktion). Ein Polypol allein reicht dafür nicht: Beim Friseur gibt es viele Anbieter, aber trotzdem unterschiedliche Preise."], ["li", "**Verkäufermarkt:** Nachfrage > Angebot, Verkäufer haben die Marktmacht (Preise steigen). **Käufermarkt:** Angebot > Nachfrage, Käufer haben die Macht."], ["li", "**Unternehmenszusammenschlüsse** zielen auf mehr Marktmacht, Kostensenkung (Rationalisierung), gemeinsame Forschung und Risikoteilung. Formen: Kooperation (Unternehmen bleiben selbstständig, z. B. Arbeitsgemeinschaft) und Konzentration (Konzern, Fusion). Preisabsprachen (Kartelle) sind grundsätzlich verboten – das Bundeskartellamt wacht darüber."], ["tipp", "Auf der Unterrichtsfolie stand die OPEC als Angebotsmonopol. Die OPEC ist ein **Kartell mehrerer Staaten** – also ein Angebotsoligopol mit Absprachen, kein Monopol."]]}, "grafiken": {"maslow": {"w": 660, "h": 300, "el": [["p", [47.0, 236.0, 303.0, 236.0, 335.0, 290.0, 15.0, 290.0], "A", "K"], ["t", 175, 263.0, "1", 15, 1, "m", "AT"], ["l", [327.0, 263.0, 350, 263.0], "R", 1, 0, 1], ["t", 358, 254.0, "Physiologische Bedürfnisse", 14, 1, "s", "T"], ["t", 358, 273.0, "Essen, Trinken, Schlaf, "dsgvo", "a": "Zugangskontrolle", "b": "Zugriffskontrolle", "m": [["Frage", "Wer darf sich am System anmelden?", "Wer darf welche Daten im System sehen oder ändern?"], ["Beispiel", "Passwort, MFA, Bildschirmsperre", "NTFS-Rechte, Rollen, Berechtigungskonzept"]]}, {"t": "pm", "a": "Lastenheft", "b": "Pflichtenheft", "m": [["Verfasser", "Auftraggeber", "Auftragnehmer"], ["Inhalt", "WAS und WOFÜR", "WIE und WOMIT"], ["Zeitpunkt", "vor der Ausschreibung bzw. Anfrage", "nach dem Lastenheft, als Antwort darauf"]]}, {"t": "pm", "a": "Wasserfallmodell", "b": "Scrum", "m": [["Ablauf", "Phasen streng nacheinander", "kurze Sprints von 1–4 Wochen"], ["Änderungen", "spät und teuer", "jederzeit im Backlog möglich"], ["Ergebnis", "erst am Ende sichtbar", "nach jedem Sprint ein nutzbares Inkrement"]]}, {"t": "service", "a": "Incident", "b": "Problem", "m": [["Was", "einzelne Störung", "Ursache hinter einer oder mehreren Störungen"], ["Ziel", "Betrieb schnell wiederherstellen", "Ursache finden und dauerhaft beseitigen"], ["Beispiel", "Drucker druckt nicht – anderen zuweisen", "Treiber verursacht immer wieder Abstürze"]]}, {"t": "service", "a": "SLA", "b": "OLA", "m": [["Partner", "IT-Dienstleister und Kunde", "zwei interne Abteilungen der IT"], ["Zweck", "verspricht dem Kunden Leistungen", "sichert intern ab, dass das SLA erfüllbar ist"]]}, {"t": "kauf", "a": "Gewährleistung", "b": "Garantie", "m": [["Grundlage", "gesetzlich vorgeschrieben", "freiwillig vom Hersteller oder Händler"], ["Dauer", "2 Jahre ab Übergabe (gesetzlich, bei Neuware)", "frei festgelegt"], ["Gegenüber", "der Verkäufer", "meist der Hersteller"]]}, {"t": "kauf", "a": "Leasing", "b": "Kauf", "m": [["Eigentum", "Gerät gehört dem Leasinggeber", "Gerät gehört dem Käufer"], ["Kosten", "laufende Raten, keine große Anfangsinvestition", "einmalige Anschaffungskosten"], ["Bilanz", "meist nicht in der eigenen Bilanz", "Abschreibung über die Nutzungsdauer"]]}, {"t": "wiso", "a": "Maximalprinzip", "b": "Minimalprinzip", "m": [["Gegeben", "die Mittel (z. B. Budget)", "das Ziel"], ["Gesucht", "möglichst großer Nutzen", "möglichst geringer Mitteleinsatz"], ["Beispiel", "mit 1.000 € den besten PC kaufen", "einen bestimmten PC am günstigsten kaufen"]]}], "fehlersuche": [["ip", "PC-Konfiguration:\nIP-Adresse 192.168.10.25\nSubnetzmaske 255.255.255.0\nGateway 192.168.1.1\nDNS 192.168.10.1", "Der PC erreicht das lokale Netz, aber nicht das Internet. Was ist falsch?", "Das Gateway liegt nicht im eigenen Netz 192.168.10.0/24", "Die Subnetzmaske passt nicht zur IP-Adresse|Der DNS-Server darf nicht im eigenen Netz liegen|Die IP-Adresse ist eine Broadcastadresse", "Das Gateway muss im eigenen Netz liegen, hier also 192.168.10.x."], ["ip", "PC-Konfiguration:\nIP-Adresse 10.0.5.255\nSubnetzmaske 255.255.255.0\nGateway 10.0.5.1", "Was ist an dieser Konfiguration falsch?", "Die IP-Adresse ist die Broadcastadresse des Netzes", "Das Gateway muss immer auf .254 enden|10.0.0.0 ist kein privater Bereich|Die Maske passt nicht zu einer 10er-Adresse", "Bei /24 ist .255 die Broadcastadresse und kann keinem Host zugewiesen werden."], ["ip", "Zwei PCs im selben Büro:\nPC A: 192.168.1.10 /25\nPC B: 192.168.1.140 /25\nKein Router dazwischen", "Die beiden PCs erreichen sich nicht. Warum?", "Sie liegen in verschiedenen Netzen (.0/25 und .128/25)", "Ein /25 erlaubt nur 25 Hosts|Die Adressen sind doppelt vergeben|.140 ist eine Broadcastadresse", "/25 teilt in .0–.127 und .128–.255. Ohne Router keine Verbindung zwischen den Netzen."], ["ip", "IPv6-Adresse in einer Dokumentation:\n2001:db8::1::5", "Was ist an dieser Schreibweise falsch?", ":: kommt zweimal vor", "Hex-Buchstaben müssen großgeschrieben werden|2001:db8 ist kein gültiges Präfix|Am Ende fehlt die Präfixlänge", ":: darf nur einmal vorkommen, sonst ist nicht eindeutig, wie viele Null-Blöcke wo fehlen."], ["dienste", "DHCP-Bereich des Servers:\nNetz 192.168.50.0/24\nPool 192.168.50.1 – 192.168.50.200\nGateway (Router) 192.168.50.1\nDrucker statisch 192.168.50.20", "Es gibt immer wieder Adresskonflikte. Was ist falsch?", "Router und Drucker liegen mit ihren festen Adressen im DHCP-Pool", "Der Pool ist mit 200 Adressen zu klein für ein /24-Netz|Das Gateway muss immer die letzte Adresse .254 haben|Drucker dürfen grundsätzlich keine Adresse per DHCP bekommen", "Feste Adressen gehören außerhalb des Pools oder als Reservierung/Ausschluss in den DHCP-Server."], ["dienste", "Neues Außenbüro im eigenen Subnetz, DHCP-Server steht in der Zentrale.\nClients im Außenbüro bekommen 169.254.x.x.", "Was fehlt am Router des Außenbüros am wahrscheinlichsten?", "Ein DHCP-Relay (IP-Helper) zum Server der Zentrale", "Eine statische Route ins Internet|Ein DNS-Forwarder|Ein zweiter DNS-Server", "Der DHCP-Discover ist ein Broadcast und wird vom Router nicht weitergeleitet. Das Relay leitet ihn per Unicast weiter."], ["dienste", "DNS-Zone firma.de:\nwww   A      203.0.113.10\nmail  A      203.0.113.20\n@     MX 10  203.0.113.20", "Welcher Eintrag ist fehlerhaft?", "Der MX-Record zeigt auf eine IP statt auf einen Namen", "Der A-Record für www braucht eine Priorität|Zwei A-Records dürfen nicht in einer Zone stehen|Der Mailserver braucht einen AAAA- statt A-Record", "Ein MX-Record muss auf einen Hostnamen zeigen, z. B. mail.firma.de, nicht auf eine IP."], ["fw", "Firewall-Regeln (von oben nach unten):\n1  Deny  Any → Any\n2  Allow LAN → Internet  TCP 443\n3  Allow LAN → DNS-Server UDP 53", "Warum kommt niemand ins Internet?", "Regel 1 blockiert alles, die Allow-Regeln werden nie erreicht", "Für HTTPS muss UDP statt TCP freigegeben sein|DNS braucht Port 853 statt 53|Regel 3 muss vor Regel 2 stehen", "Die erste passende Regel gewinnt. Deny Any gehört ans Ende."], ["fw", "Portweiterleitung am Router für einen Webserver in der DMZ:\nExtern TCP 443 → 192.168.100.10:80\nZertifikat auf dem Webserver installiert.", "Besucher bekommen Verbindungsfehler. Was passt nicht?", "Von außen kommt HTTPS, intern wird auf Port 80 ohne TLS weitergeleitet", "Port 443 darf an Routern grundsätzlich nicht weitergeleitet werden|Webserver dürfen nicht in der DMZ stehen, sondern nur im LAN|Portweiterleitungen funktionieren nur mit UDP, nicht mit TCP", "Der Browser spricht TLS auf 443, der Server erwartet auf 80 unverschlüsseltes HTTP – das passt nicht zusammen."], ["spe", "Backup-Konzept einer Steuerkanzlei:\nTägliches Backup auf ein USB-Laufwerk,\ndas dauerhaft am Server steckt.\nRestore wurde noch nie getestet.", "Was ist der schwerste Mangel?", "Keine Kopie außer Haus oder offline – Ransomware oder Brand trifft Server und Backup", "Tägliche Sicherungen sind zu häufig und belasten den Server unnötig|USB-Laufwerke sind für Backups in Kanzleien gesetzlich verboten|Steuerdaten dürfen aus Datenschutzgründen gar nicht gesichert werden", "Das verletzt 3-2-1: eine Kopie außer Haus bzw. offline fehlt. Dazu kommt der fehlende Restore-Test."], ["spe", "RAID-Planung:\n4 Festplatten à 4 TB, RAID 5\n„Damit haben wir 16 TB nutzbar und können zwei Platten verlieren.“", "Was ist an der Aussage falsch?", "Nutzbar sind 12 TB, und nur eine Platte darf ausfallen", "Nutzbar sind 8 TB, zwei Platten dürfen ausfallen|RAID 5 braucht mindestens 5 Platten|RAID 5 hat keine Ausfallsicherheit", "RAID 5: (n − 1) × Größe = 3 × 4 TB = 12 TB; es verkraftet genau einen Plattenausfall."], ["spe", "USV-Auswahl für einen Server mit 900 W Wirkleistung:\nGewählt: USV mit 1000 VA, Leistungsfaktor 0,6", "Warum reicht die USV nicht?", "Sie liefert nur 600 W Wirkleistung", "VA und Watt sind dasselbe – sie reicht genau|Server dürfen nur an Online-USVs|Der Leistungsfaktor muss über 1 liegen", "1000 VA × 0,6 = 600 W < 900 W. Nötig wären mindestens 1500 VA bei cos φ = 0,6."], ["wlan", "WLAN-Planung im Büro (2,4 GHz):\nAP 1 Kanal 1\nAP 2 Kanal 3\nAP 3 Kanal 6", "Was ist ungünstig?", "Kanal 3 überlappt mit 1 und 6 – besser 1, 6, 11", "Kanal 1 ist in Deutschland nicht erlaubt|Drei APs dürfen nicht im gleichen Band funken|2,4 GHz hat nur zwei Kanäle", "Nur 1, 6 und 11 überlappen sich im 2,4-GHz-Band nicht."], ["wlan", "Firmen-WLAN:\nWPA2-Personal, Passwort „Firma2024!“,\nseit 3 Jahren unverändert, 60 Mitarbeiter.", "Was ist das größte Problem?", "Ein gemeinsamer Schlüssel für alle – ausgeschiedene Mitarbeiter haben weiter Zugang", "Das Passwort ist zu lang und wird deshalb oft falsch eingegeben|WPA2 ist im 5-GHz-Band nicht erlaubt und bremst das WLAN aus|60 Geräte sind für ein WLAN grundsätzlich zu viele, es braucht Kabel", "Besser WPA2/WPA3-Enterprise mit 802.1X: jeder meldet sich einzeln an, Zugänge sind einzeln sperrbar."], ["osi", "Verkabelung im Lager:\nSwitch → Patchfeld → 130 m Cat-6A-Kabel → Netzwerkdose am Arbeitsplatz", "Warum ist die Verbindung instabil?", "Twisted Pair ist auf 100 m begrenzt", "Cat 6A ist nur für 10 Mbit/s geeignet|Ein Patchfeld darf nicht vor dem Switch stehen|Netzwerkdosen brauchen Glasfaser", "Für 130 m braucht man Glasfaser oder einen aktiven Zwischenverteiler."], ["osi", "Zwei Switches sind zur Ausfallsicherheit doppelt verbunden.\nSpanning Tree ist deaktiviert.\nKurz danach ist das Netz komplett lahm.", "Was ist passiert?", "Eine Schleife erzeugt einen Broadcast-Sturm", "Die Kabel sind zu lang|Die Switches haben doppelte IP-Adressen|Der DHCP-Server ist ausgefallen", "Ohne STP kreisen Broadcasts endlos durch die Schleife und legen das Netz lahm."], ["sec", "Passwortrichtlinie eines Kunden:\n6 Zeichen, nur Kleinbuchstaben,\nalle 30 Tage ändern, keine MFA.", "Was ist der größte Schwachpunkt?", "Zu kurz und zu einfach, dazu keine MFA", "Die Änderung alle 30 Tage ist zu selten|Kleinbuchstaben sind besonders sicher|MFA ist nur für Admins erlaubt", "Kurze, einfache Passwörter sind schnell geknackt. Besser: lange Passphrasen und MFA; häufiges Wechseln wird heute nicht mehr empfohlen."], ["sec", "Ein Admin verschlüsselt eine Mail an Bob mit seinem eigenen Private Key, damit nur Bob sie lesen kann.", "Was ist falsch?", "Zum Verschlüsseln an Bob nimmt man Bobs Public Key", "Mails darf man nicht verschlüsseln|Man muss dafür den Private Key von Bob nehmen|Private Keys sind nur für Webserver", "Mit dem eigenen Private Key signiert man. Verschlüsselt an Bob wird mit Bobs Public Key."], ["dsgvo", "Ein Unternehmen bemerkt am Montag eine Datenpanne mit Kundendaten.\nDie Geschäftsführung will erst nach Abschluss der internen Prüfung in zwei Wochen melden.", "Was ist falsch?", "Die Meldung an die Aufsichtsbehörde muss binnen 72 Stunden erfolgen", "Datenpannen müssen gar nicht gemeldet werden|Die Meldefrist beträgt einen Monat|Nur Behörden müssen Datenpannen melden", "Art. 33 DSGVO: Meldung möglichst binnen 72 Stunden; fehlende Infos dürfen nachgereicht werden."], ["hk", "Kalkulation eines Azubis:\nBarverkaufspreis 980,00 €\n+ 2 % Kundenskonto = 980 × 1,02 = 999,60 €", "Was ist falsch gerechnet?", "Kundenskonto wird im Hundert gerechnet: 980 ÷ 0,98 = 1.000 €", "Skonto wird immer vom Listenpreis abgezogen|Kundenskonto gibt es nur beim Einkauf|Es müssen 3 % statt 2 % sein", "Der Kunde zieht 2 % vom Zielverkaufspreis ab – also ist der Barverkaufspreis 98 % davon."], ["kauf", "Nutzwertanalyse:\nPreis 40 %, Leistung 30 %, Service 20 %, Garantie 20 %", "Was stimmt nicht?", "Die Gewichtungen ergeben 110 % statt 100 %", "Der Preis darf höchstens 25 % zählen|Garantie ist kein zulässiges Kriterium|Es müssen genau fünf Kriterien sein", "Die Gewichte müssen zusammen 100 % ergeben."], ["pm", "Netzplan:\nVorgang B: FAZ 5, Dauer 3, FEZ 7", "Was ist falsch berechnet?", "FEZ = FAZ + Dauer = 8", "FAZ muss immer 0 sein|Die Dauer darf nicht größer als 2 sein|FEZ = FAZ − Dauer = 2", "Vorwärtsrechnung: FEZ = FAZ + Dauer = 5 + 3 = 8."], ["virt", "Ein Kunde will „aus Kostengründen“ seine Domänencontroller, die Datenbank und das Backup als VMs auf einem einzigen Host ohne Cluster betreiben.", "Was ist das größte Risiko?", "Der Host ist ein Single Point of Failure – fällt er aus, ist alles weg", "VMs können keine Domänencontroller sein|Backups dürfen nicht virtualisiert werden|Datenbanken laufen nur auf physischen Servern", "Mindestens das Backup gehört auf ein anderes System; für Verfügbarkeit braucht es einen zweiten Host."], ["green", "Entsorgung eines Kundenservers:\nFestplatten werden formatiert und das Gerät an einen Gebrauchthändler verkauft.", "Was ist das Problem?", "Formatieren löscht die Daten nicht sicher", "Server dürfen nicht weiterverkauft werden|Festplatten müssen immer im Gerät bleiben|Gebrauchthändler brauchen eine IHK-Prüfung", "Formatierte Daten lassen sich wiederherstellen. Nötig: zertifiziertes Löschen oder Vernichtung nach DIN 66399 mit Protokoll."]], "programme": [["prog", "summe = 0\nFÜR i VON 1 BIS 4\n    summe = summe + i\nENDE FÜR\nAUSGABE summe", "Was wird ausgegeben?", "10", "4|6|15", "1 + 2 + 3 + 4 = 10."], ["prog", "x = 1\nSOLANGE x < 20\n    x = x * 2\nENDE SOLANGE\nAUSGABE x", "Was wird ausgegeben?", "32", "16|20|64", "1 → 2 → 4 → 8 → 16 → 32. Bei 32 ist x < 20 falsch, die Schleife endet."], ["prog", "n = 0\nWIEDERHOLE\n    n = n + 3\nBIS n > 5\nAUSGABE n", "Was wird ausgegeben?", "6", "3|5|9", "Fußgesteuert: 3 (nicht > 5), dann 6 (> 5) → Ende."], ["prog", "a = 7\nb = 3\nWENN a > 5 UND b > 5 DANN\n    AUSGABE \"beide\"\nSONST WENN a > 5 ODER b > 5 DANN\n    AUSGABE \"einer\"\nSONST\n    AUSGABE \"keiner\"\nENDE WENN", "Was wird ausgegeben?", "einer", "beide|keiner|einer und beide", "a > 5 ist wahr, b > 5 falsch → UND ist falsch, ODER ist wahr."], ["prog", "zahlen = [4, 9, 2, 7]\nmax = zahlen[0]\nFÜR JEDES z IN zahlen\n    WENN z > max DANN max = z\nENDE FÜR\nAUSGABE max", "Was macht das Programm?", "Es sucht die größte Zahl und gibt 9 aus", "Es sucht die kleinste Zahl und gibt 2 aus|Es sortiert die Liste aufsteigend|Es gibt die erste Zahl 4 aus", "max startet mit 4 und wird bei jeder größeren Zahl ersetzt → 9."], ["prog", "zahl = 17\nWENN zahl MOD 2 = 0 DANN\n    AUSGABE \"gerade\"\nSONST\n    AUSGABE \"ungerade\"\nENDE WENN", "Was wird ausgegeben?", "ungerade", "gerade|1|8", "17 MOD 2 = 1 (Rest der Division) → nicht 0 → ungerade."], ["prog", "text  ist das Problem?", "Endlosschleife – i wird größer statt kleiner", "Die Schleife läuft nie|Es wird nur 10 ausgegeben|Die Ausgabe ist 10, 9, 8 … 1", "Die Bedingung i > 0 bleibt immer wahr. Richtig wäre i = i − 1."], ["prog", "FUNKTION f(n)\n    WENN n <= 1 DANN RÜCKGABE 1\n    RÜCKGABE n * f(n − 1)\nENDE FUNKTION\nAUSGABE f(4)", "Was wird ausgegeben?", "24", "10|4|16", "Rekursion (Fakultät): 4 × 3 × 2 × 1 = 24."]], "luecken": [["hw", "Der schnellste und kleinste CPU-Cache ist der ___-Cache.", "L1|L1-Cache", "L1 → L2 → L3: kleiner und schneller nach links."], ["hw", "Das Rechenwerk der CPU heißt auch ___.", "ALU", "Arithmetic Logic Unit."], ["hw", "Speicher, der Bitfehler erkennt und korrigiert, heißt ___-RAM.", "ECC", "Error Correction Code – Pflicht in Servern."], ["spe", "Eine Sicherung aller Änderungen seit dem letzten Vollbackup heißt ___ Sicherung.", "differenzielle|differenziell|differentielle|differentiell", "Inkrementell = seit der letzten Sicherung beliebiger Art."], ["spe", "RAID ___ spiegelt die Daten auf zwei Platten.", "1", "RAID 1 = Spiegelung, 50 % nutzbar."], ["spe", "RAID 6 braucht mindestens ___ Festplatten.", "4|vier", "Zwei Paritäten, verkraftet zwei Plattenausfälle."], ["spe", "Der maximal tolerierbare Datenverlust heißt ___.", "RPO|Recovery Point Objective", "RTO ist die tolerierbare Ausfallzeit."], ["spe", "Eine Online-USV hat eine Umschaltzeit von ___ ms.", "0|null", "Doppelwandler (VFI) – der Strom läuft immer über den Wechselrichter."], ["osi", "Ein Switch arbeitet auf OSI-Schicht ___.", "2|zwei", "Ein normaler Switch nutzt MAC-Adressen."], ["osi", "Der Standard für VLAN-Tagging heißt IEEE ___.", "802.1Q|802.1q", "802.1X ist dagegen die Port-Authentifizierung."], ["osi", "Der TCP-Verbindungsaufbau heißt 3-Wege-___.", "Handshake", "SYN → SYN-ACK → ACK."], ["osi", "Ein Twisted-Pair-Kabel darf maximal ___ m lang sein.", "100|hundert", "Für längere Strecken: Glasfaser."], ["osi", "Eine MAC-Adresse ist ___ Bit lang.", "48", "6 Byte, meist hexade
