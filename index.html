eifer überflutet den DNS-Server mit Anfragen|Gefälschte DHCP-Angebote verteilen falsche Gateways|Der Angreifer errät die WLAN-Passphrase per Wörterbuch", "Er behauptet z. B., die IP des Gateways gehöre zu seiner MAC – klassischer Einstieg für Man-in-the-Middle."], ["sec", "Was schützt am Switch gegen ARP-Spoofing?", "Dynamic ARP Inspection", "Spanning Tree Protocol|Link Aggregation (LACP)|Port Mirroring (SPAN)", "DAI prüft ARP-Pakete gegen bekannte IP-MAC-Zuordnungen (z. B. aus DHCP Snooping)."], ["sec", "Was leistet DNSSEC?", "Es prüft per Signatur, ob DNS-Antworten echt sind", "Es verschlüsselt alle DNS-Anfragen per TLS|Es beschleunigt die Namensauflösung per Cache|Es verhindert DDoS-Angriffe auf DNS-Server", "DNSSEC sichert Echtheit und Integrität, verschlüsselt aber nicht. Vertraulichkeit bringen DoH und DoT."], ["sec", "Wie funktioniert SYN-Flooding?", "Viele SYN-Pakete mit gefälschten Absendern füllen die Verbindungstabelle", "Viele große ICMP-Echo-Pakete überlasten die Leitung des Opfers|Gefälschte DNS-Antworten füllen den Cache des Resolvers mit falschen Daten|Viele vollständig aufgebaute Verbindungen senden extrem langsam Daten", "Das Opfer wartet auf ACKs, die nie kommen. Gegenmittel: SYN-Cookies, Rate Limiting."], ["sec", "Welche Einträge schützen eine Domain gegen Mail-Spoofing?", "SPF, DKIM und DMARC", "MX, CNAME und PTR|A, AAAA und NS|SOA, SRV und CAA", "SPF nennt erlaubte Server, DKIM signiert Mails, DMARC legt fest, was mit Fälschungen passiert."], ["sec", "Was ist beim CEO-Fraud die wichtigste Gegenmaßnahme?", "Rückruf über eine bekannte Nummer und Vier-Augen-Prinzip", "Ein stärkerer Virenscanner auf dem Mailserver|Längere Passwörter für die Buchhaltung|Mails nur noch verschlüsselt senden", "Die Täter nutzen Zeitdruck und Autorität. Technik hilft wenig, feste Freigabeprozesse viel."], ["spe", "Was beschreibt der RTO?", "Wie lange ein System maximal ausfallen darf", "Wie viel Datenverlust maximal akzeptabel ist|Wie oft ein Restore-Test stattfinden muss|Wie lange Backups aufbewahrt werden", "RTO = Recovery Time Objective (Ausfallzeit). RPO = Recovery Point Objective (Datenverlust)."], ["spe", "Ein Prozess hat ein RPO von 1 Stunde. Was folgt daraus?", "Mindestens stündlich sichern", "Restore muss in 1 Stunde fertig sein|Backups 1 Stunde lang aufbewahren|Nur einmal am Tag voll sichern", "Das RPO bestimmt das Sicherungsintervall. Das RTO bestimmt die Wiederherstellungstechnik."], ["spe", "Was bedeutet die „0“ in der 3-2-1-1-0-Regel?", "Null Fehler beim Prüfen der Wiederherstellung", "Null Kopien auf dem Produktivsystem|Null Minuten Ausfallzeit beim Restore|Null ungesicherte Änderungen (RPO 0)", "3 Kopien, 2 Medien, 1 außer Haus, 1 offline/unveränderbar, 0 Fehler beim Restore-Test."], ["spe", "Was zeichnet CDP (Continuous Data Protection) aus?", "Jede Änderung wird sofort gesichert, RPO nahe null", "Einmal pro Woche ein Vollbackup auf Band|Nur geänderte Dateien seit dem letzten Vollbackup|Ein Snapshot vor jedem Windows-Update", "CDP schreibt Änderungen fortlaufend mit Zeitstempel ins Journal – Wiederherstellung auf fast jeden Zeitpunkt."], ["spe", "MTBF 500 h, MTTR 1,5 h. Wie hoch ist die Verfügbarkeit?", "ca. 99,7 %", "ca. 99,0 %|ca. 99,97 %|ca. 98,5 %", "500 ÷ (500 + 1,5) = 0,997 → 99,7 %."], ["spe", "Wie viel Ausfall pro Jahr erlaubt 99,99 % Verfügbarkeit?", "ca. 52,6 Minuten", "ca. 8,8 Stunden|ca. 5,3 Minuten|ca. 87,6 Stunden", "8.760 h × 0,0001 = 0,876 h ≈ 52,6 min."], ["spe", "Was misst die MTTD?", "Die mittlere Zeit, bis ein Fehler bemerkt wird", "Die mittlere Zeit zwischen zwei Ausfällen|Die mittlere Reparaturzeit|Die maximale Dauer eines Backups", "Mean Time To Detect – sagt viel über die Qualität des Monitorings."], ["spe", "Welchen Abstand empfiehlt das BSI für georedundante Rechenzentren?", "Mindestens 200 km", "Mindestens 5 km|Mindestens 50 km|Mindestens 1.000 km", "Im begründeten Einzelfall sollen 100 km nicht unterschritten werden. Die Empfehlung ist nicht rechtlich bindend."], ["spe", "Was ermittelt eine Business Impact Analysis (BIA)?", "Welche Prozesse kritisch sind und was ein Ausfall kostet", "Welche Firewall-Regeln überflüssig oder zu offen sind|Wie hoch die Eintrittswahrscheinlichkeit von Angriffen ist|Welche Mitarbeiter welche Adminrechte benötigen", "Aus der BIA ergeben sich RTO und RPO je Prozess."], ["spe", "Welche Medien-Rotation überschreibt Medien exponentiell seltener?", "Türme von Hanoi", "Großvater-Vater-Sohn|Forever Incremental|Round Robin (Ringtausch)", "Medium A jeden 2. Tag, B jeden 4., C jeden 8. Tag … – wenige Medien, trotzdem alte Stände."], ["osi", "Wie viele Leitungen braucht ein vollvermaschtes Netz mit 6 Knoten?", "15", "12|30|36", "n × (n − 1) ÷ 2 = 6 × 5 ÷ 2 = 15."], ["osi", "Welche Topologie ist im heutigen LAN Standard?", "Stern bzw. erweiterter Stern (Baum)", "Bus mit Abschlusswiderständen|Ring mit Token Passing|Vollvermaschung aller PCs", "Jedes Gerät hat eine eigene Leitung zum Switch; große Netze werden hierarchisch als Baum aufgebaut."], ["osi", "Wie viele Schichten hat das DoD- bzw. TCP/IP-Modell?", "4", "5|7|3", "Anwendung, Transport, Internet, Netzzugang."], ["osi", "Welcher OSI-Schicht entspricht die Internet-Schicht des DoD-Modells?", "Schicht 3 – Vermittlung", "Schicht 2 – Sicherung|Schicht 4 – Transport|Schicht 7 – Anwendung", "Internet-Schicht = IP, ICMP = OSI-Schicht 3."], ["osi", "Wie heißt die Dateneinheit auf Schicht 2?", "Frame (Rahmen)", "Paket (IP-Paket)|Segment (TCP-Segment)|Bits (Bitstrom)", "Schicht 4: Segment/Datagramm, Schicht 3: Paket, Schicht 2: Frame, Schicht 1: Bits."], ["osi", "Wozu dient ein Patchfeld?", "Feste Leitungen enden dort und werden per Patchkabel flexibel auf Switchports gelegt", "Es verstärkt das Signal aktiv, damit Strecken über 100 m möglich werden|Es trennt Broadcast-Domänen und leitet zwischen VLANs weiter wie ein Router|Es versorgt alle angeschlossenen Endgeräte per PoE mit Strom", "Das Patchfeld ist passiv. Umstecken ändert die Zuordnung, ohne die Verkabelung anzufassen."], ["osi", "Welches Zugriffsverfahren nutzt WLAN?", "CSMA/CA – Kollisionen vermeiden", "CSMA/CD – Kollisionen erkennen|Token Passing – nur mit Token senden|Polling – der AP fragt jeden Client ab", "Funk kann Kollisionen nicht zuverlässig erkennen. Deshalb: abhören, zufällig warten, senden, ACK abwarten."], ["osi", "Was ist der Unterschied zwischen Gateway und Router?", "Ein Gateway kann auch zwischen verschiedenen Protokollen übersetzen", "Ein Router arbeitet auf Schicht 2, ein Gateway auf Schicht 1|Ein Gateway verbindet nur Geräte im selben Netz|Es gibt keinen – beides sind exakt dasselbe Gerät", "Jeder Router ist ein Gateway, aber nicht jedes Gateway ist ein Router (z. B. VoIP-Gateway)."], ["wiso", "Was ist „Bedarf“?", "Ein Bedürfnis, das mit Kaufkraft gedeckt ist", "Ein Wunsch, der unrealistisch ist|Die Menge, die tatsächlich gekauft wurde|Ein Grundbedürfnis wie Essen und Trinken", "Wunsch → Bedürfnis → Bedarf (mit Geld) → Nachfrage (tritt am Markt auf)."], ["wiso", "Mit 1.000 € soll der leistungsstärkste PC gekauft werden. Welches Prinzip ist das?", "Maximalprinzip", "Minimalprinzip|Optimumprinzip|Maximumprinzip (BSI)", "Mittel fest, Nutzen maximal = Maximalprinzip. Ziel fest, Mittel minimal = Minimalprinzip."], ["wiso", "Zu welchem Sektor gehört ein IT-Systemhaus?", "Tertiärer Sektor (Dienstleistung)", "Primärer Sektor (Urproduktion)|Sekundärer Sektor (Weiterverarbeitung)|Öffentlicher Sektor (Staat)", "Dienstleistungen gehören zum tertiären Sektor; manche zählen IT-Dienste als quartären Sektor."], ["wiso", "Drucker und Toner sind …", "Komplementärgüter", "Substitutionsgüter|Inferiore Güter|Freie Güter", "Komplementärgüter ergänzen sich, Substitutionsgüter ersetzen sich (z. B. Butter/Margarine)."], ["wiso", "Der Preis liegt über dem Gleichgewichtspreis. Was entsteht?", "Ein Angebotsüberhang – der Preis sinkt", "Ein Nachfrageüberhang – der Preis steigt|Ein Gleichgewicht – nichts ändert sich|Ein Monopol – der Preis bleibt fest", "Bei zu hohem Preis wollen mehr verkaufen als kaufen. Anbieter senken den Preis."], ["wiso", "Wenige Anbieter, viele Nachfrager – welche Marktform?", "Angebotsoligopol", "Polypol|Angebotsmonopol|Nachfrageoligopol", "Beispiele: Mobilfunknetze, Mineralöl, Betriebssysteme."], ["wiso", "Welcher Produktionsfaktor ist abgeleitet (derivativ)?", "Kapital", "Boden|Arbeit|Natur (Umwelt)", "Kapital (Maschinen, Gebäude) entsteht erst aus Boden und Arbeit."], ["wiso", "Was ist ein Zielkonflikt im Unternehmen?", "Höhere Löhne senken den Gewinn", "Energie sparen senkt Kosten und schont die Umwelt|Mehr Umsatz erhöht den Gewinn|Weiterbildung hat keinen Einfluss auf den Gewinn", "Zielkonflikt: ein Ziel behindert ein anderes. Energie sparen wäre Zielharmonie, das letzte Zielneutralität."], ["wiso", "Was beschreibt die Konsumentenrente?", "Käufer hätten mehr gezahlt und sparen die Differenz", "Anbieter hätten billiger verkauft und gewinnen die Differenz|Käufer zahlen mehr, als ihnen das Gut wert ist|Der Staat erstattet Verbrauchern einen Teil der Steuern", "Gegenstück: Produzentenrente – Anbieter hätten auch billiger verkauft."], ["wiso", "Was sind inferiore Güter?", "Güter, deren Nachfrage bei steigendem Einkommen sinkt", "Güter, die besonders hochwertig verarbeitet sind|Güter, deren Nachfrage bei steigendem Einkommen steigt|Güter, die sich gegenseitig ergänzen", "Bei mehr Einkommen steigen Menschen auf bessere Produkte um (z. B. vom Discount-Produkt zur Marke)."], ["wiso", "Welche Stufe steht in der Maslow-Pyramide ganz oben?", "Selbstverwirklichung", "Sicherheitsbedürfnisse|Soziale Bedürfnisse|Ich-Bedürfnisse (Wertschätzung)", "Von unten: physiologische, Sicherheits-, soziale, Ich-Bedürfnisse, Selbstverwirklichung."], ["wiso", "Was kennzeichnet die soziale Marktwirtschaft?", "Markt plus Staat, der Wettbewerb und sozialen Ausgleich sichert", "Der Staat plant Produktion, Mengen und Preise für alle Unternehmen|Der Staat greift nie ein, der Markt regelt alles allein|Alle großen Unternehmen gehören dem Staat und werden zentral gelenkt", "Beispiele: Kartellamt, Sozialversicherung, Kündigungsschutz."], ["prog", "Welcher SQL-Befehl ändert vorhandene Datensätze?", "UPDATE … SET … WHERE …", "ALTER TABLE … MODIFY …|INSERT INTO … VALUES …|MODIFY … SET … WHERE …", "UPDATE ändert Daten, ALTER TABLE ändert die Struktur der Tabelle."], ["prog", "Was liefert ein INNER JOIN?", "Nur Zeilen, die in beiden Tabellen einen passenden Partner haben", "Alle Zeilen der linken Tabelle, auch wenn kein Partner existiert|Alle Zeilen beider Tabellen, auch wenn kein Partner existiert|Jede Zeile der einen mit jeder Zeile der anderen Tabelle kombiniert", "LEFT JOIN nimmt zusätzlich die linke Tabelle vollständig, FULL OUTER JOIN beide."], ["prog", "Welche Funktion bildet den Durchschnitt einer Spalte?", "AVG()", "SUM()|MEAN()|COUNT()", "AVG = average. MEAN gibt es in Standard-SQL nicht."], ["prog", "Wie sortiert man absteigend?", "ORDER BY spalte DESC", "ORDER BY spalte ASC|SORT BY spalte DOWN|GROUP BY spalte DESC", "ASC (aufsteigend) ist Standard, DESC absteigend."], ["prog", "Was ist ein Array?", "Eine Datenstruktur mit mehreren Werten gleichen Typs über einen Index", "Ein einzelner Wahrheitswert, der nur wahr oder falsch sein kann|Eine Schleife mit einer festen Anzahl von Durchläufen|Eine Funktion, die keinen Rückgabewert liefert", "In vielen Sprachen beginnt der Index bei 0."], ["prog", "Was ist der Unterschied zwischen = und == in vielen Programmiersprachen?", "= weist zu, == vergleicht", "= vergleicht, == weist zu|Beides weist zu, == nur bei Zahlen|Es gibt keinen Unterschied", "x = 5 setzt x auf 5. x == 5 prüft, ob x gleich 5 ist (wahr/falsch)."], ["prog", "Welcher Datentyp passt für einen Preis wie 19,99?", "Kommazahl (float/double, für Geld besser decimal)", "Char (einzelnes Zeichen, z. B. CHAR(1))|String (Zeichenkette, z. B. VARCHAR(10))|Boolean (wahr/falsch, z. B. BIT oder BOOL)", "Für Geldbeträge nimmt man in Datenbanken oft DECIMAL, um Rundungsfehler zu vermeiden."], ["prog", "Was bedeutet die 1. Normalform?", "Jedes Feld enthält nur einen einzelnen (atomaren) Wert", "Jede Tabelle hat genau einen Fremdschlüssel|Es gibt keine transitiven Abhängigkeiten|Jedes Nichtschlüsselattribut hängt vom ganzen Schlüssel ab", "2. NF: volle Abhängigkeit vom Schlüssel; 3. NF: keine transitiven Abhängigkeiten."], ["prog", "Welches Symbol steht im PAP für Start und Ende?", "Abgerundetes Rechteck (Oval)", "Raute|Parallelogramm|Rechteck mit doppelten Seitenlinien", "Rechteck = Anweisung, Raute = Verzweigung, Parallelogramm = Ein-/Ausgabe, doppelte Seitenlinien = Unterprogramm."], ["prog", "Was bewirkt eine Zählschleife FÜR i VON 1 BIS 5?", "Sie läuft genau fünfmal", "Sie läuft viermal|Sie läuft sechsmal|Sie läuft, bis i größer als 6 ist", "i nimmt nacheinander 1, 2, 3, 4, 5 an."], ["prog", "Wozu dient ein Primärschlüssel?", "Er identifiziert jeden Datensatz eindeutig", "Er verschlüsselt die Tabelle|Er sortiert die Tabelle automatisch|Er verweist auf eine andere Tabelle", "Der Verweis auf eine andere Tabelle ist der Fremdschlüssel."], ["prog", "Was ist eine Variable?", "Ein benannter Speicherplatz für einen Wert, der sich ändern kann", "Ein fester Wert, der sich während des Programms nie ändert|Eine Bedingung, die in einer Verzweigung geprüft wird|Ein Kommentar im Quelltext, den der Compiler ignoriert", "Ein Wert, der sich nicht ändern darf, heißt Konstante."], ["pm", "Welche Phase kommt im klassischen Projektablauf nach der Planung?", "Durchführung", "Initialisierung|Abschluss|Definition", "Initialisierung → Definition → Planung → Durchführung → Abschluss (Controlling begleitend)."], ["pm", "Was ist ein Meilenstein?", "Ein wichtiges Ereignis ohne Dauer, an dem geprüft wird", "Ein Vorgang mit besonders langer Dauer im Netzplan|Der teuerste Arbeitsschritt im gesamten Projekt|Ein Arbeitspaket auf der untersten Ebene des PSP", "Meilensteine markieren z. B. das Ende einer Phase und haben die Dauer 0."], ["pm", "Was ist der freie Puffer eines Vorgangs?", "Wie weit er sich verschieben lässt, ohne den Nachfolger zu verzögern", "Wie weit er sich verschieben lässt, ohne das Projektende zu verzögern|Die Zeit zwischen zwei Meilensteinen|Die Pause zwischen zwei Sprints", "FP = kleinster FAZ der Nachfolger − FEZ. Der Gesamtpuffer bezieht sich auf das Projektende."], ["pm", "Wer priorisiert in Scrum das Product Backlog?", "Der Product Owner", "Der Scrum Master|Das Entwicklungsteam|Der Kunde selbst", "Der Scrum Master sorgt für den Prozess, das Team setzt um."], ["pm", "Was ist ein Daily Scrum?", "Ein tägliches, kurzes Abstimmungstreffen (ca. 15 Minuten)", "Ein tägliches Review mit dem Kunden zum Sprint-Ergebnis|Die tägliche Planung aller Aufgaben des ganzen Sprints|Ein täglicher Statusbericht an die Geschäftsführung", "Typisch (klassisch): Was habe ich gemacht, was mache ich heute, was hindert mich? Der Scrum Guide 2020 schreibt die Fragen nicht mehr vor."], ["pm", "Was zeigt ein Projektstrukturplan (PSP)?", "Alle Arbeitspakete des Projekts hierarchisch gegliedert", "Die zeitliche Abfolge der Vorgänge als Balken|Die Kosten der Arbeitspakete pro Monat|Die Abhängigkeiten der Vorgänge mit Puffern", "Der PSP sagt, WAS zu tun ist. Wann – das zeigen Netzplan und Gantt-Diagramm."], ["pm", "Was gehört in eine Stakeholder-Analyse?", "Wer betroffen ist, welchen Einfluss und welche Haltung er hat", "Welche Aktien die Firma an Partnern hält|Welche Hardware und Software beschafft wird|Welche Arbeitspakete auf dem kritischen Pfad liegen", "Stakeholder sind alle, die vom Projekt betroffen sind oder es beeinflussen können."], ["pm", "Was ist ein Risiko im Projektmanagement?", "Ein mögliches Ereignis mit negativen Folgen für das Projekt", "Ein bereits eingetretenes Problem, das sofort gelöst werden muss|Eine sichere Kostensteigerung, die schon feststeht|Ein Fehler im Pflichtenheft, der vor der Abnahme auffällt", "Risiko = Eintrittswahrscheinlichkeit × Schadenshöhe; man plant Maßnahmen dagegen."], ["pm", "Was zeichnet agiles Vorgehen gegenüber dem Wasserfall aus?", "Kurze Zyklen mit Feedback, Anforderungen dürfen sich ändern", "Alle Anforderungen stehen zu Projektbeginn fest|Phasen laufen streng nacheinander ohne Rücksprung|Ein Lastenheft ersetzt jede Abstimmung mit dem Kunden", "Wasserfall: Phasen nacheinander, Änderungen teuer. Agil: iterativ, z. B. Scrum mit Sprints."], ["pm", "Vier Vorgänge auf dem kritischen Pfad – was gilt für sie?", "Jede Verzögerung verschiebt das Projektende", "Sie haben einen freien Puffer größer 0|Sie können um einen Tag verschoben werden, ohne das Projektende zu ändern|Sie müssen alle parallel bearbeitet werden", "Auf dem kritischen Pfad ist der Gesamtpuffer 0."], ["pm", "Was ist eine Lessons-Learned-Runde?", "Rückblick am Projektende: was lief gut, was verbessern wir", "Schulung der Anwender vor dem Go-live des neuen Systems|Erste Besprechung beim Projektstart (Kick-off-Meeting)|Formelle Abnahme der Leistung durch den Auftraggeber", "Die Erkenntnisse fließen in künftige Projekte ein."], ["pm", "Wozu dient die Abnahme am Projektende?", "Der Auftraggeber bestätigt, dass die Leistung den Anforderungen entspricht", "Der Projektleiter verteilt die Arbeitspakete an die Mitglieder des Teams|Das Team schätzt gemeinsam die Dauer der Vorgänge für den Netzplan|Der Lieferant schickt die Schlussrechnung und schließt das Projekt ab", "Mit dem Abnahmeprotokoll geht die Verantwortung über, oft beginnt die Gewährleistung."], ["service", "Was ist ein Major Incident?", "Eine Störung mit großer Auswirkung, die sofort mit höchster Priorität bearbeitet wird", "Eine dauerhafte Ursache hinter vielen wiederkehrenden Störungen im Betrieb|Ein großer, geplanter Change, der am Wochenende im Wartungsfenster eingespielt wird|Eine Störung, die nur einen einzelnen Arbeitsplatz betrifft und warten kann", "Major Incidents haben meist einen eigenen, beschleunigten Ablauf und Kommunikationsplan."], ["service", "Wonach richtet sich die Priorität eines Tickets?", "Nach Auswirkung (Impact) und Dringlichkeit (Urgency)", "Nach der Reihenfolge des Eingangs|Nach dem Rang des Anrufers im Unternehmen|Nach der Länge der Fehlerbeschreibung", "Priorität = Impact × Urgency, oft als Matrix dargestellt."], ["service", "Was ist ein Workaround?", "Eine vorläufige Umgehungslösung, bis die Ursache behoben ist", "Die endgültige Lösung, die die Ursache dauerhaft beseitigt|Eine vorab genehmigte Standardänderung ohne CAB|Die Weitergabe eines Tickets an den 2nd Level Support", "Beispiel: anderen Drucker zuweisen, bis der Treiber repariert ist."], ["service", "Was ist eine funktionale Eskalation?", "Weitergabe an Fachleute mit mehr Know-how (1st → 2nd Level)", "Weitergabe an Vorgesetzte bzw. die Geschäftsführung|Rückgabe des Tickets an den Anwender zur Klärung|Abschluss des Tickets mit dokumentiertem Workaround", "Hierarchisch geht es nach oben in der Führung, funktional zur Fachkompetenz."], ["service", "Was regelt das Change Management?", "Änderungen geplant, bewertet und genehmigt durchführen", "Störungen möglichst schnell und dauerhaft beheben|Ursachen wiederkehrender Störungen analysieren|Standardanfragen der Anwender bearbeiten", "Ziel: Risiken durch Änderungen klein halten; Freigabe oft durch ein CAB (Change Advisory Board)."], ["service", "Was ist ein Single Point of Contact (SPOC)?", "Eine zentrale Anlaufstelle für alle Anfragen der Anwender", "Ein Server, dessen Ausfall das ganze Netz lahmlegt|Ein Administrator mit allen Rechten im System|Ein einzelner Switchport für das Management", "In der Regel der Service Desk. Nicht verwechseln mit dem Single Point of Failure."], ["service", "Was gehört in eine gute Ticketbeschreibung?", "Wer, was genau, seit wann, welche Fehlermeldung, schon versucht", "Nur Name und Abteilung des Anrufers, der Rest kommt später|Vor allem die eigene Vermutung über die Ursache|Die Telefonnummer und Vertragsnummer des Herstellers", "Je genauer die Beschreibung, desto schneller die Lösung – ohne Rückfragen."], ["service", "Was ist bei einem Kundengespräch am Telefon wichtig?", "Aktiv zuhören, nachfragen, zusammenfassen, Ergebnis vereinbaren", "Viele Fachbegriffe verwenden, um kompetent zu wirken|Sofort eine Lösung nennen, ohne nachzufragen|Den Kunden bei falschen Begriffen direkt korrigieren", "Am Ende fasst man zusammen, was passiert und bis wann der Kunde Rückmeldung bekommt."], ["service", "Was beschreibt eine CMDB?", "Eine Datenbank mit allen IT-Komponenten und ihren Beziehungen", "Eine Liste aller offenen und geschlossenen Tickets|Ein verschlüsseltes Dokument mit allen Admin-Passwörtern|Ein Vertrag zwischen IT-Dienstleister und Kunde", "CMDB = Configuration Management Database; Einträge heißen Configuration Items (CI)."], ["service", "Welche Lizenzart erlaubt es, die Software beliebig zu nutzen, zu ändern und weiterzugeben, auch ohne die Änderungen offenzulegen?", "MIT-Lizenz (permissive Open Source)", "GPL-Lizenz (Copyleft, strenge Weitergabe)|Freeware-Lizenz (kostenlos, Closed Source)|Shareware-Lizenz (Testphase, dann kostenpflichtig)", "MIT/BSD sind freizügig. Die GPL verlangt, dass Änderungen wieder offen sind."], ["service", "Was ist ein Vorteil eines Self-Service-Portals?", "Anwender lösen einfache Anliegen selbst, rund um die Uhr", "Es ersetzt das komplette Service-Desk-Team|Es braucht nach der Einführung keine Pflege|Es verhindert, dass überhaupt Störungen entstehen", "Typisch: Passwort zurücksetzen, Software bestellen, Wissensdatenbank."], ["service", "Was regelt ein Underpinning Contract (UC)?", "Leistungen eines externen Dienstleisters für die IT", "Interne Absprachen zwischen zwei Abteilungen|Die Lizenzbedingungen eines Betriebssystems|Den Arbeitsvertrag eines Service-Mitarbeiters", "SLA: IT ↔ Kunde, OLA: intern, UC: IT ↔ externer Lieferant."], ["dsgvo", "Fall: Eine Arztpraxis sichert Patientendaten auf ein NAS. Welcher Schutzbedarf bei Vertraulichkeit?", "Hoch bis sehr hoch – Gesundheitsdaten sind besonders schutzwürdig", "Normal – es sind ja nur Namen, Adressen und Termine|Hoch – aber nur wegen der Verfügbarkeit der Termine|Niedrig – das NAS steht im abgeschlossenen Praxisraum", "Gesundheitsdaten sind besondere Kategorien nach Art. 9 DSGVO; eine Offenlegung hätte gravierende Folgen."], ["dsgvo", "Fall: Mitarbeiter sollen nur die Ordner ihrer Abteilung öffnen können. Welche TOM?", "Zugriffskontrolle (Berechtigungen)", "Zutrittskontrolle (Gebäude)|Zugangskontrolle (Anmeldung)|Weitergabekontrolle (Transport)", "Zutritt = Räume, Zugang = Systeme, Zugriff = Daten innerhalb der Systeme."], ["dsgvo", "Fall: Laptops von Außendienstlern gehen gelegentlich verloren. Welche Maßnahme schützt die Daten am besten?", "Festplattenverschlüsselung, z. B. BitLocker", "Ein BIOS-/UEFI-Passwort am Gerät|Tägliches Backup auf ein NAS|Ein starkes Windows-Anmeldepasswort", "Backup schützt die Verfügbarkeit, nicht die Vertraulichkeit. Ein BIOS-Passwort lässt sich umgehen, wenn die Platte ausgebaut wird."], ["dsgvo", "Fall: Ein externer Dienstleister wartet die Kundendatenbank per Fernzugriff. Was ist rechtlich nötig?", "Ein Vertrag zur Auftragsverarbeitung (AV-Vertrag)", "Eine Einwilligung jedes einzelnen Kunden|Eine Meldung an die Aufsichtsbehörde|Nichts, Wartung ist keine Verarbeitung", "Wer im Auftrag personenbezogene Daten verarbeitet oder darauf zugreifen kann, braucht einen AV-Vertrag nach Art. 28 DSGVO."], ["sec", "Fall: Ein Webshop darf höchstens 4 Stunden ausfallen. Welches Schutzziel steht im Vordergrund?", "Verfügbarkeit", "Vertraulichkeit|Integrität|Authentizität", "Die maximale Ausfallzeit beschreibt die Verfügbarkeit (→ RTO)."], ["sec", "Fall: Ein Server betreibt den Webshop (Schutzbedarf hoch) und das Intranet (normal). Welchen Schutzbedarf hat der Server?", "Hoch – nach dem Maximumprinzip", "Normal – nach dem Durchschnitt|Sehr hoch – wegen Kumulation immer|Normal – der Verteilungseffekt senkt ihn", "Das System erbt den höchsten Schutzbedarf seiner Anwendungen. Kumulation kann ihn zusätzlich erhöhen."], ["osi", "Welche Höchstlänge sieht die strukturierte Verkabelung (EN 50173) für den Sekundärbereich (Gebäudebackbone) vor?", "500 m", "90 m|1.500 m|2.000 m", "Richtwerte: Primär (Gelände) bis 1.500 m, Sekundär (Steigbereich zwischen Gebäude- und Etagenverteiler) bis 500 m, Tertiär (Etage) 90 m fest verlegt plus 10 m Patch- und Geräteanschlusskabel."], ["osi", "Was legt die Kategorie eines Kupferkabels (z. B. Cat 6A) eigentlich fest?", "Die spezifizierte Frequenz in MHz", "Die maximale Datenrate in Mbit/s|Die Art und Anzahl der Schirmungen|Die zulässige Länge der Strecke", "Cat 5e = 100 MHz, Cat 6 = 250 MHz, Cat 6A = 500 MHz, Cat 7 = 600 MHz. Welche Datenrate läuft, bestimmt der Ethernet-Standard; die Schirmung steht separat in der Bezeichnung (U/UTP, S/FTP …)."], ["osi", "Was bedeutet die Kabelbezeichnung SF/UTP?", "Geflecht und Folie gesamt, Paare ungeschirmt", "Geflecht um jedes Paar, Folie als Gesamtschirm|Folie um jedes Paar, kein Gesamtschirm vorhanden|Geflecht als Gesamtschirm, Folie um jede Einzelader", "Nach ISO/IEC 11801 steht vor dem Schrägstrich der Gesamtschirm, dahinter die Schirmung der Adernpaare (U = ungeschirmt, F = Folie, S = Geflecht). Einzelne Adern werden nie geschirmt."], ["osi", "Welche Faserklasse bezeichnet eine Singlemode-Faser?", "OS2", "OM3|OM4|OM5", "OM1 bis OM5 sind Multimode-Klassen (Kern 62,5 bzw. 50 µm), OS1 und OS2 sind Singlemode (Kern ca. 9 µm)."], ["osi", "Warum ist die Reichweite von Multimode-Fasern kürzer als die von Singlemode?", "Unterschiedlich lange Lichtwege verschmieren die Pulse", "Die Faser leitet Strom und fängt dadurch Störungen ein|Der dicke Kern schluckt das Licht schon nach wenigen Metern|Multimode arbeitet ausschließlich mit sichtbarem Rotlicht", "Das nennt man Modendispersion: Im dicken Kern laufen viele Moden auf verschieden langen Wegen. Darum hat Singlemode die höhere Bandbreite über Distanz – nicht Multimode."], ["osi", "Welche Downstream-Rate erreicht Supervectoring (VDSL2-Profil 35b) maximal?", "250 Mbit/s", "100 Mbit/s|52 Mbit/s|1.000 Mbit/s", "VDSL2 mit Vectoring: bis 100/40 Mbit/s, Supervectoring: bis 250/40 Mbit/s. Gigabit gibt es über Glasfaser (FTTH) oder Kabel."], ["osi", "Eine WAN-Leitung mit gleicher Up- und Downloadrate nennt man fachlich korrekt …", "symmetrisch", "synchron|isochron|bidirektional", "„Synchron/asynchron“ beschreibt den Takt einer Übertragung, nicht das Verhältnis von Up- zu Download. ADSL heißt deshalb Asymmetric DSL."], ["osi", "Was trifft auf MPLS zu?", "Weiterleitung anhand kurzer Labels statt per IP-Lookup", "Ein DSL-Verfahren mit gleich schnellem Up- und Download|Eine Verschlüsselung für Standortnetze im Internet|Ein Ersatz für IP-Adressen durch MAC-Adressen im WAN", "MPLS arbeitet zwischen Schicht 2 und 3. MPLS-VPNs laufen im Netz des Providers, getrennt vom öffentlichen Internet, und sind von sich aus nicht verschlüsselt."], ["osi", "Welche Bytes zählen bei der Ethernet-Framegröße (64 bis 1518 Byte) nicht mit?", "Präambel und Start Frame Delimiter (8 Byte)", "Ziel- und Quell-MAC-Adresse (12 Byte)|Typfeld und Frame Check Sequence (6 Byte)|Padding bei sehr kleinen Nutzdaten (bis 46 Byte)", "Gezählt wird von der Ziel-MAC bis zur FCS: 6 + 6 + 2 + 46…1500 + 4 = 64…1518 Byte. Präambel (7) und SFD (1) dienen nur der Synchronisation."], ["osi", "Was macht ein Store-and-Forward-Switch mit einem Frame, dessen FCS nicht stimmt?", "Er verwirft den Frame", "Er korrigiert die fehlerhaften Bits|Er fordert ihn beim Sender neu an|Er leitet ihn mit Fehlermarke weiter", "Ethernet erkennt Fehler nur, korrigiert sie aber nicht. Fehlende Daten fordert erst TCP auf Schicht 4 neu an."], ["osi", "Woran erkennt man, dass eine MAC-Adresse eine Gruppen- bzw. Multicast-Adresse ist?", "Niederwertigstes Bit des ersten Bytes ist 1", "Das höchstwertige Bit des ersten Bytes ist 1|Die ersten 24 Bit bestehen nur aus Nullen|Das letzte Byte der Adresse lautet FF", "Das I/G-Bit: 0 = Einzeladresse, 1 = Gruppe. Eine Adresse wie FF-AA-12-34-56-AB ist daher keine normale Geräteadresse; ff:ff:ff:ff:ff:ff ist Broadcast."], ["osi", "Ein Smartphone zeigt im WLAN die MAC 9E-41-…. Was verrät die zweite Hex-Ziffer E?", "Lokal vergebene, z. B. zufällige Adresse", "Vom Hersteller fest eingebrannte Geräteadresse|Multicast-Adresse für eine Gruppe|Broadcast-Adresse an alle Geräte", "E = 1110: Das U/L-Bit ist gesetzt (lokal verwaltet), das I/G-Bit nicht (Einzeladresse). Private WLAN-Adressen erkennt man an 2, 6, A oder E an zweiter Stelle."], ["osi", "Wohin leitet ein Switch einen Frame mit unbekannter Ziel-MAC?", "An alle Ports im VLAN außer dem Eingangsport", "Nur an Ports, an denen weitere Switches hängen|Nur an das Standardgateway des Netzes|Nirgendwohin, der Frame wird sofort verworfen", "Das nennt man Flooding. Antwortet das Ziel, lernt der Switch dessen Quell-MAC und leitet ab dann gezielt weiter."], ["osi", "Was ist das Ziel eines MAC-Flooding-Angriffs?", "MAC-Tabelle überfüllen, damit der Switch alles flutet", "Die ARP-Caches aller Clients mit falschen Einträgen füllen|Die Root Bridge übernehmen und den Verkehr umleiten|Den DHCP-Server mit gefälschten Anfragen überlasten", "Ist die Tabelle voll, behandelt der Switch neue Ziele als unbekannt und flutet sie – der Angreifer kann mitlesen. Gegenmittel: Port Security."], ["osi", "Was macht BPDU Guard an einem Access-Port?", "Er schaltet den Port ab, sobald BPDUs ankommen", "Er macht den Switch automatisch zur Root Bridge|Er bremst Broadcasts oberhalb eines Grenzwerts|Er prüft ARP-Antworten gegen die DHCP-Tabelle", "An Endgeräte-Ports haben Switches nichts verloren. Kommt dort ein BPDU an, hängt jemand einen Switch an oder manipuliert den Spanning Tree."], ["osi", "Wogegen schützt DHCP Snooping?", "Gegen fremde (Rogue-)DHCP-Server", "Gegen doppelte MAC-Adressen im LAN|Gegen Schleifen bei redundanten Uplinks|Gegen das Mitlesen von DHCP-Paketen", "Nur vertrauenswürdige Ports dürfen DHCP-Antworten senden. Die dabei erstellte Bindungstabelle nutzt auch Dynamic ARP Inspection."], ["osi", "Welcher Switch wird beim Spanning Tree zur Root Bridge?", "Der mit der niedrigsten Bridge-ID", "Der mit der höchsten Bridge-ID|Der mit den meisten aktiven Ports|Der zuerst eingeschaltete Switch", "Bridge-ID = Priorität (Standard 32768) + MAC-Adresse. Erst entscheidet die kleinere Priorität, bei Gleichstand die kleinere MAC."], ["osi", "Drei Switches haben Priorität 32768 und die MACs aa:…, bb:… und cc:…. Welcher wird Root Bridge?", "Der Switch mit aa:aa:aa:aa:aa:aa", "Der Switch mit cc:cc:cc:cc:cc:cc|Der Switch mit bb:bb:bb:bb:bb:bb|Keiner, die Prioritäten müssen sich unterscheiden", "Bei gleicher Priorität entscheidet die kleinste MAC-Adresse."], ["osi", "Was ist der Root Port eines Switches?", "Sein Port mit den geringsten Kosten zur Root Bridge", "Der Port, über den er BPDUs an alle Nachbarn schickt|Jeder Port der Root Bridge selbst|Der Port mit der höchsten Bandbreite des Switches", "Jeder Switch außer der Root Bridge hat genau einen Root Port. Die Root Bridge selbst hat nur Designated Ports."], ["osi", "Wie viele Designated Ports gibt es bei STP pro Netzsegment (Link)?", "Genau einen", "Genau einen pro Switch|Zwei, an jedem Ende einen|Keinen, nur Root Ports", "Pro Segment gewinnt der Port mit den geringsten Kosten zur Root Bridge. Steht ein Segment-Ende weder als Root noch als Designated Port fest, wird es blockiert."], ["osi", "Switch B (MAC bb…) und Switch C (MAC cc…) sind direkt verbunden und haben gleiche Kosten zur Root Bridge. Welcher Port dieses Links wird blockiert?", "Der Port an Switch C", "Der Port an Switch B|Beide Ports des Links|Keiner, beide leiten weiter", "Bei Kostengleichstand bekommt der Switch mit der kleineren Bridge-ID (hier B) den Designated Port; das andere Ende (C) blockiert."], ["osi", "Welche STP-Pfadkosten hat ein 1-Gbit/s-Link nach den kurzen Werten von IEEE 802.1D?", "4", "19|2|100", "Kurze Werte: 10 Mbit/s = 100, 100 Mbit/s = 19, 1 Gbit/s = 4, 10 Gbit/s = 2. Die Kosten addieren sich auf dem Weg zur Root Bridge."], ["osi", "Welche Aussage zu STP-Pfadkosten stimmt?", "Je höher die Bandbreite, desto geringer die Kosten", "Je höher die Bandbreite, desto höher die Kosten|Die Kosten entsprechen der verlegten Kabellänge in Metern|Die Kosten zählen nur die Switches bis zum Ziel", "Die Kosten sind umgekehrt proportional zur Linkrate. Eine Formel „Bandbreite ÷ Mindestbandbreite“ würde schnelle Links benachteiligen und ist falsch."], ["osi", "In welcher Reihenfolge durchläuft ein Port bei klassischem STP die Zustände?", "Blocking → Listening → Learning → Forwarding", "Listening → Blocking → Learning → Forwarding|Blocking → Learning → Listening → Forwarding|Learning → Listening → Blocking → Forwarding", "Listening und Learning dauern je 15 s, dazu bis zu 20 s Max Age – deshalb 30 bis 50 s Umschaltzeit. RSTP kennt nur Discarding, Learning, Forwarding."], ["osi", "Warum sollte man VLAN 1 nicht für Gäste- oder Nutzerverkehr verwenden?", "Es ist Standard- und oft Native-VLAN aller Ports", "Es unterstützt grundsätzlich kein 802.1Q-Tagging|Es ist für IPv6-Verkehr reserviert|Es darf nur eine einzige MAC-Adresse enthalten", "Ab Werk hängen alle Ports in VLAN 1. Wer es für Gäste nutzt, landet schnell im selben Netz wie Management oder unkonfigurierte Ports."], ["osi", "Wie nennt man Inter-VLAN-Routing über ein einziges getaggtes Kabel mit Subinterfaces?", "Router-on-a-Stick", "Link Aggregation (LACP)|Port Mirroring|Spanning Tree", "Der Router hat pro VLAN ein Subinterface mit eigener IP als Gateway. Alternative im Firmennetz: ein Layer-3-Switch."], ["osi", "Wie wird ein Gerät bei dynamischer VLAN-Zuweisung in der Praxis meist zugeordnet?", "Per 802.1X: RADIUS übergibt die VLAN-ID", "Per DHCP: Der Server wählt das VLAN zur IP|Per STP: Die Root Bridge verteilt die IDs|Per ARP: Der Switch fragt die ID beim Client ab", "Nach erfolgreicher Anmeldung schickt der RADIUS-Server die VLAN-ID mit. So muss niemand eine MAC-Tabelle von Hand pflegen."], ["osi", "Ein Access Point strahlt die SSIDs „Firma“ und „Gast“ aus. Wie wird sein Switchport konfiguriert?", "Als Trunk mit beiden VLANs getaggt", "Als Access-Port im VLAN des Gäste-WLANs|Als Access-Port im VLAN 1|Als gespiegelter Monitor-Port", "Der AP ordnet jeder SSID ein VLAN zu und taggt die Frames. Das Management des APs läuft oft untagged im Native- bzw. Management-VLAN."], ["osi", "Wie groß ist ein TCP-Header?", "20 bis 60 Byte, je nach Optionen", "Immer genau 20 Byte, ohne Ausnahme|Immer genau 40 Byte inkl. Optionen|8 Byte, genauso groß wie bei UDP", "Das Feld „Data Offset“ gibt die Länge in 32-Bit-Wörtern an. Der Optionsteil ist variabel, deshalb haben nicht alle Bereiche eine feste Länge. UDP-Header: fest 8 Byte."], ["osi", "Welches TCP-Flag bricht eine Verbindung sofort ab?", "RST", "FIN|PSH|URG", "FIN beendet geordnet (mit Bestätigung), RST sofort. PSH = Daten direkt an die Anwendung, URG = dringende Daten."], ["osi", "Was schützt die TCP-Flusskontrolle über das Empfangsfenster?", "Den Empfänger vor einem überlaufenden Puffer", "Das Netz vor Überlast auf den Routern unterwegs|Den Sender vor doppelten Bestätigungen|Die Verbindung vor Mitlesen durch Dritte", "Das Netz schützt die Staukontrolle (Congestion Control, z. B. Slow Start). Flusskontrolle und Staukontrolle sind zwei verschiedene Mechanismen."], ["osi", "TCP gilt als „zuverlässig“. Was bedeutet das nicht?", "Die Daten werden verschlüsselt übertragen", "Verlorene Segmente werden neu gesendet|Die Reihenfolge wird wiederhergestellt|Der Empfang wird ausdrücklich vom Ziel bestätigt", "TCP sichert die Zustellung, nicht die Vertraulichkeit. Verschlüsselung kommt durch TLS oder VPN dazu."], ["osi", "Welche Anwendung nutzt klassisch UDP?", "Sprachdaten bei VoIP (RTP)", "Dateidownload per FTP|Webseitenabruf über HTTP/1.1|Dateiübertragung per SFTP", "Echtzeit-Sprache und -Video vertragen keine Wartezeit durch Neusendungen. Große On-Demand-Streamingdienste übertragen dagegen meist per HTTPS über TCP oder per QUIC."], ["osi", "Worauf setzt HTTP/3 auf?", "QUIC über UDP", "TCP mit TLS 1.2|SCTP über IP|UDP ohne Verschlüsselung", "QUIC bringt Zuverlässigkeit und TLS 1.3 selbst mit und spart so Handshakes. HTTP/1.1 und HTTP/2 laufen über TCP."], ["ip", "Bis zu wie vielen Hops gilt ein Netz bei RIPv2 als erreichbar?", "15 – ab 16 unerreichbar", "16 – ab 17 unerreichbar|15 bei v1, 16 bei v2|255 wie die höchste TTL", "RIPv1 und RIPv2 haben dieselbe Grenze: 16 bedeutet „unendlich“. RIPv2 erreicht also nicht weiter entfernte Netze."], ["ip", "Was kann RIPv1 im Gegensatz zu RIPv2 nicht?", "Subnetzmasken in den Updates mitsenden", "Routen nach der Hop-Anzahl bewerten|Updates über UDP Port 520 senden|Mit benachbarten Routern Routen tauschen", "RIPv1 ist klassenbasiert (classful) und kennt kein VLSM. RIPv2 ist klassenlos, nutzt Multicast und kann Updates authentifizieren."], ["ip", "Was unterbindet „Split Horizon“ bei RIP?", "Rückmeldung einer Route an ihren Lieferanten", "Doppelte IP-Adressen in angeschlossenen Netzen|Broadcasts zwischen verschiedenen VLANs|Zu große Pakete auf Strecken mit kleiner MTU", "Ein Router meldet eine Route nicht über die Schnittstelle zurück, über die er sie gelernt hat. Das bremst Routing-Schleifen und das „Count to Infinity“."], ["ip", "Wie ermittelt tracert die Router auf dem Weg zum Ziel?", "TTL schrittweise erhöhen, „Time Exceeded“ auswerten", "Routingtabellen aller Router per SNMP auslesen und listen|Jeder Router hängt seine IP an das Echo an|Vor jedem Router einen ARP-Request schicken", "Paket 1 hat TTL 1 → der erste Router verwirft es und meldet „Time Exceeded“. Dann TTL 2 usw. Windows nutzt ICMP-Echo, Linux-traceroute standardmäßig UDP."], ["ip", "Lassen sich 192.168.1.0/24 und 192.168.2.0/24 zu einem /23 zusammenfassen?", "Nein, erst 192.168.0.0/22 umfasst beide", "Ja, als 192.168.1.0/23 (Netze .1 und .2)|Ja, als 192.168.0.0/23 (Netze .0 bis .2)|Ja, als 192.168.2.0/23 (Netze .1 und .2)", "Ein /23 beginnt immer bei einem geraden dritten Oktett (.0/.1, .2/.3 …). .1 und .2 liegen in verschiedenen /23-Blöcken; ein /22 umfasst .0 bis .3."], ["ip", "Welche Netze fasst die Route 10.0.4.0/22 zusammen?", "10.0.4.0/24 bis 10.0.7.0/24", "10.0.2.0/24 bis 10.0.5.0/24|10.0.4.0/24 bis 10.0.8.0/24|10.0.1.0/24 bis 10.0.4.0/24", "/22 = 4 aufeinanderfolgende /24-Netze, Start an einer durch 4 teilbaren Stelle: 4, 5, 6, 7."], ["ip", "Was passiert beim Supernetting mit der Präfixlänge?", "Sie wird kürzer (weniger Netzbits)", "Sie wird länger (mehr Netzbits)|Sie bleibt gleich, nur die IP ändert sich|Sie springt auf die nächste Klassengrenze", "Beim Subnetting werden Hostbits zu Netzbits (Präfix länger), beim Supernetting umgekehrt. Ziel sind weniger Einträge in Routingtabellen, nicht weniger IP-Adressen."], ["ip", "Wie viele Hosts kann ein klassisches Klasse-B-Netz (/16) adressieren?", "65.534", "65.536|16.384|65.535", "2¹⁶ − 2 = 65.534 (Netz- und Broadcastadresse abziehen). 16.384 = 2¹⁴ ist die Zahl der Klasse-B-Netze."], ["ip", "10.0.0.0/8 soll in 40 Subnetze geteilt werden. Welche Maske passt?", "255.252.0.0 (/14)", "255.248.0.0 (/13)|255.254.0.0 (/15)|255.255.192.0 (/18)", "40 Netze → 2⁶ = 64 ≥ 40 → 6 Bit borgen: /8 + 6 = /14. Pro Netz 2¹⁸ − 2 = 262.142 Hosts. /13 ergäbe nur 32 Netze."], ["ip", "172.16.0.0/16 braucht Subnetze mit mindestens 500 Hosts – möglichst viele davon. Welche Maske?", "255.255.254.0 (/23)", "255.255.255.0 (/24)|255.255.252.0 (/22)|255.255.248.0 (/21)", "500 Hosts brauchen 9 Hostbits (2⁹ − 2 = 510). /24 hätte nur 254, /22 verschenkt Netze."], ["ip", "PC 192.168.3.50/27 erreicht den Server 192.168.3.191/27 nicht. Was ist die Ursache?", "Die Server-IP ist die Broadcastadresse ihres Netzes", "Der Server liegt im selben Netz, nur das Gateway fehlt|Die Server-IP ist die Netzadresse ihres Subnetzes|Ein /27 erlaubt keine Adressen oberhalb von .127", "Blockgröße 32: Netz 192.168.3.160 reicht bis .191 (Broadcast). Zudem liegt der PC in 192.168.3.32/27 – ein Router wäre ohnehin nötig."], ["ip", "Liegen 172.16.2.50 und 172.16.3.20 mit der Maske 255.255.254.0 im selben Netz?", "Ja, beide liegen in 172.16.2.0/23", "Nein, das dritte Oktett unterscheidet sich|Nein, 172.16.3.20 ist eine Broadcastadresse|Nur, wenn das Gateway 172.16.2.1 lautet", "/23 = Blockgröße 2 im dritten Oktett: 172.16.2.0 bis 172.16.3.255. Broadcast ist 172.16.3.255."], ["ip", "Was steht in einem ARP-Request im Feld der gesuchten MAC-Adresse (Target Hardware Address)?", "00:00:00:00:00:00, weil sie noch unbekannt ist", "ff:ff:ff:ff:ff:ff, damit alle Geräte antworten|Die MAC-Adresse des Standardgateways|Die MAC-Adresse, nach der gefragt wird", "Gesucht wird ja gerade die MAC. Im Ethernet-Header steht als Ziel der Broadcast ff:ff:ff:ff:ff:ff, im ARP-Feld dagegen Nullen."], ["ip", "Wie ist eine IPv6-Multicast-Adresse nach dem Präfix ff aufgebaut?", "4 Bit Flags, 4 Bit Scope, 112 Bit Gruppen-ID", "8 Bit Gruppen-ID und 112 Bit Host-ID|16 Bit Scope und 104 Bit Gruppen-ID|4 Bit Version, 4 Bit Klasse, 112 Bit Zieladresse", "Beispiel ff02::1: Flags 0, Scope 2 (Link), Gruppe 1 (alle Knoten). Die Gruppen-ID ist 112 Bit lang, nicht 8 Bit."], ["ip", "Welchen Gültigkeitsbereich hat die Multicast-Adresse ff05::2?", "Site-lokal", "Link-lokal|Global|Interface-lokal", "Scope-Ziffer: 1 Interface, 2 Link, 5 Site, 8 Organisation, e global. ff05::2 = alle Router der Site, ff02::2 = alle Router im Segment."], ["ip", "Welches Präfix umfasst alle Global-Unicast-Adressen korrekt?", "2000::/3", "2001::/3|2001::/16|2000::/16", "Bei /3 zählen nur die ersten 3 Bit (001) – das umfasst 2000 bis 3fff. „2001::/3“ ist keine saubere Präfixangabe, weil hinter Bit 3 nichts gesetzt sein darf."], ["ip", "Ein reines IPv6-Netz soll IPv4-Server im Internet erreichen. Was braucht man?", "NAT64 mit DNS64", "Dual Stack auf allen Servern|Einen 6in4-Tunnel ins LAN|Link-Local-Adressen für alle", "Tunnel transportieren IPv6 über IPv4, übersetzen aber nicht zwischen den Protokollen. Dual Stack hilft nur Geräten, die selbst beide Protokolle sprechen."], ["ip", "Wie lautet FC00:0101:00CA:0000:0000:0000:0001:0000 korrekt gekürzt?", "fc00:101:ca::1:0", "fc00:101:ca::1|fc00:101:ca:0::1:0:0|fc00:101:ca::1::0", "Führende Nullen weg, die Dreier-Nullfolge wird zu ::. Der letzte Null-Block bleibt als 0 stehen, :: darf nur einmal vorkommen."], ["wlan", "Wie überträgt ein WLAN mit 2×2 MIMO zwei räumliche Streams?", "Gleichzeitig auf einem Kanal über mehrere Antennen", "Auf zwei getrennten Kanälen, für jeden Stream einen|Abwechselnd in Zeitschlitzen auf einem Kanal|Ein Stream im 2,4-GHz-, einer im 5-GHz-Band", "Räumliches Multiplexing nutzt verschiedene Ausbreitungswege. Mehr Streams brauchen keine zusätzlichen Kanäle – mehr Kanalbreite (Bonding) ist ein anderes Thema."], ["wlan", "Mit welcher Technik teilt Wi-Fi 6 einen Kanal in Ressourcen-Einheiten für mehrere Clients auf?", "OFDMA", "CSMA/CD|DSSS|MLO", "OFDMA verteilt Teilträger gleichzeitig an mehrere Clients – gut bei vielen kleinen Paketen. MLO ist eine Neuerung von Wi-Fi 7, DSSS stammt aus 802.11b."], ["wlan", "Was ist „Multi-Link Operation“ (MLO) bei Wi-Fi 7?", "Ein Client nutzt mehrere Bänder gleichzeitig", "Mehrere APs teilen sich eine gemeinsame SSID|Mehrere Clients senden gleichzeitig per OFDMA|Ein AP bündelt mehrere LAN-Kabel zum Switch", "Z. B. 5 und 6 GHz parallel: mehr Durchsatz, geringere Latenz und Ausfallsicherheit, falls ein Band gestört ist."], ["wlan", "Wie viele 20-MHz-Kanäle sind im 2,4-GHz-Band in Deutschland nutzbar?", "13", "11|14|19", "11 Kanäle gelten in den USA, Kanal 14 nur in Japan (802.11b). Überlappungsfrei sind 1, 6, 11 – mit reinem OFDM-Betrieb in Europa auch 1, 5, 9, 13."], ["wlan", "Warum stören sich im 2,4-GHz-Band die Kanäle 1 und 4?", "Nur 15 MHz Abstand (5 MHz je Kanal), aber jeder Kanal ist ca. 20 MHz breit", "Kanal 4 ist in Europa für Bluetooth-Geräte reserviert|Die Kanäle 1 bis 4 teilen sich automatisch eine SSID|Kanal 4 sendet mit doppelter Sendeleistung", "Klassisch gelten erst 5 Kanäle Abstand (25 MHz) als überlappungsfrei – daher 1, 6, 11; bei reinem OFDM (20 MHz) reichen in Europa 4 (1, 5, 9, 13). Drei Kanäle Abstand reichen nie."], ["wlan", "Seit wann gibt es WLAN im 5-GHz-Band?", "Seit 1999 mit 802.11a", "Seit 2009 mit 802.11n|Seit 2013 mit 802.11ac|Seit 2003 mit 802.11g", "802.11a nutzte 5 GHz schon 1999; in Deutschland wurde das Band ab 2002 freigegeben. 802.11g funkt nur auf 2,4 GHz."], ["wlan", "Warum halbiert ein einfacher WLAN-Repeater mit nur einem Funkmodul oft den Durchsatz?", "Er empfängt und sendet nacheinander auf einem Kanal", "Er verschlüsselt jedes Paket ein zweites Mal|Er funkt nur im 2,4-GHz-Band mit 11 Mbit/s|Er muss jedes Paket zusätzlich per Kabel zum Router schicken", "Jedes Paket läuft zweimal über dieselbe Funkzelle. Mesh-Systeme mit eigenem Backhaul-Band vermeiden das."], ["wlan", "Was meint „dedizierter Backhaul“ bei Mesh-Systemen?", "Ein eigenes Funkband nur zwischen den Knoten", "Ein eigener Kanal nur für die Gäste-Geräte|Ein eigener Internetanschluss für jeden Knoten|Eine eigene SSID nur für Administratoren", "Tri-Band-Mesh nutzt z. B. ein 5- oder 6-GHz-Band nur für den Verkehr zwischen den Knoten, damit die Clients ihre Bandbreite behalten."], ["wlan", "Wie lange dauert es, 1 GiB über ein WLAN mit 40 Mbit/s zu übertragen, wenn im Mittel 60 % nutzbar sind?", "ca. 5 min 58 s", "ca. 3 min 35 s|ca. 3 min 20 s|ca. 5 min 33 s", "1 GiB = 1.073.741.824 Byte × 8 = 8.589.934.592 bit. Nutzbar 40 × 0,6 = 24 Mbit/s. 8.589.934.592 ÷ 24.000.000 ≈ 358 s = 5 min 58 s. (5 min 33 s ergäbe sich mit 1 GB = 10⁹ Byte.)"], ["fw", "Zwei interne Webserver sollen über eine einzige öffentliche IP auf Port 443 erreichbar sein. Was löst das?", "Ein Reverse-Proxy, der nach Hostnamen verteilt", "Zwei Port-Forwarding-Regeln auf denselben Port 443|Ein zweiter DNS-A-Record auf dieselbe IP|Statisches NAT für beide Server zugleich", "Der Reverse-Proxy liest den Servernamen (SNI bzw. Host-Header) und leitet passend weiter. Port Forwarding kann einen Port pro IP nur an ein Ziel geben."], ["fw", "Was ist Voraussetzung, damit eine Firewall den HTTPS-Verkehr der Clients aufbrechen und prüfen kann?", "Clients vertrauen der CA der Firewall", "Webserver hinterlegen ihre privaten Schlüssel|Clients schalten TLS im Browser ab|Firewall kennt alle Benutzerpasswörter", "Die Firewall stellt sich als Zielserver aus (Man-in-the-Middle mit eigener CA). Rechtlich vorher klären: Datenschutz, Betriebsrat, Ausnahmen etwa für Banking und Gesundheit."], ["fw", "Was ist ein typischer Nachteil einer Application-Layer-Firewall gegenüber einem Paketfilter?", "Mehr Latenz und Rechenlast durch Inhaltsprüfung", "Sie kann Ports und IP-Adressen nicht auswerten|Sie lässt Antwortpakete grundsätzlich nicht zu|Sie funktioniert ausschließlich bei UDP-Verkehr", "Dazu kommen höhere Kosten für Hardware und Lizenzen (Signaturen, Filterlisten) und mehr Pflegeaufwand."], ["fw", "Eine NGFW erkennt eine Anwendung, obwohl diese Port 443 nutzt. Woran?", "An Mustern im Datenstrom (DPI)", "Nur am Zielport im TCP-Header|An der MAC-Adresse des Clients|An der TTL im IP-Header", "Deep Packet Inspection erkennt Anwendungen unabhängig vom Port und kann Teilfunktionen (z. B. Chat ja, Dateiversand nein) getrennt regeln."], ["sec", "Was speichert ein TPM-Chip typischerweise geschützt?", "Kryptografische Schlüssel und Zertifikate", "Die Bootreihenfolge der Laufwerke|Temperatur- und Lüfterwerte des gesamten Systems|Die Firmware-Updates des Mainboards", "Ein TPM hält z. B. den BitLocker-Schlüssel, Zertifikate für VPN oder Windows Hello und kann als virtuelle Smartcard dienen. Windows 11 setzt TPM 2.0 voraus."], ["sec", "Was verhindert Secure Boot?", "Den Start nicht signierter Bootloader und Systeme", "Das Auslesen der Platte, eingebaut in einem anderen PC|Das Ändern des UEFI-Passworts durch Nutzer|Das Mitlesen von Tastatureingaben im Betrieb", "Die UEFI-Firmware prüft vor dem Start die Signatur. So scheitern Bootkits und nicht signierte Systeme, etwa von einem USB-Stick. Gegen Auslesen der Platte hilft Verschlüsselung."], ["sec", "Welche Funktion stellt die UEFI-Firmware selbst bereit – ohne TPM?", "Flexible Bootreihenfolge per Boot-Manager", "Sicheres Speichern des BitLocker-Schlüssels|Bereitstellen einer virtuellen Smartcard|Speichern von Zertifikaten für das VPN", "UEFI verwaltet Booteinträge, GPT-Laufwerke über 2 TB, Hardware-Überwachung und ist die Grundlage für Secure Boot. Schlüssel und Zertifikate gehören ins TPM."], ["sec", "Welche Kombination ist eine echte Zwei-Faktor-Authentifizierung?", "Passwort und Einmalcode aus einer Handy-App", "Passwort und eine zusätzliche Sicherheitsfrage|PIN und ein zweites, längeres Passwort|Benutzername und Passwort mit Sonderzeichen", "Die Faktoren müssen aus verschiedenen Kategorien stammen: Wissen, Besitz, Inhärenz (Biometrie). Passwort und Sicherheitsfrage sind beides Wissen."], ["sec", "Wie viele Kombinationen hat eine fünfstellige PIN aus den Ziffern 0–9 im schlimmsten Fall?", "100.000", "99.999|59.049|1.000.000", "10⁵ = 100.000 (00000 bis 99999). Im Mittel findet ein Angreifer die PIN nach der Hälfte, im schlimmsten Fall erst beim letzten Versuch."], ["sec", "Welchen Nachteil hat eine dauerhafte Kontosperre nach drei Fehlversuchen?", "Angreifer können fremde Konten absichtlich sperren", "Brute-Force-Angriffe laufen dadurch sogar schneller|Passwörter landen dadurch im Klartext im Log|Das Konto lässt sich danach nie mehr entsperren", "Eine Zeitsperre (z. B. 30 Minuten) bremst Brute Force ebenfalls stark, entsperrt sich aber selbst und entlastet den Helpdesk."], ["sec", "Wogegen helfen CAPTCHAs bei Anmeldeformularen?", "Gegen automatisierte Anmeldeversuche durch Bots", "Gegen Phishing-Mails mit gefälschter Absenderadresse|Gegen das Mitlesen im offenen WLAN|Gegen Schadcode in E-Mail-Anhängen", "Ein CAPTCHA soll Menschen von Programmen unterscheiden und bremst so automatisierte Passwortversuche und Massenregistrierungen."], ["sec", "Wie prüft ein Server ein eingegebenes Passwort, wenn er nur Hashwerte speichert?", "Eingabe mit gleichem Salt hashen und vergleichen", "Hash entschlüsseln und im Klartext vergleichen|Hash an den Client schicken und dort prüfen|Nur die Länge und die Zeichenarten der Eingabe prüfen", "Hashes lassen sich nicht zurückrechnen. Stimmen beide Hashwerte überein, war die Eingabe richtig – das Klartext-Passwort liegt nirgends gespeichert."], ["spe", "Was unterscheidet ein Notstromaggregat von einer USV?", "Es startet erst nach Sekunden, läuft dann aber lange", "Es überbrückt unterbrechungsfrei, allerdings nur Minuten|Es filtert lediglich Spannungsspitzen aus dem Netz|Es speist Strom aus Akkus statt aus Kraftstoff", "Die USV springt sofort mit Akkus ein und überbrückt Minuten. Das Aggregat (meist Diesel) braucht einige Sekunden zum Anlaufen. Kombiniert überbrückt die USV genau diese Lücke."], ["dsgvo", "Daten aus der Kursbuchung werden ungefragt für die Werbung eines Partnerunternehmens genutzt. Welcher Grundsatz ist verletzt?", "Zweckbindung", "Speicherbegrenzung|Richtigkeit|Rechenschaftspflicht", "Daten dürfen nur für die bei der Erhebung festgelegten Zwecke verwendet werden. Für den neuen Zweck bräuchte es eine eigene Rechtsgrundlage, hier eine Einwilligung."], ["dsgvo", "Wie viele Rechtsgrundlagen für eine Verarbeitung nennt Art. 6 Abs. 1 DSGVO?", "Sechs", "Zwei|Vier|Sieben", "a) Einwilligung, b) Vertrag oder vorvertragliche Maßnahmen, c) rechtliche Pflicht, d) lebenswichtige Interessen, e) öffentliche Aufgabe, f) berechtigtes Interesse."], ["dsgvo", "Was bedeutet der Grundsatz „Rechtmäßigkeit“?", "Jede Verarbeitung braucht eine Rechtsgrundlage", "Jede Verarbeitung braucht eine Einwilligung der Person|Die Daten müssen sachlich richtig und aktuell sein|Die Daten dürfen nur im Inland verarbeitet werden", "Die Einwilligung ist nur eine von sechs Grundlagen. Richtigkeit ist ein eigener Grundsatz."], ["dsgvo", "Eine Interessentin bittet per Mail um ein Kursangebot. Worauf stützt sich das Speichern von Name und Mailadresse für das Angebot?", "Vorvertragliche Maßnahme auf Anfrage (Art. 6 Abs. 1 b)", "Berechtigtes Interesse an Werbung (Art. 6 Abs. 1 f)|Rechtliche Verpflichtung des Studios (Art. 6 Abs. 1 c)|Ausdrückliche schriftliche Einwilligung (Art. 7)", "Wer selbst ein Angebot anfragt, löst eine vorvertragliche Maßnahme aus. Eine gesonderte Einwilligung ist dafür nicht nötig – für spätere Werbung schon."], ["dsgvo", "Eine Interessentin fragt per Mail ein Kursangebot an. Das Studio ergänzt ihre Daten um Postadresse und Social-Media-Profile. Wie ist das zu bewerten?", "Unzulässig – für das Angebot nicht erforderlich", "Zulässig – öffentlich sichtbare Daten sind frei nutzbar|Zulässig – solange alles verschlüsselt gespeichert wird|Zulässig – weil sie selbst den Kontakt gesucht hat", "Für ein Angebot per Mail braucht es weder Postadresse noch Profile. Das verletzt Datenminimierung und Zweckbindung."], ["dsgvo", "Was bedeutet „Verbot mit Erlaubnisvorbehalt“ im Datenschutz?", "Verboten, außer eine Rechtsgrundlage erlaubt es", "Erlaubt, bis die betroffene Person widerspricht|Nur Behörden erlaubt, Unternehmen grundsätzlich nie|Nur mit schriftlicher Einwilligung überhaupt erlaubt", "Grundsätzlich ist jede Verarbeitung personenbezogener Daten untersagt, solange keiner der Tatbestände aus Art. 6 (bzw. Art. 9 bei Gesundheitsdaten) greift."], ["dsgvo", "Was meint „Privacy by Design“ (Art. 25 Abs. 1 DSGVO)?", "Datenschutz schon bei der Entwicklung einplanen", "Datenschutzerklärung optisch ansprechend gestalten|Datenschutz später per Software-Update nachrüsten|Nur zertifizierte Software im Betrieb einsetzen", "Beispiele: Pseudonymisierung, Verschlüsselung, Löschfristen und Rollenrechte gleich in die Architektur einbauen."], ["dsgvo", "Ein Unternehmen wählt einen Cloud-Standort für Kundendaten. Welche Region ist datenschutzrechtlich am einfachsten?", "EU bzw. EWR", "Nordamerika|Asien|Südamerika", "Innerhalb von EU/EWR gilt die DSGVO unmittelbar. Für Drittländer braucht es einen Angemessenheitsbeschluss oder Garantien wie Standardvertragsklauseln."], ["dsgvo", "Was erlaubt ein Angemessenheitsbeschluss der EU-Kommission?", "Übermittlung in das Drittland ohne Zusatzgarantien", "Verarbeitung ohne Rechtsgrundlage innerhalb der EU|Verzicht auf einen Datenschutzbeauftragten|Speicherung über die gesetzlichen Löschfristen hinaus", "Beispiel: EU-US Data Privacy Framework (2023) für zertifizierte US-Unternehmen. Ohne Beschluss sind z. B. Standardvertragsklauseln nötig."], ["dsgvo", "Namen werden durch Kundennummern ersetzt, die Zuordnungstabelle liegt getrennt. Was ist das?", "Pseudonymisierung – die DSGVO gilt weiter", "Anonymisierung – die DSGVO gilt nicht mehr|Verschlüsselung – die Daten gelten als gelöscht|Aggregation – nur Summenwerte bleiben übrig", "Mit der Tabelle lässt sich der Personenbezug wiederherstellen. Erst wenn das niemand mehr kann, sind Daten anonym."], ["dsgvo", "Ein Autovermieter zählt ohne Personenbezug, in welcher Stadt zwischen 16 und 20 Uhr die meisten Fahrten starten. Ist das zulässig?", "Ja, anonyme Statistik fällt nicht unter die DSGVO", "Nein, Bewegungsdaten sind grundsätzlich immer verboten|Nur mit Einwilligung jedes einzelnen Kunden|Nur, wenn die Aufsichtsbehörde vorher zustimmt", "Anders bei Kundenprofilen aus Bewegungs- und Kreditkartendaten für Werbung: Dafür bräuchte es eine Einwilligung."], ["dsgvo", "Ein Fitnessstudio will Gesundheitsdaten seiner Kunden an eine Universität für eine Studie geben. Was ist nötig?", "Ausdrückliche Einwilligung oder Anonymisierung", "Ein Hinweis im Aushang am Empfang reicht aus|Ein AV-Vertrag mit der Universität reicht aus|Nichts, denn Forschung ist immer und überall zulässig", "Gesundheitsdaten sind besondere Kategorien nach Art. 9. Die Uni verarbeitet für eigene Zwecke, ist also kein Auftragsverarbeiter."], ["dsgvo", "Was gehört bei Videoüberwachung in Geschäftsräumen dazu?", "Gut sichtbarer Hinweis und kurze Speicherdauer", "Unterschriebene Einwilligung jedes einzelnen Kunden|Speicherung mindestens ein Jahr als Beweis|Meldung jeder Kamera beim Ordnungsamt", "Grundlage ist meist das berechtigte Interesse (Art. 6 Abs. 1 f), z. B. Diebstahlschutz. Aufnahmen nur so lange wie nötig (oft 48–72 Stunden), Ruhebereiche ausnehmen."], ["dsgvo", "Welche Maßnahmen nennt Art. 32 DSGVO ausdrücklich als Beispiele?", "Pseudonymisierung und Verschlüsselung", "Videoüberwachung aller Büros|Biometrische Zutrittskontrolle|Jährlicher Passwortwechsel für alle Konten", "Dazu: Vertraulichkeit, Integrität, Verfügbarkeit und Belastbarkeit sichern, Daten rasch wiederherstellen können und Maßnahmen regelmäßig überprüfen."], ["dsgvo", "Binnen welcher Frist muss ein Unternehmen eine Auskunftsanfrage grundsätzlich beantworten?", "Innerhalb eines Monats", "Innerhalb von 72 Stunden|Innerhalb von 14 Tagen|Innerhalb von drei Monaten", "Art. 12 Abs. 3: ein Monat, bei komplexen Fällen um zwei weitere Monate verlängerbar. 72 Stunden ist die Meldefrist für Datenpannen."], ["wiso", "Welche Gleichung gilt im Kreislauf mit Banken für das Einkommen der Haushalte?", "Y = C + S", "Y = C − S|Y = C + I + S|Y = S − C", "Einkommen wird entweder konsumiert (C) oder gespart (S)."], ["wiso", "Wann ist der erweiterte Wirtschaftskreislauf im Gleichgewicht?", "Wenn Ersparnis und Investitionen gleich hoch sind", "Wenn Konsum und Ersparnis gleich hoch sind|Wenn der Staat keine Schulden macht|Wenn Exporte und Importe gleich hoch sind", "S = I: Was gespart wird, fließt über die Banken als Investition zurück."], ["wiso", "Ab welchem Modell spricht man von einer offenen Volkswirtschaft?", "Wenn das Ausland einbezogen ist (5 Sektoren)", "Sobald der Staat dazukommt (4 Sektoren)|Sobald Banken dazukommen (3 Sektoren)|Schon im einfachen Kreislauf", "Offen = Handel mit dem Ausland. Das 4-Sektoren-Modell mit Staat ist noch geschlossen."], ["wiso", "Ein Haushalt hat 3.000 € verfügbares Einkommen und gibt 2.550 € für Konsum aus. Wie hoch ist die Ersparnis?", "450 €", "550 €|5.550 €|2.550 €", "Ersparnis = verfügbares Einkommen − Konsumausgaben = 3.000 − 2.550."], ["wiso", "Was unterscheidet das BIP vom BNE?", "BIP: im Inland erzeugt (Inlandsprinzip) – BNE: von Inländern verdient (Inländerprinzip)", "BIP und BNE sind zwei Namen für dieselbe Kennzahl|BIP: von Inländern verdient – BNE: im Inland erzeugt|Das BNE enthält zusätzlich alle Vorleistungen", "Das frühere Bruttosozialprodukt heißt heute BNE; das BIP ist eine andere Größe."], ["wiso", "Eine Grenzgängerin wohnt in Deutschland und arbeitet in der Schweiz. Wo zählt ihr Einkommen?", "Zum deutschen BNE und zum Schweizer BIP", "Zum deutschen BIP und zum Schweizer BNE|Nur zum deutschen BIP|Nur zum Schweizer BNE", "BNE = Inländerprinzip (Wohnsitz), BIP = Inlandsprinzip (Ort der Produktion)."], ["wiso", "Was bedeutet „reales“ BIP?", "Preisbereinigt, also ohne den Einfluss der Inflation", "In aktuellen Preisen gerechnet|Ohne Steuern und Sozialabgaben|Ohne die Leistungen des Staates", "Nominal = aktuelle Preise; real = in Preisen eines Basisjahres."], ["wiso", "Wer erstellt in Deutschland die Volkswirtschaftliche Gesamtrechnung?", "Das Statistische Bundesamt", "Die Deutsche Bundesbank|Das Bundesfinanzministerium|Die Industrie- und Handelskammer", "Destatis in Wiesbaden veröffentlicht BIP und VGR."], ["wiso", "Welche Einkommensart gehört zum Produktionsfaktor Boden?", "Pacht bzw. Grundrente", "Zins|Lohn|Gewinn", "Arbeit → Lohn, Boden → Rente/Pacht/Miete, Kapital → Zins, Unternehmer → Gewinn."], ["wiso", "Was ist die gesetzliche Altersrente volkswirtschaftlich?", "Ein Transfereinkommen im Umlageverfahren", "Ein Faktoreinkommen für den Produktionsfaktor Boden|Die Auszahlung der eigenen angesparten Beiträge|Ein Zinseinkommen aus Kapital", "Die heute Arbeitenden zahlen die heutigen Renten (Generationenvertrag)."], ["wiso", "Wie heißt das Einkommen des Unternehmers aus seiner unternehmerischen Tätigkeit?", "Gewinn", "Unternehmerlohn|Gehalt|Rendite", "Unternehmerlohn ist ein kalkulatorischer Kostenposten, die Einkommensart ist der Gewinn."], ["wiso", "Welche Zahlung ist eine Transferleistung des Staates an Haushalte?", "Kindergeld", "Subvention für ein Unternehmen|Lohn eines Beamten|Zinsen auf Staatsanleihen", "Transfers sind Zahlungen ohne Gegenleistung. Beamtenlohn ist Entgelt für Arbeit, Subventionen gehen an Unternehmen."], ["wiso", "Welche Marktform ist die OPEC?", "Angebotsoligopol mit Absprachen (Kartell)", "Angebotsmonopol|Polypol|Nachfrageoligopol", "Mehrere Ölstaaten sprechen Fördermengen ab – wenige Anbieter, viele Nachfrager."], ["wiso", "Ein Bundesland ist der einzige Käufer von Spezialfahrzeugen, die drei Hersteller anbieten. Welche Marktform?", "Beschränktes Nachfragemonopol", "Angebotsoligopol|Zweiseitiges Monopol|Polypol", "Ein Nachfrager, wenige Anbieter."], ["wiso", "Woran erkennt man einen Verkäufermarkt?", "Die Nachfrage ist größer als das Angebot", "Das Angebot ist größer als die Nachfrage|Es gibt sehr viele Anbieter|Die Preise fallen dauerhaft", "Knappe Ware gibt den Verkäufern Marktmacht."], ["wiso", "Warum ist ein Polypol nicht automatisch vollständige Konkurrenz?", "Dafür muss zusätzlich ein vollkommener Markt vorliegen", "Weil im Polypol nur ein Anbieter existiert|Weil im Polypol der Staat die Preise festlegt|Weil vollständige Konkurrenz nur im Oligopol vorkommt", "Gleichartige Güter, Markttransparenz, keine Vorlieben – sonst gibt es Preisspielräume."], ["wiso", "Welche Aussage passt zum Oligopol?", "Die Anbieter beobachten sich und reagieren auf die Preise der anderen", "Der Anbieter ist reiner Preisnehmer|Es gibt keinerlei Wettbewerb|Ein einzelner Anbieter beliefert den ganzen Markt", "Preis- und Absatzpolitik sind voneinander abhängig; Preiskampf oder Absprachen sind möglich."], ["wiso", "Wer überwacht in Deutschland das Verbot von Preisabsprachen?", "Das Bundeskartellamt", "Die Bundesnetzagentur|Das Statistische Bundesamt|Die Industrie- und Handelskammer", "Das Bundeskartellamt verfolgt Kartelle und prüft Fusionen."]], "wf": [["hw", "L3-Cache ist schneller als L1-Cache.", false, "Umgekehrt: L1 ist am schnellsten."], ["hw", "DDR-RAM überträgt zweimal pro Takt.", true, "Daher „Double Data Rate“."], ["hw", "DDR6 ist ein fertiger Standard für Arbeitsspeicher.", false, "DDR6 ist noch in Entwicklung. GDDR6 ist Grafikspeicher."], ["hw", "Jede PCIe-Generation verdoppelt ungefähr die Geschwindigkeit.", true, "Faustregel aus der Tabelle."], ["hw", "USB 3.0-Buchsen sind meist blau.", true, "USB 2.0 schwarz, 3.0 blau, 3.1 türkis."], ["hw", "DRAM muss ständig aufgefrischt werden.", true, "Deshalb dynamisch – SRAM nicht."], ["spe", "RAID ersetzt ein Backup.", false, "RAID schützt nur vor Plattenausfall."], ["spe", "Bei differenzieller Sicherung braucht man zur Wiederherstellung Vollsicherung + letzte differenzielle.", true, "Genau das ist der Vorteil gegenüber inkrementell."], ["spe", "Eine Offline-USV schaltet ohne Unterbrechung um.", false, "Offline/VFD: ca. 2–10 ms. 0 ms nur bei Online/VFI."], ["spe", "Ein NAS arbeitet auf Dateiebene.", true, "SMB/NFS im normalen LAN."], ["spe", "RAID 1 nutzt 50 % der Kapazität.", true, "Spiegelung."], ["spe", "RAID 0 verträgt den Ausfall einer Platte.", false, "Bei RAID 0 darf keine Platte ausfallen."], ["osi", "Ein Switch arbeitet auf Schicht 2.", true, "Mit MAC-Adressen."], ["osi", "IMAPS nutzt Port 999.", false, "Richtig ist 993."], ["osi", "ICMP sendet fehlerhafte Pakete erneut.", false, "ICMP meldet nur. Neusenden macht TCP."], ["osi", "Cat 7 schafft offiziell 40 Gbit/s.", false, "Cat 7 offiziell 10 Gbit/s; 25/40 Gbit/s erst mit Cat 8 (bis 30 m)."], ["osi", "Multimode hat mehr Bandbreite über Distanz als Singlemode.", false, "Umgekehrt: Singlemode."], ["osi", "Ohne NAT bleiben die IP-Adressen auf dem Weg durchs Netz gleich.", true, "Die MAC-Adressen ändern sich an jedem Router."], ["osi", "Ethernet ist heute ein Beispiel für Bus-Topologie.", false, "Nur altes Koax-Ethernet; heute Stern."], ["osi", "Die TTL wird an jedem Router um 1 kleiner.", true, "Bei 0 wird das Paket verworfen."], ["osi", "UDP bestätigt jedes Paket mit ACK.", false, "Das macht TCP. UDP hat nur eine Prüfsumme."], ["osi", "Port 22 gehört zu SSH und SFTP.", true, "Port 23 wäre Telnet."], ["osi", "RSTP reagiert deutlich schneller als klassisches STP.", true, "Sekunden statt ca. 30–50 s."], ["osi", "Ein Access-Port überträgt mehrere VLANs getaggt.", false, "Das ist ein Trunk-Port."], ["osi", "RIP erlaubt maximal 15 Hops.", true, "Metrik = Hop-Anzahl."], ["osi", "Up- und Download gleich schnell nennt man symmetrisch.", true, "Nicht „synchron“ – Fachbegriff symmetrisch/asymmetrisch."], ["ip", "172.16.0.0/16 ist der komplette private Klasse-B-Bereich.", false, "Richtig ist /12 (bis 172.31.255.255)."], ["ip", "Ein /26 hat 62 nutzbare Hosts.", true, "2⁶ − 2 = 62."], ["ip", "Bei IPv6 darf :: mehrmals in einer Adresse vorkommen.", false, "Nur einmal pro Adresse."], ["ip", "Jedes IPv6-LAN bekommt standardmäßig ein /64.", true, "Erste 64 Bit Netz, letzte 64 Bit Interface-ID."], ["ip", "127.0.0.1 ist die Loopback-Adresse.", true, "IPv6: ::1."], ["ip", "Die MAC-Gerätenummer sind die letzten 25 Bit.", false, "Die letzten 24 Bit (6 Hex-Ziffern)."], ["wlan", "Eine versteckte SSID schützt zuverlässig vor Angreifern.", false, "Jedes Tool findet sie."], ["wlan", "WPA2 nutzt AES.", true, "Sicher bei starkem Passwort."], ["wlan", "2,4 GHz hat mehr Reichweite durch Wände als 5 GHz.", true, "Dafür langsamer und mehr Störungen."], ["wlan", "Bei 802.1X ist der Client der Supplicant.", true, "AP = Authenticator, RADIUS = Authentication Server."], ["wlan", "Gleicher Kanal ist im 2,4-GHz-Band schlimmer als ein Nachbarkanal.", false, "Nachbarkanäle erzeugen echte Interferenzen – viel schlimmer."], ["wlan", "RADIUS kann einem Client dynamisch ein VLAN zuweisen.", true, "Auch ACLs oder Zeitfenster."], ["dienste", "DHCP-Option 6 ist der DNS-Server.", true, "3 = Gateway, 15 = Domänenname."], ["dienste", "Ein CNAME-Record ist ein Alias.", true, "PTR = Reverse."], ["dienste", "SNMP heißt Simple Network Monitoring Protocol.", false, "Management, nicht Monitoring."], ["dienste", "Es gibt 13 Root-Server-Kennungen (A bis M).", true, "Root „.“ ist die Spitze der DNS-Hierarchie."], ["dienste", "Zwischen Domänen eines Forests muss man Trusts manuell einrichten.", false, "Innerhalb eines Forests automatisch, zwischen Forests ma ch · c rechtliche Pflicht · d lebenswichtige Interessen · e öffentliche Aufgabe · f berechtigtes Interesse"], ["dsgvo", "Anonym vs. pseudonym", "Pseudonym: Bezug über getrennte Zuordnung wiederherstellbar → DSGVO gilt\nAnonym: Bezug für niemanden mehr herstellbar → DSGVO gilt nicht"], ["spe", "USV vs. Notstromaggregat", "USV: Akkus, sofort (online ohne Umschaltzeit), Minuten\nAggregat: Diesel, startet nach Sekunden, Stunden bis Tage\nKombination: USV überbrückt den Anlauf"], ["wiso", "Einfacher Wirtschaftskreislauf", "2 Sektoren (Haushalte, Unternehmen), geschlossen, ohne Sparen: Y = C. Geld- und Güterströme laufen entgegengesetzt."], ["wiso", "Erweiterter Wirtschaftskreislauf", "+ Banken als Kapitalsammelstellen: Y = C + S, Gleichgewicht bei S = I."], ["wiso", "4- und 5-Sektoren-Modell", "4: + Staat (Steuern, Transfers, Subventionen) – geschlossen. 5: + Ausland (Exporte, Importe) – offen."], ["wiso", "BIP vs. BNE", "BIP: Inlandsprinzip (im Inland erzeugt). BNE (früher BSP): Inländerprinzip (von Inländern verdient)."], ["wiso", "Faktoreinkommen", "Arbeit → Lohn · Boden → Rente/Pacht/Miete · Kapital → Zins · Unternehmer → Gewinn"], ["wiso", "Marktformenschema", "Anbieter × Nachfrager (einer/wenige/viele): Monopol, Oligopol, Polypol – jeweils als Angebots- oder Nachfrageform, plus zweiseitige Formen."]], "zuordnen": [{"name": "Ports & Dienste", "t": "osi", "paare": [["22", "SSH / SFTP"], ["25", "SMTP"], ["53", "DNS"], ["67/68", "DHCP"], ["80", "HTTP"], ["443", "HTTPS"], ["3389", "RDP"], ["88", "Kerberos"], ["389", "LDAP"], ["636", "LDAPS"], ["445", "SMB"], ["123", "NTP"], ["161", "SNMP"], ["993", "IMAPS"], ["995", "POP3S"], ["587", "SMTP Submission"], ["1194", "OpenVPN"], ["51820", "WireGuard"], ["1812", "RADIUS"], ["5060", "SIP"], ["3306", "MySQL"], ["1433", "MS SQL Server"], ["9100", "Drucker RAW/JetDirect"], ["69", "TFTP"]]}, {"name": "Was gehört auf welche OSI-Schicht?", "t": "osi", "paare": [["Hub", "Schicht 1"], ["Repeater", "Schicht 1"], ["Switch", "Schicht 2"] "Schutzziel & Maßnahme", "t": "sec", "paare": [["Hashwert", "Integrität"], ["BitLocker", "Vertraulichkeit (gespeicherte Daten)"], ["RAID / USV", "Verfügbarkeit"], ["2FA", "Authentizität"], ["Digitale Signatur", "Integrität + Authentizität"], ["HTTPS", "Vertraulichkeit (Übertragung)"]]}, {"name": "Cloud & XaaS", "t": "virt", "paare": [["SaaS", "Microsoft 365"], ["PaaS", "Entwicklungs- und Laufzeitplattform"], ["IaaS", "VMs, Storage"], ["FaaS", "Funktionen ereignisbasiert"], ["CaaS", "Container"], ["DBaaS", "Datenbank"], ["DRaaS", "Disaster Recovery"], ["DaaS", "virtuelle Desktops"], ["IDaaS", "Identitäten"], ["NaaS", "VPN, Routing, Firewall"], ["Hybrid Cloud", "Private + Public verbunden"], ["Multi Cloud", "mehrere Public-Anbieter"]]}, {"name": "Virtualisierung", "t": "virt", "paare": [["VMware ESXi", "Typ-1-Hypervisor"], ["VirtualBox", "Typ-2-Hypervisor"], ["Xen (PV-Modus)", "Paravirtualisierung"], ["Docker", "Container"], ["App-V", "Applikationsvirtualisierung"], ["VMware NSX", "Netzwerkvirtualisierung"], ["vSAN", "Storage-Virtualisierung"], ["BSD Jails", "OS-Virtualisierung"]]}, {"name": "WLAN-Standards", "t": "wlan", "paare": [["802.11b", "2,4 GHz, 11 Mbit/s"], ["802.11a", "5 GHz, 54 Mbit/s"], ["802.11g", "2,4 GHz, 54 Mbit/s"], ["802.11n", "Wi-Fi 4, 600 Mbit/s"], ["802.11ac", "Wi-Fi 5, nur 5 GHz"], ["802.11ax", "Wi-Fi 6/6E"], ["802.11ad", "60 GHz, wenige Meter"], ["WPA3", "SAE"], ["WPA2", "AES"], ["WPA", "TKIP"]]}, {"name": "DNS & DHCP", "t": "dienste", "paare": [["A", "IPv4-Adresse"], ["AAAA", "IPv6-Adresse"], ["MX", "Mailserver"], ["CNAME", "Alias"], ["PTR", "Reverse-Lookup"], ["SRV", "Dienst finden (z. B. DC)"], ["Option 3", "Gateway"], ["Option 6", "DNS-Server"], ["Option 15", "Domänenname"], ["Option 42", "NTP-Server"]]}, {"name": "ITIL & Lizenzen", "t": "service", "paare": [["Incident", "Drucker druckt nicht"], ["Problem", "Treiber stürzt immer wieder ab"], ["Change", "Firmware-Update ausrollen"], ["Service Request", "Passwort zurücksetzen"], ["OEM", "an ein Gerät gebunden"], ["Retail", "übertragbar"], ["Subscription", "monatlich/jährlich"], ["GPL", "Copyleft"], ["OLA", "interne Vereinbarung"], ["UC", "Vertrag mit Lieferant"]]}, {"name": "Hardware-Werte", "t": "hw", "paare": [["DDR3", "1,5 V"], ["DDR4", "1,2 V"], ["DDR5", "1,1 V"], ["DDR2", "1,8 V"], ["USB 2.0", "480 Mbit/s"], ["USB 3.0", "5 Gbit/s"], ["USB4", "40 Gbit/s"], ["PCIe 3.0", "8 GT/s"], ["PCIe 5.0", "32 GT/s"], ["Mini-ITX", "17 × 17 cm"], ["ATX", "30,5 × 24,4 cm"]]}, {"name": "Hex ↔ Dezimal", "t": "ip", "paare": [["A", "10"], ["C", "12"], ["F", "15"], ["C0", "192"], ["FF", "255"], ["80", "128"], ["E0", "224"], ["10", "16"], ["1F", "31"], ["64", "100"]]}, {"name": "Handelskalkulation", "t": "hk", "paare": [["Listeneinkaufspreis − Rabatt", "Zieleinkaufspreis"], ["Zieleinkaufspreis − Skonto", "Bareinkaufspreis"], ["Bareinkaufspreis + Bezugskosten", "Einstandspreis"], ["Einstandspreis + Handlungskosten", "Selbstkostenpreis"], ["Selbstkosten + Gewinn", "Barverkaufspreis"], ["Barverkaufspreis + Kundenskonto", "Zielverkaufspreis"], ["Zielverkaufspreis + Kundenrabatt", "Nettoverkaufspreis"], ["Nettoverkaufspreis + USt", "Bruttoverkaufspreis"]]}, {"name": "Kabel & Header-Felder", "t": "osi", "paare": [["10BaseT", "10 Mbit/s, Cat 3"], ["100BaseT", "100 Mbit/s, Cat 5"], ["10GBaseT", "10 Gbit/s, Cat 6A"], ["UTP", "ohne Schirmung"], ["TTL", "verhindert endloses Kreisen"], ["Fragment Offset", "Position des Fragments"], ["Fenstergröße", "Bytes bis zur Bestätigung"], ["FCS", "Prüfsumme im Ethernet-Frame"], ["Sequenznummer", "Reihenfolge der TCP-Segmente"], ["Type of Service", "Priorität des Pakets"]]}, {"name": "Berühmte Angriffe", "t": "sec", "paare": [["ILOVEYOU (2000)", "Wurm per E-Mail"], ["Code Red (2001)", "Wurm auf Webservern"], ["Zeus (ab 2007)", "Banking-Trojaner"], ["Dyn (2016)", "DDoS mit IoT-Botnetz"], ["WannaCry (2017)", "Ransomware"], ["Honeypot", "Köder für Angreifer"], ["Quarantäne", "verdächtige Datei isolieren"], ["Heuristik", "verdächtiges Verhalten erkennen"]]}, {"name": "WAN, DSL & Dienste", "t": "dienste", "paare": [["ADSL", "asymmetrisch, bis 8/1 Mbit/s"], ["SDSL", "symmetrisch"], ["VDSL2", "bis 100/40 Mbit/s"], ["T1 / E1", "Standleitung"], ["BOOTP", "Vorgänger von DHCP"], ["WINS", "NetBIOS-Namensauflösung"], ["DHCP-Option 66", "TFTP-Server für PXE"], ["Monitoring & Logging", "Managementdienste"], ["DNS, DHCP, NTP", "Infrastrukturdienste"], ["Mail, Teams, Dateiablage", "Kommunikationsdienste"]]}], "pruefungen": [{"titel": "Steuerbüro Becker: neue Arbeitsplätze", "minuten": 30, "szenario": "Die Steuerkanzlei Becker (8 Mitarbeiter) bekommt neue Arbeitsplätze und einen Server. Das vorhandene Netz 192.168.10.0/24 soll in 4 gleich große Subnetze (Mitarbeiter, Server, Drucker/VoIP, Gäste) aufgeteilt werden. Die Kanzlei verarbeitet Mandantendaten und legt großen Wert auf Datensicherheit.", "aufgaben": [{"frage": "Das Netz 192.168.10.0/24 soll in 4 gleich große Subnetze geteilt werden. Geben Sie die neue Subnetzmaske, die Anzahl nutzbarer Hosts je Subnetz sowie Netzadresse und Broadcastadresse des 2. Subnetzes an.", "punkte": 6, "loesung": "4 Subnetze → 2 Bit borgen → /26 = 255.255.255.192\nHost-Bits 6 → 2⁶ − 2 = 62 Hosts je Subnetz\nBlockgröße 64: 2. Subnetz = 192.168.10.64 bis Broadcast 192.168.10.127", "kriterien": [["Maske 255.255.255.192 bzw. /26", 2], ["62 nutzbare Hosts", 1], ["Netzadresse 192.168.10.64", 1.5], ["Broadcast 192.168.10.127", 1.5]]}, {"frage": "Die Kanzlei möchte täglich sichern, aber möglichst wenig Speicher verbrauchen. Erläutern Sie den Unterschied zwischen inkrementeller und differenzieller Sicherung und nennen Sie, was jeweils zur Wiederherstellung benötigt wird.", "punkte": 4, "loesung": "Inkrementell: sichert die Änderungen seit der letzten Sicherung (egal welcher). Wiederherstellung: Vollsicherung + alle Inkremente der Reihe nach.\nDifferenziell: sichert die Änderungen seit der letzten Vollsicherung, wächst täglich. Wiederherstellung: Vollsicherung + letzte differenzielle Sicherung.", "kriterien": [["Inkrementell: seit letzter Sicherung", 1], ["Wiederherstellung: Voll + alle Inkremente", 1], ["Differenziell: seit letzter Vollsicherung", 1], ["Wiederherstellung: Voll + letzte Differenzielle", 1]]}, {"frage": "Nennen Sie die 3-2-1-Regel und erklären Sie, warum eine Kopie außer Haus bzw. offline liegen sollte.", "punkte": 3, "loesung": "3 Kopien der Daten, auf 2 verschiedenen Medien, 1 Kopie außer Haus.\nDie externe bzw. Offline-Kopie schützt vor Brand, Diebstahl und Ransomware, die alle Daten im Netz verschlüsseln könnte.", "kriterien": [["3 Kopien, 2 Medien, 1 außer Haus", 2], ["Begründung: Brand/Diebstahl/Ransomware", 1]]}, {"frage": "Nennen Sie drei technisch-organisatorische Maßnahmen (TOM) zum Schutz der Mandantendaten und ordnen Sie jede der passenden Kontrolle zu.", "punkte": 3, "loesung": "Beispiele: abgeschlossener Serverraum → Zutrittskontrolle; Anmeldung mit MFA → Zugangskontrolle; NTFS-Rechte nach Need-to-know → Zugriffskontrolle; VPN/HTTPS → Weitergabekontrolle; Protokollierung → Eingabekontrolle; Backup/USV → Verfügbarkeitskontrolle; AV-Vertrag mit Dienstleister → Auftragskontrolle.", "kriterien": [["1. Maßnahme mit richtiger Kontrolle", 1], ["2. Maßnahme mit richtiger Kontrolle", 1], ["3. Maßnahme mit richtiger Kontrolle", 1]]}, {"frage": "Für den Server soll eine USV beschafft werden. Welchen USV-Typ empfehlen Sie (mit Begründung)? Wie viel Wirkleistung liefert eine USV mit 1500 VA bei cos φ = 0,6?", "punkte": 4, "loesung": "Online-USV / Doppelwandler (VFI): Der Strom läuft immer über Gleich- und Wechselrichter (Akku am Zwischenkreis), Umschaltzeit 0 ms, gleicht Störungen aus – geeignet für Server.\nWirkleistung = 1500 VA × 0,6 = 900 W.", "kriterien": [["Online / Doppelwandler (VFI)", 1], ["Begründung: 0 ms, immer über Wechselrichter", 1], ["Rechenweg VA × cos φ", 1], ["Ergebnis 900 W", 1]]}]}, {"titel": "Malerbetrieb Kraus: Beschaffung", "minuten": 30, "szenario": "Der Malerbetrieb Kraus braucht fünf neue Büro-PCs inklusive Office. Sie sollen zwei Angebote vergleichen, die Finanzierung beraten und für Ihren eigenen Betrieb den Verkaufspreis eines Monitors kalkulieren.", "aufgaben": [{"frage": "Berechnen Sie die Nutzwertanalyse und nennen Sie das bessere Angebot.\nGewichtung: Preis 40 %, Leistung 35 %, Service 25 %.\nAngebot A: Preis 8, Leistung 6, Service 7 Punkte.\nAngebot B: Preis 6, Leistung 9, Service 8 Punkte.", "punkte": 5, "loesung": "A: 8 × 0,40 + 6 × 0,35 + 7 × 0,25 = 3,2 + 2,1 + 1,75 = 7,05\nB: 6 × 0,40 + 9 × 0,35 + 8 × 0,25 = 2,4 + 3,15 + 2,0 = 7,55\n→ Angebot B hat den höheren Nutzwert.", "kriterien": [["Rechenweg Punkte × Gewichtung", 1], ["A = 7,05", 1.5], ["B = 7,55", 1.5], ["Entscheidung für B", 1]]}, {"frage": "Herr Kraus überlegt, die PCs zu leasen statt zu kaufen. Nennen Sie je einen Vorteil und einen Nachteil des Leasings gegenüber dem Kauf.", "punkte": 4, "loesung": "Vorteile: kein hoher Betrag auf einmal (Liquidität), feste planbare Raten, Raten als Betriebsausgaben absetzbar, Austausch nach Vertragsende.\nNachteile: insgesamt meist teurer, Eigentum bleibt beim Leasinggeber, Bindung an die Vertragslaufzeit.", "kriterien": [["Sinnvoller Vorteil", 2], ["Sinnvoller Nachteil", 2]]}, {"frage": "Kalkulieren Sie für einen Monitor: Listeneinkaufspreis 800 €, Lieferantenrabatt 10 %, Lieferantenskonto 2 %, Bezugskosten 15 €, Handlungskosten 25 %, Gewinn 10 %. Ermitteln Sie Einstandspreis, Selbstkostenpreis und Barverkaufspreis.", "punkte": 6, "loesung": "800,00 − 10 % (80,00) = 720,00 Zieleinkaufspreis\n720,00 − 2 % (14,40) = 705,60 Bareinkaufspreis\n705,60 + 15,00 = 720,60 € Einstandspreis\n720,60 + 25 % (180,15) = 900,75 € Selbstkostenpreis\n900,75 + 10 % (90,08) = 990,83 € Barverkaufspreis", "kriterien": [["Ziel- und Bareinkaufspreis richtig", 1.5], ["Einstandspreis 720,60 €", 1.5], ["Selbstkostenpreis 900,75 €", 1.5], ["Barverkaufspreis 990,83 €", 1.5]]}, {"frage": "Ein PC ist nach drei Monaten defekt. Erklären Sie den Unterschied zwischen Gewährleistung und Garantie und was der Kunde zuerst verlangen kann.", "punkte": 3, "loesung": "Gewährleistung: gesetzlich, 2 Jahre (an Verbraucher), gegenüber dem Verkäufer.\nGarantie: freiwillige Zusage des Herstellers.\nZuerst: Nacherfüllung (Reparatur oder Ersatz); erst danach Rücktritt, Minderung oder Schadensersatz.", "kriterien": [["Gewährleistung gesetzlich / Garantie freiwillig", 2], ["Zuerst Nacherfüllung", 1]]}, {"frage": "Für die fünf PCs wird Office benötigt. Vergleichen Sie OEM-Lizenz und Abo-Modell (z. B. Microsoft 365) und geben Sie eine Empfehlung.", "punkte": 3, "loesung": "OEM: an ein Gerät gebunden, nicht übertragbar, günstig.\nAbo: monatlich/jährlich, immer aktuell, pro Benutzer, flexibel bei neuen Mitarbeitern.\nEmpfehlung z. B. Abo wegen Aktualität und Flexibilität (andere Empfehlung mit guter Begründung ist ebenfalls richtig).", "kriterien": [["OEM richtig beschrieben", 1], ["Abo richtig beschrieben", 1], ["Begründete Empfehlung", 1]]}]}, {"titel": "Arztpraxis Dr. Yilmaz: WLAN und Sicherheit", "minuten": 30, "szenario": "Die Arztpraxis Dr. Yilmaz möchte ein WLAN für Mitarbeiter und ein Gäste-WLAN für das Wartezimmer. Drei Access Points sollen im 2,4-GHz-Band arbeiten. In der Praxis werden Patientendaten verarbeitet.", "aufgaben": [{"frage": "Der bisherige Dienstleister hat die SSID versteckt und einen MAC-Filter eingerichtet. Bewerten Sie beide Maßnahmen und empfehlen Sie eine sichere Lösung für das Mitarbeiter-WLAN.", "punkte": 5, "loesung": "SSID verstecken: unsicher, jedes Analyse-Tool findet den Namen trotzdem.\nMAC-Filter: unsicher, MAC-Adressen stehen im Klartext und lassen sich fälschen.\nEmpfehlung: WPA3 (oder WPA2 mit AES) als Enterprise mit 802.1X und RADIUS – jeder meldet sich einzeln an, Konten lassen sich sperren.", "kriterien": [["SSID verstecken unsicher + Grund", 1], ["MAC-Filter unsicher + Grund", 1], ["WPA3 bzw. WPA2-AES", 1], ["Enterprise / 802.1X / RADIUS", 2]]}, {"frage": "Welche Kanäle wählen Sie für die drei Access Points im 2,4-GHz-Band? Begründen Sie.", "punk
