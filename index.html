t."}, "357": {"Sie haben einen freien Puffer größer 0": "Vorgänge auf dem kritischen Pfad haben keinen Puffer (0).", "Sie können um einen Tag verschoben werden, ohne das Projektende zu ändern": "Ohne Puffer verschiebt jede Verzögerung auch das Projektende.", "Sie müssen alle parallel bearbeitet werden": "Der kritische Pfad ist eine Kette, die Vorgänge laufen meist nacheinander."}, "358": {"Schulung der Anwender vor dem Go-live des neuen Systems": "Anwenderschulungen gehören zur Einführung, nicht zum Rückblick.", "Erste Besprechung beim Projektstart (Kick-off-Meeting)": "Das Kick-off-Meeting findet am Anfang des Projekts statt.", "Formelle Abnahme der Leistung durch den Auftraggeber": "Das ist die Abnahme – sie prüft die Leistung, nicht die Erfahrungen des Teams."}, "359": {"Der Projektleiter verteilt die Arbeitspakete an die Mitglieder des Teams": "Das ist Teil der Projektplanung bzw. der Ressourcenzuordnung.", "Das Team schätzt gemeinsam die Dauer der Vorgänge für den Netzplan": "Das ist die Aufwandsschätzung in der Planungsphase.", "Der Lieferant schickt die Schlussrechnung und schließt das Projekt ab": "Die Rechnung folgt der Abnahme, ersetzt sie aber nicht."}, "360": {"Eine dauerhafte Ursache hinter vielen wiederkehrenden Störungen im Betrieb": "Das ist ein Problem im Sinne des Problem Managements.", "Ein großer, geplanter Change, der am Wochenende im Wartungsfenster eingespielt wird": "Das ist ein geplanter (Normal-)Change, keine Störung.", "Eine Störung, die nur einen einzelnen Arbeitsplatz betrifft und warten kann": "Das ist eine Störung mit geringer Auswirkung und niedriger Priorität."}, "361": {"Nach der Reihenfolge des Eingangs": "Nach Eingang zu arbeiten ignoriert, wie schwer und eilig eine Störung ist.", "Nach dem Rang des Anrufers im Unternehmen": "Der Rang des Anrufers zählt nur, wenn er die Auswirkung oder Dringlichkeit beeinflusst.", "Nach der Länge der Fehlerbeschreibung": "Die Textlänge sagt nichts über die Wichtigkeit einer Störung aus."}, "362": {"Die endgültige Lösung, die die Ursache dauerhaft beseitigt": "Die dauerhafte Behebung der Ursache ist die Lösung bzw. der Fix, kein Workaround.", "Eine vorab genehmigte Standardänderung ohne CAB": "Das ist ein Standard Change.", "Die Weitergabe eines Tickets an den 2nd Level Support": "Das ist eine funktionale Eskalation."}, "363": {"Weitergabe an Vorgesetzte bzw. die Geschäftsführung": "Das ist eine hierarchische Eskalation.", "Rückgabe des Tickets an den Anwender zur Klärung": "Eine Rückfrage beim Anwender ist keine Eskalation.", "Abschluss des Tickets mit dokumentiertem Workaround": "Ein Ticketabschluss ist das Gegenteil einer Weitergabe."}, "364": {"Störungen möglichst schnell und dauerhaft beheben": "Das ist Aufgabe des Incident Managements.", "Ursachen wiederkehrender Störungen analysieren": "Das ist Aufgabe des Problem Managements.", "Standardanfragen der Anwender bearbeiten": "Das ist Aufgabe des Request Fulfillments."}, "365": {"Ein Server, dessen Ausfall das ganze Netz lahmlegt": "Das ist ein Single Point of Failure (SPOF).", "Ein Administrator mit allen Rechten im System": "Das ist ein Admin-Konto, keine Anlaufstelle für Anwender.", "Ein einzelner Switchport für das Management": "Ein Management-Port dient der Verwaltung von Netzgeräten, nicht dem Service."}, "366": {"Nur Name und Abteilung des Anrufers, der Rest kommt später": "Ohne Fehlerbild und Zeitpunkt muss der Anwender später erneut befragt werden.", "Vor allem die eigene Vermutung über die Ursache": "Eine Vermutung kann in die falsche Richtung führen – zuerst gehören die Fakten ins Ticket.", "Die Telefonnummer und Vertragsnummer des Herstellers": "Herstellerdaten können zwar ergänzt werden, beschreiben aber nicht das Problem."}, "367": {"Viele Fachbegriffe verwenden, um kompetent zu wirken": "Viele Fachbegriffe überfordern den Kunden und führen zu Missverständnissen.", "Sofort eine Lösung nennen, ohne nachzufragen": "Ohne Nachfragen fehlen Informationen, die Lösung passt dann oft nicht.", "Den Kunden bei falschen Begriffen direkt korrigieren": "Direktes Korrigieren wirkt belehrend und verschlechtert das Gesprächsklima."}, "368": {"Eine Liste aller offenen und geschlossenen Tickets": "Eine Ticketliste ist die Ticket- bzw. Incident-Datenbank, nicht die CMDB.", "Ein verschlüsseltes Dokument mit allen Admin-Passwörtern": "Das ist ein Passwort-Tresor bzw. Passwortmanager.", "Ein Vertrag zwischen IT-Dienstleister und Kunde": "Das ist ein Service Level Agreement (SLA)."}, "369": {"GPL-Lizenz (Copyleft, strenge Weitergabe)": "Die GPL verlangt bei Weitergabe, dass auch geänderter Quellcode offengelegt wird.", "Freeware-Lizenz (kostenlos, Closed Source)": "Freeware ist zwar kostenlos, darf aber meist nicht geändert werden, weil der Quellcode fehlt.", "Shareware-Lizenz (Testphase, dann kostenpflichtig)": "Shareware darf nur eine begrenzte Zeit getestet werden und ist nicht zur Änderung freigegeben."}, "370": {"Es ersetzt das komplette Service-Desk-Team": "Komplexe Störungen brauchen weiterhin Menschen am Service Desk.", "Es braucht nach der Einführung keine Pflege": "Inhalte wie FAQs und Formulare müssen laufend gepflegt werden.", "Es verhindert, dass überhaupt Störungen entstehen": "Ein Portal beschleunigt die Bearbeitung, verhindert aber keine Störungen."}, "371": {"Interne Absprachen zwischen zwei Abteilungen": "Interne Absprachen zwischen Abteilungen regelt ein OLA.", "Die Lizenzbedingungen eines Betriebssystems": "Lizenzbedingungen stehen im EULA bzw. Lizenzvertrag.", "Den Arbeitsvertrag eines Service-Mitarbeiters": "Ein Arbeitsvertrag ist ein Personalthema, kein Service-Vertrag."}, "372": {"Normal – es sind ja nur Namen, Adressen und Termine": "Gesundheitsdaten sind besondere Kategorien nach Art. 9 DSGVO – „normal“ reicht nicht.", "Hoch – aber nur wegen der Verfügbarkeit der Termine": "Vertraulichkeit und Verfügbarkeit sind getrennte Schutzziele – hier geht es um Vertraulichkeit.", "Niedrig – das NAS steht im abgeschlossenen Praxisraum": "Ein abgeschlossener Raum ist eine Maßnahme, er senkt nicht den Schutzbedarf der Daten."}, "373": {"Zutrittskontrolle (Gebäude)": "Zutrittskontrolle regelt den Zutritt zu Räumen, nicht zu Ordnern.", "Zugangskontrolle (Anmeldung)": "Zugangskontrolle regelt die Anmeldung am System, nicht die Rechte danach.", "Weitergabekontrolle (Transport)": "Weitergabekontrolle schützt Daten bei Übertragung und Transport."}, "374": {"Ein BIOS-/UEFI-Passwort am Gerät": "Ein BIOS-Passwort hilft nicht, wenn die Platte ausgebaut und in einem anderen PC gelesen wird.", "Tägliches Backup auf ein NAS": "Ein Backup sichert nur die Verfügbarkeit, der Finder kann die Daten trotzdem lesen.", "Ein starkes Windows-Anmeldepasswort": "Ohne Verschlüsselung lässt sich die Platte in einem anderen Rechner auslesen."}, "375": {"Eine Einwilligung jedes einzelnen Kunden": "Der Dienstleister handelt im Auftrag; eine Einwilligung jedes Kunden ist dafür nicht nötig.", "Eine Meldung an die Aufsichtsbehörde": "Eine Meldung an die Aufsicht ist nur bei Datenpannen vorgeschrieben.", "Nichts, Wartung ist keine Verarbeitung": "Schon der mögliche Zugriff auf die Daten gilt als Verarbeitung im Sinne der DSGVO."}, "376": {"Vertraulichkeit": "Vertraulichkeit schützt vor unbefugtem Lesen, nicht vor Ausfall.", "Integrität": "Integrität schützt vor unbemerkten Veränderungen, nicht vor Ausfall.", "Authentizität": "Authentizität sichert die Echtheit von Daten oder Absendern, nicht die Erreichbarkeit."}, "377": {"Normal – nach dem Durchschnitt": "Einen Durchschnitt gibt es beim Schutzbedarf nicht – es zählt das höchste Niveau.", "Sehr hoch – wegen Kumulation immer": "Kumulation gilt nur, wenn mehrere Anwendungen zusammen einen höheren Schaden verursachen.", "Normal – der Verteilungseffekt senkt ihn": "Der Verteilungseffekt greift nur, wenn eine Anwendung auf mehrere Systeme verteilt ist."}, "378": {"90 m": "90 m gilt für den Tertiärbereich (Etagenverkabelung) als fest verlegte Strecke.", "1.500 m": "1.500 m gilt für den Primärbereich (Campus) zwischen Gebäuden.", "2.000 m": "2.000 m ist die gesamte Länge über alle Bereiche, nicht der Sekundärbereich."}, "379": {"Die maximale Datenrate in Mbit/s": "Die Datenrate hängt vom Ethernet-Standard ab, die Kategorie legt nur die Frequenz fest.", "Die Art und Anzahl der Schirmungen": "Die Schirmung zeigt die Bezeichnung wie S/FTP oder U/UTP an, nicht die Kategorie.", "Die zulässige Länge der Strecke": "Die Länge (meist 100 m) gibt der Standard vor, nicht die Kategorie."}, "380": {"Geflecht um jedes Paar, Folie als Gesamtschirm": "Das wäre S/FTP – das F nach dem Schrägstrich bedeutet Folie um jedes Paar.", "Folie um jedes Paar, kein Gesamtschirm vorhanden": "Das wäre U/FTP – das U vor dem Schrägstrich bedeutet: kein Gesamtschirm.", "Geflecht als Gesamtschirm, Folie um jede Einzelader": "Geschirmt werden die Paare, nicht einzelne Adern – und SF steht für Geflecht und Folie gesamt."}, "381": {"OM3": "OM3 ist eine Multimode-Faser (OM = Optical Multimode).", "OM4": "OM4 ist ebenfalls eine Multimode-Faser.", "OM5": "OM5 ist eine Multimode-Faser für mehrere Wellenlängen (Wideband)."}, "382": {"Die Faser leitet Strom und fängt dadurch Störungen ein": "Glasfasern leiten keinen Strom und sind gerade deshalb unempfindlich gegen Störungen.", "Der dicke Kern schluckt das Licht schon nach wenigen Metern": "Das Licht wird nicht nach wenigen Metern „geschluckt“ – das Problem ist die Modendispersion.", "Multimode arbeitet ausschließlich mit sichtbarem Rotlicht": "Multimode nutzt meist 850 nm, also Infrarot, kein sichtbares Rotlicht."}, "383": {"100 Mbit/s": "100 Mbit/s erreicht VDSL2 mit Vectoring (Profil 17a).", "52 Mbit/s": "Rund 50 Mbit/s schafft VDSL2 ohne Vectoring, nicht Supervectoring.", "1.000 Mbit/s": "1.000 Mbit/s erreichen Glasfaser oder Kabel, nicht VDSL."}, "384": {"synchron": "Synchron heißt „zeitgleich getaktet“ und sagt nichts über gleiche Raten aus.", "isochron": "Isochron bedeutet „in gleichen Zeitabständen“ (z. B. bei Echtzeitdaten).", "bidirektional": "Bidirektional heißt nur, dass in beide Richtungen übertragen wird – auch bei ungleichen Raten."}, "385": {"Ein DSL-Verfahren mit gleich schnellem Up- und Download": "Ein DSL-Verfahren mit gleich schnellem Up- und Download ist SDSL.", "Eine Verschlüsselung für Standortnetze im Internet": "MPLS selbst verschlüsselt nicht – dafür nutzt man IPsec oder andere VPN-Verfahren.", "Ein Ersatz für IP-Adressen durch MAC-Adressen im WAN": "MPLS ersetzt keine Adressen, es setzt zusätzliche Labels vor die IP-Pakete."}, "386": {"Ziel- und Quell-MAC-Adresse (12 Byte)": "Die MAC-Adressen gehören zum Frame-Header und zählen mit.", "Typfeld und Frame Check Sequence (6 Byte)": "Typfeld und FCS sind Teil des Frames und zählen mit.", "Padding bei sehr kleinen Nutzdaten (bis 46 Byte)": "Padding füllt kleine Frames auf 64 Byte auf – es zählt also gerade mit."}, "387": {"Er korrigiert die fehlerhaften Bits": "Die FCS erkennt Fehler nur, sie enthält keine Daten zur Korrektur.", "Er fordert ihn beim Sender neu an": "Ethernet kennt keine Neuanforderung – das erledigt bei Bedarf TCP auf Schicht 4.", "Er leitet ihn mit Fehlermarke weiter": "Fehlerhafte Frames weiterleiten kann nur Cut-Through, und auch ohne Fehlermarke."}, "388": {"Das höchstwertige Bit des ersten Bytes ist 1": "Das höchstwertige Bit des ersten Bytes hat keine Sonderbedeutung bei MAC-Adressen.", "Die ersten 24 Bit bestehen nur aus Nullen": "Die ersten 24 Bit sind die Herstellerkennung (OUI), Nullen sagen nichts über Multicast.", "Das letzte Byte der Adresse lautet FF": "Das letzte Byte ist Teil der Gerätenummer; nur ff:ff:ff:ff:ff:ff ist Broadcast."}, "389": {"Vom Hersteller fest eingebrannte Geräteadresse": "Bei einer Herstelleradresse wäre das zweitniedrigste Bit des ersten Bytes 0 – bei E ist es 1.", "Multicast-Adresse für eine Gruppe": "Multicast erkennt man am niedrigsten Bit – bei E (1110) ist es 0, also Unicast.", "Broadcast-Adresse an alle Geräte": "Broadcast ist nur ff:ff:ff:ff:ff:ff, nicht jede Adresse mit einem E an zweiter Stelle."}, "390": {"Nur an Ports, an denen weitere Switches hängen": "Der Switch weiß nicht, wo das Ziel hängt – deshalb flutet er an alle Ports des VLANs.", "Nur an das Standardgateway des Netzes": "Das Gateway ist nur für fremde Netze zuständig; der Switch arbeitet mit MAC-Adressen.", "Nirgendwohin, der Frame wird sofort verworfen": "Unbekannte Ziele werden geflutet, nicht verworfen – sonst würde nie jemand antworten."}, "391": {"Die ARP-Caches aller Clients mit falschen Einträgen füllen": "Das ist ARP-Spoofing bzw. ARP-Cache-Poisoning.", "Die Root Bridge übernehmen und den Verkehr umleiten": "Das ist ein STP-Angriff mit gefälschten BPDUs.", "Den DHCP-Server mit gefälschten Anfragen überlasten": "Das ist DHCP-Starvation."}, "392": {"Er macht den Switch automatisch zur Root Bridge": "Die Root Bridge wird über die Bridge-Priorität festgelegt, nicht über BPDU Guard.", "Er bremst Broadcasts oberhalb eines Grenzwerts": "Das macht Storm Control.", "Er prüft ARP-Antworten gegen die DHCP-Tabelle": "Das macht Dynamic ARP Inspection (DAI)."}, "393": {"Gegen doppelte MAC-Adressen im LAN": "Gegen doppelte bzw. zu viele MACs hilft Port Security.", "Gegen Schleifen bei redundanten Uplinks": "Gegen Schleifen schützt Spanning Tree.", "Gegen das Mitlesen von DHCP-Paketen": "DHCP Snooping verschlüsselt nichts, es filtert nur nicht vertrauenswürdige Server-Antworten."}, "394": {"Der mit der höchsten Bridge-ID": "Gewählt wird die niedrigste Bridge-ID, nicht die höchste.", "Der mit den meisten aktiven Ports": "Die Anzahl aktiver Ports spielt für die Wahl keine Rolle.", "Der zuerst eingeschaltete Switch": "Der Einschaltzeitpunkt zählt nicht – entscheidend ist die Bridge-ID."}, "395": {"Der Switch mit cc:cc:cc:cc:cc:cc": "cc:… ist die höchste MAC – bei gleicher Priorität gewinnt die niedrigste.", "Der Switch mit bb:bb:bb:bb:bb:bb": "bb:… ist niedriger als cc:…, aber höher als aa:…, also nicht die niedrigste.", "Keiner, die Prioritäten müssen sich unterscheiden": "Bei gleicher Priorität entscheidet die MAC-Adresse als Teil der Bridge-ID."}, "396": {"Der Port, über den er BPDUs an alle Nachbarn schickt": "Das beschreibt eher Designated Ports, die BPDUs in ein Segment senden.", "Jeder Port der Root Bridge selbst": "Die Root Bridge hat keinen Root Port, alle ihre Ports sind Designated.", "Der Port mit der höchsten Bandbreite des Switches": "Entscheidend sind die Pfadkosten zur Root Bridge, nicht die Bandbreite eines Ports."}, "397": {"Genau einen pro Switch": "Pro Segment gibt es einen Designated Port, nicht pro Switch.", "Zwei, an jedem Ende einen": "Zwei aktive Designated Ports auf einem Link würden eine Schleife ermöglichen.", "Keinen, nur Root Ports": "Jedes aktive Segment braucht einen Designated Port, sonst wäre es nicht angebunden."}, "398": {"Der Port an Switch B": "B hat die niedrigere Bridge-ID, sein Port wird Designated und bleibt aktiv.", "Beide Ports des Links": "Ein Port reicht als Designated Port – nur der andere wird blockiert.", "Keiner, beide leiten weiter": "Würden beide Ports weiterleiten, entstünde eine Schleife."}, "399": {"19": "19 sind die Kosten für 100 Mbit/s.", "2": "2 sind die Kosten für 10 Gbit/s.", "100": "100 sind die Kosten für 10 Mbit/s."}, "400": {"Je höher die Bandbreite, desto höher die Kosten": "Genau umgekehrt: Schnellere Links sind „billiger“ und werden bevorzugt.", "Die Kosten entsprechen der verlegten Kabellänge in Metern": "Die Kabellänge spielt keine Rolle – die Kosten richten sich nach der Bandbreite.", "Die Kosten zählen nur die Switches bis zum Ziel": "Das klingt nach Hop-Zählung wie bei RIP; STP summiert die Kosten der einzelnen Links."}, "401": {"Listening → Blocking → Learning → Forwarding": "Ein Port beginnt in Blocking, nicht in Listening.", "Blocking → Learning → Listening → Forwarding": "Erst wird zugehört (Listening), dann gelernt (Learning) – nicht umgekehrt.", "Learning → Listening → Blocking → Forwarding": "Learning setzt voraus, dass der Port schon für die Weiterleitung ausgewählt ist."}, "402": {"Es unterstützt grundsätzlich kein 802.1Q-Tagging": "VLAN 1 kann wie jedes VLAN getaggt werden – das Problem ist die Standardzuordnung.", "Es ist für IPv6-Verkehr reserviert": "Kein VLAN ist für IPv6 reserviert; VLANs trennen Netze unabhängig vom IP-Protokoll.", "Es darf nur eine einzige MAC-Adresse enthalten": "Ein VLAN kann beliebig viele Geräte enthalten."}, "403": {"Link Aggregation (LACP)": "LACP bündelt mehrere Links zu einem logischen Link, es routet nicht.", "Port Mirroring": "Port Mirroring kopiert Verkehr zur Analyse an einen anderen Port.", "Spanning Tree": "Spanning Tree verhindert Schleifen, es verbindet keine VLANs."}, "404": {"Per DHCP: Der Server wählt das VLAN zur IP": "DHCP vergibt die IP erst, wenn das VLAN schon feststeht – nicht umgekehrt.", "Per STP: Die Root Bridge verteilt die IDs": "STP verhindert Schleifen und verteilt keine VLAN-IDs.", "Per ARP: Der Switch fragt die ID beim Client ab": "ARP löst nur IP- in MAC-Adressen auf und kennt keine VLAN-IDs."}, "405": {"Als Access-Port im VLAN des Gäste-WLANs": "Ein Access-Port führt nur ein VLAN – das Firmen-WLAN wäre dann nicht angebunden.", "Als Access-Port im VLAN 1": "Ein Access-Port in VLAN 1 trennt die beiden SSIDs nicht und VLAN 1 sollte man meiden.", "Als gespiegelter Monitor-Port": "Ein Monitor-Port spiegelt nur Verkehr zur Analyse und leitet nichts weiter."}, "406": {"Immer genau 20 Byte, ohne Ausnahme": "20 Byte ist nur die Mindestgröße – mit Optionen wird der Header größer.", "Immer genau 40 Byte inkl. Optionen": "40 Byte ist die Größe des IPv6-Headers, nicht die feste Größe des TCP-Headers.", "8 Byte, genauso groß wie bei UDP": "8 Byte hat nur der UDP-Header; TCP braucht mehr Felder (z. B. Sequenznummern)."}, "407": {"FIN": "FIN beendet eine Verbindung geordnet, nicht sofort.", "PSH": "PSH sorgt dafür, dass Daten sofort an die Anwendung übergeben werden.", "URG": "URG markiert dringende Daten im Segment."}, "408": {"Das Netz vor Überlast auf den Routern unterwegs": "Die Überlast auf Routern regelt die Staukontrolle (Congestion Window).", "Den Sender vor doppelten Bestätigungen": "Doppelte Bestätigungen deuten auf Paketverlust hin, das Empfangsfenster regelt etwas anderes.", "Die Verbindung vor Mitlesen durch Dritte": "Vor Mitlesen schützt Verschlüsselung wie TLS, nicht die Flusskontrolle."}, "409": {"Verlorene Segmente werden neu gesendet": "Doch – das Neusenden verlorener Segmente gehört zur Zuverlässigkeit von TCP.", "Die Reihenfolge wird wiederhergestellt": "Doch – TCP sortiert Segmente anhand der Sequenznummern wieder richtig.", "Der Empfang wird ausdrücklich vom Ziel bestätigt": "Doch – TCP bestätigt den Empfang mit ACKs."}, "410": {"Dateidownload per FTP": "FTP nutzt TCP, weil Dateien vollständig und fehlerfrei ankommen müssen.", "Webseitenabruf über HTTP/1.1": "HTTP/1.1 läuft über TCP; erst HTTP/3 nutzt UDP mit QUIC.", "Dateiübertragung per SFTP": "SFTP läuft über SSH und damit über TCP."}, "411": {"TCP mit TLS 1.2": "TCP mit TLS nutzen HTTP/1.1 und HTTP/2.", "SCTP über IP": "SCTP ist ein eigenes Transportprotokoll, das HTTP/3 nicht verwendet.", "UDP ohne Verschlüsselung": "QUIC verschlüsselt immer mit TLS 1.3 – unverschlüsselt läuft HTTP/3 nicht."}, "412": {"16 – ab 17 unerreichbar": "16 bedeutet bei RIP bereits „unendlich“, also unerreichbar.", "15 bei v1, 16 bei v2": "Die Grenze von 15 Hops gilt bei RIPv1 und RIPv2 gleich.", "255 wie die höchste TTL": "255 ist der höchste TTL-Wert im IP-Header, RIP zählt nur bis 15."}, "413": {"Routen nach der Hop-Anzahl bewerten": "Die Hop-Anzahl als Metrik gibt es schon bei RIPv1.", "Updates über UDP Port 520 senden": "Auch RIPv1 nutzt UDP Port 520.", "Mit benachbarten Routern Routen tauschen": "Routen austauschen kann jede RIP-Version – das ist ihr Grundprinzip."}, "414": {"Doppelte IP-Adressen in angeschlossenen Netzen": "Doppelte IP-Adressen erkennt z. B. Gratuitous ARP bzw. DAD bei IPv6.", "Broadcasts zwischen verschiedenen VLANs": "Broadcasts zwischen VLANs verhindert schon die VLAN-Trennung.", "Zu große Pakete auf Strecken mit kleiner MTU": "Das ist Aufgabe von Fragmentierung bzw. Path MTU Discovery."}, "415": {"Routingtabellen aller Router per SNMP auslesen und listen": "tracert nutzt kein SNMP und braucht keinen Zugriff auf die Router.", "Jeder Router hängt seine IP an das Echo an": "Das beschreibt eher die Record-Route-Option von IP, nicht tracert.", "Vor jedem Router einen ARP-Request schicken": "ARP funktioniert nur im eigenen Netz und erreicht entfernte Router nicht."}, "416": {"Ja, als 192.168.1.0/23 (Netze .1 und .2)": "192.168.1.0 ist keine gültige /23-Netzadresse, weil das dritte Oktett gerade sein muss.", "Ja, als 192.168.0.0/23 (Netze .0 bis .2)": "192.168.0.0/23 umfasst nur .0 und .1, nicht .2.", "Ja, als 192.168.2.0/23 (Netze .1 und .2)": "192.168.2.0/23 umfasst .2 und .3, aber nicht .1."}, "417": {"10.0.2.0/24 bis 10.0.5.0/24": "Ein /22 beginnt bei einem Vielfachen von 4, nicht bei 10.0.2.0.", "10.0.4.0/24 bis 10.0.8.0/24": "Das wären fünf /24-Netze – ein /22 umfasst genau vier.", "10.0.1.0/24 bis 10.0.4.0/24": "Ein /22 beginnt bei einem Vielfachen von 4 – 10.0.1.0 passt nicht."}, "418": {"Sie wird länger (mehr Netzbits)": "Länger wird das Präfix beim Subnetting, nicht beim Zusammenfassen.", "Sie bleibt gleich, nur die IP ändert sich": "Die Präfixlänge muss sich ändern, sonst wäre es keine Zusammenfassung.", "Sie springt auf die nächste Klassengrenze": "Supernetting ist klassenlos (CIDR) und nicht an Klassengrenzen gebunden."}, "419": {"65.536": "65.536 sind alle Adressen – Netz- und Broadcastadresse sind keine Hosts.", "16.384": "16.384 ist die Anzahl der möglichen Klasse-B-Netze, nicht der Hosts.", "65.535": "65.535 zieht nur eine Adresse ab – Netz- und Broadcastadresse fallen beide weg."}, "420": {"255.248.0.0 (/13)": "/13 hat 5 Subnetzbits, also nur 32 Subnetze – zu wenig für 40.", "255.254.0.0 (/15)": "/15 ergibt 128 Subnetze – mehr Bits als nötig, die Hosts pro Netz sinken unnötig.", "255.255.192.0 (/18)": "/18 ergibt 1.024 Subnetze – viel zu viele Subnetzbits für 40 Netze."}, "421": {"255.255.255.0 (/24)": "/24 bietet nur 254 Hosts – zu wenig für 500.", "255.255.252.0 (/22)": "/22 reicht für 1.022 Hosts, ergibt aber nur halb so viele Subnetze wie /23.", "255.255.248.0 (/21)": "/21 bietet 2.046 Hosts, aber nur 32 Subnetze – Verschwendung."}, "422": {"Der Server liegt im selben Netz, nur das Gateway fehlt": "PC (.32–.63) und Server (.160–.191) liegen in verschiedenen /27-Netzen.", "Die Server-IP ist die Netzadresse ihres Subnetzes": "Die Netzadresse dieses Subnetzes ist .160, nicht .191.", "Ein /27 erlaubt keine Adressen oberhalb von .127": "Ein /27 teilt das ganze letzte Oktett in Blöcke zu 32 – auch oberhalb von .127."}, "423": {"Nein, das dritte Oktett unterscheidet sich": "Bei /23 umfasst ein Netz zwei Werte im dritten Oktett (hier 2 und 3).", "Nein, 172.16.3.20 ist eine Broadcastadresse": "Die Broadcastadresse von 172.16.2.0/23 ist 172.16.3.255, nicht .3.20.", "Nur, wenn das Gateway 172.16.2.1 lautet": "Ob zwei Adressen im selben Netz liegen, hängt nur von IP und Maske ab, nicht vom Gateway."}, "424": {"ff:ff:ff:ff:ff:ff, damit alle Geräte antworten": "ff:ff:ff:ff:ff:ff steht als Ziel im Ethernet-Header, nicht im ARP-Feld.", "Die MAC-Adresse des Standardgateways": "Die Gateway-MAC wäre schon bekannt – gefragt wird nach einer unbekannten MAC.", "Die MAC-Adresse, nach der gefragt wird": "Die gesuchte MAC ist ja noch unbekannt und kann daher nicht eingetragen werden."}, "425": {"8 Bit Gruppen-ID und 112 Bit Host-ID": "Eine Host-ID gibt es bei Multicast nicht – adressiert wird eine Gruppe.", "16 Bit Scope und 104 Bit Gruppen-ID": "Der Scope ist nur 4 Bit lang, nicht 16.", "4 Bit Version, 4 Bit Klasse, 112 Bit Zieladresse": "Version und Klasse stehen im IPv6-Header, nicht in der Adresse."}, "426": {"Link-lokal": "Link-lokal ist der Scope 2 (ff02::).", "Global": "Global ist der Scope e (ff0e::).", "Interface-lokal": "Interface-lokal ist der Scope 1 (ff01::)."}, "427": {"2001::/3": "2001::/3 ist keine saubere Präfixangabe – nach den ersten 3 Bit müssen Nullen folgen.", "2001::/16": "2001::/16 ist nur ein kleiner Teil des Global-Unicast-Bereichs.", "2000::/16": "2000::/16 umfasst nur einen einzigen /16-Block, nicht den ganzen Bereich."}, "428": {"Dual Stack auf allen Servern": "Dual Stack bräuchte auch IPv4 im eigenen Netz – das reine IPv6-Netz hat es aber nicht.", "Einen 6in4-Tunnel ins LAN": "6in4 transportiert IPv6 über IPv4, übersetzt aber nicht zwischen den Protokollen.", "Link-Local-Adressen für alle": "Link-Local-Adressen gelten nur im eigenen Segment und werden nicht geroutet."}, "429": {"fc00:101:ca::1": "fc00:101:ca::1 lässt die letzte Gruppe weg – das ergibt eine andere Adresse.", "fc00:101:ca:0::1:0:0": "Hier steht die 1 an der falschen Stelle, und :: darf keinen einzelnen Nullblock ersetzen.", "fc00:101:ca::1::0": "Zwei :: sind ungültig, weil nicht klar ist, wie viele Nullen wo fehlen."}, "430": {"Auf zwei getrennten Kanälen, für jeden Stream einen": "Getrennte Kanäle wären Kanalbündelung bzw. Multi-Link, nicht MIMO.", "Abwechselnd in Zeitschlitzen auf einem Kanal": "Abwechselnde Zeitschlitze sind Zeitmultiplex – MIMO überträgt gleichzeitig.", "Ein Stream im 2,4-GHz-, einer im 5-GHz-Band": "Getrennte Bänder entsprechen Dual-Band bzw. MLO, nicht räumlichen Streams."}, "431": {"CSMA/CD": "CSMA/CD ist das Zugriffsverfahren des klassischen kabelgebundenen Ethernet.", "DSSS": "DSSS ist ein älteres Funkverfahren aus 802.11b.", "MLO": "MLO bündelt bei Wi-Fi 7 mehrere Bänder, es teilt keinen Kanal auf."}, "432": {"Mehrere APs teilen sich eine gemeinsame SSID": "Mehrere APs mit gleicher SSID bilden ein ESS bzw. Mesh – das gibt es schon lange.", "Mehrere Clients senden gleichzeitig per OFDMA": "Gleichzeitiges Senden mehrerer Clients per OFDMA ist eine Wi-Fi-6-Technik.", "Ein AP bündelt mehrere LAN-Kabel zum Switch": "Das Bündeln von LAN-Kabeln ist Link Aggregation (LACP)."}, "433": {"11": "11 Kanäle sind es in den USA.", "14": "14 Kanäle gibt es nur in Japan, Kanal 14 dort nur für 802.11b.", "19": "Rund 19 Kanäle gibt es im 5-GHz-Band in Europa, nicht im 2,4-GHz-Band."}, "434": {"Kanal 4 ist in Europa für Bluetooth-Geräte reserviert": "Kanal 4 ist nicht für Bluetooth reserviert; Bluetooth springt über das ganze Band.", "Die Kanäle 1 bis 4 teilen sich automatisch eine SSID": "Kanäle haben nichts mit SSIDs zu tun – jede SSID kann auf jedem Kanal funken.", "Kanal 4 sendet mit doppelter Sendeleistung": "Alle Kanäle unterliegen denselben Leistungsgrenzen – das Problem ist die Überlappung."}, "435": {"Seit 2009 mit 802.11n": "802.11n (Wi-Fi 4) unterstützt 2,4 und 5 GHz, 5 GHz gab es aber schon vorher.", "Seit 2013 mit 802.11ac": "802.11ac (Wi-Fi 5) nutzt nur 5 GHz, war aber nicht der erste Standard dort.", "Seit 2003 mit 802.11g": "802.11g nutzt nur das 2,4-GHz-Band."}, "436": {"Er verschlüsselt jedes Paket ein zweites Mal": "Ein Repeater verschlüsselt nicht doppelt; der Verlust kommt vom geteilten Funkkanal.", "Er funkt nur im 2,4-GHz-Band mit 11 Mbit/s": "Repeater gibt es auch für 5 GHz und moderne Standards, nicht nur mit 11 Mbit/s.", "Er muss jedes Paket zusätzlich per Kabel zum Router schicken": "Ein Funk-Repeater ist gerade nicht per Kabel angebunden."}, "437": {"Ein eigener Kanal nur für die Gäste-Geräte": "Backhaul ist die Verbindung zwischen den Knoten, nicht ein Kanal für Gäste.", "Ein eigener Internetanschluss für jeden Knoten": "Mesh-Knoten teilen sich einen Internetanschluss.", "Eine eigene SSID nur für Administratoren": "Backhaul hat nichts mit SSIDs für bestimmte Nutzer zu tun."}, "438": {"ca. 3 min 35 s": "Hier wurde mit vollen 40 Mbit/s gerechnet – nutzbar sind aber nur 60 % (24 Mbit/s).", "ca. 3 min 20 s": "Hier wurde mit 1 GB (10⁹ Byte) und vollen 40 Mbit/s gerechnet – doppelt falsch.", "ca. 5 min 33 s": "Hier wurde 1 GB statt 1 GiB (2³⁰ Byte) verwendet."}, "439": {"Zwei Port-Forwarding-Regeln auf denselben Port 443": "Ein öffentlicher Port kann nur auf ein internes Ziel weitergeleitet werden.", "Ein zweiter DNS-A-Record auf dieselbe IP": "Ein zweiter A-Record zeigt auf dieselbe IP – der Router weiß trotzdem nicht, welcher Server gemeint ist.", "Statisches NAT für beide Server zugleich": "Statisches NAT braucht für jeden Server eine eigene öffentliche IP."}, "440": {"Webserver hinterlegen ihre privaten Schlüssel": "Webserver geben ihre privaten Schlüssel nie an fremde Firewalls heraus.", "Clients schalten TLS im Browser ab": "Ohne TLS gäbe es kein HTTPS mehr – das wäre ein großes Sicherheitsrisiko.", "Firewall kennt alle Benutzerpasswörter": "Benutzerpasswörter sind für das Aufbrechen von TLS nicht nötig."}, "441": {"Sie kann Ports und IP-Adressen nicht auswerten": "Eine Application-Layer-Firewall wertet zusätzlich auch Ports und Adressen aus.", "Sie lässt Antwortpakete grundsätzlich nicht zu": "Antwortpakete erlaubt schon jede zustandsorientierte Firewall.", "Sie funktioniert ausschließlich bei UDP-Verkehr": "Sie prüft TCP- und UDP-Anwendungen, besonders häufig HTTP über TCP."}, "442": {"Nur am Zielport im TCP-Header": "Gerade der Port 443 ist nicht eindeutig – hier laufen viele Anwendungen.", "An der MAC-Adresse des Clients": "Die MAC-Adresse identifiziert ein Gerät, nicht die Anwendung.", "An der TTL im IP-Header": "Die TTL zählt nur die verbleibenden Hops und sagt nichts über die Anwendung."}, "443": {"Die Bootreihenfolge der Laufwerke": "Die Bootreihenfolge speichert die UEFI-Firmware im NVRAM.", "Temperatur- und Lüfterwerte des gesamten Systems": "Temperatur- und Lüfterwerte erfassen Sensoren und das Mainboard-Management.", "Die Firmware-Updates des Mainboards": "Firmware-Updates liegen im Flash-Speicher des Mainboards, nicht im TPM."}, "444": {"Das Auslesen der Platte, eingebaut in einem anderen PC": "Gegen das Auslesen schützt Festplattenverschlüsselung wie BitLocker.", "Das Ändern des UEFI-Passworts durch Nutzer": "Das UEFI-Passwort ist eine eigene Einstellung, Secure Boot prüft nur Signaturen.", "Das Mitlesen von Tastatureingaben im Betrieb": "Gegen Keylogger hilft Secure Boot nicht, wenn das System schon läuft."}, "445": {"Sicheres Speichern des BitLocker-Schlüssels": "Den BitLocker-Schlüssel speichert das TPM, nicht die UEFI-Firmware.", "Bereitstellen einer virtuellen Smartcard": "Virtuelle Smartcards benötigen ein TPM.", "Speichern von Zertifikaten für das VPN": "Zertifikate werden sicher im TPM oder im Zertifikatsspeicher des OS gehalten."}, "446": {"Passwort und eine zusätzliche Sicherheitsfrage": "Passwort und Sicherheitsfrage sind beides Wissen – das ist nur ein Faktor.", "PIN und ein zweites, längeres Passwort": "PIN und Passwort sind ebenfalls beides Wissen.", "Benutzername und Passwort mit Sonderzeichen": "Benutzername ist kein Faktor, sondern nur die Kennung."}, "447": {"99.999": "99.999 vergisst die 00000 – die Kombinationen reichen von 00000 bis 99999.", "59.049": "59.049 ist 9⁵ – hier fehlt die Ziffer 0.", "1.000.000": "1.000.000 wäre eine sechsstellige PIN (10⁶)."}, "448": {"Brute-Force-Angriffe laufen dadurch sogar schneller": "Die Sperre bremst Brute-Force-Angriffe aus, statt sie zu beschleunigen.", "Passwörter landen dadurch im Klartext im Log": "Die Sperre schreibt kein Passwort ins Log.", "Das Konto lässt sich danach nie mehr entsperren": "Ein Admin kann das Konto jederzeit wieder entsperren."}, "449": {"Gegen Phishing-Mails mit gefälschter Absenderadresse": "Gegen gefälschte Absender helfen SPF, DKIM und DMARC.", "Gegen das Mitlesen im offenen WLAN": "Gegen Mitlesen hilft Verschlüsselung wie TLS oder VPN.", "Gegen Schadcode in E-Mail-Anhängen": "Gegen Schadcode in Anhängen hilft ein Virenscanner bzw. Sandboxing."}, "450": {"Hash entschlüsseln und im Klartext vergleichen": "Hashes sind Einwegfunktionen und lassen sich nicht entschlüsseln.", "Hash an den Client schicken und dort prüfen": "Hashes gehören nicht an den Client – sonst ließen sie sich offline knacken.", "Nur die Länge und die Zeichenarten der Eingabe prüfen": "Länge und Zeichenarten sagen nicht, ob das Passwort richtig ist."}, "451": {"Es überbrückt unterbrechungsfrei, allerdings nur Minuten": "Unterbrechungsfreies Überbrücken für Minuten leistet die USV, nicht das Aggregat.", "Es filtert lediglich Spannungsspitzen aus dem Netz": "Das Filtern von Spannungsspitzen leistet ein Überspannungsschutz bzw. die USV.", "Es speist Strom aus Akkus statt aus Kraftstoff": "Akkus nutzt die USV; das Aggregat läuft mit Diesel oder anderem Kraftstoff."}, "452": {"Speicherbegrenzung": "Speicherbegrenzung betrifft die Dauer der Speicherung, nicht den Zweck.", "Richtigkeit": "Richtigkeit betrifft korrekte und aktuelle Daten.", "Rechenschaftspflicht": "Rechenschaftspflicht heißt, die Einhaltung nachweisen zu können."}, "453": {"Zwei": "Art. 6 Abs. 1 nennt mehr als zwei – nämlich a bis f.", "Vier": "Vier sind zu wenig – Art. 6 Abs. 1 reicht von Buchstabe a bis f.", "Sieben": "Sieben Grundsätze nennt Art. 5 DSGVO, nicht Art. 6."}, "454": {"Jede Verarbeitung braucht eine Einwilligung der Person": "Eine Einwilligung ist nur eine von sechs Rechtsgrundlagen.", "Die Daten müssen sachlich richtig und aktuell sein": "Das ist der Grundsatz der Richtigkeit.", "Die Daten dürfen nur im Inland verarbeitet werden": "Verarbeitung in der EU und in Drittländern ist mit passenden Garantien erlaubt."}, "455": {"Berechtigtes Interesse an Werbung (Art. 6 Abs. 1 f)": "Hier geht es um ein Angebot, nicht um Werbung – Art. 6 Abs. 1 b passt genauer.", "Rechtliche Verpflichtung des Studios (Art. 6 Abs. 1 c)": "Es gibt keine Rechtspflicht, ein Angebot zu erstellen.", "Ausdrückliche schriftliche Einwilligung (Art. 7)": "Eine Einwilligung ist nicht nötig, wenn sie selbst das Angebot anfragt."}, "456": {"Zulässig – öffentlich sichtbare Daten sind frei nutzbar": "Öffentlich sichtbare Daten sind nicht frei nutzbar – auch sie unterliegen der DSGVO.", "Zulässig – solange alles verschlüsselt gespeichert wird": "Verschlüsselung schützt die Daten, ersetzt aber nicht die Erforderlichkeit.", "Zulässig – weil sie selbst den Kontakt gesucht hat": "Ihr Kontakt erlaubt nur, was für das Angebot nötig ist (Datenminimierung)."}, "457": {"Erlaubt, bis die betroffene Person widerspricht": "Das wäre ein Widerspruchsmodell – der Datenschutz geht genau umgekehrt vor.", "Nur Behörden erlaubt, Unternehmen grundsätzlich nie": "Auch Unternehmen dürfen verarbeiten, wenn eine Rechtsgrundlage vorliegt.", "Nur mit schriftlicher Einwilligung überhaupt erlaubt": "Die Einwilligung ist nur eine von sechs möglichen Rechtsgrundlagen."}, "458": {"Datenschutzerklärung optisch ansprechend gestalten": "Das Design der Datenschutzerklärung ist kein technischer Datenschutz.", "Datenschutz später per Software-Update nachrüsten": "Nachträgliches Nachrüsten ist das Gegenteil von „by Design“.", "Nur zertifizierte Software im Betrieb einsetzen": "Zertifizierte Software ist nicht vorgeschrieben – es geht um die Entwicklung selbst."}, "459": {"Nordamerika": "In Nordamerika gelten keine EU-Regeln; für die USA braucht es zusätzliche Garantien.", "Asien": "Asien ist für die DSGVO ein Drittland, Übermittlung nur mit Garantien.", "Südamerika": "Südamerika ist für die DSGVO ebenfalls ein Drittland."}, "460": {"Verarbeitung ohne Rechtsgrundlage innerhalb der EU": "Eine Rechtsgrundlage ist immer nötig – der Beschluss betrifft nur Drittländer.", "Verzicht auf einen Datenschutzbeauftragten": "Die Pflicht zum Datenschutzbeauftragten bleibt davon unberührt.", "Speicherung über die gesetzlichen Löschfristen hinaus": "Löschfristen gelten weiterhin."}, "461": {"Anonymisierung – die DSGVO gilt nicht mehr": "Anonym wären die Daten erst ohne Zuordnungstabelle – so bleibt der Personenbezug.", "Verschlüsselung – die Daten gelten als gelöscht": "Verschlüsselung ersetzt Werte durch Chiffre, die Daten gelten dadurch nicht als gelöscht.", "Aggregation – nur Summenwerte bleiben übrig": "Aggregation fasst Daten zu Summen zusammen – hier bleiben Einzeldatensätze erhalten."}, "462": {"Nein, Bewegungsdaten sind grundsätzlich immer verboten": "Ohne Personenbezug sind es keine personenbezogenen Daten und die DSGVO greift nicht.", "Nur mit Einwilligung jedes einzelnen Kunden": "Für anonyme Daten braucht es keine Einwilligung.", "Nur, wenn die Aufsichtsbehörde vorher zustimmt": "Eine vorherige Zustimmung der Aufsicht gibt es dafür nicht."}, "463": {"Ein Hinweis im Aushang am Empfang reicht aus": "Ein Aushang ist keine ausdrückliche Einwilligung für besondere Datenkategorien.", "Ein AV-Vertrag mit der Universität reicht aus": "Die Universität forscht für eigene Zwecke und ist kein Auftragsverarbeiter.", "Nichts, denn Forschung ist immer und überall zulässig": "Forschung hat Erleichterungen, braucht aber trotzdem eine Rechtsgrundlage."}, "464": {"Unterschriebene Einwilligung jedes einzelnen Kunden": "Bei Videoüberwachung stützt man sich meist auf berechtigtes Interesse, nicht auf Einwilligung.", "Speicherung mindestens ein Jahr als Beweis": "Aufnahmen müssen nach wenigen Tagen gelöscht werden, wenn kein Vorfall vorliegt.", "Meldung jeder Kamera beim Ordnungsamt": "Eine Meldung beim Ordnungsamt ist nicht vorgeschrieben."}, "465": {"Videoüberwachung aller Büros": "Videoüberwachung ist nicht als Beispiel in Art. 32 genannt.", "Biometrische Zutrittskontrolle": "Biometrische Zutrittskontrolle wird in Art. 32 nicht ausdrücklich erwähnt.", "Jährlicher Passwortwechsel für alle Konten": "Passwortwechsel stehen nicht in der DSGVO."}, "466": {"Innerhalb von 72 Stunden": "72 Stunden gelten für die Meldung einer Datenpanne an die Aufsicht.", "Innerhalb von 14 Tagen": "14 Tage sind z. B. die Widerrufsfrist, nicht die Auskunftsfrist.", "Innerhalb von drei Monaten": "Drei Monate sind nur die maximale Frist nach Verlängerung in komplexen Fällen."}, "467": {"Y = C − S": "Ersparnis wird nicht vom Konsum abgezogen – das Einkommen teilt sich in beides auf.", "Y = C + I + S": "Investitionen tätigen Unternehmen, sie gehören nicht zur Verwendung des Haushaltseinkommens.", "Y = S − C": "Y = S − C würde bedeuten, dass Konsum das Einkommen mindert."}, "468": {"Wenn Konsum und Ersparnis gleich hoch sind": "Konsum und Ersparnis sind Teile des Einkommens – ihre Gleichheit ist kein Gleichgewicht.", "Wenn der Staat keine Schulden macht": "Der Staat kommt erst im erweiterten Modell mit Staat dazu.", "Wenn Exporte und Importe gleich hoch sind": "Exporte und Importe gehören zum Modell mit Ausland."}, "469": {"Sobald der Staat dazukommt (4 Sektoren)": "Mit Staat (4 Sektoren) ist die Volkswirtschaft noch geschlossen.", "Sobald Banken dazukommen (3 Sektoren)": "Mit Banken (3 Sektoren) gibt es noch keinen Außenhandel.", "Schon im einfachen Kreislauf": "Der einfache Kreislauf hat nur Haushalte und Unternehmen."}, "470": {"550 €": "550 € ist ein Rechenfehler – 3.000 − 2.550 = 450.", "5.550 €": "5.550 € ist die Summe, nicht die Differenz.", "2.550 €": "2.550 € ist der Konsum, nicht die Ersparnis."}, "471": {"BIP und BNE sind zwei Namen für dieselbe Kennzahl": "BIP und BNE unterscheiden sich durch die Einkommen über die Grenze.", "BIP: von Inländern verdient – BNE: im Inland erzeugt": "Genau umgekehrt: BIP folgt dem Inlandsprinzip, BNE dem Inländerprinzip.", "Das BNE enthält zusätzlich alle Vorleistungen": "Vorleistungen sind weder im BIP noch im BNE enthalten."}, "472": {"Zum deutschen BIP und zum Schweizer BNE": "Vertauscht: Sie erzeugt in der Schweiz (BIP CH) und ist Inländerin in Deutschland (BNE DE).", "Nur zum deutschen BIP": "Zum deutschen BIP zählt nur, was im deutschen Inland erzeugt wird.", "Nur zum Schweizer BNE": "Zum Schweizer BNE zählen nur Einkommen von Schweizer Inländern."}, "473": {"In aktuellen Preisen gerechnet": "In aktuellen Preisen ist das nominale BIP.", "Ohne Steuern und Sozialabgaben": "Steuern und Abgaben haben mit real und nominal nichts zu tun.", "Ohne die Leistungen des Staates": "Staatliche Leistungen zählen weiterhin mit."}, "474": {"Die Deutsche Bundesbank": "Die Bundesbank erstellt u. a. die Zahlungsbilanz, nicht die VGR.", "Das Bundesfinanzministerium": "Das Bundesfinanzministerium plant den Haushalt, erstellt aber nicht die VGR.", "Die Industrie- und Handelskammer": "Die IHK vertritt Unternehmen, sie erstellt keine amtliche Statistik."}, "475": {"Zins": "Zins ist das Einkommen aus dem Produktionsfaktor Kapital.", "Lohn": "Lohn ist das Einkommen aus dem Produktionsfaktor Arbeit.", "Gewinn": "Gewinn ist das Einkommen aus unternehmerischer Tätigkeit."}, "476": {"Ein Faktoreinkommen für den Produktionsfaktor Boden": "Faktoreinkommen erhält man für eine Leistung, die Rente ist eine Umverteilung ohne Gegenleistung.", "Die Auszahlung der eigenen angesparten Beiträge": "Im Umlageverfahren werden die Beiträge sofort ausgezahlt, nicht angespart.", "Ein Zinseinkommen aus Kapital": "Zinseinkommen gehört zum Faktor Kapital."}, "477": {"Unternehmerlohn": "Unternehmerlohn ist ein kalkulatorischer Kostenposten, nicht das tatsächliche Einkommen.", "Gehalt": "Gehalt erhalten Angestellte für ihre Arbeit.", "Rendite": "Rendite ist eine prozentuale Kennzahl der Kapitalverzinsung."}, "478": {"Subvention für ein Unternehmen": "Subventionen gehen an Unternehmen, nicht an Haushalte.", "Lohn eines Beamten": "Der Lohn eines Beamten ist ein Faktoreinkommen für Arbeit.", "Zinsen auf Staatsanleihen": "Zinsen auf Staatsanleihen sind Kapitaleinkommen."}, "479": {"Angebotsmonopol": "Die OPEC besteht aus mehreren Staaten, nicht aus einem Anbieter.", "Polypol": "Im Polypol gibt es sehr viele Anbieter, die OPEC hat wenige.", "Nachfrageoligopol": "Bei einem Nachfrageoligopol gibt es wenige Käufer, die OPEC verkauft aber."}, "480": {"Angebotsoligopol": "Hier gibt es nur einen einzigen Nachfrager, nicht wenige Anbieter.", "Zweiseitiges Monopol": "Zweiseitiges Monopol hätte nur einen Anbieter.", "Polypol": "Im Polypol gibt es viele Anbieter und viele Nachfrager."}, "481": {"Das Angebot ist größer als die Nachfrage": "Das ist ein Käufermarkt.", "Es gibt sehr viele Anbieter": "Viele Anbieter sprechen eher für einen Käufermarkt.", "Die Preise fallen dauerhaft": "Fallende Preise sind ein Zeichen für zu viel Angebot."}, "482": {"Weil im Polypol nur ein Anbieter existiert": "Im Polypol gibt es viele Anbieter, nicht einen.", "Weil im Polypol der Staat die Preise festlegt": "Im Polypol bildet sich der Preis am Markt, nicht durch den Staat.", "Weil vollständige Konkurrenz nur im Oligopol vorkommt": "Vollständige Konkurrenz gibt es gerade im Polypol, nicht im Oligopol."}, "483": {"Der Anbieter ist reiner Preisnehmer": "Reine Preisnehmer gibt es im Polypol bei vollständiger Konkurrenz.", "Es gibt keinerlei Wettbewerb": "Im Oligopol gibt es Wettbewerb, auch wenn er nicht so groß ist.", "Ein einzelner Anbieter beliefert den ganzen Markt": "Ein einzelner Anbieter kennzeichnet das Monopol."}, "484": {"Die Bundesnetzagentur": "Die Bundesnetzagentur reguliert Netze wie Telekommunikation und Energie.", "Das Statistische Bundesamt": "Das Statistische Bundesamt erstellt Statistiken, es überwacht keinen Wettbewerb.", "Die Industrie- und Handelskammer": "Die IHK vertritt Unternehmen, sie hat keine Kartellbehörden-Rechte."}}, "poolerkl": {"port": {"20": "Port 20 gehört zu FTP (Datenkanal).", "21": "Port 21 gehört zu FTP (Steuerkanal).", "22": "Port 22 gehört zu SSH (und SFTP/SCP).", "23": "Port 23 gehört zu Telnet.", "25": "Port 25 gehört zu SMTP (Mailversand zwischen Servern).", "53": "Port 53 gehört zu DNS.", "67": "Port 67 gehört zum DHCP-Server.", "69": "Port 69 gehört zu TFTP.", "80": "Port 80 gehört zu HTTP.", "88": "Port 88 gehört zu Kerberos.", "110": "Port 110 gehört zu POP3.", "123": "Port 123 gehört zu NTP.", "143": "Port 143 gehört zu IMAP.", "161": "Port 161 gehört zu SNMP.", "389": "Port 389 gehört zu LDAP.", "443": "Port 443 gehört zu HTTPS.", "445": "Port 445 gehört zu SMB (Datei- und Druckerfreigaben).", "636": "Port 636 gehört zu LDAPS (LDAP über TLS).", "993": "Port 993 gehört zu IMAPS (IMAP über TLS).", "995": "Port 995 gehört zu POP3S (POP3 über TLS).", "1433": "Port 1433 gehört zu Microsoft SQL Server.", "3306": "Port 3306 gehört zu MySQL/MariaDB.", "3389": "Port 3389 gehört zu RDP (Remotedesktop).", "5900": "Port 5900 gehört zu VNC."}, "osi": {"Schicht 1 – Bitübertragung": "Auf Schicht 1 werden Bits als Signale übertragen – hier arbeiten Kabel, Hub und Repeater.", "Schicht 2 – Sicherung": "Auf Schicht 2 arbeiten MAC-Adressen, Frames, Switches und Bridges.", "Schicht 3 – Vermittlung": "Auf Schicht 3 arbeiten IP-Adressen, Pakete und Router.", "Schicht 4 – Transport": "Auf Schicht 4 arbeiten TCP und UDP mit Ports und Segmenten.", "Schicht 5 – Sitzung": "Schicht 5 baut Sitzungen zwischen Anwendungen auf, hält und beendet sie.", "Schicht 6 – Darstellung": "Schicht 6 kümmert sich um Kodierung, Kompression und Verschlüsselung.", "Schicht 7 – Anwendung": "Auf Schicht 7 liegen Anwendungsprotokolle wie HTTP, DNS und SMTP."}, "maske": {"255.255.255.0": "255.255.255.0 entspricht /24 (254 nutzbare Hosts).", "255.255.255.128": "255.255.255.128 entspricht /25 (126 nutzbare Hosts).", "255.255.255.192": "255.255.255.192 entspricht /26 (62 nutzbare Hosts).", "255.255.255.224": "255.255.255.224 entspricht /27 (30 nutzbare Hosts).", "255.255.255.240": "255.255.255.240 entspricht /28 (14 nutzbare Hosts).", "255.255.255.248": "255.255.255.248 entspricht /29 (6 nutzbare Hosts).", "255.255.255.252": "255.255.255.252 entspricht /30 (2 nutzbare Hosts).", "255.255.254.0": "255.255.254.0 entspricht /23 (510 nutzbare Hosts).", "255.255.0.0": "255.255.0.0 entspricht /16 (65.534 nutzbare Hosts)."}, "cidr": {"/24": "/24 entspricht 255.255.255.0: 256 Adressen, 254 nutzbare Hosts.", "/25": "/25 entspricht 255.255.255.128: 128 Adressen, 126 Hosts – ein /24 ergibt 2 davon.", "/26": "/26 entspricht 255.255.255.192: 64 Adressen, 62 Hosts – ein /24 ergibt 4 davon.", "/27": "/27 entspricht 255.255.255.224: 32 Adressen, 30 Hosts – ein /24 ergibt 8 davon.", "/28": "/28 entspricht 255.255.255.240: 16 Adressen, 14 Hosts – ein /24 ergibt 16 davon.", "/29": "/29 entspricht 255.255.255.248: 8 Adressen, 6 Hosts – ein /24 ergibt 32 davon.", "/30": "/30 entspricht 255.255.255.252: 4 Adressen, 2 Hosts – typisch für Punkt-zu-Punkt-Links."}, "pdu": {"Bits (Bitstrom)": "Bits sind die Dateneinheit auf Schicht 1 (Bitübertragung).", "Frame (Rahmen)": "Frames sind die Dateneinheit auf Schicht 2 (Sicherung).", "Paket (IP-Paket)": "Pakete sind die Dateneinheit auf Schicht 3 (Vermittlung).", "Segment (TCP-Segment)": "Segmente sind die Dateneinheit auf Schicht 4 (Transport, TCP)."}, "tom": {"Zutrittskontrolle": "Zutrittskontrolle verhindert den physischen Zutritt Unbefugter zu Räumen und Anlagen.", "Zugangskontrolle": "Zugangskontrolle verhindert, dass Unbefugte IT-Systeme nutzen (Login, Passwort, MFA).", "Zugriffskontrolle": "Zugriffskontrolle regelt, welche Daten Berechtigte lesen oder ändern dürfen (Rechte, Rollen).", "Weitergabekontrolle": "Weitergabekontrolle schützt Daten bei Übertragung und Transport (Verschlüsselung, VPN).", "Eingabekontrolle": "Eingabekontrolle protokolliert, wer wann welche Daten eingegeben oder geändert hat.", "Auftragskontrolle": "Auftragskontrolle sichert, dass Dienstleister nur nach Weisung verarbeiten (AV-Vertrag).", "Verfügbarkeitskontrolle": "Verfügbarkeitskontrolle schützt vor Verlust und Zerstörung (Backup, USV, Brandschutz).", "Trennungsgebot": "Das Trennungsgebot verlangt die getrennte Verarbeitung von Daten unterschiedlicher Zwecke."}, "schutzziel": {"Vertraulichkeit": "Vertraulichkeit heißt: Nur Berechtigte können Daten lesen (bedroht z. B. durch Sniffing).", "Integrität": "Integrität heißt: Daten sind unverändert und vollständig (geprüft z. B. per Hash).", "Verfügbarkeit": "Verfügbarkeit heißt: Systeme und Daten sind nutzbar, wenn sie gebraucht werden.", "Authentizität": "Authentizität heißt: Die Echtheit von Absender bzw. Daten ist nachweisbar (z. B. Signatur)."}, "itil": {"Incident": "Ein Incident ist eine ungeplante Störung, die schnell behoben werden soll.", "Problem": "Ein Problem ist die (noch unbekannte) Ursache eines oder mehrerer Incidents.", "Change": "Ein Change ist eine geplante Änderung an der IT-Infrastruktur.", "Service Request": "Ein Service Request ist eine Standardanfrage ohne Störung, z. B. Passwort-Reset."}, "dnsrec": {"A": "Ein A-Record ordnet einem Namen eine IPv4-Adresse zu.", "AAAA": "Ein AAAA-Record ordnet einem Namen eine IPv6-Adresse zu.", "MX": "Ein MX-Record nennt den zuständigen Mailserver einer Domain.", "CNAME": "Ein CNAME-Record definiert einen Alias auf einen anderen Namen.", "PTR": "Ein PTR-Record dient dem Reverse Lookup: IP-Adresse → Name.", "NS": "Ein NS-Record nennt die zuständigen Nameserver einer Zone.", "SOA": "Der SOA-Record enthält die Grunddaten der Zone (primärer Nameserver, Seriennummer, Timer).", "SRV": "Ein SRV-Record nennt Host und Port für einen Dienst, z. B. LDAP oder Kerberos.", "TXT": "Ein TXT-Record enthält Freitext, z. B. für SPF, DKIM oder Domain-Verifizierung."}, "phase": {"Initialisierung": "In der Initialisierung wird die Projektidee geprüft und der Projektauftrag erteilt.", "Definition": "In der Definition werden Ziele, Umfang und Anforderungen festgelegt.", "Planung": "In der Planung entstehen Struktur-, Ablauf-, Termin-, Kosten- und Ressourcenpläne.", "Durchführung": "In der Durchführung wird umgesetzt und per Soll-Ist-Vergleich gesteuert.", "Abschluss": "Im Abschluss erfolgen Abnahme, Dokumentation und Lessons Learned."}, "pap": {"Raute": "Die Raute steht im PAP für eine Verzweigung (Entscheidung).", "Rechteck": "Das Rechteck steht im PAP für eine Operation bzw. Verarbeitung.", "Oval": "Das Oval steht im PAP für Start und Ende (Grenzstelle).", "Parallelogramm": "Das Parallelogramm steht im PAP für Ein- und Ausgabe.", "Kreis": "Der Kreis steht im PAP für eine Übergangsstelle (Konnektor)."}, "datentyp": {"Boolean": "Boolean speichert Wahrheitswerte (wahr/falsch).", "Integer": "Integer speichert ganze Zahlen.", "String": "String speichert Zeichenketten (Text).", "Float": "Float speichert Gleitkommazahlen mit einfacher Genauigkeit.", "Char": "Char speichert ein einzelnes Zeichen.", "Double": "Double speichert Gleitkommazahlen mit doppelter Genauigkeit."}, "sqlagg": {"COUNT": "COUNT zählt Zeilen bzw. Werte.", "SUM": "SUM addiert die Werte einer Spalte.", "AVG": "AVG berechnet den Durchschnitt einer Spalte.", "MIN": "MIN liefert den kleinsten Wert einer Spalte.", "MAX": "MAX liefert den größten Wert einer Spalte."}, "sqlagg_klammer": {"AVG()": "AVG() berechnet den Durchschnitt einer Spalte.", "SUM()": "SUM() addiert die Werte einer Spalte.", "COUNT()": "COUNT() zählt Zeilen bzw. Werte.", "MIN()": "MIN() liefert den kleinsten Wert einer Spalte.", "MAX()": "MAX() liefert den größten Wert einer Spalte.", "MEAN()": "MEAN() gibt es in Standard-SQL nicht – der Durchschnitt heißt dort AVG()."}, "dienstart": {"Infrastrukturdiensten": "Infrastrukturdienste sind Basisdienste wie DHCP, DNS, NTP, Active Directory und PKI.", "Managementdiensten": "Managementdienste dienen Verwaltung und Überwachung, z. B. Monitoring oder Softwareverteilung.", "Kommunikationsdiensten": "Kommunikationsdienste sind z. B. E-Mail, VoIP, Chat und Videokonferenz.", "Business-Anwendungen": "Business-Anwendungen sind fachliche Programme wie ERP, CRM oder Warenwirtschaft."}, "din_kennung": {"P": "Kennung P steht nach DIN 66399 für Papier.", "F": "Kennung F steht nach DIN 66399 für Film (z. B. Mikrofilm).", "O": "Kennung O steht nach DIN 66399 für optische Datenträger (CD, DVD, Blu-ray).", "T": "Kennung T steht nach DIN 66399 für Magnetbänder und Disketten.", "H": "Kennung H steht nach DIN 66399 für Festplatten mit magnetischen Scheiben.", "E": "Kennung E steht nach DIN 66399 für elektronische Datenträger (SSD, USB-Stick, Speicherkarte)."}, "din_material": {"Papier": "Papier hat nach DIN 66399 die Kennung P.", "Film": "Film hat nach DIN 66399 die Kennung F.", "Optische Datenträger": "Optische Datenträger haben nach DIN 66399 die Kennung O.", "Festplatten": "Festplatten haben nach DIN 66399 die Kennung H.", "Elektronische Datenträger": "Elektronische Datenträger (SSD, USB-Stick) haben nach DIN 66399 die Kennung E.", "Magnetbänder und Disketten": "Magnetbänder und Disketten haben nach DIN 66399 die Kennung T."}, "wlan_std": {"802.11a": "802.11a funkt mit bis zu 54 Mbit/s im 5-GHz-Band.", "802.11b": "802.11b funkt mit bis zu 11 Mbit/s im 2,4-GHz-Band.", "802.11g": "802.11g funkt mit bis zu 54 Mbit/s im 2,4-GHz-Band.", "802.11n": "802.11n ist Wi-Fi 4 (2,4 und 5 GHz).", "802.11ac": "802.11ac ist Wi-Fi 5 (5 GHz).", "802.11ax": "802.11ax ist Wi-Fi 6 bzw. 6E (2,4, 5 und 6 GHz).", "802.11be": "802.11be ist Wi-Fi 7."}, "ipv6_praefix": {"fe80::/10": "fe80::/10 ist das Präfix für Link-Local-Adressen.", "fc00::/7": "fc00::/7 ist das Präfix für Unique Local Addresses (private IPv6-Adressen).", "2000::/3": "2000::/3 ist der Bereich der globalen Unicast-Adressen.", "ff00::/8": "ff00::/8 ist der IPv6-Multicast-Bereich.", "2001:db8::/32": "2001:db8::/32 ist für Dokumentation und Beispiele reserviert."}, "usb_rate": {"1,5 Mbit/s": "1,5 Mbit/s ist USB 1.x Low Speed.", "12 Mbit/s": "12 Mbit/s ist USB 1.x Full Speed.", "100 Mbit/s": "100 Mbit/s ist keine USB-Stufe, sondern typisch für Fast Ethernet.", "480 Mbit/s": "480 Mbit/s ist USB 2.0 Hi-Speed.", "5 Gbit/s": "5 Gbit/s ist USB 3.0 bzw. USB 3.2 Gen 1 (SuperSpeed).", "10 Gbit/s": "10 Gbit/s ist USB 3.1 bzw. USB 3.2 Gen 2 (SuperSpeed+).", "20 Gbit/s": "20 Gbit/s ist USB 3.2 Gen 2x2 (bzw. die Basisstufe von USB4)."}, "pcie_rate": {"2,5 GT/s": "2,5 GT/s pro Lane ist PCIe 1.x.", "5 GT/s": "5 GT/s pro Lane ist PCIe 2.0.", "8 GT/s": "8 GT/s pro Lane ist PCIe 3.0.", "16 GT/s": "16 GT/s pro Lane ist PCIe 4.0.", "32 GT/s": "32 GT/s pro Lane ist PCIe 5.0.", "64 GT/s": "64 GT/s pro Lane ist PCIe 6.0."}, "ddr_spannung": {"1,1 V": "1,1 V ist die Standardspannung von DDR5.", "1,2 V": "1,2 V ist die Standardspannung von DDR4.", "1,5 V": "1,5 V ist die Standardspannung von DDR3.", "1,8 V": "1,8 V ist die Standardspannung von DDR2.", "2,5 V": "2,5 V ist die Standardspannung von DDR(1)-SDRAM."}, "ausfall_jahr": {"3,65 Tage": "3,65 Tage Ausfall pro Jahr entsprechen 99 % Verfügbarkeit.", "8,76 Stunden": "8,76 Stunden Ausfall pro Jahr entsprechen 99,9 % Verfügbarkeit.", "52,56 Minuten": "52,56 Minuten Ausfall pro Jahr entsprechen 99,99 % Verfügbarkeit.", "5,26 Minuten": "5,26 Minuten Ausfall pro Jahr entsprechen 99,999 % Verfügbarkeit.", "31,5 Sekunden": "31,5 Sekunden Ausfall pro Jahr entsprechen 99,9999 % Verfügbarkeit."}, "marktform": {"Polypol": "Polypol: viele Anbieter und viele Nachfrager.", "Angebotsmonopol": "Angebotsmonopol: ein Anbieter und viele Nachfrager.", "Angebotsoligopol": "Angebotsoligopol: wenige Anbieter und viele Nachfrager.", "Nachfragemonopol": "Nachfragemonopol: ein Nachfrager und viele Anbieter.", "Nachfrageoligopol": "Nachfrageoligopol: wenige Nachfrager und viele Anbieter.", "Bilaterales Monopol": "Bilaterales Monopol: ein Anbieter und ein Nachfrager."}}, "lueckencode": [{"t": "prog", "titel": "Summe eines Arrays", "aufgabe": "Was gehört in die Lücken?", "code": "summe = 0\nFÜR i VON 0 BIS laenge(werte) - 1\n    summe = summe ___1___ werte[i]\nENDE FÜR\nAUSGABE summe", "luecken": [["+"]], "erkl": "Jedes Element wird zur bisherigen Summe addiert. Der Startwert 0 ist das neutrale Element der Addition."}, {"t": "prog", "titel": "Größten Wert finden", "aufgabe": "Was gehört in die Lücken?", "code": "max = werte[0]\nFÜR i VON 1 BIS laenge(werte) - 1\n    WENN werte[i] ___1___ max DANN\n        max = ___2___\n    ENDE WENN\nENDE FÜR\nAUSGABE max", "luecken": [[">", ">=|≥"], ["werte[i]"]], "erkl": "Ist das aktuelle Element größer als das bisherige Maximum, wird es zum neuen Maximum. Mit >= kommt dasselbe Ergebnis heraus."}, {"t": "prog", "titel": "Notendurchschnitt", "aufgabe": "Was gehört in die Lücken?", "code": "summe = 0\nFÜR i VON 0 BIS n - 1\n    summe = summe + noten[i]\nENDE FÜR\nschnitt = summe ___1___ n\nAUSGABE schnitt", "luecken": [["/", ":|÷"]], "erkl": "Der Durchschnitt ist die Summe geteilt durch die Anzahl der Werte."}, {"t": "prog", "titel": "Tickets mit hoher Priorität zählen", "aufgabe": "Was gehört in die Lücken?", "code": "anzahl = ___1___\nFÜR i VON 0 BIS laenge(tickets) - 1\n    WENN tickets[i].prioritaet == \"hoch\" DANN\n        anzahl = anzahl + ___2___\n    ENDE WENN\nENDE FÜR\nAUSGABE anzahl", "luecken": [["0"], ["1"]], "erkl": "Ein Zähler startet bei 0 und wird bei jedem Treffer um 1 erhöht."}, {"t": "prog", "titel": "Wie viele Tage reicht der Speicher?", "aufgabe": "Die Schleife soll laufen, solange noch mindestens 15 GB frei sind. Was gehört in die Lücke?", "code": "frei = 380\ntage = 0\nSOLANGE frei ___1___ 15\n    frei = frei - 15\n    tage = tage + 1\nENDE SOLANGE\nAUSGABE tage", "luecken": [[">=", "≥"]], "erkl": "„Mindestens 15“ heißt größer oder gleich 15. Ausgegeben wird 25 (25 × 15 GB = 375 GB, Rest 5 GB)."}, {"t": "prog", "titel": "Passwortlänge prüfen", "aufgabe": "Ein Passwort muss mindestens 12 Zeichen haben. Was gehört in die Lücke?", "code": "WENN laenge(passwort) ___1___ 12 DANN\n    AUSGABE \"Passwort zu kurz\"\nSONST\n    AUSGABE \"Länge in Ordnung\"\nENDE WENN", "luecken": [["<"]], "erkl": "Zu kurz ist ein Passwort nur bei weniger als 12 Zeichen. Genau 12 Zeichen sind erlaubt, daher < und nicht <=."}, {"t": "prog", "titel": "Anmeldung prüfen", "aufgabe": "Die Anmeldung gelingt nur, wenn das Konto aktiv ist und das Passwort stimmt. Was gehört in die Lücke?", "code": "WENN aktiv == wahr ___1___ pwOk == wahr DANN\n    AUSGABE \"Anmeldung erfolgreich\"\nSONST\n    AUSGABE \"Zugriff verweigert\"\nENDE WENN", "luecken": [["UND", "AND|&&"]], "erkl": "Beide Bedingungen müssen gleichzeitig erfüllt sein, also logisches UND."}, {"t": "prog", "titel": "Serverraum überwachen", "aufgabe": "Eine Warnung soll kommen, wenn es zu warm ist oder der Lüfter ausgefallen ist. Was gehört in die Lücke?", "code": "WENN temperatur > 35 ___1___ luefterOk == falsch DANN\n    AUSGABE \"Warnung: Serverraum prüfen!\"\nENDE WENN", "luecken": [["ODER", "OR¦||"]], "erkl": "Schon eine der beiden Bedingungen reicht für die Warnung, also logisches ODER."}, {"t": "prog", "titel": "Mengenrabatt", "aufgabe": "Ab 10 Stück gibt es 5 % Rabatt. Was gehört in die Lücke?", "code": "WENN menge >= 10 DANN\n    preis = menge * einzelpreis * ___1___\nSONST\n    preis = menge * einzelpreis\nENDE WENN\nAUSGABE preis", "luecken": [["0.95", "0,95"]], "erkl": "5 % Rabatt bedeutet, dass 95 % des Preises bezahlt werden: Faktor 0,95."}, {"t": "prog", "titel": "Datenmenge umrechnen", "aufgabe": "Eine Datei mit 4 GiB soll in MiB und dann in Mibit umgerechnet werden. Was gehört in die Lücken?", "code": "groesseGiB = 4\ngroesseMiB = groesseGiB ___1___ 1024\ngroesseMibit = groesseMiB * ___2___\nAUSGABE groesseMibit", "luecken": [["*", "×|·"], ["8"]], "erkl": "1 GiB = 1024 MiB, also multiplizieren. 1 Byte = 8 Bit, also mal 8. Ergebnis: 32768 Mibit."}, {"t": "prog", "titel": "Liste rückwärts ausgeben", "aufgabe": "Alle Elemente sollen vom letzten bis zum ersten ausgegeben werden. Was gehört in die Lücke?", "code": "FÜR i VON laenge(liste) - 1 BIS ___1___ SCHRITT -1\n    AUSGABE liste[i]\nENDE FÜR", "luecken": [["0"]], "erkl": "Arrays beginnen beim Index 0. Rückwärts wird also bis einschließlich 0 gezählt."}, {"t": "prog", "titel": "Zwei Werte tauschen (Bubblesort)", "aufgabe": "Was gehört in die Lücken?", "code": "WENN zahlen[j] > zahlen[j + 1] DANN\n    temp = zahlen[j]\n    zahlen[j] = ___1___\n    zahlen[j + 1] = ___2___\nENDE WENN", "luecken": [["zahlen[j + 1]", "zahlen[j+1]"], ["temp"]], "erkl": "Zum Tauschen braucht man eine Hilfsvariable: erst sichern, dann überschreiben, dann den gesicherten Wert eintragen."}, {"t": "prog", "titel": "Gerade oder ungerade?", "aufgabe": "Was gehört in die Lücke?", "code": "WENN zahl ___1___ 2 == 0 DANN\n    AUSGABE \"gerade\"\nSONST\n    AUSGABE \"ungerade\"\nENDE WENN", "luecken": [["MOD", "%|mod"]], "erkl": "MOD liefert den Rest einer Division. Ist der Rest bei Division durch 2 gleich 0, ist die Zahl gerade."}, {"t": "prog", "titel": "Seriennummer suchen", "aufgabe": "Die Suche soll enden, sobald das Gerät gefunden ist. Was gehört in die Lücke?", "code": "i = 0\ngefunden = falsch\nSOLANGE i < laenge(geraete) UND gefunden == ___1___\n    WENN geraete[i] == suchNr DANN\n        gefunden = wahr\n    SONST\n        i = i + 1\n    ENDE WENN\nENDE SOLANGE", "luecken": [["falsch", "false"]], "erkl": "Weitergesucht wird nur, solange noch nichts gefunden wurde, also solange gefunden == falsch ist."}, {"t": "prog", "titel": "Hosts im Subnetz berechnen", "aufgabe": "Was gehört in die Lücke?", "code": "praefix = 26\nhosts = 2 ^ (32 - praefix) - ___1___\nAUSGABE hosts", "luecken": [["2"]], "erkl": "Netz- und Broadcastadresse sind nicht nutzbar: 2^6 − 2 = 62 Hosts."}, {"t": "prog", "titel": "PIN-Sperre", "aufgabe": "Nach 3 Fehlversuchen wird gesperrt. Was gehört in die Lücken?", "code": "versuche = 0\nentsperrt = falsch\nSOLANGE versuche < ___1___ UND entsperrt == falsch\n    eingabe = EINGABE()\n    WENN eingabe == pin DANN\n        entsperrt = ___2___\n    SONST\n        versuche = versuche + 1\n    ENDE WENN\nENDE SOLANGE", "luecken": [["3"], ["wahr", "true"]], "erkl": "Die Schleife läuft bei 0, 1 und 2 Fehlversuchen, also höchstens 3 Fehleingaben. Bei richtiger PIN wird entsperrt auf wahr gesetzt und die Schleife endet."}, {"t": "prog", "titel": "Tabelle aufsummieren", "aufgabe": "Alle Werte einer Tabelle mit 3 Zeilen und 4 Spalten sollen addiert werden. Was gehört in die Lücke?", "code": "gesamt = 0\nFÜR z VON 0 BIS 2\n    FÜR s VON 0 BIS 3\n        gesamt = gesamt + tabelle[z][___1___]\n    ENDE FÜR\nENDE FÜR\nAUSGABE gesamt", "luecken": [["s"]], "erkl": "Die äußere Schleife läuft über die Zeilen (z), die innere über die Spalten (s). Zugriff: tabelle[z][s]."}, {"t": "prog", "titel": "SQL: Alle Drucker anzeigen", "aufgabe": "Was gehört in die Lücke?", "code": "SELECT name, standort\n___1___ geraete\nWHERE typ = 'Drucker';", "luecken": [["FROM"]], "erkl": "Nach SELECT folgt mit FROM die Tabelle, aus der gelesen wird."}, {"t": "prog", "titel": "SQL: Mitarbeiter je Abteilung", "aufgabe": "Gezählt wird pro Abteilung, sortiert nach Anzahl absteigend. Was gehört in die Lücken?", "code": "SELECT abteilung, COUNT(*) AS anzahl\nFROM mitarbeiter\n___1___ abteilung\n___2___ anzahl DESC;", "luecken": [["GROUP BY"], ["ORDER BY"]], "erkl": "GROUP BY bildet Gruppen für COUNT(*), ORDER BY … DESC sortiert absteigend."}, {"t": "prog", "titel": "SQL: Ticket schließen", "aufgabe": "Ticket 4711 soll den Status „erledigt“ bekommen. Was gehört in die Lücken?", "code": "___1___ tickets\n___2___ status = 'erledigt'\nWHERE ticket_id = 4711;", "luecken": [["UPDATE"], ["SET"]], "erkl": "Vorhandene Datensätze ändert man mit UPDATE tabelle SET spalte = wert. Ohne WHERE würden alle Tickets geändert."}], "szenarien": [{"name": "Neue Filiale vernetzen", "t": "ip", "schritte": [["ip", "Die Holzwerk Brandt GmbH eröffnet eine Filiale. Dafür ist das Netz 192.168.40.0/24 vorgesehen. Es soll in 4 gleich große Subnetze geteilt werden (Verwaltung, Lager, Server, Gäste).", "Welche Präfixlänge haben die Subnetze?", "/26", "/25|/27|/28", "Für 4 Subnetze braucht man 2 zusätzliche Bits: /24 + 2 = /26."], ["ip", "Die Subnetze haben die Präfixlänge /26.", "Wie viele Hosts sind pro Subnetz nutzbar?", "62", "64|30|126", "2^(32−26) = 64 Adressen, minus Netz- und Broadcastadresse = 62 Hosts."], ["ip", "Das Lager bekommt das zweite Subnetz.", "Wie lautet die Broadcastadresse des Lager-Subnetzes?", "192.168.40.127", "192.168.40.128|192.168.40.63|192.168.40.255", "Die Subnetze beginnen bei .0, .64, .128 und .192. Das zweite reicht von .64 bis .127; .127 ist die Broadcastadresse."], ["fw", "Die Filiale soll dauerhaft und verschlüsselt über das Internet mit dem Netz der Zentrale verbunden werden.", "Welche Lösung ist geeignet?", "Site-to-Site-VPN zwischen den beiden Routern bzw. Firewalls", "Client-to-Site-VPN auf jedem einzelnen Filial-PC|Portweiterleitung für RDP auf jeden Rechner|Unverschlüsselte Verbindung über eine öffentliche IP", "Ein Site-to-Site-VPN (z. B. mit IPsec) verbindet zwei ganze Netze. Die Clients brauchen dafür keine eigene VPN-Software."], ["ip", "Jede Nacht werden 9 GiB Daten über die VPN-Verbindung zur Zentrale gesichert. Der Upload der Filiale beträgt 100 Mbit/s (Overhead vernachlässigen).", "Wie lange dauert die Übertragung ungefähr?", "ca. 12,9 Minuten", "ca. 12,0 Minuten|ca. 1,6 Minuten|ca. 103 Minuten", "9 × 1024³ Byte × 8 = 77.309.411.328 Bit; geteilt durch 100.000.000 Bit/s = ca. 773 s = ca. 12,9 Minuten. Bei 12,0 wurde mit 1000 statt 1024 gerechnet, bei 1,6 das ×8 vergessen."]]}, {"name": "Arbeitsplätze beschaffen", "t": "kauf", "schritte": [["kauf", "Die Kanzlei Sommer & Partner braucht 10 neue PCs. Angebot A: Listenpreis 890 € je PC, 10 % Rabatt, 2 % Skonto.", "Wie hoch ist der Bareinkaufspreis für alle 10 PCs?", "7.849,80 €", "7.832,00 €|8.010,00 €|8.722,00 €", "8.900 € − 10 % Rabatt = 8.010 €; davon 2 % Skonto (160,20 €) = 7.849,80 €. Rabatt und Skonto werden nacheinander abgezogen, nicht addiert (7.832 €)."], ["kauf", "Der Lieferant berechnet zusätzlich 120 € Versandpauschale.", "Wie hoch ist der Bezugspreis?", "7.969,80 €", "7.849,80 €|7.729,80 €|8.130,00 €", "Bezugspreis = Bareinkaufspreis + Bezugskosten = 7.849,80 € + 120 € = 7.969,80 €."], ["kauf", "Angebot B wird mit einer Nutzwertanalyse bewertet. Gewichtung: Preis 40 %, Leistung 35 %, Service 25 %. Punkte für B: Preis 6, Leistung 9, Service 8.", "Welchen Nutzwert erreicht Angebot B?", "7,55", "7,67|7,70|23,00", "6 × 0,40 + 9 × 0,35 + 8 × 0,25 = 2,40 + 3,15 + 2,00 = 7,55. 7,67 wäre der einfache Durchschnitt ohne Gewichtung."], ["hw", "Die neuen PCs sollen nachts automatisch für Updates eingeschaltet werden.", "Was muss dafür eingerichtet werden?", "Wake on LAN im UEFI und in der Netzwerkkarte aktivieren", "Secure Boot im UEFI vollständig deaktivieren|TPM 2.0 im UEFI zurücksetzen lassen|Schnellstart im Energiesparplan einschalten", "Wake on LAN startet den PC über ein Magic Packet an die MAC-Adresse. Dazu muss die Funktion im UEFI und im Treiber der Netzwerkkarte aktiv sein."], ["service", "Alle 10 PCs sollen gleich installiert und danach der Domäne hinzugefügt werden.", "Wie geht man am effizientesten und fehlerfrei vor?", "Referenzimage mit Sysprep generalisieren und per Netzwerk verteilen", "Image ohne Generalisierung klonen und verteilen|Jeden PC einzeln per USB-Stick manuell installieren|Festplatte des ersten PCs auf alle anderen kopieren", "Sysprep entfernt rechnerspezifische Daten (z. B. die SID). Ohne Generalisierung kann es beim Domänenbeitritt Probleme geben."]]}, {"name": "Datensicherung planen", "t": "spe", "schritte": [["spe", "Die Spedition Kaiser KG hat 2 TB Nutzdaten. Freitags gibt es eine Vollsicherung, Montag bis Donnerstag eine inkrementelle Sicherung. Pro Tag ändern sich etwa 5 % der Daten.", "Wie viel Sicherungsspeicher wird pro Woche benötigt?", "2,4 TB", "2,0 TB|2,5 TB|10,0 TB", "Vollsicherung 2 TB + 4 × (5 % von 2 TB = 0,1 TB) = 2,4 TB."], ["spe", "Am Donnerstagvormittag fällt der Server aus. Die letzte Sicherung lief Mittwochnacht.", "Welche Sicherungen braucht man zur Wiederherstellung?", "Vollsicherung vom Freitag plus die inkrementellen Sicherungen von Montag bis Mittwoch", "Nur die inkrementelle Sicherung von Mittwochnacht|Vollsicherung vom Freitag plus nur die Mittwochssicherung|Nur die Vollsicherung vom vergangenen Freitag", "Inkrementelle Sicherungen bauen aufeinander auf. Man braucht die letzte Vollsicherung und alle inkrementellen Sicherungen danach."], ["spe", "Die Geschäftsführung fragt, was die 3-2-1-Regel bedeutet.", "Was ist richtig?", "3 Kopien der Daten, auf 2 verschiedenen Medien, 1 Kopie außer Haus", "3 Sicherungen pro Tag, 2 Administratoren, 1 Prüfprotokoll|3 Festplatten im RAID, 2 Netzteile, 1 USV|3 Generationen, 2 Server, 1 Cloud-Anbieter", "Die 3-2-1-Regel: drei Kopien (inkl. Original), zwei unterschiedliche Speichermedien, eine Kopie an einem anderen Ort."], ["spe", "Als Sicherungsziel wird ein NAS mit 4 Festplatten zu je 4 TB im RAID 5 eingesetzt.", "Wie groß ist die nutzbare Kapazität?", "12 TB", "16 TB|8 TB|4 TB", "Bei RAID 5 geht die Kapazität einer Platte für die Parität verloren: (4 − 1) × 4 TB = 12 TB."], ["sec", "Ein Mitarbeiter meint: „Mit RAID 5 brauchen wir doch gar kein Backup mehr.“", "Warum ist das falsch?", "RAID schützt nur vor Plattenausfall, nicht vor Löschen, Verschlüsselung oder Brand", "RAID 5 ist langsamer als jedes Backup und daher ungeeignet|RAID 5 verträgt gar keinen Ausfall einer einzigen Platte|RAID 5 speichert die Daten nur im Arbeitsspeicher", "RAID erhöht die Verfügbarkeit. Gelöschte oder durch Ransomware verschlüsselte Daten sind aber auf allen Platten gleichzeitig betroffen."]]}, {"name": "WLAN für eine Arztpraxis", "t": "wlan", "schritte": [["wlan", "Die Praxis Dr. Lindner möchte WLAN für die Praxis-Notebooks und ein Gäste-WLAN für Patienten im Wartezimmer.", "Wie trennt man die Netze sinnvoll?", "Eigene Gast-SSID in einem eigenen VLAN mit Client-Isolation", "Gleiche SSID, Gäste bekommen nur ein anderes Passwort|Gast-SSID im selben Subnetz wie die Praxis-PCs|Praxis-SSID verstecken, das reicht als Trennung", "Ein eigenes VLAN trennt den Gastverkehr logisch vom Praxisnetz. Client-Isolation verhindert, dass Gäste untereinander kommunizieren."], ["wlan", "Im Praxis-WLAN soll sich jeder Mitarbeiter mit eigenen Zugangsdaten anmelden. Ein RADIUS-Server ist vorhanden.", "Welches Verfahren passt?", "WPA3-Enterprise mit IEEE 802.1X", "WPA3-Personal mit gemeinsamem Kennwort|WPA2-Personal mit TKIP-Verschlüsselung|WEP mit 128-Bit-Schlüssel", "Bei Enterprise erfolgt die Anmeldung pro Benutzer über 802.1X und RADIUS. Personal nutzt ein gemeinsames Kennwort für alle."], ["wlan", "In der Praxis gibt es viele Nachbarnetze. Die Räume liegen nah am Access Point.", "Welches Frequenzband bietet mehr überlappungsfreie Kanäle, aber weniger Reichweite durch Wände?", "5 GHz", "2,4 GHz|433 MHz|900 MHz", "Im 5-GHz-Band gibt es deutlich mehr überlappungsfreie Kanäle. Höhere Frequenzen werden von Wänden aber stärker gedämpft."], ["wlan", "Ein Röntgenbild ist 48 MiB groß. Das WLAN erreicht effektiv 200 Mbit/s.", "Wie lange dauert die Übertragung ungefähr?", "ca. 2,02 s", "ca. 1,92 s|ca. 0,26 s|ca. 16,11 s", "48 × 1024² Byte × 8 = 402.653.184 Bit; geteilt durch 200.000.000 Bit/s = ca. 2,02 s (aufgerundet). 1,92 s entsteht, wenn man mit 1000 statt 1024 rechnet; 0,26 s, wenn das ×8 fehlt."], ["dsgvo", "Auf den Praxis-Notebooks werden Befunde und Diagnosen gespeichert.", "Wie sind diese Daten nach DSGVO einzuordnen?", "Gesundheitsdaten – besondere Kategorie nach Art. 9 DSGVO", "Normale personenbezogene Daten nach Art. 6 DSGVO|Anonyme Daten, für die die DSGVO nicht gilt|Pseudonyme Daten ohne besonderen Schutzbedarf", "Gesundheitsdaten gehören zu den besonderen Kategorien personenbezogener Daten und brauchen besonders hohen Schutz."]]}, {"name": "Server virtualisieren", "t": "virt", "schritte": [["virt", "Die Metallbau Riedel GmbH will vier alte physische Server auf einem neuen Host zusammenfassen.", "Welcher Hypervisor eignet sich für den produktiven Serverbetrieb?", "Typ-1-Hypervisor, der direkt auf der Hardware läuft", "Typ-2-Hypervisor als Programm auf einem Desktop-Betriebssystem|Terminalserver mit Remote-Desktop-Zugriff|Emulator, der jeden Befehl in Software nachbildet", "Ein Typ-1-Hypervisor (Bare Metal) hat wenig Overhead und ist für Server gedacht. Typ 2 eignet sich eher für Test und Schulung."], ["virt", "Die VMs brauchen 8 GB, 16 GB, 12 GB und 24 GB RAM. Für den Hypervisor sollen 8 GB reserviert bleiben.", "Wie viel RAM braucht der Host mindestens?", "68 GB", "60 GB|76 GB|64 GB", "8 + 16 + 12 + 24 = 60 GB für die VMs, plus 8 GB Reserve = 68 GB."], ["virt", "Vor einem großen Update erstellt der Admin einen Snapshot der Warenwirtschafts-VM.", "Was trifft auf einen Snapshot zu?", "Er hält den Zustand der VM fest, ersetzt aber kein Backup", "Er ist eine vollständige Sicherung auf einem anderen Medium|Er kann beliebig lange ohne Nachteile bestehen bleiben|Er sichert nur die Konfiguration, nicht die Daten", "Ein Snapshot liegt auf demselben Speicher wie die VM. Fällt dieser aus, ist der Snapshot auch weg. Außerdem bremsen alte Snapshots die VM."], ["virt", "Ein zweiter Host soll dazukommen. VMs sollen im laufenden Betrieb zwischen den Hosts verschoben werden können.", "Was wird dafür typischerweise benötigt?", "Gemeinsamer Speicher (SAN oder NAS), auf den beide Hosts zugreifen", "Lokale Festplatten in jedem Host ohne Verbindung|Zwei getrennte Internetanschlüsse pro Host|Ein Typ-2-Hypervisor auf jedem der Hosts", "Bei der Live-Migration wird nur der Arbeitsspeicherinhalt übertragen. Die virtuellen Festplatten liegen auf gemeinsamem Speicher."], ["green", "Die vier alten Server brauchten je 350 W, der neue Host braucht 450 W. Alle laufen rund um die Uhr (8.760 h/Jahr). Strompreis: 0,30 €/kWh.", "Wie viel Stromkosten spart die Firma pro Jahr?", "2.496,60 €", "3.679,20 €|1.182,60 €|249,66 €", "Einsparung: 4 × 350 W − 450 W = 950 W = 0,95 kW. 0,95 kW × 8.760 h = 8.322 kWh × 0,30 € = 2.496,60 €."]]}, {"name": "Datenpanne: Notebook verloren", "t": "dsgvo", "schritte": [["sec", "Ein Außendienstmitarbeiter der Gartenbau Huber GmbH hat sein Notebook im Zug verloren. Darauf liegen unverschlüsselt Kundenlisten. Die Daten sind zusätzlich auf dem Server gesichert.", "Welches Schutzziel ist hauptsächlich verletzt?", "Vertraulichkeit", "Integrität|Verfügbarkeit|Authentizität", "Fremde können die Daten lesen. Da es eine Sicherung gibt, ist die Verfügbarkeit nicht wesentlich betroffen."], ["dsgvo", "Die Firma muss die Datenpanne melden.", "Innerhalb welcher Frist muss die Meldung erfolgen?", "Unverzüglich, möglichst binnen 72 Stunden nach Bekanntwerden", "Innerhalb von 14 Tagen nach Bekanntwerden|Erst nach Abschluss der internen Untersuchung|Innerhalb von 24 Stunden nach dem Verlust", "Art. 33 DSGVO: unverzüglich und möglichst binnen 72 Stunden. Eine spätere Meldung muss begründet werden."], ["dsgvo", "Die Meldung wird vorbereitet.", "An wen geht sie?", "An die zuständige Datenschutz-Aufsichtsbehörde", "An das Bundesamt für Sicherheit in der Informationstechnik|An die örtliche Polizeidienststelle|An die zuständige Industrie- und Handelskammer", "Verletzungen des Schutzes personenbezogener Daten meldet der Verantwortliche der Datenschutz-Aufsichtsbehörde."], ["dsgvo", "Die Geschäftsführung fragt, ob auch die Kunden informiert werden müssen.", "Wann ist das nötig?", "Wenn voraussichtlich ein hohes Risiko für die Betroffenen besteht", "Immer, bei jeder Datenpanne ohne Ausnahme|Nur wenn mehr als 1.000 Personen betroffen sind|Nie, das übernimmt die Aufsichtsbehörde", "Art. 34 DSGVO: Betroffene sind bei voraussichtlich hohem Risiko für ihre Rechte und Freiheiten zu benachrichtigen."], ["sec", "So etwas soll nicht wieder passieren.", "Welche Maßnahme schützt die Daten bei Verlust am besten?", "Festplattenverschlüsselung mit Pre-Boot-Authentifizierung", "Ein längeres Windows-Passwort ohne Verschlüsselung|Ein BIOS-Passwort gegen das Booten vom Stick|Die Daten in einen versteckten Ordner verschieben", "Nur Verschlüsselung (z. B. BitLocker mit PIN) schützt die Daten, wenn jemand die Festplatte ausbaut. Ist das Gerät sicher verschlüsselt, ist das Risiko meist gering."]]}, {"name": "Drucker nicht erreichbar", "t": "service", "schritte": [["service", "Bei der Elektro Wagner OHG kann die ganze Buchhaltung nicht mehr drucken. Ein Ticket wird angelegt.", "Wie wird der Fall nach ITIL eingeordnet?", "Incident (Störung)", "Service Request (Serviceanfrage)|Change (Änderung)|Problem (Ursachenanalyse)", "Eine ungeplante Unterbrechung eines Dienstes ist ein Incident. Ein Problem wird erst angelegt, wenn die Ursache wiederkehrender Störungen gesucht wird."], ["osi", "Ein ping auf den Drucker liefert „Zielhost nicht erreichbar“. Am Netzwerkanschluss des Druckers leuchtet keine LED.", "Auf welcher OSI-Schicht liegt der Fehler vermutlich?", "Schicht 1 (Bitübertragung)", "Schicht 3 (Vermittlung)|Schicht 4 (Transport)|Schicht 7 (Anwendung)", "Keine Link-LED heißt: keine physische Verbi     zwischen: [[`FAZ von ${N[i]}`, faz[i], 0.01, 'Tage'], [`SAZ von ${N[i]}`, saz[i], 0.01, 'Tage']] };

function aufgabeNutzwert() {
