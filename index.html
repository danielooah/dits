zw. extern, schützt vor Ransomware und Brand)."], ["li", "**Generationenprinzip (Großvater-Vater-Sohn):** tägliche Sicherungen (Sohn), wöchentliche (Vater), monatliche (Großvater); ältere Medien werden rotierend wiederverwendet."], ["li", "**RPO** = wie viel Datenverlust ist maximal okay (bestimmt, wie oft gesichert wird). **RTO** = wie schnell muss das System wieder laufen."], ["li", "Backups regelmäßig per Test-Wiederherstellung prüfen."], ["li", "**Weitere Verfahren:** Snapshot (Systemzustand zum Zeitpunkt X, kein Ersatz für ein Backup), Forever Incremental (einmal voll, danach nur geänderte Blöcke), CDP (jede Änderung sofort, RPO nahe null)."], ["li", "**3-2-1-1-0:** zusätzlich 1 Kopie offline bzw. unveränderbar und 0 Fehler beim Restore-Test. **Türme von Hanoi:** Medien werden exponentiell seltener überschrieben (A jeden 2., B jeden 4., C jeden 8. Tag …)."], ["li", "**Kennzahlen:** MTBF = mittlere Zeit zwischen Ausfällen, MTTR = mittlere Reparaturzeit, MTTD = Zeit bis zur Erkennung. Verfügbarkeit = MTBF ÷ (MTBF + MTTR)."], ["li", "**BIA (Business Impact Analysis):** kritische Prozesse, Ausfallfolgen und -kosten ermitteln → daraus RTO und RPO. Beispiel: 4 h Ausfall × 7.500 €/h + 4.000 € einmalig = 34.000 €."], ["li", "**Georedundanz:** zweites Rechenzentrum, das alles übernehmen kann; BSI empfiehlt mind. 200 km Abstand (im Einzelfall nicht unter 100 km, nicht rechtlich bindend). KRITIS-Betreiber (Energie, Wasser, Gesundheit, IT/TK …) registrieren sich ab bestimmten Schwellenwerten beim BSI; seit dem NIS-2-Umsetzungsgesetz (2025) auch viele weitere Unternehmen."], ["h", "USV (unterbrechungsfreie Stromversorgung)"], ["tab", [["Typ", "Klasse", "Funktion", "Umschaltzeit", "Einsatz"], ["Offline / Standby", "VFD", "Netzstrom geht direkt durch, bei Ausfall Umschalten auf Akku", "ca. 2–10 ms", "Einzel-PC"], ["Line-Interactive", "VI", "wie Offline + gleicht Spannungsschwankungen aus", "ca. 2–4 ms", "kleine Server, Switches"], ["Online / Doppelwandler", "VFI", "Strom läuft immer über Akku und Wechselrichter", "**0 ms**", "Server, Rechenzentrum"]]], ["li", "USVs werden in **VA** (Scheinleistung) angegeben. Wirkleistung in W = VA × Leistungsfaktor (cos φ), z. B. 1500 VA × 0,6 = 900 W."], ["li", "**Autonomiezeit** = wie lange der Akku die Last hält; muss reichen, um Server sauber herunterzufahren (per USB/Netzwerk-Signal)."]]}, {"t": "osi", "bloecke": [["p", "Das OSI-Modell teilt Netzwerkkommunikation in 7 Schichten. Schichten 1–3 transportieren die Daten, Schichten 4–7 bereiten sie für Anwendungen auf. Eselsbrücke von unten: **„P**lease **D**o **N**ot **T**hrow **S**ausage **P**izza **A**way“."], ["h", "Die 7 Schichten"], ["tab", [["Nr.", "Schicht", "Aufgabe", "Protokolle", "Geräte", "Adresse / Einheit"], ["7", "Anwendung (Application)", "Inhalt und Dienste für Programme", "HTTP(S), DNS, DHCP, SMTP, IMAP, FTP, SSH", "Webserver, Application-Firewall, Proxy", "Daten"], ["6", "Darstellung (Presentation)", "Kodierung, Kompression, Verschlüsselung", "ASCII, UTF-8, JSON, TLS-Verschlüsselung", "–", "Daten"], ["5", "Sitzung (Session)", "Sitzung auf-/abbauen, wiederaufnehmen", "NetBIOS, RPC, SSH-Kanäle", "–", "Daten"], ["4", "Transport", "Segmentierung, Reihenfolge, Zuordnung per Port", "TCP, UDP", "Portfilter-Firewall, NAT/PAT", "Port / Segment"], ["3", "Vermittlung (Network)", "Logische Adressierung, Routing", "IP, ICMP, RIP, (ARP)", "Router, Layer-3-Switch", "IP-Adresse / Paket"], ["2", "Sicherung (Data Link)", "Physische Adressierung im LAN, Fehlererkennung", "Ethernet, MAC, CSMA/CD, ARP", "Switch, Bridge, Access Point", "MAC-Adresse / Frame"], ["1", "Bitübertragung (Physical)", "Signale über Kabel/Funk", "Kupfer, Glasfaser, Funk", "Hub, Repeater, Kabel, Netzwerkkarte", "Bits"]]], ["p", "In der Praxis (TCP/IP) sind Schicht 5 und 6 nicht eigenständig; ihre Aufgaben stecken in TLS, SSH oder der Anwendung."], ["p", "**DoD- bzw. TCP/IP-Modell (4 Schichten):** Anwendung (OSI 5–7) · Transport (4) · Internet (3) · Netzzugang (1–2)."], ["h", "Wichtige Ports"], ["p", "Ports 0–1023 sind **Well-Known Ports** (IANA), 1024–49151 registriert, 49152–65535 dynamisch (Quellports der Clients)."], ["tab", [["Bereich", "Port", "Protokoll", "Dienst"], ["Web", "80 / 443", "TCP", "HTTP / HTTPS"], ["Web", "8080", "TCP", "HTTP-Alternative, Proxy, Geräte-Weboberflächen"], ["Fernzugriff", "22", "TCP", "SSH, SFTP"], ["Fernzugriff", "23", "TCP", "Telnet (unverschlüsselt, veraltet)"], ["Fernzugriff", "3389", "TCP", "RDP"], ["Fernzugriff", "5900", "TCP", "VNC"], ["Mail", "25", "TCP", "SMTP (Server zu Server)"], ["Mail", "465 / 587", "TCP", "SMTPS / SMTP Submission mit TLS"], ["Mail", "110 / 995", "TCP", "POP3 / POP3S"], ["Mail", "143 / 993", "TCP", "IMAP / IMAPS"], ["Dateien", "20/21", "TCP", "FTP"], ["Dateien", "990", "TCP", "FTPS"], ["Dateien", "69", "UDP", "TFTP (PXE-Boot, Switch-Konfigs, Firmware)"], ["Dateien", "445", "TCP", "SMB (Windows-Freigaben)"], ["Infrastruktur", "53", "UDP/TCP", "DNS"], ["Infrastruktur", "67/68", "UDP", "DHCP (Server/Client)"], ["Infrastruktur", "123", "UDP", "NTP"], ["Active Directory", "88", "TCP/UDP", "Kerberos (Domänenanmeldung)"], ["Active Directory", "135", "TCP", "RPC"], ["Active Directory", "137–139", "UDP/TCP", "NetBIOS (veraltet)"], ["Active Directory", "389 / 636", "TCP", "LDAP / LDAPS"], ["Active Directory", "3268", "TCP", "Global Catalog"], ["Active Directory", "5985 / 5986", "TCP", "WinRM (PowerShell-Remoting)"], ["VPN", "500 / 4500", "UDP", "IPsec IKE / NAT-Traversal"], ["VPN", "1194", "UDP", "OpenVPN"], ["VPN", "51820", "UDP", "WireGuard"], ["Authentifizierung", "1812 / 1813", "UDP", "RADIUS (Anmeldung / Accounting)"], ["Management", "161 / 162", "UDP", "SNMP / SNMP-Traps"], ["Management", "514", "UDP", "Syslog"], ["Drucker", "631", "TCP", "IPP"], ["Drucker", "9100", "TCP", "RAW / JetDirect"], ["VoIP", "5060 / 5061", "UDP/TCP", "SIP / SIP über TLS"], ["Datenbank", "1433", "TCP", "Microsoft SQL Server"], ["Datenbank", "3306", "TCP", "MySQL / MariaDB"]]], ["p", "Besonders prüfungsrelevant für Firewall-Aufgaben: 22, 25, 53, 80, 443, 3389, 88, 465/587, 500/4500, 636, 1812, 5060."], ["p", "**Socket** = IP + Port + Protokoll. Eine Verbindung ist eindeutig durch das **5-Tupel**: Quell-IP, Quell-Port, Ziel-IP, Ziel-Port, Protokoll."], ["h", "Header und Kapselung"], ["p", "Jede Schicht setzt beim Senden ihren Header davor:"], ["li", "**TCP-Header (L4):** Quell-/Zielport, Sequenznummer, ACK-Nummer, Flags (SYN, ACK, FIN), Fenstergröße, Prüfsumme."], ["li", "**IP-Header (L3):** Version, Gesamtlänge, **TTL** (wird pro Router um 1 kleiner, bei 0 verworfen), Protokoll (TCP/UDP), Quell-/Ziel-IP."], ["li", "**Ethernet-Frame (L2):** Ziel-/Quell-MAC, Typ (z. B. IPv4, ARP), Nutzdaten, **FCS** (Prüfsumme). Max. 1518 Byte, davon 1500 Byte Nutzdaten (MTU)."], ["p", "**Wichtig:** Auf dem Weg durchs Netz bleiben die IP-Adressen gleich, die **MAC-Adressen ändern sich an jedem Router** (Absender = Router, Ziel = nächster Hop)."], ["h", "Schicht 1: Verkabelung"], ["p", "**Strukturierte Verkabelung:** **Primär** = zwischen Gebäuden (Glasfaser), **Sekundär** = Gebäudeverteiler zu Etagenverteiler (Glasfaser), **Tertiär** = Etagenverteiler bis zur Netzwerkdose (Kupfer). Im Verteilerschrank: Switch (aktiv) + Patchfeld (passiv) → Verlegekabel → Dose → Patchkabel → Endgerät."], ["tab", [["Kupferkabel", "Frequenz", "Typisch", "Ethernet-Standard"], ["Cat 5e", "100 MHz", "1 Gbit/s", "1000BASE-T"], ["Cat 6", "250 MHz", "1 Gbit/s, 10 Gbit/s bis 55 m", "1000BASE-T"], ["Cat 6A", "500 MHz", "10 Gbit/s", "10GBASE-T"], ["Cat 7", "600 MHz", "10 Gbit/s", "10GBASE-T"], ["Cat 8", "2000 MHz", "25/40 Gbit/s bis 30 m (Rechenzentrum)", "25G/40GBASE-T"]]], ["li", "Kupfer (Twisted Pair) max. **100 m** wegen Dämpfung und Übersprechen. Schirmung: U/UTP (keine), F/UTP (Folie gesamt), S/FTP (Geflecht gesamt + Folie je Paar)."], ["li", "**Glasfaser:** immun gegen Störungen, abhörsicher, teurer. **Multimode** = dicker Kern, kürzere Strecken (ca. 300–550 m bei 10 Gbit/s), günstiger. **Singlemode** = dünner Kern, bis 10–100 km, höchste Bandbreite über Distanz."], ["li", "**Netzwerktypen:** LAN (Gebäude), MAN (Stadt), WAN (Land/weltweit)."], ["li", "**WAN-Anschlüsse:** asymmetrisch = Download > Upload (ADSL bis 16, VDSL bis 52, VDSL2 bis 100/250 Mbit/s); symmetrisch = gleich schnell (SDSL, Standleitung, MPLS)."], ["li", "**Topologien:** Stern (heute Standard, Switch in der Mitte), Bus (altes Koax-Ethernet), Ring (Token Ring, FDDI), Mesh (viele Wege, ausfallsicher)."], ["li", "**Weitere Topologien:** Baum (erweiterter Stern, große Netze), Linie (Gerät an Gerät), vollvermascht mit n × (n − 1) ÷ 2 Leitungen. **Patchfeld** = Rangierverteiler zwischen fest verlegtem Kabel und Switch. **Zugriff:** CSMA/CD (altes Ethernet, Kollision erkennen), CSMA/CA (WLAN, Kollision vermeiden)."], ["h", "Schicht 2: Switching"], ["li", "**MAC-Adresse:** 48 Bit, 12 Hex-Zeichen, z. B. 5A-34-36-AC-C3-7F. Erste 24 Bit = Hersteller (OUI), letzte 24 Bit = Gerätenummer."], ["li", "**Switch** arbeitet mit der **MAC-Tabelle (CAM)**: **Learning** (Quell-MAC + Port merken) → **Forwarding** (bekanntes Ziel gezielt, unbekanntes Ziel an alle Ports fluten) → **Aging** (alte Einträge verfallen)."], ["li", "Hub schickt alles an alle (Schicht 1); Switch nur an den richtigen Port."], ["li", "Switches leiten **keinen netzübergreifenden Verkehr** weiter: Alles an einem Switch bzw. einer Kaskade ist eine Broadcast-Domäne. Trennung geht nur per Router oder VLAN."], ["li", "**Physische Topologie** = wie verkabelt (Schränke, Ports, Uplinks). **Logische Topologie** = welche Netze/VLANs es gibt und wer mit wem darf. Mehrere logische Netze können über dieselbe Verkabelung laufen (VLAN-Tagging)."], ["h", "VLAN und Spanning Tree"], ["li", "**VLAN (IEEE 802.1Q):** teilt einen physischen Switch in mehrere logische Netze. Jedes VLAN ist eine eigene Broadcast-Domäne. VLAN-ID 1–4094 (12 Bit) in einem 4-Byte-Tag im Ethernet-Frame."], ["li", "**Access-Port** (untagged): genau ein VLAN, für Endgeräte. **Trunk-Port** (tagged): mehrere VLANs über ein Kabel, zwischen Switches oder zum Router."], ["li", "Zwischen VLANs geht es nur über **Router oder Layer-3-Switch** (Inter-VLAN-Routing), dort greifen dann Firewall-Regeln/ACLs."], ["li", "**Vorteile:** Sicherheit (Gäste, VoIP, Server getrennt), weniger Broadcasts, flexibel ohne Umverkabeln."], ["li", "**Spanning Tree (STP, IEEE 802.1D):** verhindert Schleifen bei redundant verkabelten Switches. Ohne STP kreisen Broadcasts endlos (Broadcast-Sturm, Netz steht). STP wählt eine **Root Bridge** und blockiert redundante Wege, bis einer ausfällt. **RSTP (802.1w)** reagiert in Sekunden statt ca. 30–50 s."], ["li", "**Link Aggregation (LACP):** mehrere Kabel zwischen zwei Switches bündeln = mehr Bandbreite + Ausfallsicherheit."], ["h", "Schicht 4: TCP und UDP"], ["tab", [["", "TCP", "UDP"], ["Verbindung", "verbindungsorientiert (3-Wege-Handshake)", "verbindungslos"], ["Zuverlässigkeit", "Bestätigung (ACK), Reihenfolge, Neusendung", "keine Garantie, nur Prüfsumme"], ["Overhead", "höher", "gering, schnell"], ["Einsatz", "HTTP(S), Mail, FTP, SSH, RDP", "DNS, DHCP, NTP, SNMP, VoIP, Streaming, Gaming"]]], ["p", "**3-Wege-Handshake:** Client → **SYN** (Seq = x) → Server → **SYN-ACK** (Seq = y, Ack = x+1) → Client → **ACK** (Ack = y+1) → Verbindung steht. Der dritte Schritt beweist, dass auch der Rückweg funktioniert. Abbau mit FIN/ACK."]]}, {"t": "ip", "bloecke": [["p", "IPv4-Adressen, Subnetting, IPv6 und Zahlensysteme – die Rechenwege findest du auch in der Formelsammlung."], ["h", "Schicht 3: IP, ARP und Routing"], ["p", "**Kommunikationsablauf:**"], ["li", "Host prüft per **AND-Verknüpfung** (IP UND Subnetzmaske), ob das Ziel im eigenen Netz liegt.", "1"], ["li", "**Gleiches Netz:** ARP-Broadcast „Wer hat 172.16.0.20?“ → Ziel antwortet mit MAC → Frame direkt an das Ziel.", "2"], ["li", "**Anderes Netz:** ARP nach der MAC des **Default-Gateways** → Frame an den Router → Router sucht in der Routingtabelle den nächsten Hop → ARP im Zielnetz → Zustellung.", "3"], ["li", "**ICMP:** Fehler- und Diagnosemeldungen (Ping, „Ziel nicht erreichbar“, TTL abgelaufen). Sendet selbst nichts erneut."], ["li", "**RIP:** Routing-Protokoll für kleine Netze, Metrik = Hop-Anzahl, max. 15 Hops. Größere Netze: OSPF, im Internet BGP."], ["li", "**Routingprotokolle einordnen:** IGP innerhalb eines autonomen Systems (RIP = Distanzvektor, OSPF = Link-State), EGP zwischen autonomen Systemen (BGP = Pfadvektor). Statisch = von Hand, dynamisch = per Protokoll. Der längste passende Präfix gewinnt."], ["li", "**ARP-Arten:** Gratuitous ARP (eigene IP/MAC ungefragt verkünden, Konflikte erkennen), Proxy-ARP (Router antwortet stellvertretend), RARP (MAC → IP, veraltet)."], ["h", "IPv4"], ["p", "32 Bit, 4 Oktette. Subnetzmaske trennt Netz- und Hostteil, z. B. 255.255.255.192 = /26."], ["tab", [["Klasse", "1. Oktett", "Standardmaske", "Privater Bereich"], ["A", "0–127", "/8", "10.0.0.0/8"], ["B", "128–191", "/16", "172.16.0.0/12 (172.16.0.0 – 172.31.255.255)"], ["C", "192–223", "/24", "192.168.0.0/16"], ["D", "224–239", "–", "Multicast"], ["E", "240–255", "–", "Experimentell"]]], ["p", "Sonderadressen: **127.0.0.1** Loopback, **169.254.0.0/16** APIPA (kein DHCP erreicht). Klassen sind historisch; heute plant man klassenlos mit CIDR. Rechenweg fürs Subnetting: siehe Formelsammlung."], ["p", "**Vergaberegeln und Fehlerbilder:**"], ["tab", [["Symptom", "Ursache"], ["Lokales Netz geht, Internet/andere Netze nicht", "Gateway fehlt oder falsch"], ["Manche Geräte erreichbar, andere nicht", "Subnetzmasken uneinheitlich"], ["Zwei Geräte stören sich, Verbindung bricht ab", "IP doppelt vergeben"], ["Zugriff per IP klappt, per Name nicht", "DNS fehlt oder falsch"], ["Adresse 169.254.x.x", "DHCP-Server nicht erreichbar"]]], ["h", "IPv6"], ["li", "128 Bit, 8 Blöcke (Hextette) à 4 Hex-Ziffern. Standard: erste 64 Bit Netz, letzte 64 Bit Host (Interface-ID)."], ["li", "**Kürzen:** führende Nullen pro Block weglassen; **eine** längste Folge von Null-Blöcken durch `::` ersetzen (nur einmal pro Adresse). 2001:0db8:0000:0000:0000:8a2e:0370:7334 → 2001:db8::8a2e:370:7334."], ["li", "**RFC 5952:** Kleinbuchstaben; bei gleich langen Null-Folgen die linke kürzen; ein einzelner Null-Block bleibt 0. In URLs in eckige Klammern: http://[2001:db8::1]:8080/"], ["li", "**SLAAC und NDP:** Router Advertisements liefern das Präfix, der Host bildet die Interface-ID selbst (Privacy Extensions: zufällig). NDP (Teil von ICMPv6) ersetzt ARP. IPv6 kennt keinen Broadcast, nur Multicast; Header fest 40 Byte, Hop Limit statt TTL."], ["tab", [["Typ", "Präfix", "Vergleichbar mit IPv4"], ["Global Unicast", "2000::/3", "öffentliche Adresse"], ["Unique Local (ULA)", "fc00::/7 (praktisch fd..)", "private Adresse"], ["Link-Local", "fe80::/10", "APIPA, automatisch, nicht routbar"], ["Multicast", "ff00::/8 (ff02::1 alle Knoten)", "Multicast/Broadcast"], ["Loopback", "::1", "127.0.0.1"]]], ["li", "Kein Subnetting mit Hostbits: Jedes LAN bekommt ein **/64**. Ein Kunden-Präfix wird hierarchisch aufgeteilt. /48 vom Provider → 16 Bit bis /64 = 65.536 eigene Netze; /56 → 8 Bit = 256 Netze."], ["li", "**Prüfungsaufgabe /48 in 4 Netze:** 2 Bit borgen → /50. Die 2 Bit sind die ersten Bits des 4. Hextetts: 0000, 4000, 8000, c000 → 2001:ac23:34bc:0000::/50, :4000::/50, :8000::/50, :c000::/50."], ["li", "**Übergang:** **Dual Stack** = Geräte haben IPv4 und IPv6 parallel (DNS: A- und AAAA-Record). **Tunneling** = ein Protokoll im anderen verpackt (6in4, 4in6)."], ["h", "Subnetting IPv4"], ["li", "Bits borgen: 2ᵐ ≥ Anzahl benötigter Subnetze (m = geborgte Bits)", "1"], ["li", "Neue CIDR = alte CIDR + geborgte Bits", "2"], ["li", "Host-Bits = 32 − neue CIDR", "3"], ["li", "Hosts pro Subnetz = 2ʰ − 2 (h = Host-Bits; Netz- und Broadcastadresse zählen nicht)", "4"], ["li", "Blockgröße = 256 − letztes Oktett der Maske ≠ 255", "5"], ["li", "Subnetze ab 0 in Blockgrößen-Schritten zählen", "6"], ["p", "**Beispiel 192.168.16.52/25:**"], ["tab", [["Größe", "Wert", "Weg"], ["Subnetzmaske", "255.255.255.128", "25 Einsen: 11111111.11111111.11111111.10000000"], ["Netzadresse", "192.168.16.0", "IP UND Maske"], ["Broadcast", "192.168.16.127", "alle Host-Bits auf 1"], ["Nutzbare IPs", ".1 bis .126 (126 Stück)", "2⁷ − 2"]]], ["p", "/24 in /27 aufteilen: 3 geborgte Bits → 8 Subnetze mit je 30 Hosts, Blockgröße 32."], ["h", "Zahlensysteme"], ["tab", [["Dezimal", "Binär", "Hex"], ["0", "0000", "0"], ["5", "0101", "5"], ["9", "1001", "9"], ["10", "1010", "A"], ["12", "1100", "C"], ["15", "1111", "F"], ["192", "1100 0000", "C0"], ["255", "1111 1111", "FF"]]], ["li", "**Binär → Dezimal:** Stellenwerte 128, 64, 32, 16, 8, 4, 2, 1 addieren, wo eine 1 steht. 1100 0000 = 128 + 64 = 192."], ["li", "**Dezimal → Binär:** von 128 abwärts prüfen, ob der Wert passt, dann abziehen. 200 = 128 + 64 + 8 = 1100 1000."], ["li", "**Binär ↔ Hex:** Je 4 Bit sind eine Hex-Ziffer. 1100 1000 → 1100 = C, 1000 = 8 → C8."], ["li", "Typische Nutzung: Subnetzmasken (binär), MAC- und IPv6-Adressen (hex)."]]}, {"t": "wlan", "bloecke": [["p", "Für die Prüfung zählen vier Punkte: Standards mit Frequenz und Datenrate, Kanalplanung (1, 6, 11), die Bewertung der Sicherheitsverfahren und Segmentierung mit Firewall."], ["h", "Topologien"], ["li", "**Ad-hoc:** Geräte direkt miteinander, ohne Access Point. Schnell eingerichtet, aber wenig Reichweite und keine zentrale Verwaltung."], ["li", "**Infrastrukturmodus:** Alle Geräte über einen Access Point, der auch ins LAN/Internet verbindet. Standard in Firmen: Roaming über mehrere APs, zentrale Verwaltung, skalierbar."], ["h", "Standards"], ["tab", [["Standard", "Wi-Fi-Name", "Jahr", "Frequenz", "Brutto max."], ["802.11", "–", "1997", "2,4 GHz", "2 Mbit/s"], ["802.11b", "–", "1999", "2,4 GHz", "11 Mbit/s"], ["802.11a/h", "–", "1999", "5 GHz", "54 Mbit/s"], ["802.11g", "–", "2002", "2,4 GHz", "54 Mbit/s"], ["802.11n", "Wi-Fi 4", "2009", "2,4 + 5 GHz", "600 Mbit/s (4 Streams à 150)"], ["802.11ac", "Wi-Fi 5", "2013", "5 GHz", "1.733 Mbit/s mit 4 Streams, bis 6.936 mit 8"], ["802.11ad", "–", "2012", "60 GHz", "6.757 Mbit/s, nur wenige Meter"], ["802.11ax", "Wi-Fi 6 / 6E", "2019/2020", "2,4 + 5 (+ 6) GHz", "ca. 9,6 Gbit/s"]]], ["li", "**Streams (MIMO):** parallele Datenströme über mehrere Antennen. Mehr Streams = mehr Datenrate. Ein Smartphone mit 1×1 ist langsamer als ein Laptop mit 3×3."], ["li", "**Brutto ≠ Praxis:** Bruttowerte sind Laborwerte. Realistisch kommt oft nur die Hälfte oder weniger an (300 Mbit/s brutto ≈ 150–200 netto)."], ["li", "**Gründe:** Protokoll-Overhead, Halbduplex (Senden und Empfangen nicht gleichzeitig), alle Clients teilen sich die Bandbreite, Entfernung und Wände, Störungen, belegte Kanäle, schwächere Client-Hardware."], ["h", "Frequenzbänder"], ["tab", [["Band", "Reichweite", "Kanäle", "Vorteile", "Nachteile"], ["2,4 GHz", "groß, gut durch Wände", "13 in Europa, nur **1, 6, 11** überlappungsfrei", "alte Geräte kompatibel", "langsam, Störungen durch Bluetooth, Mikrowelle, Babyphone"], ["5 GHz", "mittel", "bis ca. 30 ohne Überlappung", "schnell, weniger Störungen", "schlechter durch Wände"], ["6 GHz (Wi-Fi 6E)", "gering", "viele zusätzliche, überlappungsfrei", "schnell, geringe Latenz, entlastet andere Bänder", "neue Hardware nötig, wenige Clients"]]], ["p", "**Kanalproblem 2,4 GHz:** Jeder Kanal ist 20 MHz breit, das Band nur ca. 83 MHz. Gleicher Kanal = Netze teilen sich die Zeit (langsamer). Nachbarkanäle = echte Interferenzen mit Paketverlust (viel schlimmer)."], ["h", "Sicherheitsverfahren bewerten"], ["tab", [["Verfahren", "Funktion", "Bewertung"], ["SSID verstecken", "Netzname wird nicht angezeigt", "**unsicher** – jedes Tool findet ihn"], ["MAC-Filter", "Nur eingetragene MAC-Adressen dürfen rein", "**unsicher** – MAC steht im Klartext im Header, leicht zu fälschen"], ["WEP", "PSK, gleicher Schlüssel für die ganze Sitzung", "**unsicher** – in Minuten geknackt"], ["WPA", "TKIP, Schlüssel wechselt periodisch", "**veraltet** – Übergangslösung"], ["WPA2", "AES, seit 2004", "**sicher** bei starkem Passwort"], ["WPA3", "SAE gegen Brute Force, OWE für offene Netze, seit 2018", "**aktuell am sichersten**"]]], ["p", "**Personal vs. Enterprise:** Personal = ein gemeinsames Passwort (PSK) für alle, gut für zu Hause. Enterprise = jeder meldet sich einzeln über 802.1X und RADIUS an; Pflicht für Firmen, weil ein geleakter PSK sofort allen Zugriff gibt und jeder Wechsel alle Geräte betrifft."], ["h", "WPA-Enterprise (802.1X mit RADIUS)"], ["p", "Drei Rollen: **Supplicant** (Client), **Authenticator** (Access Point oder WLAN-Controller), **Authentication Server** (RADIUS, z. B. Windows NPS mit AD)."], ["li", "Client verbindet sich per Funk mit dem AP, hat aber noch keinen Netzzugriff.", "1"], ["li", "Der AP leitet die EAP-Anmeldung an den RADIUS weiter.", "2"], ["li", "RADIUS prüft die Identität: **EAP-TLS** mit Zertifikaten auf beiden Seiten (empfohlen) oder **PEAP-MSCHAPv2** mit Benutzername und Passwort.", "3"], ["li", "Bei Erfolg: 4-Way-Handshake erzeugt einen eigenen Schlüssel pro Sitzung.", "4"], ["li", "Optional weist RADIUS ein VLAN, ACLs oder Zeitfenster zu, dann ist der Verkehr frei.", "5"], ["p", "**Vorteile:** pro Person nachvollziehbar, Mitarbeiter verlässt Firma → Konto sperren statt alle Geräte umstellen, dynamische VLANs, zentrales Logging."], ["p", "**RADIUS** = Remote Authentication Dial-In User Service, stammt aus der Modem-Einwahl. **AAA:** **Authentication** (wer bist du?), **Authorization** (was darfst du?), **Accounting** (was hast du genutzt?)."], ["h", "Netzwerkdesign"], ["li", "**Alles in einem Netz** ist riskant: Ein geleakter PSK oder ein infiziertes Notebook erreicht sofort alle Server (Lateral Movement)."], ["li", "**Besser:** WLAN in eigene Segmente hinter die Firewall. Je SSID ein VLAN für Mitarbeiter, Gäste und IoT. Gäste bekommen nur Internet, Mitarbeiter nur die nötigen internen Dienste. APs in ein eigenes Management-Netz, Admin-Oberflächen nur aus dem Admin-Netz."], ["li", "**Merksatz:** WPA2/WPA3 schützt die Funkstrecke, Segmentierung + Firewall schützen das Netz dahinter."], ["p", "**Gefahren im WLAN:** Mitlesen (Sniffing), unbefugte Teilnehmer im LAN, **Rogue Access Points** (gefälschte WLANs, über die der Angreifer alles mitliest)."]]}, {"t": "dienste", "bloecke": [["p", "Ohne DHCP, DNS, Verzeichnisdienst und Zeit funktioniert im Netz fast nichts; Management-Dienste halten es beherrschbar."], ["h", "IP-Vergabe"], ["tab", [["Methode", "Vorteil", "Nachteil"], ["Manuell (statisch)", "feste Adresse für Server, Drucker, Router", "fehleranfällig, nicht skalierbar"], ["APIPA 169.254.x.x", "lokal ohne Server", "kein Gateway, nicht routbar → **Fehlersignal**"], ["DHCP", "automatisch, zentral, Reservierungen möglich", "Abhängigkeit vom Server, Rogue-DHCP-Gefahr"]]], ["p", "**DHCP-Ablauf DORA:** **D**iscover (Client-Broadcast) → **O**ffer (Server bietet IP an) → **R**equest (Client nimmt an) → **A**cknowledge (Server bestätigt Lease)."], ["li", "**Lease verlängern:** bei 50 % (T1) per Unicast beim selben Server, bei 87,5 % (T2) per Broadcast, danach neu mit DORA."], ["li", "**Kurze Lease** für Gäste-WLAN (viele wechselnde Geräte), **lange Lease** für Büro-LAN."], ["li", "**Zuordnungsarten:** statisch (Reservierung MAC → IP), automatisch (einmal zugeteilt, dann dauerhaft), dynamisch (nur für die Lease-Dauer)."], ["li", "**Scope** = Adressbereich für ein Subnetz, mit **Ausschlüssen** (statische Geräte), **Reservierungen** (feste IP per MAC) und **Bereichsoptionen**: 3 Gateway, 6 DNS, 15 Domänenname, 42 NTP, 66/67 PXE-Boot."], ["li", "**DHCP-Relay** („ip helper-address“): Router leiten keine Broadcasts weiter. Der Relay auf dem Router/L3-Switch schickt die Anfrage als Unicast an den zentralen DHCP-Server. Jedes Subnetz braucht einen eigenen Scope."], ["h", "DNS"], ["li", "Übersetzt Namen in IP-Adressen und findet Dienste (**MX** = Mailserver, **SRV** = z. B. Domänencontroller). Weitere Einträge: **A** (IPv4), **AAAA** (IPv6), **CNAME** (Alias), **PTR** (Reverse)."], ["li", "Hierarchie: Root „.“ → Top-Level-Domain (.de, .com) → Second-Level (firma.de) → Subdomain (www). Jeder Teilbereich (Zone) hat eigene, autoritative DNS-Server. Es gibt 13 Root-Server-Adressen."], ["li", "**Ablauf:** Client prüft Cache und HOSTS-Datei → fragt Firmen-DNS (rekursiv) → Weiterleitung an Provider-DNS → der fragt iterativ Root → .com → microsoft.com → Antwort zurück zum Client."], ["li", "Alternativen: HOSTS-Datei (lokal, hat Vorrang), NetBIOS/WINS (veraltet, max. 15 Zeichen)."], ["li", "**Servertypen:** Root → TLD → autoritativer Nameserver (Primary mit der Zone, Secondary als Kopie per Zonentransfer); rekursiver Resolver mit Cache; Forwarder leitet alles weiter. Weitere Records: NS, SOA, TXT (SPF, DKIM). Port 53 per UDP, TCP für große Antworten und Zonentransfers."], ["h", "Verzeichnisdienst (Active Directory, LDAP)"], ["li", "Zentrale Verwaltung von Benutzern, Gruppen, Computern und Druckern statt lokaler Konten auf jedem PC (Peer-to-Peer). **LDAP** ist das Protokoll für den Zugriff, AD nutzt dazu Kerberos für die Anmeldung."], ["li", "**Aufbau:** Domäne (z. B. firma.local) → **OUs** (Container nach Abteilung/Standort, für Gruppenrichtlinien und Delegation) → **Blattobjekte** (Benutzer, Gruppen, Computer, Drucker)."], ["li", "**Struktur:** Mehrere Domänen mit gemeinsamem Namensstamm = **Tree** (z. B. firma.dom, hh.firma.dom). Mehrere Trees = **Forest**. Innerhalb eines Forests gelten **automatische Vertrauensstellungen (Trusts)**; zwischen Forests richtet man sie manuell ein."], ["li", "**NTP** synchronisiert die Uhrzeit. Kerberos-Anmeldung und Zertifikate scheitern, wenn die Uhren um mehr als wenige Minuten abweichen (Kerberos: 5 Minuten)."], ["h", "Monitoring und Management"], ["tab", [["Methode", "Prüft", "Vorteil", "Nachteil"], ["Ping (ICMP)", "Erreichbarkeit, Latenz", "einfach, geringe Last", "sagt nichts über Dienste; oft geblockt"], ["Port-Scan", "ob Dienste/Ports offen sind", "genauer als Ping, keine Software nötig", "keine Aussage zur Anwendung; wirkt verdächtig"], ["Agent", "CPU, RAM, Prozesse, Logs", "sehr detailliert", "Software auf jedem System"], ["WMI", "Windows-Details", "ohne Zusatz-Agent", "nur Windows, Rechte nötig"], ["SNMP", "Netzwerkgeräte, Drucker, USV über MIBs", "Standard, herstellerunabhängig", "alte Versionen unsicher (nur v3 verschlüsselt)"]]], ["li", "**SNMP** = Simple Network **Management** Protocol. **Aktives Monitoring** fragt selbst ab (Ping, Checks). **Passives Monitoring** wartet auf Meldungen (SNMP-Traps, Logs, z. B. „Toner leer“). Beides zusammen = hybrides Monitoring."], ["li", "**Deployment/MDM** (z. B. Intune): Geräte, Software und Richtlinien zentral verteilen; MDM speziell für Smartphones/Tablets inkl. Remote-Wipe und BYOD-Trennung."], ["li", "**Patchmanagement:** Updates erkennen, testen, verteilen, überwachen, Rollback einplanen. Die meisten Angriffe nutzen bekannte, ungepatchte Lücken."], ["h", "Mail- und Dateidienste"], ["li", "**SMTP** = senden (Client → Server und Server → Server). **POP3** = abholen und meist vom Server löschen (ein Gerät). **IMAP** = Mails bleiben auf dem Server, Sync über alle Geräte."], ["li", "**FTP** überträgt unverschlüsselt (besser SFTP/FTPS). **SharePoint** = Teamplattform/Intranet, **OneDrive** = persönlicher Cloudspeicher (beide Microsoft 365)."]]}, {"t": "fw", "bloecke": [["p", "Eine Firewall trennt Netze mit unterschiedlichem Vertrauen. In der Prüfung geht es um Regeltabellen, Stateful Inspection, die drei Topologien sowie NAT/PAT und Port Forwarding."], ["h", "Firewall-Typen"], ["tab", [["Typ", "Schicht", "Prüft", "Hinweis"], ["Paket-/Portfilter", "3/4", "Header: IP, Port, Protokoll", "schnell, sieht keinen Inhalt"], ["Stateful Inspection (SPI)", "3/4", "wie oben + Verbindungszustand", "Antworten kommen automatisch zurück"], ["Application-Filter / NGFW / UTM", "7", "auch den Inhalt (Payload)", "IDS/IPS, URL-Filter, TLS-Inspection"], ["Proxy / WAF", "7", "Web-Protokolle", "für HTTP(S) und Webanwendungen"], ["Lokale (Host-)Firewall", "3/4", "auf dem einzelnen Rechner", "z. B. Windows Defender Firewall; nie abschalten!"]]], ["h", "Regeln"], ["li", "Eine Regel nennt Quelle, Ziel, Port/Protokoll und Aktion (erlauben/verweigern)."], ["li", "Regeln werden **von oben nach unten** geprüft, die **erste passende** gilt."], ["li", "Letzte Regel immer **Deny All**: Alles, was nicht erlaubt ist, wird verworfen."], ["li", "**Stateful:** Nur die Richtung, in der die Verbindung beginnt, braucht eine Regel. Die Firewall merkt sich das 5-Tupel in der State-Tabelle und lässt passende Antworten durch. UDP-States laufen per Timeout ab."], ["p", "**Beispiel dreibeinige Firewall:**"], ["tab", [["Nr.", "Quelle", "Ziel", "Port", "Aktion", "Zweck"], ["1", "Any (Internet)", "Webserver DMZ", "80, 443", "erlauben", "Webseite erreichbar"], ["2", "Any (Internet)", "Mailserver DMZ", "25", "erlauben", "Mails empfangen"], ["3", "Mailserver DMZ", "Any", "25", "erlauben", "Mails senden"], ["4", "LAN 10.0.0.0/8", "Any", "80, 443", "erlauben", "Surfen (Rückweg per Stateful)"], ["5", "Any", "Any", "Any", "verweigern", "Deny All"]]], ["h", "Topologien"], ["tab", [["Topologie", "Aufbau", "Geeignet für", "Vor- und Nachteile"], ["Zweibeinig", "Internet – FW – LAN", "Privat, kleine Firmen ohne eigene Server nach außen", "günstig, einfach; Freigaben nach innen öffnen direkt das LAN"], ["Dreibeinig", "eine FW mit Internet, LAN und **DMZ**", "Firmen mit Web-/Mail-/VPN-Server", "DMZ als Pufferzone; FW ist Single Point of Failure"], ["Back-to-Back", "Internet – externe FW – DMZ – interne FW – LAN", "hohe Sicherheitsanforderungen", "zwei Barrieren, ideal von **zwei Herstellern**; teurer, aufwendiger"]]], ["li", "**DMZ:** eigenes Segment für öffentlich erreichbare Server. Von dort nur minimale, kontrollierte Zugriffe ins LAN."], ["li", "**North-South** = Verkehr rein/raus (Perimeter-Firewall). **East-West** = Verkehr innerhalb des Netzes (Segmentierung, Host-Firewall)."], ["h", "NAT und PAT"], ["p", "Private IPs werden im Internet nicht geroutet. Der Router/die Firewall tauscht beim Rausgehen die private Quell-IP gegen die öffentliche und merkt sich die Zuordnung in der **NAT-Tabelle**."], ["tab", [["Art", "Zuordnung", "Hinweis"], ["Statisches NAT", "1 privat ↔ 1 öffentlich", "fest, z. B. für Server"], ["Dynamisches NAT", "viele ↔ Pool öffentlicher IPs", "keine Portänderung"], ["PAT (NAT Overload)", "viele → **1** öffentliche IP", "unterscheidet über die **Ports**; Standard bei jedem DSL-Router"]]], ["p", "**Port Forwarding (DNAT):** feste Regel von außen nach innen, z. B. 212.31.20.125:3389 → 10.0.0.9:3389 (RDP). Braucht zusätzlich eine erlaubende Firewall-Regel und öffnet eine Angriffsfläche. Pro öffentlicher IP kann ein Port nur auf ein internes Ziel zeigen. Besser in der DMZ."], ["p", "NAT ist **kein Sicherheitsfeature**; Schutz bringt die Stateful-Policy."], ["h", "VPN"], ["tab", [["Art", "Verbindet", "Typische Technik", "Merkmal"], ["End-to-End", "Gerät ↔ Gerät / einzelne Anwendung", "TLS, HTTPS", "nur dieser Datenstrom geschützt"], ["End-to-Site (Remote Access)", "Laptop ↔ Firmennetz", "SSL-VPN, OpenVPN, WireGuard, IPsec", "VPN-Client nötig; SSL über Port 443 kommt fast überall durch"], ["Site-to-Site", "Standort ↔ Standort", "IPsec (Schicht 3) zwischen zwei Routern", "Clients brauchen keine Software; IPsec + NAT braucht Sonderkonfiguration"]]]]}, {"t": "virt", "bloecke": [["p", "Prüfungsklassiker sind Typ 1 vs. Typ 2, VM vs. Container und wer bei IaaS, PaaS und SaaS was verwaltet."], ["h", "Hypervisor Typ 1 vs. Typ 2"], ["tab", [["", "Typ 1 – Bare Metal", "Typ 2 – Hosted"], ["Läuft auf", "direkt auf der Hardware", "als Programm auf einem Host-OS"], ["Overhead", "sehr niedrig", "moderat bis hoch"], ["Einsatz", "Rechenzentrum, Server, Cloud", "Desktop, Test, Entwicklung"], ["Beispiele", "VMware ESXi, Microsoft Hyper-V, KVM", "VMware Workstation, VirtualBox, Parallels"], ["Nachteil", "aufwendiger einzurichten", "Host-OS verbraucht Ressourcen"], ["", "", ""]]], ["h", "Virtualisierungsarten im Überblick"], ["tab", [["Art", "Prinzip", "Overhead", "Beispiele"], ["Vollvirtualisierung", "Komplette Hardware wird nachgebildet, Gast-OS merkt nichts, keine Anpassung nötig", "hoch", "ESXi, Hyper-V, VirtualBox"], ["Paravirtualisierung", "Gast-OS ist angepasst und spricht direkt mit dem Hypervisor", "niedrig", "Xen"], ["Hybrid", "Mischung aus Voll- und Paravirtualisierung", "je nach Umsetzung", "Xen"], ["Container", "Nur App + Abhängigkeiten isoliert, alle teilen den Host-Kernel; startet in Sekunden", "sehr niedrig", "Docker, Kubernetes, LXC, Podman"], ["OS-Virtualisierung", "Mehrere isolierte Umgebungen auf einem Kernel; Grundlage für Container", "sehr niedrig", "Solaris Zones, BSD Jails, Linux Namespaces"], ["Applikation", "Einzelne Anwendung läuft gekapselt, vermeidet Versionskonflikte", "moderat", "App-V, ThinApp, Citrix Virtual Apps"], ["Netzwerk", "Switches/Router als virtuelle Netze", "sehr niedrig", "VMware NSX, Cisco ACI, Open vSwitch"], ["Storage", "Platten/SSDs zu einem zentralen Speicherpool", "sehr niedrig", "VMware vSAN, IBM Spectrum Virtualize"]]], ["p", "**VM vs. Container:** Eine VM bringt ein eigenes Betriebssystem mit und ist stärker isoliert. Container teilen den Kernel, sind leichter und schneller, aber weniger isoliert."], ["h", "Cloud-Servicemodelle: Wer verwaltet was?"], ["tab", [["Ebene", "On-Premises", "IaaS", "PaaS", "SaaS"], ["Anwendung", "Kunde", "Kunde", "Kunde", "Anbieter"], ["Daten", "Kunde", "Kunde", "Kunde", "Anbieter\\*"], ["Laufzeit, Middleware", "Kunde", "Kunde", "Anbieter", "Anbieter"], ["Betriebssystem", "Kunde", "Kunde", "Anbieter", "Anbieter"], ["Virtualisierung", "Kunde", "Anbieter", "Anbieter", "Anbieter"], ["Server, Speicher, Netzwerk", "Kunde", "Anbieter", "Anbieter", "Anbieter"], ["Beispiel", "eigener Serverraum", "VMs, Storage, Serverhosting", "Webserver, Datenbank, Entwicklungsumgebung", "Microsoft 365, Google Workspace, Salesforce"]]], ["p", "\\*Die Verantwortung für den Inhalt der Daten (DSGVO) bleibt immer beim Kunden."], ["p", "**Weitere XaaS-Modelle:** FaaS (Funktionen ereignisbasiert), CaaS (Container), DBaaS (Datenbank), STaaS (Speicher), BaaS (Backup), DRaaS (Disaster Recovery), NaaS (VPN, Routing, Firewall), IDaaS (Identitäten), DaaS (virtuelle Desktops), BPaaS (Geschäftsprozesse)."], ["h", "Cloud-Bereitstellungsarten"], ["tab", [["Typ", "Was", "Vorteile", "Nachteile"], ["Public", "Externer Anbieter, viele Kunden teilen Infrastruktur", "Kaum Einstiegskosten, schnell, skalierbar, Pay per Use", "Weniger Kontrolle, Anbieterabhängigkeit, DSGVO prüfen, Internet nötig"], ["Private", "Exklusiv für eine Organisation, eigenes RZ oder beim Provider", "Kontrolle, Sicherheit, für sensible Daten", "Teuer, Hardware muss vorab gekauft werden, weniger elastisch"], ["Hybrid", "Private/On-Prem + Public, verbunden über VPN oder Standleitung", "Sensible Daten bleiben lokal, Lastspitzen in die Public Cloud", "Komplex, braucht stabile Anbindung"], ["Multi", "Mehrere Public-Anbieter parallel", "Weniger Abhängigkeit von einem Anbieter", "Mehr Verwaltung"], ["Community", "Geteilt von Organisationen mit gleichen Anforderungen", "Gemeinsame Standards, geteilte Kosten", "Weniger individuell"]]], ["p", "**Abrechnung:** Pay per Use = nur zahlen, was gerade genutzt wird (z. B. Lastspitzen im Shop). Pay as you Grow = Leistung wächst geplant mit (z. B. weitere Microsoft-365-Lizenzen für neue Mitarbeiter)."], ["p", "**Typisches Argument Public vs. Private:** In der Private Cloud muss Kapazität für Lastspitzen dauerhaft gekauft werden. In der Public Cloud wird sie bei Bedarf zugeschaltet und wieder abgebaut."]]}, {"t": "sec", "bloecke": [["p", "Jede Bedrohung lässt sich einem Schutzziel zuordnen. In der Prüfung heißt das meist: Gefahr erkennen, Schutzziel nennen, passende Maßnahme wählen."], ["h", "Schutzziele"], ["tab", [["Schutzziel", "Kurz", "Typische Gefahr", "Maßnahmen"], ["Vertraulichkeit", "Schutz vor Einsicht", "falsche Berechtigungen, Sniffing", "NTFS-Rechte, BitLocker/EFS, HTTPS, WPA2/3, VPN"], ["Integrität", "Schutz vor Veränderung", "Manipulation, Übertragungsfehler", "Hashwerte, digitale Signaturen"], ["Verfügbarkeit", "Schutz der Nutzbarkeit", "Ransomware, versehentliches Löschen, DDoS", "Backup, Firewall, Endpoint Protection, USV, RAID"], ["Authentizität", "Schutz der Identität", "Spoofing, falsche Identität", "Passwörter, 2FA (Zertifikat, Chipkarte, Fingerabdruck)"]]], ["p", "Eselsbrücke **CIA**: Confidentiality, Integrity, Availability sind die drei Grundwerte; Authentizität kommt oft als viertes Ziel dazu."], ["h", "Schadsoftware"], ["tab", [["Art", "Merkmal", "Schutz"], ["Virus", "hängt sich an Dateien, wird erst beim Öffnen aktiv, vermehrt sich", "Virenscanner, Endpoint Protection, Spamfilter, Schulung"], ["Wurm", "eigenständig, verbreitet sich ohne Zutun über Netzwerk/Mail", "wie Virus + lokale Firewall, Patches"], ["Trojaner", "tarnt sich als harmlos, späht aus, öffnet Fernzugriff", "Endpoint Protection, Rechte, IDS, Proxy"], ["Ransomware", "verschlüsselt Daten, fordert Lösegeld (z. B. WannaCry 2017)", "Offline-Backups, Patches, Schulung"], ["Scareware", "falsche Warnmeldung drängt zu „Schutzprogramm“", "Adblocker, Schulung"], ["Zero-Day-Exploit", "Lücke ist noch unbekannt, kein Patch", "Verhaltenserkennung, Segmentierung, schnell patchen"], ["Insider", "Mitarbeiter handelt böswillig oder unachtsam – eine der häufigsten Ursachen", "Rechte nach Need-to-know, Protokollierung, Schulung"]]], ["h", "Angriffsmethoden"], ["tab", [["Angriff", "Was passiert", "Schutz"], ["DDoS", "Botnetz überlastet ein Ziel mit Anfragen", "Firewall, IDS, Zusammenarbeit mit Provider"], ["Phishing", "Gefälschte Mail oder Webseite lockt Zugangsdaten heraus", "Spamfilter, Virenscanner, Schulung"], ["Spoofing", "Fälschen von MAC, IP, Absender oder Identität", "2FA, IDS, keine reine MAC-Filterung"], ["Sniffing", "Mitlesen von Datenverkehr, z. B. im offenen WLAN", "Verschlüsselung (HTTPS, VPN), Netzzugang schützen"], ["Man in the Middle", "Angreifer sitzt zwischen zwei Systemen, liest und ändert mit", "VPN/Verschlüsselung, Router, DNS und Switches härten"], ["Social Engineering", "Täuscht Menschen statt Technik", "Schulung und Sensibilisierung"]]], ["p", "**Spoofing im Netz:** ARP-Spoofing (gefälschte ARP-Antworten → Verkehr läuft über den Angreifer), IP-Spoofing, DNS-Spoofing bzw. Cache Poisoning, SYN-Flooding mit gefälschten Absendern. **DNSSEC** prüft per Signatur, ob DNS-Antworten echt sind, verschlüsselt aber nicht – dafür gibt es DoH und DoT."], ["h", "Abwehrwerkzeuge"], ["li", "**Virenscanner:** Signaturerkennung (bekannte Muster) + Heuristik (verdächtiges Verhalten); Funde kommen in Quarantäne. Nur mit aktuellen Signaturen wirksam."], ["li", "**IDS:** erkennt verdächtigen Verkehr und alarmiert. **NIDS** überwacht das Netzwerk, **HIDS** einen einzelnen Host. Kann Fehlalarme erzeugen."], ["li", "**Honeypot:** Köder-System, das Angreifer anlockt, um Methoden zu beobachten. Low-Interaction emuliert nur wenige Dienste, High-Interaction ist realistischer, aber riskanter."], ["li", "**Allgemein:** Updates und Patches, Firewall, 2FA, starke Passwörter, minimale Rechte, getestete Backups, Monitoring, Notfallplan, Schulungen. Keine Maßnahme ist 100 % sicher."], ["h", "Verschlüsselung, Hash und Zertifikate"], ["tab", [["Verfahren", "Schlüssel", "Beispiel", "Stärke", "Schwäche"], ["Symmetrisch", "ein gemeinsamer Schlüssel für Ver- und Entschlüsseln", "AES", "schnell", "Schlüssel muss sicher ausgetauscht werden; bei n Personen n·(n−1)/2 Schlüssel"], ["Asymmetrisch", "Schlüsselpaar: öffentlich (Public Key) + privat (Private Key)", "RSA, ECC", "kein geheimer Austausch nötig", "langsam"], ["Hybrid", "asymmetrisch einen Sitzungsschlüssel austauschen, dann symmetrisch weiter", "TLS/HTTPS, VPN", "schnell und sicher", "–"]]], ["li", "**Verschlüsseln:** mit dem **Public Key des Empfängers**; nur er kann mit seinem Private Key entschlüsseln."], ["li", "**Hash:** Einwegfunktion mit fester Länge (SHA-256). Kleinste Änderung = ganz anderer Hashwert → prüft **Integrität**. Passwörter werden gehasht (+ Salt) gespeichert. MD5 und SHA-1 gelten als unsicher."], ["li", "**Digitale Signatur:** Absender bildet den Hash und verschlüsselt ihn mit seinem **Private Key**. Empfänger prüft mit dem **Public Key des Absenders** → Integrität + Authentizität + Nichtabstreitbarkeit."], ["li", "**Zertifikat (X.509):** bestätigt, dass ein Public Key zu einer Person/Webseite gehört. Ausgestellt und signiert von einer **Zertifizierungsstelle (CA)**; das Gesamtsystem heißt **PKI**."], ["h", "BSI IT-Grundschutz und Schutzbedarf"], ["li", "Der Schutzbedarf wird je Schutzziel (Vertraulichkeit, Integrität, Verfügbarkeit) eingestuft: **normal, hoch, sehr hoch**."], ["li", "**Maximumprinzip:** Ein Server erbt den höchsten Schutzbedarf der Anwendungen, die auf ihm laufen."], ["li", "**Kumulationseffekt:** Viele kleine Schäden zusammen ergeben einen höheren Schutzbedarf. **Verteilungseffekt:** Redundanz (z. B. Cluster) kann den Schutzbedarf eines einzelnen Systems senken."]]}, {"t": "dsgvo", "bloecke": [["p", "Datenschutz fragt „Darf ich diese personenbezogenen Daten verarbeiten?“, Datensicherheit fragt „Wie schütze ich Daten vor Unbefugten?“. Die DSGVO gilt seit 25. Mai 2018 EU-weit, das BDSG ergänzt sie in Deutschland."], ["tab", [["Datenschutz", "Datensicherheit"], ["schützt die Person und ihre Privatsphäre", "schützt die Daten selbst"], ["nur personenbezogene Daten", "alle Daten"], ["rechtliche Vorgaben", "technische Umsetzung"]]], ["p", "**Personenbezogene Daten** sind alle Infos zu einer identifizierbaren Person: Name, Anschrift, Geburtsdatum, Bankdaten, Ausweis- und Sozialversicherungsnummer, Aussehen, Eigentum, IP-Adresse, Standort, E-Mail, Cookie-ID, Gesundheitsdaten, Zeugnisse."], ["p", "**Grundregel:** Verarbeitung nur mit Rechtsgrundlage (z. B. Vertrag, gesetzliche Pflicht) oder Einwilligung."], ["h", "Pflichten des Verantwortlichen"], ["tab", [["Pflicht", "Bedeutung", "Beispiel"], ["Rechtmäßigkeit, Zweckbindung, Transparenz", "Nur für den festgelegten Zweck, offen kommuniziert", "Werbeerlaubnis heißt nicht Weitergabe an Dritte"], ["Datenminimierung", "Nur so viel wie nötig, nicht mehr benötigte Daten löschen", "keine Speicherung „auf Vorrat“"], ["Dokumentation", "Welche Daten, warum, mit welcher Anwendung", "Verzeichnis der Verarbeitungstätigkeiten"], ["Sicherheit", "Angemessene TOM nach Stand der Technik", "Passwort, Rechte, Verschlüsselung, Bildschirmsperre"], ["Meldepflicht", "Bei Datenpanne Behörde (binnen 72 h) und ggf. Betroffene informieren", "Praxis-Hack mit Patientendaten"], ["Datenschutzbeauftragter", "Unter bestimmten Umständen Pflicht; intern oder extern", "intern: Befangenheit gegenüber dem Chef"]]], ["p", "**Bußgelder:** bis 10 Mio. € oder 2 % des weltweiten Jahresumsatzes (z. B. Verstöße bei TOM und Dokumentation), bis 20 Mio. € oder 4 % bei schweren Verstößen. Nach BDSG ist auch Freiheitsstrafe bis 3 Jahre möglich."], ["h", "Rechte der Betroffenen"], ["tab", [["Recht", "Inhalt"], ["Auskunft", "Welche Daten werden wofür verarbeitet?"], ["Berichtigung", "Falsche Daten korrigieren lassen"], ["Löschung", "Löschen, außer gesetzliche Aufbewahrung greift (z. B. Rechnungen 8 Jahre seit 2025, Jahresabschlüsse 10 Jahre)"], ["Einschränkung", "Verarbeitung auf bestimmte Zwecke begrenzen"], ["Datenübertragbarkeit", "Daten maschinenlesbar erhalten und mitnehmen"], ["Widerspruch", "Z. B. gegen Werbung; Tipp: Datensatz sperren statt löschen lassen"], ["Widerruf der Einwilligung", "Jederzeit für die Zukunft möglich"]]], ["h", "TOM – technische und organisatorische Maßnahmen"], ["p", "Die acht Kontrollen stammen aus § 9 BDSG (alte Fassung) und sind in Prüfungen weiter Standard."], ["tab", [["Kontrolle", "Frage", "Beispiel"], ["Zutrittskontrolle", "Wer kommt **physisch** in den Raum?", "abgeschlossener Serverraum, Pförtner, Zaun"], ["Zugangskontrolle", "Wer kann sich am **System anmelden**?", "Login, MFA, Passwortrichtlinie, VPN-Anmeldung"], ["Zugriffskontrolle", "Wer darf welche **Daten** lesen/ändern?", "NTFS-Rechte, Rollen in Anwendungen, BitLocker"], ["Weitergabekontrolle", "Sind Daten bei der **Übertragung** geschützt?", "Verschlüsselung, VPN, HTTPS"], ["Eingabekontrolle", "Wer hat wann was **geändert**?", "Protokollierung, Windows-Ereignisanzeige"], ["Auftragskontrolle", "Halten **Dienstleister** sich an Vorgaben?", "AV-Vertrag, z. B. mit dem Steuerbüro"], ["Verfügbarkeitskontrolle", "Sind Daten gegen **Verlust** geschützt?", "Backup, Firewall, USV"], ["Trennungsgebot", "Werden Daten **zweckgetrennt** verarbeitet?", "Buchhaltung und Prüfungsergebnisse auf getrennten Systemen"]]], ["p", "**Merkhilfe Zutritt → Zugang → Zugriff:** erst in den Raum, dann an den Rechner, dann an die Daten."]]}, {"t": "prog", "bloecke": [["p", "In der AP1 kommen kleine Algorithmen (Pseudocode, Struktogramm, PAP) und einfache SQL-Abfragen vor. Alles baut auf drei Grundstrukturen auf: Sequenz, Verzweigung, Schleife."], ["h", "Grundstrukturen"], ["tab", [["Struktur", "Bedeutung", "Pseudocode"], ["Sequenz", "Anweisungen nacheinander", "`a = 5` / `b = a * 2`"], ["Verzweigung", "Bedingung entscheidet", "`WENN alter >= 18 DANN ... SONST ... ENDE WENN`"], ["Kopfgesteuerte Schleife", "prüft **vor** dem Durchlauf, evtl. 0 Durchläufe", "`SOLANGE x < 10 ... ENDE SOLANGE`"], ["Fußgesteuerte Schleife", "prüft **nach** dem Durchlauf, mind. 1 Durchlauf", "`WIEDERHOLE ... BIS x >= 10`"], ["Zählschleife", "feste Anzahl", "`FÜR i VON 1 BIS 10 ... ENDE FÜR`"]]], ["p", "**Datentypen:** Integer (Ganzzahl), Float/Double (Kommazahl), String (Text), Boolean (wahr/falsch), Array (Liste)."], ["h", "Darstellungsformen"], ["li", "**Struktogramm (Nassi-Shneiderman):** Blöcke ineinander geschachtelt; Verzweigung als Dreieck mit Ja/Nein-Spalten. Keine Sprünge möglich."], ["li", "**Programmablaufplan (PAP, DIN 66001):** Oval = Start/Ende, Rechteck = Anweisung, Raute = Verzweigung, Parallelogramm = Ein-/Ausgabe, Pfeile = Ablauf."], ["h", "SQL"], ["p", "**Primärschlüssel** identifiziert eine Zeile eindeutig; **Fremdschlüssel** verweist auf den Primärschlüssel einer anderen Tabelle."], ["code", "-- Abfragen\nSELECT name, ort FROM kunde WHERE ort = 'Hamburg' ORDER BY name;\n\n-- Zählen und gruppieren\nSELECT ort, COUNT(*) AS anzahl FROM kunde GROUP BY ort HAVING COUNT(*) > 5;\n\n-- Zwei Tabellen verbinden\nSELECT k.name, a.datum FROM kunde k\nJOIN auftrag a ON a.kunden_id = k.id;\n\n-- Ändern\nINSERT INTO kunde (name, ort) VALUES ('Müller', 'Bremen');\nUPDATE kunde SET ort = 'Kiel' WHERE id = 7;\nDELETE FROM kunde WHERE id = 7;"], ["li", "Aggregatfunktionen: COUNT, SUM, AVG, MIN, MAX. **WHERE** filtert Zeilen vor dem Gruppieren, **HAVING** filtert Gruppen danach."], ["li", "UPDATE und DELETE ohne WHERE treffen **alle** Zeilen – beliebte Prüfungsfalle."]]}, {"t": "pm", "bloecke": [["p", "Ein Projekt ist einmalig, zeitlich begrenzt, hat ein klares Ziel und ein Budget. In der Prüfung kommen vor allem Lasten-/Pflichtenheft, magisches Dreieck und Netzplan."], ["li", "**Phasen:** Initialisierung → Definition → Planung → Durchführung → Abschluss."], ["li", "**Magisches Dreieck:** Zeit, Kosten, Qualität/Leistung hängen zusammen. Ändert sich eine Größe, ändern sich die anderen."], ["li", "**SMART-Ziele:** Spezifisch, Messbar, Attraktiv/Akzeptiert, Realistisch, Terminiert."], ["li", "**Lastenheft** = vom **Auftraggeber**: Was und wofür. **Pflichtenheft** = vom **Auftragnehmer**: Wie und womit."], ["li", "**Stakeholder:** alle, die vom Projekt betroffen sind oder es beeinflussen (Kunde, Nutzer, Geschäftsführung, Betriebsrat)."], ["li", "**Vorgehensmodelle:** Wasserfall (Phasen nacheinander, gut planbar), V-Modell (jede Phase mit Testphase), Scrum (agil, Sprints von 1–4 Wochen, Rollen Product Owner, Scrum Master, Team)."], ["li", "**Gantt-Diagramm:** Balken auf einer Zeitachse, zeigt Dauer und Reihenfolge der Vorgänge."], ["h", "Netzplan"], ["p", "Jeder Vorgang hat: **FAZ/FEZ** (frühester Anfang/Ende) und **SAZ/SEZ** (spätester Anfang/Ende)."], ["li", "**Vorwärtsrechnung:** FEZ = FAZ + Dauer. FAZ des Nachfolgers = größter FEZ aller Vorgänger.", "1"], ["li", "**Rückwärtsrechnung:** SAZ = SEZ − Dauer. SEZ des Vorgängers = kleinster SAZ aller Nachfolger.", "2"], ["li", "**Gesamtpuffer** GP = SAZ − FAZ (um so viel darf der Vorgang sich verspäten, ohne das Projektende zu gefährden).", "3"], ["li", "**Freier Puffer** FP = FAZ des Nachfolgers − FEZ (Verspätung ohne Auswirkung auf den Nachfolger).", "4"], ["li", "**Kritischer Pfad** = alle Vorgänge mit GP = 0. Jede Verzögerung dort verschiebt das Projektende.", "5"]]}, {"t": "kauf", "bloecke": [["p", "Vor einer Anschaffung vergleicht man Angebote nach Preis (quantitativ) und nach Kriterien (qualitativ, Nutzwertanalyse) und prüft, ob Kauf, Miete oder Leasing günstiger ist."], ["h", "Nutzwertanalyse"], ["li", "Kriterien festlegen und gewichten (Summe = 100 %).", "1"], ["li", "Jedes Angebot pro Kriterium bewerten (z. B. 1–10 Punkte).", "2"], ["li", "Punkte × Gewichtung, dann aufsummieren. Die höchste Summe gewinnt.", "3"], ["tab", [["Kriterium", "Gewicht", "Angebot A Punkte", "A gewichtet", "Angebot B Punkte", "B gewichtet"], ["Preis", "40 %", "8", "3,2", "6", "2,4"], ["Leistung", "35 %", "6", "2,1", "9", "3,15"], ["Service", "25 %", "7", "1,75", "8", "2,0"], ["**Summe**", "100 %", "", "**7,05**", "", "**7,55** → B"]]], ["h", "Kauf, Miete, Leasing"], ["tab", [["", "Kauf", "Miete", "Leasing"], ["Eigentum", "sofort beim Käufer", "bleibt beim Vermieter", "bleibt beim Leasinggeber"], ["Kapital", "hoher Betrag auf einmal", "laufende Kosten, kürzbar", "feste Raten über Vertragslaufzeit"], ["Flexibilität", "gering", "hoch, kurz kündbar", "mittel, Austausch nach Laufzeit"], ["Steuer", "Abschreibung über Nutzungsdauer", "Kosten sofort absetzbar", "Raten als Betriebsausgaben"]]], ["h", "Kaufvertrag kurz"], ["li", "Entsteht durch zwei übereinstimmende Willenserklärungen: **Antrag + Annahme**."], ["li", "**Gewährleistung** (gesetzlich, 2 Jahre beim Verkauf an Verbraucher) ≠ **Garantie** (freiwillig vom Hersteller)."], ["li", "Bei Mangel zuerst **Nacherfüllung** (Reparatur oder Ersatz), erst danach Rücktritt, Minderung oder Schadensersatz."], ["li", "Kaufvertragsstörungen: mangelhafte Lieferung, Lieferverzug, Annahmeverzug, Zahlungsverzug."], ["h", "Wirtschaftlichkeit"], ["formel", "Amortisationszeit = Anschaffungskosten ÷ jährliche Einsparung"], ["formel", "Energiekosten = Leistung [W] × Stunden ÷ 1000 × Preis pro kWh"], ["p", "**Beispiel:** PC mit 200 W, 8 h am Tag, 220 Arbeitstage, 0,30 €/kWh → 200 × 8 × 220 ÷ 1000 = 352 kWh × 0,30 € = **105,60 € pro Jahr**. Ein neues Gerät mit 80 W spart 63,36 € im Jahr; kostet es 400 €, amortisiert es sich nach 400 ÷ 63,36 ≈ **6,3 Jahren**."], ["h", "Volkswirtschaft-Grundlagen (WiSo, AP2)"], ["li", "**Wunsch → Bedürfnis → Bedarf → Nachfrage:** Bedarf = Bedürfnis mit Kaufkraft; Nachfrage = Bedarf, der am Markt auftritt."], ["li", "**Ökonomisches Prinzip:** Maximalprinzip (Mittel fest, Nutzen maximal), Minimalprinzip (Ziel fest, Mittel minimal)."], ["li", "**Sektoren:** primär = Urproduktion, sekundär = Weiterverarbeitung, tertiär = Dienstleistung."], ["li", "**Markt:** Gleichgewichtspreis im Schnittpunkt von Angebot und Nachfrage; Preis zu hoch → Angebotsüberhang, zu niedrig → Nachfrageüberhang. Marktformen: Polypol, Oligopol, Monopol."], ["li", "**Güter:** inferior = Nachfrage sinkt bei steigendem Einkommen, superior = steigt mit dem Einkommen, oft überproportional; Substitutions- vs. Komplementärgüter."], ["li", "**Zielbereiche:** ökonomisch, sozial, ökologisch – Zielkonflikt oder Zielharmonie."]]}, {"t": "hk", "bloecke": [["p", "Die Handelskalkulation führt in drei Stufen vom Listenpreis des Lieferanten zum Bruttoverkaufspreis für den Kunden: Einkauf → eigene Kosten → Verkauf."], ["tab", [["Stufe", "Frage", "Ergebnis"], ["1. Bezugskalkulation", "Was kostet uns die Ware, bis sie bei uns ist?", "Einstandspreis (Bezugspreis)"], ["2. Selbstkostenkalkulation", "Was kostet sie inkl. unserer Betriebskosten?", "Selbstkostenpreis"], ["3. Verkaufskalkulation", "Zu welchem Preis müssen wir verkaufen?", "Bruttoverkaufspreis"]]], ["h", "Komplettes Schema mit Beispiel (Laptop)"], ["tab", [["Schritt", "Betrag", "Rechnung"], ["Listeneinkaufspreis", "89,05 €", "Angebot des Lieferanten, netto"], ["− Lieferantenrabatt (8 %)", "7,12 €", "vom Listenpreis"], ["= Zieleinkaufspreis", "81,93 €", ""], ["− Lieferantenskonto (2,5 %)", "2,05 €", "vom Zieleinkaufspreis"], ["= Bareinkaufspreis", "79,88 €", ""], ["+ Bezugskosten", "7,60 €", "Versand, Versicherung, Zoll (anteilig pro Stück)"], ["**= Einstandspreis**", "**87,48 €**", "Ende Stufe 1"], ["+ Handlungskosten (33 %)", "28,87 €", "vom Einstandspreis"], ["**= Selbstkostenpreis**", "**116,35 €**", "Ende Stufe 2"], ["+ Gewinn (5 %)", "5,82 €", "von den Selbstkosten"], ["= Barverkaufspreis", "122,17 €", ""], ["+ Kundenskonto (2 %)", "2,49 €", "im Hundert (siehe unten)"], ["= Zielverkaufspreis", "124,66 €", ""], ["+ Kundenrabatt (5 %)", "6,56 €", "im Hundert"], ["= Nettoverkaufspreis (Listenverkaufspreis)", "131,22 €", ""], ["+ Umsatzsteuer (19 %)", "24,93 €", "vom Nettoverkaufspreis"], ["**= Bruttoverkaufspreis**", "**156,15 €**", "Ende Stufe 3"]]], ["h", "Prüfungsfalle: vom Hundert vs. im Hundert"], ["p", "Im Einkauf und bei Handlungskosten, Gewinn und USt rechnest du **vom Hundert**: Prozentsatz × Grundwert. Kundenskonto und Kundenrabatt rechnest du **im Hundert**, weil der Kunde sie später vom höheren Preis abzieht:"], ["formel", "Zielverkaufspreis = Barverkaufspreis ÷ (1 - Skontosatz) = 122,17 ÷ 0,98 = 124,66"], ["formel", "Nettoverkaufspreis = Zielverkaufspreis ÷ (1 - Rabattsatz) = 124,66 ÷ 0,95 = 131,22"], ["h", "Begriffe kurz"], ["li", "**Bezugskosten** immer auf die Stückzahl verteilen: 30 € Fracht für 10 Laptops = 3 € pro Laptop."], ["li", "**Handlungskosten** sind die Kosten des eigenen Betriebs: Gehälter, Miete, Strom, Versicherungen, Werbung, Abschreibungen."], ["li", "**Ziel-** heißt „mit Zahlungsziel, vor Skonto“; **Bar-** heißt „nach Skonto“, nicht unbedingt Bargeld."], ["li", "**Netto ist nicht Gewinn:** Von 156,15 € brutto bleiben im Beispiel nur 5,82 € Gewinn. Die USt ist für vorsteuerabzugsberechtigte Firmen ein durchlaufender Posten."], ["p", "**Merksatz:** Einstandspreis = Einkauf. Selbstkostenpreis = Einkauf + eigener Betrieb. Gewinn = was nach allen Kosten übrig bleiben soll."]]}, {"t": "service", "bloecke": [["p", "Im Service zählen klare Abläufe (ITIL), vereinbarte Leistungen (SLA) und ständige Verbesserung (PDCA). Dazu kommen Ergonomie und Lizenzen beim Einrichten von Arbeitsplätzen."], ["h", "ITIL-Begriffe"], ["tab", [["Begriff", "Bedeutung", "Beispiel"], ["Incident (Störung)", "Dienst schnell wiederherstellen, notfalls per Workaround", "Drucker druckt nicht → anderen Drucker zuweisen"], ["Problem", "**Ursache** wiederkehrender Störungen finden und beseitigen", "Treiber verursacht immer wieder Abstürze"], ["Change", "geplante, freigegebene Änderung", "neues Firmware-Update ausrollen"], ["Service Request", "Standardanfrage, keine Störung", "neuer Benutzer, Passwort zurücksetzen"]]], ["li", "**Support-Level:** 1st Level (Service Desk, Annahme, einfache Lösungen) → 2nd Level (Fachexperten) → 3rd Level (Hersteller/Entwickler)."], ["li", "**Eskalation:** funktional = an ein höheres Fachlevel, hierarchisch = an Vorgesetzte/Management."], ["li", "**SLA** = Vereinbarung mit dem Kunden (Verfügbarkeit, **Reaktionszeit** = bis jemand sich meldet, **Lösungszeit** = bis es wieder läuft). **OLA** = interne Vereinbarung zwischen Abteilungen. **UC** = Vertrag mit einem externen Lieferanten."], ["h", "Qualitätsmanagement"], ["li", "**PDCA-Zyklus (Deming):** Plan (planen) → Do (umsetzen) → Check (prüfen) → Act (verbessern), dann von vorn."], ["li", "**ISO 9001** = Norm für Qualitätsmanagementsysteme; **ISO 27001** = Norm für Informationssicherheit (ISMS)."], ["h", "Ergonomie am Bildschirmarbeitsplatz"], ["li", "Monitor im rechten Winkel zum Fenster (keine Spiegelung, kein Gegenlicht), Abstand ca. 50–80 cm."], ["li", "Oberkante des Bildschirms auf oder leicht unter Augenhöhe, Blick leicht nach unten."], ["li", "Unterarme waagerecht, Oberschenkel waagerecht, Füße flach auf dem Boden."], ["li", "Rechtsgrundlage: Arbeitsstättenverordnung (ArbStättV), Anhang 6."], ["h", "Lizenzmodelle"], ["tab", [["Modell", "Merkmal"], ["OEM", "an ein Gerät gebunden, nicht übertragbar, günstig"], ["Retail (Box)", "einzeln gekauft, auf neues Gerät übertragbar"], ["Volumenlizenz", "viele Lizenzen für Firmen, zentral verwaltet"], ["Abo / Subscription", "monatlich oder jährlich, z. B. Microsoft 365"], ["Server + CAL", "Serverlizenz + Zugriffslizenz je **Benutzer** (User CAL) oder je **Gerät** (Device CAL)"], ["Open Source", "Quellcode offen; **GPL** verlangt, dass Änderungen wieder offen sind (Copyleft), **MIT/Apache** nicht"], ["Freeware / Shareware", "kostenlos / kostenlos testen, dann zahlen"]]]]}, {"t": "green", "bloecke": [["p", "Altgeräte gehören nie in den Hausmüll, und Datenträger müssen vor der Entsorgung nachweisbar gelöscht oder vernichtet werden."], ["h", "Entsorgung nach ElektroG"], ["li", "Das **Elektro- und Elektronikgerätegesetz (ElektroG)** regelt Rücknahme und Recycling. Kennzeichen: **durchgestrichene Mülltonne**."], ["li", "Privatleute geben Altgeräte kostenlos beim Wertstoffhof oder bei großen Händlern ab. Gewerbliche Altgeräte nimmt der Hersteller zurück bzw. ein zertifizierter Entsorger."], ["li", "Akkus und Batterien separat (Batterierecht-Durchführungsgesetz BattDG, seit 2025; früher Batteriegesetz)."], ["li", "Bei Kundengeräten: Datenlöschung bzw. Vernichtung **dokumentieren** (Löschprotokoll/Vernichtungszertifikat) – das ist zugleich DSGVO-Pflicht."], ["h", "Datenvernichtung nach DIN 66399"], ["li", "**Sicherheitsstufen 1–7**: je höher, desto kleiner die Partikel. Stufe 3 für normale personenbezogene Daten, **Stufe 4** für besonders sensible Daten, 5–7 für geheime Daten."], ["li", "**Schutzklassen 1–3**: normal, hoch, sehr hoch (Schutzbedarf der Daten)."], ["li", "Materialkennungen: **P** Papier, **H** Festplatten, **E** elektronische Datenträger (SSD, USB-Stick), **O** optisch (CD/DVD), **T** magnetisch (Bänder), **F** Film."], ["li", "**Methoden:** HDD überschreiben, entmagnetisieren (Degausser) oder schreddern. **SSD** per Secure Erase/Crypto Erase oder schreddern – Degausser und einfaches Überschreiben wirken bei SSDs nicht zuverlässig."], ["h", "Green IT"], ["li", "**Labels:** EU-Energielabel, Energy Star, Blauer Engel, TCO Certified; Netzteile mit **80 PLUS** (Bronze bis Titanium = Wirkungsgrad)."], ["li", "**Maßnahmen:** Server virtualisieren und konsolidieren, Energiesparmodi nutzen, effiziente Netzteile, Geräte länger nutzen und reparieren, Thin Clients."], ["li", "**PUE** (Power Usage Effectiveness) eines Rechenzentrums = Gesamtenergie ÷ Energie der IT. Ideal 1,0; typisch 1,3–1,6."]]}], "formeln": [{"titel": "Subnetting IPv4", "t": "ip", "formeln": [{"name": "Nutzbare Hosts", "formel": "Hosts = 2ⁿ − 2", "info": "n = Host-Bits = 32 − Präfix. Netz- und Broadcastadresse zählen nicht.", "bsp": "/26 → 6 Host-Bits → 2⁶ − 2 = 62 Hosts", "rechnen": "subnetz"}, {"name": "Anzahl Subnetze", "formel": "Subnetze = 2ᵐ", "info": "m = geliehene Bits (neues Präfix − altes Präfix).", "bsp": "/24 → /27: 3 Bits → 2³ = 8 Subnetze", "rechnen": "subnetz"}, {"name": "Bits borgen", "formel": "2ᵐ ≥ benötigte Subnetze  →  neues Präfix = altes Präfix + m", "info": "Kleinstes m wählen, das reicht.", "bsp": "5 Abteilungen: 2³ = 8 ≥ 5 → /24 + 3 = /27", "rechnen": "subnetz"}, {"name": "Blockgröße", "formel": "Blockgröße = 256 − Maskenwert im entscheidenden Oktett", "info": "Netze beginnen bei 0 und laufen in Blockgrößen-Schritten.", "bsp": "255.255.255.224 → 256 − 224 = 32 → Netze .0, .32, .64 …", "rechnen": "subnetz"}, {"name": "Netz- und Broadcastadresse", "formel": "Netz = IP UND Maske     Broadcast = Netz + Blockgröße − 1", "info": "Erste nutzbare = Netz + 1, letzte = Broadcast − 1.", "bsp": "192.168.16.52/25 → Netz .0, Broadcast .127, nutzbar .1 – .126", "rechnen": "subnetz"}, {"name": "Präfix ↔ Subnetzmaske", "formel": "/24 = .0   /25 = .128   /26 = .192   /27 = .224   /28 = .240   /29 = .248   /30 = .252", "info": "Werte im 4. Oktett (die ersten drei sind 255). Hosts: 254 · 126 · 62 · 30 · 14 · 6 · 2.", "bsp": "", "rechnen": "subnetz"}, {"name": "IPv6-Subnetze", "formel": "Anzahl /64-Netze = 2⁶⁴⁻ᵖ", "info": "p = zugeteiltes Präfix. Im LAN ist /64 Standard.", "bsp": "/48 → 2¹⁶ = 65.536 Subnetze", "rechnen": "medien"}]}, {"titel": "Zahlensysteme", "t": "ip", "formeln": [{"name": "Binär → Dezimal", "formel": "Stellenwerte 128 · 64 · 32 · 16 · 8 · 4 · 2 · 1 addieren, wo eine 1 steht", "info": "", "bsp": "1100 1000 = 128 + 64 + 8 = 200", "rechnen": "zahlen"}, {"name": "Dezimal → Binär", "formel": "Von 128 abwärts: passt der Stellenwert? → 1 und abziehen, sonst 0", "info": "", "bsp": "200 − 128 = 72 − 64 = 8 − 8 = 0 → 1100 1000", "rechnen": "zahlen"}, {"name": "Binär ↔ Hex", "formel": "Je 4 Bit (Nibble) = 1 Hex-Ziffer (0–9, A=10 … F=15)", "info": "Hex-Stellenwerte: 16¹ = 16, 16⁰ = 1.", "bsp": "1100 1000 → C 8 → C8   ·   C8 = 12 × 16 + 8 = 200", "rechnen": "zahlen"}]}, {"titel": "Datenmengen und Übertragung", "t": "hw", "formeln": [{"name": "Bit und Byte", "formel": "1 Byte = 8 Bit     Bit → Byte: ÷ 8", "info": "Klein-b = Bit (Mbit/s), Groß-B = Byte (MB).", "bsp": "100 Mbit/s ÷ 8 = 12,5 MB/s", "rechnen": "speicher"}, {"name": "SI und IEC", "formel": "SI: 1 kB = 1000 B (kB, MB, GB, TB)     IEC: 1 KiB = 1024 B (KiB, MiB, GiB, TiB)", "info": "Festplatten-Hersteller rechnen SI, Windows zeigt IEC.", "bsp": "1 TB = 10¹² B ÷ 1024⁴ ≈ 0,91 TiB", "rechnen": "speicher"}, {"name": "Übertragungszeit", "formel": "Zeit = Menge ÷ Datenrate     Menge = Zeit × Rate     Rate = Menge ÷ Zeit", "info": "Vorher Bit/Byte und SI/IEC angleichen.", "bsp": "4 GB über 100 Mbit/s: 32.000 Mbit ÷ 100 = 320 s", "rechnen": "daten"}, {"name": "Bildgröße", "formel": "Größe = Breite × Höhe × Farbtiefe (Bit) ÷ 8", "info": "Ergebnis in Byte, dann in KiB/MiB umrechnen.", "bsp": "1920 × 1080 × 24 ÷ 8 = 6.220.800 B ≈ 5,93 MiB", "rechnen": "medien"}, {"name": "Audiogröße", "formel": "Größe = Abtastrate × Bittiefe × Kanäle × Sekunden ÷ 8", "info": "CD-Qualität: 44.100 Hz, 16 Bit, Stereo.", "bsp": "44.100 × 16 × 2 × 60 ÷ 8 = 10,58 MB pro Minute", "rechnen": "medien"}, {"name": "Video / Kamera-Speicher", "formel": "Datenrate = Breite × Höhe × Farbtiefe × fps (× Kompression)     Speicher = Datenrate × Zeit", "info": "", "bsp": "1920 × 1080 × 24 × 30 × 0,3 ≈ 448 Mbit/s → 72 h ≈ 13,2 TiB pro Kamera", "rechnen": "speicher"}]}, {"titel": "Strom und Energie", "t": "spe", "formeln": [{"name": "Elektrische Leistung", "formel": "P = U × I     I = P ÷ U     U = P ÷ I", "info": "P in Watt, U in Volt, I in Ampere. Ohm: U = R × I.", "bsp": "Kamera 24 W an 48 V → I = 0,5 A", "rechnen": "poe"}, {"name": "PoE-Standards", "formel": "802.3af (PoE) 12,95 W · 802.3at (PoE+) 25,5 W · 802.3bt (PoE++) 51–71,3 W", "info": "Werte = am Gerät nutzbar (am Port: 15,4 / 30 / 60–90 W).", "bsp": "Gerät braucht 24 W → 802.3af reicht nicht → PoE+", "rechnen": "poe"}, {"name": "Energie und Stromkosten", "formel": "kWh = Leistung (W) × Stunden ÷ 1000     Kosten = kWh × Preis pro kWh", "info": "", "bsp": "200 W × 8 h × 220 Tage ÷ 1000 = 352 kWh × 0,30 € = 105,60 €", "rechnen": "strom"}, {"name": "Netzteil-Wirkungsgrad", "formel": "P_real = P_ges ÷ η", "info": "η = Wirkungsgrad als Dezimalzahl (80 % = 0,8). Der Rest wird Wärme.", "bsp": "400 W ÷ 0,8 = 500 W aus der Steckdose", "rechnen": "netzteil"}, {"name": "USV-Leistung", "formel": "Wirkleistung (W) = Scheinleistung (VA) × Leistungsfaktor (cos φ)", "info": "", "bsp": "1500 VA × 0,8 = 1200 W", "rechnen": "usv"}, {"name": "USV-Überbrückungszeit", "formel": "Zeit (h) = Akku-Energie (Wh) × η ÷ Last (W)     Wh = V × Ah", "info": "× 60 für Minuten.", "bsp": "2 × 12 V × 9 Ah = 216 Wh × 0,9 ÷ 300 W = 0,648 h ≈ 38,9 min", "rechnen": "usvzeit"}]}, {"titel": "Verfügbarkeit und Speicher", "t": "spe", "formeln": [{"name": "SLA-Ausfallzeit", "formel": "Ausfallzeit = (1 − Verfügbarkeit) × Zeitraum", "info": "1 Jahr = 8.760 h = 525.600 min.", "bsp": "99,9 % → 0,001 × 8.760 h = 8,76 h pro Jahr", "rechnen": "sla"}, {"name": "Verfügbarkeit aus MTBF", "formel": "V = MTBF ÷ (MTBF + MTTR)", "info": "MTBF = mittlere Zeit zwischen Ausfällen, MTTR = mittlere Reparaturzeit.", "bsp": "10.000 h ÷ (10.000 + 8) = 99,92 %", "rechnen": "verf"}, {"name": "Systeme in Reihe", "formel": "V = V₁ × V₂ × V₃ …", "info": "Alle müssen laufen → schlechter als das schwächste Teil.", "bsp": "99,5 % × 99,9 % = 0,995 × 0,999 = 99,40 %", "rechnen": "verf"}, {"name": "Systeme parallel (redundant)", "formel": "V = 1 − (1 − V₁) × (1 − V₂)", "info": "Einer reicht → besser als jedes Einzelteil.", "bsp": "2 × 99 %: 1 − 0,01 × 0,01 = 99,99 %", "rechnen": "verf"}, {"name": "RAID-Kapazität", "formel": "RAID 0: n × C · RAID 1: C · RAID 5: (n − 1) × C · RAID 6: (n − 2) × C · RAID 10: n × C ÷ 2", "info": "C = kleinste Platte, n = Anzahl Platten. Ausfallsicher: 0 / 1 / 1 / 2 / 1 pro Spiegel.", "bsp": "RAID 5 mit 4 × 2 TB = 3 × 2 TB = 6 TB", "rechnen": "raid"}]}, {"titel": "Kaufmännisch", "t": "hk", "formeln": [{"name": "Handelskalkulation (vorwärts)", "formel": "Listeneinkaufspreis − Rabatt = Zieleinkaufspreis − Skonto = Bareinkaufspreis + Bezugskosten = Einstandspreis + Handlungskosten = Selbstkosten + Gewinn = Barverkaufspreis + Kundenskonto = Zielverkaufspreis + Kundenrabatt = Nettoverkaufspreis + USt. = Bruttoverkaufspreis", "info": "Abzüge vom Hundert (× (1 − p)), Zuschläge beim Verkauf im Hundert: Zielverkaufspreis = Barverkaufspreis ÷ (1 − Skonto).", "bsp": "", "rechnen": "kalk"}, {"name": "Prozentrechnung", "formel": "Prozentwert = Grundwert × Prozentsatz ÷ 100", "info": "Dreisatz: auf 1 rechnen, dann auf das Gesuchte.", "bsp": "15 % von 840 € = 840 × 15 ÷ 100 = 126 €", "rechnen": "kalk"}, {"name": "Netto ↔ Brutto", "formel": "Brutto = Netto × 1,19     Netto = Brutto ÷ 1,19", "info": "Ermäßigt: 7 % → 1,07. Nie Brutto × 0,81 rechnen!", "bsp": "119 € brutto ÷ 1,19 = 100 € netto", "rechnen": "kalk"}, {"name": "Lineare Abschreibung (AfA)", "formel": "AfA pro Jahr = Anschaffungskosten ÷ Nutzungsdauer     Restbuchwert = AK − Jahre × AfA", "info": "IT-Hardware wird meist über 3 Jahre abgeschrieben (auch 1 Jahr möglich).", "bsp": "2.400 € ÷ 3 = 800 € pro Jahr", "rechnen": "afa"}, {"name": "Amortisationszeit", "formel": "Amortisation (Jahre) = Anschaffungskosten ÷ jährliche Ersparnis", "info": "", "bsp": "400 € ÷ 63,36 € = 6,3 Jahre", "rechnen": "amort"}, {"name": "Kostenvergleich / Break-even", "formel": "Fixkosten₁ + Menge × variabel₁ = Fixkosten₂ + Menge × variabel₂  →  nach Menge auflösen", "info": "Ab dieser Menge (oder Zeit) ist die zweite Lösung günstiger.", "bsp": "Kauf 1.200 € vs. Miete 50 €/Monat → 1.200 ÷ 50 = 24 Monate", "rechnen": ""}, {"name": "Nutzwertanalyse", "formel": "Nutzwert = Σ (Punkte × Gewichtung)", "info": "Gewichtungen ergeben zusammen 100 %. Höchster Nutzwert gewinnt.", "bsp": "Preis 40 % × 8 + Leistung 35 % × 6 + Service 25 % × 9 = 7,55", "rechnen": ""}]}, {"titel": "Projektmanagement", "t": "pm", "formeln": [{"name": "Netzplan vorwärts", "formel": "FEZ = FAZ + Dauer     FAZ (Nachfolger) = größter FEZ der Vorgänger", "info": "FAZ/FEZ = frühester Anfang/Ende.", "bsp": "", "rechnen": ""}, {"name": "Netzplan rückwärts", "formel": "SAZ = SEZ − Dauer     SEZ (Vorgänger) = kleinster SAZ der Nachfolger", "info": "SAZ/SEZ = spätester Anfang/Ende.", "bsp": "", "rechnen": ""}, {"name": "Puffer", "formel": "Gesamtpuffer = SAZ − FAZ     Freier Puffer = FAZ (Nachfolger) − FEZ", "info": "Kritischer Pfad = alle Vorgänge mit Gesamtpuffer 0.", "bsp": "", "rechnen": ""}]}], "katalog": {"bereiche": [["Hardware und Systeme", ["hw", "spe", "verf", "virt", "green"]], ["Netzwerk", ["netz", "schichten", "osi", "ip", "ipv6", "adr", "dienste", "routing", "proxy", "wlan"]], ["Sicherheit", ["fw", "sec", "angriffe", "dsgvo"]], ["Software und Projekte", ["prog", "pm", "service"]], ["Wirtschaft und Recht", ["kauf", "hk", "wiso"]]], "neu": {"netz": {"titel": "Netzwerk-Grundlagen", "bloecke": [["p", "Netzgrößen, Protokolle, Topologien, Verkabelung und die wichtigsten Geräte – das Fundament für alle Netzwerkthemen."], ["h", "Netzgrößen"], ["tab", [["Bezeichnung", "Ausdehnung", "Beispiel"], ["PAN (Personal Area Network)", "wenige Meter", "Bluetooth-Headset, USB"], ["LAN (Local Area Network)", "Gebäude, Firmengelände", "Ethernet, WLAN im Büro"], ["MAN (Metropolitan Area Network)", "Stadt, Region", "Stadtnetz, Verbindung mehrerer Standorte"], ["WAN (Wide Area Network)", "Länder, Kontinente", "Providernetze, Standortvernetzung per MPLS/VPN"], ["GAN (Global Area Network)", "weltweit", "Internet, Satellitennetze"]]], ["p", "Die Grenzen sind fließend. In der Praxis unterscheidet man meist nur **LAN** und **WAN**; manche Techniken (z. B. Ethernet) laufen in beiden."], ["h", "Protokolle und Dateneinheiten"], ["p", "Ein **Netzwerkprotokoll** ist eine Sammlung von Regeln, wie eine Kommunikation aufgebaut, durchgeführt und beendet wird (Format, Reihenfolge, Fehlerbehandlung). Jedes Protokoll übernimmt eine Teilaufgabe und gehört zu einer Schicht."], ["tab", [["OSI-Schicht", "Dateneinheit (PDU)", "Adresse", "Typisches Gerät"], ["7–5 Anwendung", "Daten", "Hostname, URL", "Proxy, Anwendungs-Gateway"], ["4 Transport", "Segment (TCP) / Datagramm (UDP)", "Port", "Firewall"], ["3 Vermittlung", "Paket", "IP-Adresse", "Router, L3-Switch"], ["2 Sicherung", "Frame (Rahmen)", "MAC-Adresse", "Switch, Bridge, Access Point"], ["1 Bitübertragung", "Bits", "–", "Hub, Repeater, Medienkonverter, Kabel"]]], ["p", "Genau genommen heißen IPv4-Einheiten in RFC 791 **Datagramme**; im Alltag sagt man einfach **Paket**."], ["h", "Peer-to-Peer und Client-Server"], ["tab", [["Merkmal", "Peer-to-Peer", "Client-Server"], ["Rollen", "alle gleichberechtigt, jeder gibt Ressourcen frei", "Server stellt Dienste bereit, Clients nutzen sie"], ["Verwaltung", "dezentral, lokale Konten auf jedem Rechner", "zentral (Domäne, Active Directory)"], ["Größe", "bis ca. 10 Rechner (Faustregel)", "beliebig groß"], ["Kosten", "günstig, kein Server nötig", "Server, Lizenzen, Administration"], ["Sicherheit, Backup", "jeder Rechner einzeln – schnell unübersichtlich", "zentrale Richtlinien und Sicherung"], ["Beispiel", "Heimnetz, Windows-Arbeitsgruppe", "Firmennetz mit Domänencontroller"]]], ["tipp", "Punkt-zu-Punkt ist eine **Topologie** (zwei Geräte direkt verbunden), Peer-to-Peer eine **Architektur** (gleichberechtigte Rechner). Nicht verwechseln."], ["h", "Topologien"], ["grafik", "topologien"], ["tab", [["Topologie", "Aufbau", "Vorteile", "Nachteile"], ["Punkt-zu-Punkt", "zwei Geräte direkt verbunden", "einfach, volle Bandbreite", "nur zwei Teilnehmer"], ["Punkt-zu-Mehrpunkt", "ein zentrales System versorgt mehrere über eine gemeinsame Leitung (Richtfunk, Glasfaser-PON)", "wenige Leitungen", "Teilnehmer teilen sich die Bandbreite"], ["Linie (Daisy Chain)", "Gerät an Gerät in Reihe", "wenig Kabel", "wird ein Gerät entfernt oder fällt aus, ist die Linie getrennt"], ["Bus", "alle an einer gemeinsamen Leitung, Abschlusswiderstand an beiden Enden", "billig, wenig Kabel", "Kollisionen; Kabelbruch legt alles lahm; Erweitern unterbricht den Betrieb"], ["Ring", "jedes Gerät hat Vorgänger und Nachfolger, geschlossener Kreis", "gleiche Zugriffschancen; mit Doppelring oder Ringmanager redundant", "ohne Redundanz legt eine Unterbrechung den Ring lahm"], ["Stern", "jedes Gerät hat eine eigene Leitung zum Switch", "Kabeldefekt betrifft nur ein Gerät, leicht erweiterbar – Standard im LAN", "Switch ist Single Point of Failure, viel Kabel"], ["Baum", "erweiterter Stern: Switches hierarchisch (Kern – Verteiler – Zugang)", "gut strukturierbar, für große Netze", "fällt ein Verteiler aus, ist der ganze Ast weg"], ["Masche (teilvermascht)", "viele, aber nicht alle Knoten untereinander verbunden", "Ausweichwege bei Ausfall (Internet, WLAN-Mesh)", "aufwendig, braucht Routing"], ["Vollvermascht", "jeder mit jedem verbunden", "höchste Ausfallsicherheit", "sehr teuer, schlecht skalierbar"], ["Fabric (Gewebe)", "Switches mehrfach über Kreuz verbunden (Leaf-Spine im Rechenzentrum)", "hohe Bandbreite, viele gleichwertige Wege", "teuer, nur im Rechenzentrum sinnvoll"]]], ["formel", "Leitungen bei Vollvermaschung = n × (n − 1) / 2      Beispiel: 5 Knoten → 5 × 4 / 2 = 10 Leitungen"], ["p", "**Physisch und logisch:** Ein heutiges LAN ist physisch ein Stern bzw. Baum. Logisch verhält sich Ethernet innerhalb eines VLANs wie ein Bus – alle hören Broadcasts."], ["h", "Zugriffsverfahren"], ["li", "**CSMA/CD** (Collision Detection, klassisches Ethernet mit Hub/Bus, Halbduplex): Leitung abhören → senden → Kollision erkennen → Jam-Signal → zufällige Wartezeit → neu senden. Mit Switch und Vollduplex gibt es keine Kollisionen mehr."], ["li", "**CSMA/CA** (Collision Avoidance, WLAN): Funk kann Kollisionen nicht zuverlässig erkennen, also vermeiden: Kanal abhören, zufällig warten, senden, Empfänger bestätigt mit ACK; optional RTS/CTS gegen das Hidden-Station-Problem."], ["h", "Verkabelung und Patchfeld"], ["li", "**Twisted Pair** (Kupfer, RJ45, max. 100 m pro Strecke), **Koaxial** (im LAN veraltet, noch bei Kabel-TV/-Internet), **Lichtwellenleiter** (Glasfaser: Multimode für kürzere Strecken, Singlemode für lange; unempfindlich gegen Störungen)."], ["li", "**Passive Komponenten:** Anschlussdose am Arbeitsplatz → fest verlegtes Installationskabel → **Patchfeld** im Netzwerkschrank → **Patchkabel** → Switch."], ["li", "**Patchfeld (Rangierverteiler):** Hier enden die fest verlegten Leitungen. Mit kurzen Patchkabeln wird „rangiert“ – jede Dose lässt sich flexibel auf einen Switchport schalten, ohne die Verkabelung anzufassen."], ["li", "Kupfer bleibt im Gebäude Standard, weil nur Twisted Pair Geräte per **PoE** mit Strom versorgen kann (Access Points, VoIP-Telefone, Kameras). Glasfaser nimmt man für den Backbone zwischen Etagen und Gebäuden, im Rechenzentrum und beim Provider. Am Arbeitsplatz reichen meist 1 Gbit/s."], ["p", "**Regeln beim Verlegen:**"], ["li", "Biegeradius des Herstellers einhalten; nicht quetschen, knicken oder zu stark ziehen; Kanten auf der Strecke glätten."], ["li", "Datenkabel getrennt von Stromkabeln führen (Trennsteg im Kabelkanal)."], ["li", "Beim Auflegen die Adernpaare nur so wenig wie nötig aufdrillen – sonst schlechte **NEXT**-Werte (Übersprechen) bei der Abnahmemessung."], ["li", "Schirmung und Metallteile in den Potentialausgleich einbeziehen; Kabel trocken lagern und von der sich drehenden Trommel abrollen, nicht seitlich über Kopf abziehen (sonst verdrillt und knickt es)."], ["h", "Netzwerkkomponenten"], ["tab", [["Gerät", "Schicht", "Aufgabe"], ["Repeater / Hub", "1", "verstärkt bzw. verteilt Signale an alle Ports, wertet keine Adressen aus – eine Kollisionsdomäne"], ["Medienkonverter", "1", "wandelt Kupfer ↔ Glasfaser"], ["Modem / ONT", "1", "wandelt Daten in Signale für die Anschlussleitung (DSL, Kabel, Glasfaser)"], ["Bridge / Switch", "2", "lernt MAC-Adressen (MAC-Tabelle), leitet Frames gezielt an den Zielport; jeder Port eigene Kollisionsdomäne"], ["Access Point", "2", "bindet WLAN-Geräte an das kabelgebundene LAN"], ["Router", "3", "verbindet verschiedene IP-Netze, leitet nach Routingtabelle weiter, trennt Broadcast-Domänen"], ["Layer-3-Switch", "2 + 3", "Switch, der zusätzlich zwischen VLANs routet"], ["Firewall", "3–7", "filtert Verkehr nach Regeln"], ["Server / Client", "–", "stellt Dienste bereit / nutzt Dienste"]]], ["h", "Gateway"], ["p", "Ein **Gateway** ist der Übergang zwischen zwei Netzen, die unterschiedliche Adressbereiche oder Protokolle nutzen. Es leitet weiter und übersetzt bei Bedarf (Protokollkonverter) – je nach Art auf jeder OSI-Schicht."], ["li", "**Standard-Gateway (Default Gateway):** die Router-Adresse, an die ein Host alles schickt, was nicht im eigenen Netz liegt. Nur Verkehr im selben Netzsegment kommt ohne Gateway aus."], ["li", "Jeder Router ist ein Gateway, aber nicht jedes Gateway ist ein Router (z. B. VoIP-Gateway, IoT-Gateway Zigbee ↔ WLAN)."], ["li", "Vorteile: ein Gerät für die Internetanbindung, oft zugleich Firewall, Proxy, Lastverteiler. Nachteile: Übersetzung und Sicherheitsprüfung kosten etwas Zeit; schwache Hardware wird zum Engpass."], ["tab", [["Gerät", "verbindet", "arbeitet mit", "Schicht"], ["Switch", "Geräte im selben Netz", "MAC-Adressen", "2"], ["Router", "verschiedene IP-Netze", "IP-Adressen, Routingtabelle", "3"], ["Gateway", "verschiedene Netze oder Protokolle, übersetzt", "je nach Art bis zu Anwendungsdaten", "3–7"]]], ["tab", [["Gateway-Art", "Aufgabe"], ["Internet- / Heim-Gateway", "Router mit Modem, NAT, Firewall und DHCP"], ["VoIP- / Trunk-Gateway", "verbindet Telefonanlage, Fax und Analoggeräte mit VoIP"], ["Media-Gateway", "wandelt Medienformate zwischen verschiedenen Netzen"], ["IoT-Gateway", "sammelt Sensordaten, übersetzt Funkprotokolle"], ["E-Mail-Security-Gateway", "filtert Spam, Schadsoftware und Richtlinienverstöße"], ["Web Application Firewall (WAF)", "prüft HTTP-Verkehr zu einem Webserver auf Anwendungsebene"], ["API-Gateway", "zentraler Eingang für Schnittstellen und Microservices"], ["Cloud-Storage-Gateway", "bindet Cloudspeicher wie ein lokales Laufwerk ein"]]]]}, "schichten": {"titel": "TCP/IP- und DoD-Modell", "bloecke": [["p", "**TCP/IP** ist die Protokollfamilie des Internets. Das **DoD-Modell** (US-Verteidigungsministerium) ist das ursprüngliche TCP/IP-Modell mit 4 Schichten. Das spätere **OSI-Modell** ist das feinere Referenzmodell mit 7 Schichten."], ["h", "Vergleich der Modelle"], ["grafik", "schichten"], ["tab", [["DoD-Schicht", "entspricht OSI", "Protokolle"], ["4 Anwendung", "7 Anwendung, 6 Darstellung, 5 Sitzung", "HTTP(S), FTP, SMTP, POP3, IMAP, DNS, DHCP, SSH, SNMP"], ["3 Transport", "4 Transport", "TCP, UDP"], ["2 Internet", "3 Vermittlung", "IPv4, IPv6, ICMP"], ["1 Netzzugang", "2 Sicherung, 1 Bitübertragung", "Ethernet (IEEE 802.3), WLAN (IEEE 802.11), ARP"]]], ["h", "Aufgaben von TCP/IP"], ["li", "**Logische Adressierung (IP):** teilt große Netze in Teilnetze, damit Pakete nur in das Netz gelangen, in dem das Ziel liegt (Klassen, Subnetting, CIDR)."], ["li", "**Routing (IP):** In jedem Knoten wird für jedes Paket der nächste Knoten bestimmt – so findet es auch in unbekannte Netze."], ["li", "**Fehlerbehandlung und Flusssteuerung (TCP):** verbindungsorientiert, Empfang wird bestätigt, Verlorenes neu gesendet; die Fenstergröße passt das Tempo an den Empfänger an (Flusssteuerung), die Staukontrolle an die Auslastung des Netzes."], ["li", "**Anwendungsunterstützung (TCP/UDP):** Ports unterscheiden Anwendungen auf demselben Rechner."], ["li", "**Namensauflösung (DNS):** Menschen merken sich Namen, Verbindungen brauchen IP-Adressen."], ["tipp", "Zuordnung, die oft gefragt wird: **ARP** liegt zwischen Schicht 2 und 3 (meist Schicht 2 zugeordnet), **ICMP** Schicht 3, **TCP/UDP** Schicht 4, **DHCP, DNS, HTTP** Schicht 7."]]}, "ipv6": {"titel": "IPv6 im Detail", "bloecke": [["p", "IPv6 ist der Nachfolger von IPv4 (erstmals 1995 spezifiziert, 1998 RFC 2460, heute RFC 8200). Hauptgrund: Adressknappheit. 128 Bit ergeben 2¹²⁸ ≈ 3,4 × 10³⁸ Adressen. Dazu kommen einfachere Autokonfiguration und ein schlankerer Header."], ["h", "Aufbau"], ["p", "8 Blöcke à 16 Bit, hexadezimal geschrieben, getrennt durch Doppelpunkte. Üblich: vordere **64 Bit Präfix** (Netz), hintere **64 Bit Interface Identifier** (Host)."], ["tab", [["Teil", "Bits", "Beispiel 2001:0db8:0000:0000:0000:0000:0000:0001"], ["Präfix (Network ID)", "64", "2001:0db8:0000:0000"], ["Interface Identifier (IID)", "64", "0000:0000:0000:0001"]]], ["h", "Schreibweise nach RFC 5952"], ["li", "Führende Nullen in jedem Block weglassen (0db8 → db8, 0000 → 0).", "1"], ["li", "Die **längste** Folge aufeinanderfolgender Null-Blöcke durch **::** ersetzen – nur **einmal** pro Adresse.", "2"], ["li", "Ein einzelner Null-Block wird nicht mit :: gekürzt, sondern als 0 geschrieben.", "3"], ["li", "Bei gleich langen Null-Folgen wird die **erste von links** gekürzt.", "4"
