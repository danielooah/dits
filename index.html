 eigenen Netz 192.168.10.0/24", "Die Subnetzmaske passt nicht zur IP-Adresse|Der DNS-Server darf nicht im eigenen Netz liegen|Die IP-Adresse ist eine Broadcastadresse", "Das Gateway muss im eigenen Netz liegen, hier also 192.168.10.x."], ["ip", "PC-Konfiguration:\nIP-Adresse 10.0.5.255\nSubnetzmaske 255.255.255.0\nGateway 10.0.5.1", "Was ist an dieser Konfiguration falsch?", "Die IP-Adresse ist die Broadcastadresse des Netzes", "Das Gateway muss immer auf .254 enden|10.0.0.0 ist kein privater Bereich|Die Maske passt nicht zu einer 10er-Adresse", "Bei /24 ist .255 die Broadcastadresse und kann keinem Host zugewiesen werden."], ["ip", "Zwei PCs im selben Büro:\nPC A: 192.168.1.10 /25\nPC B: 192.168.1.140 /25\nKein Router dazwischen", "Die beiden PCs erreichen sich nicht. Warum?", "Sie liegen in verschiedenen Netzen (.0/25 und .128/25)", "Ein /25 erlaubt nur 25 Hosts|Die Adressen sind doppelt vergeben|.140 ist eine Broadcastadresse", "/25 teilt in .0–.127 und .128–.255. Ohne Router keine Verbindung zwischen den Netzen."], ["ip", "IPv6-Adresse in einer Dokumentation:\n2001:db8::1::5", "Was ist an dieser Schreibweise falsch?", ":: kommt zweimal vor", "Hex-Buchstaben müssen großgeschrieben werden|2001:db8 ist kein gültiges Präfix|Am Ende fehlt die Präfixlänge", ":: darf nur einmal vorkommen, sonst ist nicht eindeutig, wie viele Null-Blöcke wo fehlen."], ["dienste", "DHCP-Bereich des Servers:\nNetz 192.168.50.0/24\nPool 192.168.50.1 – 192.168.50.200\nGateway (Router) 192.168.50.1\nDrucker statisch 192.168.50.20", "Es gibt immer wieder Adresskonflikte. Was ist falsch?", "Router und Drucker liegen mit ihren festen Adressen im DHCP-Pool", "Der Pool ist mit 200 Adressen zu klein für ein /24-Netz|Das Gateway muss immer die letzte Adresse .254 haben|Drucker dürfen grundsätzlich keine Adresse per DHCP bekommen", "Feste Adressen gehören außerhalb des Pools oder als Reservierung/Ausschluss in den DHCP-Server."], ["dienste", "Neues Außenbüro im eigenen Subnetz, DHCP-Server steht in der Zentrale.\nClients im Außenbüro bekommen 169.254.x.x.", "Was fehlt am Router des Außenbüros am wahrscheinlichsten?", "Ein DHCP-Relay (IP-Helper) zum Server der Zentrale", "Eine statische Route ins Internet|Ein DNS-Forwarder|Ein zweiter DNS-Server", "Der DHCP-Discover ist ein Broadcast und wird vom Router nicht weitergeleitet. Das Relay leitet ihn per Unicast weiter."], ["dienste", "DNS-Zone firma.de:\nwww   A      203.0.113.10\nmail  A      203.0.113.20\n@     MX 10  203.0.113.20", "Welcher Eintrag ist fehlerhaft?", "Der MX-Record zeigt auf eine IP statt auf einen Namen", "Der A-Record für www braucht eine Priorität|Zwei A-Records dürfen nicht in einer Zone stehen|Der Mailserver braucht einen AAAA- statt A-Record", "Ein MX-Record muss auf einen Hostnamen zeigen, z. B. mail.firma.de, nicht auf eine IP."], ["fw", "Firewall-Regeln (von oben nach unten):\n1  Deny  Any → Any\n2  Allow LAN → Internet  TCP 443\n3  Allow LAN → DNS-Server UDP 53", "Warum kommt niemand ins Internet?", "Regel 1 blockiert alles, die Allow-Regeln werden nie erreicht", "Für HTTPS muss UDP statt TCP freigegeben sein|DNS braucht Port 853 statt 53|Regel 3 muss vor Regel 2 stehen", "Die erste passende Regel gewinnt. Deny Any gehört ans Ende."], ["fw", "Portweiterleitung am Router für einen Webserver in der DMZ:\nExtern TCP 443 → 192.168.100.10:80\nZertifikat auf dem Webserver installiert.", "Besucher bekommen Verbindungsfehler. Was passt nicht?", "Von außen kommt HTTPS, intern wird auf Port 80 ohne TLS weitergeleitet", "Port 443 darf an Routern grundsätzlich nicht weitergeleitet werden|Webserver dürfen nicht in der DMZ stehen, sondern nur im LAN|Portweiterleitungen funktionieren nur mit UDP, nicht mit TCP", "Der Browser spricht TLS auf 443, der Server erwartet auf 80 unverschlüsseltes HTTP – das passt nicht zusammen."], ["spe", "Backup-Konzept einer Steuerkanzlei:\nTägliches Backup auf ein USB-Laufwerk,\ndas dauerhaft am Server steckt.\nRestore wurde noch nie getestet.", "Was ist der schwerste Mangel?", "Keine Kopie außer Haus oder offline – Ransomware oder Brand trifft Server und Backup", "Tägliche Sicherungen sind zu häufig und belasten den Server unnötig|USB-Laufwerke sind für Backups in Kanzleien gesetzlich verboten|Steuerdaten dürfen aus Datenschutzgründen gar nicht gesichert werden", "Das verletzt 3-2-1: eine Kopie außer Haus bzw. offline fehlt. Dazu kommt der fehlende Restore-Test."], ["spe", "RAID-Planung:\n4 Festplatten à 4 TB, RAID 5\n„Damit haben wir 16 TB nutzbar und können zwei Platten verlieren.“", "Was ist an der Aussage falsch?", "Nutzbar sind 12 TB, und nur eine Platte darf ausfallen", "Nutzbar sind 8 TB, zwei Platten dürfen ausfallen|RAID 5 braucht mindestens 5 Platten|RAID 5 hat keine Ausfallsicherheit", "RAID 5: (n − 1) × Größe = 3 × 4 TB = 12 TB; es verkraftet genau einen Plattenausfall."], ["spe", "USV-Auswahl für einen Server mit 900 W Wirkleistung:\nGewählt: USV mit 1000 VA, Leistungsfaktor 0,6", "Warum reicht die USV nicht?", "Sie liefert nur 600 W Wirkleistung", "VA und Watt sind dasselbe – sie reicht genau|Server dürfen nur an Online-USVs|Der Leistungsfaktor muss über 1 liegen", "1000 VA × 0,6 = 600 W < 900 W. Nötig wären mindestens 1500 VA bei cos φ = 0,6."], ["wlan", "WLAN-Planung im Büro (2,4 GHz):\nAP 1 Kanal 1\nAP 2 Kanal 3\nAP 3 Kanal 6", "Was ist ungünstig?", "Kanal 3 überlappt mit 1 und 6 – besser 1, 6, 11", "Kanal 1 ist in Deutschland nicht erlaubt|Drei APs dürfen nicht im gleichen Band funken|2,4 GHz hat nur zwei Kanäle", "Nur 1, 6 und 11 überlappen sich im 2,4-GHz-Band nicht."], ["wlan", "Firmen-WLAN:\nWPA2-Personal, Passwort „Firma2024!“,\nseit 3 Jahren unverändert, 60 Mitarbeiter.", "Was ist das größte Problem?", "Ein gemeinsamer Schlüssel für alle – ausgeschiedene Mitarbeiter haben weiter Zugang", "Das Passwort ist zu lang und wird deshalb oft falsch eingegeben|WPA2 ist im 5-GHz-Band nicht erlaubt und bremst das WLAN aus|60 Geräte sind für ein WLAN grundsätzlich zu viele, es braucht Kabel", "Besser WPA2/WPA3-Enterprise mit 802.1X: jeder meldet sich einzeln an, Zugänge sind einzeln sperrbar."], ["osi", "Verkabelung im Lager:\nSwitch → Patchfeld → 130 m Cat-6A-Kabel → Netzwerkdose am Arbeitsplatz", "Warum ist die Verbindung instabil?", "Twisted Pair ist auf 100 m begrenzt", "Cat 6A ist nur für 10 Mbit/s geeignet|Ein Patchfeld darf nicht vor dem Switch stehen|Netzwerkdosen brauchen Glasfaser", "Für 130 m braucht man Glasfaser oder einen aktiven Zwischenverteiler."], ["osi", "Zwei Switches sind zur Ausfallsicherheit doppelt verbunden.\nSpanning Tree ist deaktiviert.\nKurz danach ist das Netz komplett lahm.", "Was ist passiert?", "Eine Schleife erzeugt einen Broadcast-Sturm", "Die Kabel sind zu lang|Die Switches haben doppelte IP-Adressen|Der DHCP-Server ist ausgefallen", "Ohne STP kreisen Broadcasts endlos durch die Schleife und legen das Netz lahm."], ["sec", "Passwortrichtlinie eines Kunden:\n6 Zeichen, nur Kleinbuchstaben,\nalle 30 Tage ändern, keine MFA.", "Was ist der größte Schwachpunkt?", "Zu kurz und zu einfach, dazu keine MFA", "Die Änderung alle 30 Tage ist zu selten|Kleinbuchstaben sind besonders sicher|MFA ist nur für Admins erlaubt", "Kurze, einfache Passwörter sind schnell geknackt. Besser: lange Passphrasen und MFA; häufiges Wechseln wird heute nicht mehr empfohlen."], ["sec", "Ein Admin verschlüsselt eine Mail an Bob mit seinem eigenen Private Key, damit nur Bob sie lesen kann.", "Was ist falsch?", "Zum Verschlüsseln an Bob nimmt man Bobs Public Key", "Mails darf man nicht verschlüsseln|Man muss dafür den Private Key von Bob nehmen|Private Keys sind nur für Webserver", "Mit dem eigenen Private Key signiert man. Verschlüsselt an Bob wird mit Bobs Public Key."], ["dsgvo", "Ein Unternehmen bemerkt am Montag eine Datenpanne mit Kundendaten.\nDie Geschäftsführung will erst nach Abschluss der internen Prüfung in zwei Wochen melden.", "Was ist falsch?", "Die Meldung an die Aufsichtsbehörde muss binnen 72 Stunden erfolgen", "Datenpannen müssen gar nicht gemeldet werden|Die Meldefrist beträgt einen Monat|Nur Behörden müssen Datenpannen melden", "Art. 33 DSGVO: Meldung möglichst binnen 72 Stunden; fehlende Infos dürfen nachgereicht werden."], ["hk", "Kalkulation eines Azubis:\nBarverkaufspreis 980,00 €\n+ 2 % Kundenskonto = 980 × 1,02 = 999,60 €", "Was ist falsch gerechnet?", "Kundenskonto wird im Hundert gerechnet: 980 ÷ 0,98 = 1.000 €", "Skonto wird immer vom Listenpreis abgezogen|Kundenskonto gibt es nur beim Einkauf|Es müssen 3 % statt 2 % sein", "Der Kunde zieht 2 % vom Zielverkaufspreis ab – also ist der Barverkaufspreis 98 % davon."], ["kauf", "Nutzwertanalyse:\nPreis 40 %, Leistung 30 %, Service 20 %, Garantie 20 %", "Was stimmt nicht?", "Die Gewichtungen ergeben 110 % statt 100 %", "Der Preis darf höchstens 25 % zählen|Garantie ist kein zulässiges Kriterium|Es müssen genau fünf Kriterien sein", "Die Gewichte müssen zusammen 100 % ergeben."], ["pm", "Netzplan:\nVorgang B: FAZ 5, Dauer 3, FEZ 7", "Was ist falsch berechnet?", "FEZ = FAZ + Dauer = 8", "FAZ muss immer 0 sein|Die Dauer darf nicht größer als 2 sein|FEZ = FAZ − Dauer = 2", "Vorwärtsrechnung: FEZ = FAZ + Dauer = 5 + 3 = 8."], ["virt", "Ein Kunde will „aus Kostengründen“ seine Domänencontroller, die Datenbank und das Backup als VMs auf einem einzigen Host ohne Cluster betreiben.", "Was ist das größte Risiko?", "Der Host ist ein Single Point of Failure – fällt er aus, ist alles weg", "VMs können keine Domänencontroller sein|Backups dürfen nicht virtualisiert werden|Datenbanken laufen nur auf physischen Servern", "Mindestens das Backup gehört auf ein anderes System; für Verfügbarkeit braucht es einen zweiten Host."], ["green", "Entsorgung eines Kundenservers:\nFestplatten werden formatiert und das Gerät an einen Gebrauchthändler verkauft.", "Was ist das Problem?", "Formatieren löscht die Daten nicht sicher", "Server dürfen nicht weiterverkauft werden|Festplatten müssen immer im Gerät bleiben|Gebrauchthändler brauchen eine IHK-Prüfung", "Formatierte Daten lassen sich wiederherstellen. Nötig: zertifiziertes Löschen oder Vernichtung nach DIN 66399 mit Protokoll."]], "programme": [["prog", "summe = 0\nFÜR i VON 1 BIS 4\n    summe = summe + i\nENDE FÜR\nAUSGABE summe", "Was wird ausgegeben?", "10", "4|6|15", "1 + 2 + 3 + 4 = 10."], ["prog", "x = 1\nSOLANGE x < 20\n    x = x * 2\nENDE SOLANGE\nAUSGABE x", "Was wird ausgegeben?", "32", "16|20|64", "1 → 2 → 4 → 8 → 16 → 32. Bei 32 ist x < 20 falsch, die Schleife endet."], ["prog", "n = 0\nWIEDERHOLE\n    n = n + 3\nBIS n > 5\nAUSGABE n", "Was wird ausgegeben?", "6", "3|5|9", "Fußgesteuert: 3 (nicht > 5), dann 6 (> 5) → Ende."], ["prog", "a = 7\nb = 3\nWENN a > 5 UND b > 5 DANN\n    AUSGABE \"beide\"\nSONST WENN a > 5 ODER b > 5 DANN\n    AUSGABE \"einer\"\nSONST\n    AUSGABE \"keiner\"\nENDE WENN", "Was wird ausgegeben?", "einer", "beide|keiner|einer und beide", "a > 5 ist wahr, b > 5 falsch → UND ist falsch, ODER ist wahr."], ["prog", "zahlen = [4, 9, 2, 7]\nmax = zahlen[0]\nFÜR JEDES z IN zahlen\n    WENN z > max DANN max = z\nENDE FÜR\nAUSGABE max", "Was macht das Programm?", "Es sucht die größte Zahl und gibt 9 aus", "Es sucht die kleinste Zahl und gibt 2 aus|Es sortiert die Liste aufsteigend|Es gibt die erste Zahl 4 aus", "max startet mit 4 und wird bei jeder größeren Zahl ersetzt → 9."], ["prog", "zahl = 17\nWENN zahl MOD 2 = 0 DANN\n    AUSGABE \"gerade\"\nSONST\n    AUSGABE \"ungerade\"\nENDE WENN", "Was wird ausgegeben?", "ungerade", "gerade|1|8", "17 MOD 2 = 1 (Rest der Division) → nicht 0 → ungerade."], ["prog", "text = \"IHK\"\nergebnis = \"\"\nFÜR i VON LÄNGE(text) BIS 1 SCHRITT -1\n    ergebnis = ergebnis + text[i]\nENDE FÜR\nAUSGABE ergebnis\n(Index beginnt bei 1)", "Was wird ausgegeben?", "KHI", "IHK|HKI|KIH", "Die Schleife läuft rückwärts von 3 bis 1 und dreht den Text um."], ["prog", "z = 0\nFÜR i VON 1 BIS 3\n    FÜR j VON 1 BIS 2\n        z = z + 1\n    ENDE FÜR\nENDE FÜR\nAUSGABE z", "Was wird ausgegeben?", "6", "5|3|9", "Verschachtelte Schleifen: 3 × 2 = 6 Durchläufe."], ["prog", "Tabelle kunde(id, name, ort)\n\nSELECT ort, COUNT(*)\nFROM kunde\nGROUP BY ort\nHAVING COUNT(*) > 10;", "Was liefert die Abfrage?", "Alle Orte mit mehr als 10 Kunden und deren Anzahl", "Die ersten 10 Kunden je Ort|Alle Kunden, deren id größer als 10 ist|Die Anzahl aller Kunden, wenn es mehr als 10 sind", "GROUP BY bildet Gruppen je Ort, HAVING filtert die Gruppen."], ["prog", "SELECT k.name, b.datum\nFROM kunde k\nLEFT JOIN bestellung b ON k.id = b.kunde_id;", "Was liefert die Abfrage?", "Alle Kunden – auch die ohne Bestellung (dann ist datum leer)", "Nur Kunden mit mindestens einer Bestellung|Nur Bestellungen ohne Kunden|Alle Bestellungen doppelt", "LEFT JOIN nimmt die linke Tabelle vollständig; fehlt ein Partner, steht NULL."], ["prog", "UPDATE artikel SET preis = preis * 1.1;", "Was passiert?", "Alle Artikel werden um 10 % teurer", "Nur der erste Artikel wird teurer|Die Preise werden um 1,1 € erhöht|Es passiert nichts, WHERE fehlt", "Ohne WHERE betrifft UPDATE alle Zeilen – hier gewollt, oft aber ein gefährlicher Fehler."], ["prog", "Struktogramm:\n┌ Eingabe: alter\n├ alter ≥ 18 ?\n│   ja: Ausgabe \"volljährig\"\n│   nein: Ausgabe \"minderjährig\"\n└ Ende", "Welche Grundstruktur zeigt das Struktogramm vor allem?", "Einfache Verzweigung (zweiseitige Auswahl)", "Kopfgesteuerte Schleife|Fußgesteuerte Schleife|Mehrfachauswahl (Fallunterscheidung)", "Eine Bedingung mit Ja- und Nein-Zweig = zweiseitige Auswahl."], ["prog", "i = 10\nSOLANGE i > 0\n    AUSGABE i\n    i = i + 1\nENDE SOLANGE", "Was ist das Problem?", "Endlosschleife – i wird größer statt kleiner", "Die Schleife läuft nie|Es wird nur 10 ausgegeben|Die Ausgabe ist 10, 9, 8 … 1", "Die Bedingung i > 0 bleibt immer wahr. Richtig wäre i = i − 1."], ["prog", "FUNKTION f(n)\n    WENN n <= 1 DANN RÜCKGABE 1\n    RÜCKGABE n * f(n − 1)\nENDE FUNKTION\nAUSGABE f(4)", "Was wird ausgegeben?", "24", "10|4|16", "Rekursion (Fakultät): 4 × 3 × 2 × 1 = 24."]], "luecken": [["hw", "Der schnellste und kleinste CPU-Cache ist der ___-Cache.", "L1|L1-Cache", "L1 → L2 → L3: kleiner und schneller nach links."], ["hw", "Das Rechenwerk der CPU heißt auch ___.", "ALU", "Arithmetic Logic Unit."], ["hw", "Speicher, der Bitfehler erkennt und korrigiert, heißt ___-RAM.", "ECC", "Error Correction Code – Pflicht in Servern."], ["spe", "Eine Sicherung aller Änderungen seit dem letzten Vollbackup heißt ___ Sicherung.", "differenzielle|differenziell|differentielle|differentiell", "Inkrementell = seit der letzten Sicherung beliebiger Art."], ["spe", "RAID ___ spiegelt die Daten auf zwei Platten.", "1", "RAID 1 = Spiegelung, 50 % nutzbar."], ["spe", "RAID 6 braucht mindestens ___ Festplatten.", "4|vier", "Zwei Paritäten, verkraftet zwei Plattenausfälle."], ["spe", "Der maximal tolerierbare Datenverlust heißt ___.", "RPO|Recovery Point Objective", "RTO ist die tolerierbare Ausfallzeit."], ["spe", "Eine Online-USV hat eine Umschaltzeit von ___ ms.", "0|null", "Doppelwandler (VFI) – der Strom läuft immer über den Wechselrichter."], ["osi", "Ein Switch arbeitet auf OSI-Schicht ___.", "2|zwei", "Ein normaler Switch nutzt MAC-Adressen."], ["osi", "Der Standard für VLAN-Tagging heißt IEEE ___.", "802.1Q|802.1q", "802.1X ist dagegen die Port-Authentifizierung."], ["osi", "Der TCP-Verbindungsaufbau heißt 3-Wege-___.", "Handshake", "SYN → SYN-ACK → ACK."], ["osi", "Ein Twisted-Pair-Kabel darf maximal ___ m lang sein.", "100|hundert", "Für längere Strecken: Glasfaser."], ["osi", "Eine MAC-Adresse ist ___ Bit lang.", "48", "6 Byte, meist hexadezimal geschrieben."], ["osi", "RDP nutzt standardmäßig Port ___.", "3389", "Remote Desktop Protocol."], ["osi", "HTTPS nutzt standardmäßig Port ___.", "443", "HTTP ohne TLS: Port 80."], ["osi", "SSH nutzt standardmäßig Port ___.", "22", "Auch SFTP läuft über Port 22."], ["ip", "Die Subnetzmaske zu /26 lautet 255.255.255.___.", "192", "/26: 26 Einsen → letztes Oktett 11000000 = 192."], ["ip", "Ein /27-Netz hat ___ nutzbare Host-Adressen.", "30", "2⁵ − 2 = 30."], ["ip", "Eine Adresse aus 169.254.0.0/16 deutet auf ___ hin.", "APIPA|kein DHCP|keinen DHCP-Server|fehlenden DHCP-Server|einen fehlenden DHCP-Server|DHCP-Fehler|APIPA-Adresse", "Der Client hat keinen DHCP-Server erreicht."], ["ip", "IPv6-Link-Local-Adressen beginnen mit ___.", "fe80|fe80::|fe80::/10", "Sie sind auf jeder IPv6-Schnittstelle automatisch vorhanden."], ["ip", "Die IPv6-Loopback-Adresse lautet ___.", "::1", "Entspricht 127.0.0.1 bei IPv4."], ["ip", "Bei IPv6 ersetzt das Protokoll ___ das ARP.", "NDP|Neighbor Discovery|Neighbor Discovery Protocol", "NDP ist Teil von ICMPv6."], ["ip", "Das Routingprotokoll des Internets heißt ___.", "BGP|Border Gateway Protocol", "Border Gateway Protocol, ein Pfadvektor-Protokoll."], ["ip", "RIP nutzt als Metrik die Anzahl der ___.", "Hops|Hop|Router", "Maximal 15 Hops."], ["dienste", "Der DHCP-Ablauf heißt kurz ___.", "DORA", "Discover, Offer, Request, Acknowledge."], ["dienste", "Ein DNS-Eintrag für den Mailserver einer Domain ist ein ___-Record.", "MX", "Mail Exchanger, mit Priorität."], ["dienste", "Ein DNS-Eintrag für eine IPv6-Adresse ist ein ___-Record.", "AAAA", "A-Record = IPv4."], ["dienste", "Der Reverse-Lookup (IP → Name) nutzt ___-Records.", "PTR", "Pointer Record."], ["dienste", "Damit DHCP über Routergrenzen funktioniert, braucht man ein DHCP-___.", "Relay|Relay-Agent|Relay Agent", "Router leiten den Broadcast nicht weiter."], ["dienste", "Kerberos scheitert, wenn die Uhren mehr als ___ Minuten abweichen.", "5|fünf", "Deshalb ist NTP im AD wichtig."], ["fw", "Die letzte Regel einer Firewall sollte ___ sein.", "Deny All|Deny Any|Default Deny|Drop All|Block All|alles verbieten|alles blockieren|alles sperren|Deny", "Was nicht ausdrücklich erlaubt ist, wird blockiert."], ["fw", "Das Segment für öffentlich erreichbare Server heißt ___.", "DMZ|demilitarisierte Zone", "Zwischen Internet und internem Netz."], ["fw", "WireGuard nutzt standardmäßig UDP-Port ___.", "51820", "IPsec nutzt UDP 500 und 4500."], ["fw", "Ein Proxy, der vor den Servern steht, heißt ___-Proxy.", "Reverse", "Ein Forward-Proxy steht vor den Clients."], ["wlan", "Im 2,4-GHz-Band überlappen sich die Kanäle 1, 6 und ___ nicht.", "11", "1, 6 und 11."], ["wlan", "Wi-Fi 6 entspricht dem Standard IEEE 802.11___.", "ax", "Wi-Fi 5 = 802.11ac."], ["wlan", "Die Anmeldung einzelner Nutzer am WLAN über RADIUS nennt man IEEE ___.", "802.1X|802.1x", "WPA2/WPA3-Enterprise."], ["virt", "Ein Hypervisor, der direkt auf der Hardware läuft, ist ein Typ-___-Hypervisor.", "1|eins", "Typ 2 läuft auf einem Host-Betriebssystem."], ["virt", "Container teilen sich den ___ des Host-Systems.", "Kernel|Betriebssystemkern", "Deshalb starten sie schnell, sind aber schwächer isoliert."], ["sec", "Das Schutzziel, das Ransomware vor allem bedroht, ist die ___.", "Verfügbarkeit", "Die Daten sind verschlüsselt und nicht mehr nutzbar."], ["sec", "AES ist ein ___ Verschlüsselungsverfahren.", "symmetrisches|symmetrisch", "RSA ist asymmetrisch."], ["sec", "Eine Nachricht an Bob verschlüsselt man mit Bobs ___ Key.", "Public|öffentlichem|öffentlichen", "Nur Bob kann sie mit seinem Private Key entschlüsseln."], ["sec", "DNSSEC sichert die Echtheit, aber nicht die ___ von DNS-Anfragen.", "Vertraulichkeit", "Dafür gibt es DoH und DoT."], ["dsgvo", "Eine Datenpanne muss binnen ___ Stunden gemeldet werden.", "72", "Art. 33 DSGVO."], ["dsgvo", "Die Kontrolle, wer einen Serverraum betreten darf, heißt ___kontrolle.", "Zutritts|Zutritt", "Zutritt = Räume, Zugang = Systeme, Zugriff = Daten."], ["prog", "Eine Schleife, die mindestens einmal läuft, ist ___gesteuert.", "fuß|fuss", "Die Bedingung steht am Ende."], ["prog", "Der SQL-Befehl zum Löschen von Datensätzen heißt ___.", "DELETE|DELETE FROM", "Ohne WHERE werden alle Zeilen gelöscht."], ["prog", "Gruppen nach GROUP BY filtert man mit ___.", "HAVING", "WHERE filtert Zeilen vor der Gruppierung."], ["pm", "Vorgänge mit Gesamtpuffer 0 bilden den ___ Pfad.", "kritischen|kritisch", "Jede Verzögerung verschiebt das Projektende."], ["pm", "Das Lastenheft schreibt der ___.", "Auftraggeber|Kunde", "Das Pflichtenheft schreibt der Auftragnehmer."], ["pm", "In Scrum priorisiert der ___ das Backlog.", "Product Owner|PO", "Der Scrum Master kümmert sich um den Prozess."], ["service", "Eine vorläufige Umgehungslösung heißt ___.", "Workaround|Umgehungslösung", "Die Ursache bleibt bestehen, der Betrieb läuft weiter."], ["service", "Eine Vereinbarung zwischen IT und Kunde heißt ___.", "SLA|Service Level Agreement", "Intern zwischen Abteilungen: OLA."], ["hk", "Kundenskonto und Kundenrabatt werden im ___ gerechnet.", "Hundert", "Der Ausgangswert ist dann weniger als 100 %."], ["hk", "Einstandspreis + Handlungskosten = ___.", "Selbstkostenpreis|Selbstkosten", "Dann folgt der Gewinnaufschlag."], ["green", "Festplatten haben nach DIN 66399 die Materialkennung ___.", "H", "SSDs und USB-Sticks: E."], ["green", "Der PUE-Wert = Gesamtenergie ÷ Energie der ___.", "IT|IT-Geräte|IT-Komponenten|IT-Systeme|IT-Hardware|IT-Infrastruktur", "Ideal ist 1,0."], ["wiso", "Ein Bedürfnis mit Kaufkraft heißt ___.", "Bedarf", "Am Markt wird er zur Nachfrage."], ["wiso", "Viele Anbieter und viele Nachfrager bilden ein ___.", "Polypol", "Oligopol = wenige, Monopol = einer."]], "warum": {"1": ["Warum nimmt man für den Cache SRAM statt DRAM?", "SRAM ist schneller und muss nicht aufgefrischt werden", "SRAM ist billiger als DRAM|SRAM hat mehr Kapazität pro Chip|SRAM verbraucht im Betrieb gar keinen Strom", "Für den Arbeitsspeicher wäre SRAM zu teuer und zu groß – dort nimmt man DRAM."], "12": ["Warum braucht die inkrementelle Wiederherstellung ALLE Teilsicherungen?", "Jede sichert nur die Änderungen seit der vorherigen Sicherung", "Weil inkrementelle Sicherungen verschlüsselt sind|Weil jede Teilsicherung das Vollbackup überschreibt|Weil sonst die Prüfsummen nicht stimmen", "Fehlt eine Teilsicherung in der Kette, fehlen deren Änderungen."], "16": ["Warum hat eine Online-USV keine Umschaltzeit?", "Der Strom läuft ständig über Gleich- und Wechselrichter", "Sie hat einen besonders schnellen Schalter|Sie speichert den Strom im Netzteil des Servers|Sie schaltet schon vor dem Ausfall um", "Beim Ausfall speist einfach der Akku weiter – nichts muss umschalten."], "20": ["Warum schützt RAID nicht vor Ransomware?", "Verschlüsselte Dateien werden sofort auf alle Platten übernommen", "Weil RAID-Controller keine Virenscanner haben|Weil Ransomware nur RAID 0 angreift|Weil RAID die Daten unverschlüsselt speichert", "RAID spiegelt jede Änderung – auch die schädliche. Nur ein Backup hat ältere Stände."], "34": ["Warum ändern sich an jedem Router die MAC-Adressen, die IP-Adressen aber nicht?", "MAC-Adressen gelten nur im lokalen Segment, IP-Adressen Ende zu Ende", "Router verschlüsseln die MAC-Adressen|MAC-Adressen werden nach jedem Hop zufällig neu vergeben|IP-Adressen sind in der MAC enthalten", "Jeder Abschnitt ist ein eigenes Schicht-2-Segment mit eigenen MAC-Adressen."], "36": ["Warum braucht TCP einen 3-Wege-Handshake?", "Beide Seiten bestätigen, dass sie senden und empfangen können, und tauschen Sequenznummern aus", "Damit die Daten zwischen beiden Seiten automatisch verschlüsselt werden|Damit die Router auf dem Weg die Route zum Ziel lernen können|Damit der DNS-Server vorher den Namen des Ziels auflösen kann", "Erst danach ist die Verbindung für beide Richtungen bestätigt."], "37": ["Warum nutzt NTP UDP statt TCP?", "Kleine, zeitkritische Pakete – ein Handshake würde nur verzögern", "Weil UDP verschlüsselt ist|Weil TCP keine Zeitangaben übertragen kann|Weil UDP zuverlässiger ist als TCP", "Bei Zeitsynchronisation zählt geringe Verzögerung; ein verlorenes Paket fragt man einfach neu an."], "42": ["Warum trennt ein Router Broadcast-Domänen?", "Er leitet Broadcasts nicht in andere Netze weiter", "Er löscht alle Pakete ohne Absender|Er wandelt Broadcasts in Multicasts um|Er gibt Broadcasts nur ins Internet weiter", "Broadcasts bleiben im eigenen Netz bzw. VLAN."], "44": ["Warum entsteht ohne STP bei redundanten Switch-Verbindungen ein Broadcast-Sturm?", "Broadcasts kreisen endlos, weil Ethernet-Frames kein TTL haben", "Weil die Switches doppelte MAC-Adressen haben|Weil zwei Kabel die Spannung verdoppeln|Weil DHCP die Adressen doppelt vergibt", "Ohne Lebensdauer werden die Frames immer wieder kopiert, bis das Netz zusammenbricht."], "50": ["Warum vergibt sich ein PC eine 169.254-Adresse?", "Er hat keinen DHCP-Server erreicht und wählt selbst eine Link-Local-Adresse", "Der DHCP-Server hat ihm absichtlich diese Adresse gegeben|Weil das Gateway ausgefallen ist|Weil der DNS-Server den Namen nicht kennt", "So können Geräte im selben Segment zumindest untereinander reden – aber nicht ins Internet."], "59": ["Warum funktioniert das lokale Netz trotz falschem Gateway?", "Ziele im eigenen Netz werden direkt per ARP erreicht, ohne Gateway", "Weil der Switch das Gateway ersetzt|Weil DNS lokale Namen ohne Gateway auflöst|Weil das Gateway nur für IPv6 nötig ist", "Das Gateway braucht man nur für Ziele außerhalb des eigenen Netzes."], "60": ["Warum klappt der Zugriff per IP, aber nicht per Name?", "Die Verbindung steht, nur die Namensauflösung (DNS) scheitert", "Weil das Standardgateway falsch eingetragen ist|Weil die Subnetzmaske für das Netz zu klein ist|Weil die Firewall Verbindungen mit Namen blockiert", "Mit der IP braucht man DNS nicht. Fehlt DNS, scheitert nur der Name."], "69": ["Warum schützt SAE (WPA3) gegen Offline-Wörterbuchangriffe?", "Aus dem mitgeschnittenen Handshake lässt sich das Passwort nicht offline testen", "Weil SAE das Passwort im Handshake durch ein Zufallspasswort ersetzt|Weil WPA3 nur im 6-GHz-Band funkt, das schwer abzuhören ist|Weil SAE nach drei Fehlversuchen den Client dauerhaft sperrt", "Jeder Rateversuch erfordert eine echte Interaktion mit dem AP – das macht Massenraten unpraktikabel."], "71": ["Warum lässt sich ein MAC-Filter leicht umgehen?", "Erlaubte MACs sind im Funkverkehr sichtbar und lassen sich am eigenen Gerät einstellen", "Weil MAC-Adressen verschlüsselt übertragen werden und sich entschlüsseln lassen|Weil MAC-Filter nur für IPv6-Geräte gelten, nicht für IPv4|Weil Access Points die erlaubten MACs nach 24 Stunden wieder vergessen", "MAC-Spoofing ist mit wenigen Klicks möglich."], "81": ["Warum leiten Router keine Broadcasts weiter?", "Sonst würden Broadcasts das ganze Netz bis ins Internet fluten", "Weil Broadcasts keine IP-Adresse haben|Weil Broadcasts nur auf Schicht 1 existieren|Weil Router nur IPv6 verstehen", "Router begrenzen Broadcasts bewusst auf das eigene Netz."], "93": ["Warum ist Stateful Inspection sicherer als ein reiner Paketfilter?", "Sie lässt nur Antworten zu Verbindungen durch, die von innen aufgebaut wurden", "Weil sie jedes Paket zusätzlich mit einem eigenen Schlüssel verschlüsselt|Weil sie gar keine Regeln braucht und alles selbst entscheidet|Weil sie schon auf Schicht 1 arbeitet und Signale direkt prüft", "Ein Paketfilter braucht für Antworten offene Regeln, die auch Angreifer nutzen können."], "98": ["Warum ist NAT kein Sicherheitsfeature?", "Es übersetzt nur Adressen und prüft keinen Inhalt; Schutz kommt von der Firewall", "Weil NAT die Pakete entschlüsselt und dadurch angreifbar macht|Weil NAT nur bei IPv6 funktioniert und IPv4 ungeschützt lässt|Weil NAT von außen automatisch alle Ports öffnet", "Der Schutz entsteht durch die Firewall-Regeln, nicht durch die Adressübersetzung."], "101": ["Warum gehört Deny All ans Ende der Regeln?", "Die erste passende Regel gewinnt – am Anfang würde sie alles blockieren", "Weil die Firewall sonst bei jedem Paket neu startet|Weil Deny-Regeln technisch nur am Ende gültig sind|Weil sie an anderer Stelle nur für UDP-Verkehr gilt", "Erst kommen die Ausnahmen (Allow), dann das Verbot für alles andere."], "118": ["Warum bedroht Ransomware vor allem die Verfügbarkeit?", "Die Daten werden verschlüsselt und sind nicht mehr nutzbar", "Weil sie die Daten ins Internet stellt|Weil sie die Daten unbemerkt verändert|Weil sie die Passwörter mitli function aufgabeNetzplan() {
  const N = 'ABCDEF', n = wahl([5, 6]), dauer = Array.from({ length: n }, () => rnd(1, 6)), vor = [[]];
  for (let i = 1; i < n; i++) { const k = i > 1 ? wahl([1, 1, 2]) : 1; vor.push(mischen([...Array(i).keys()]).slice(0, Math.min(k, i)).sort()); }
  for (let i = 0; i < n - 1; i++) if (!vor.slice(i + 1).some(v => v.includes(i))) vor[n - 1] = [...new Set([...vor[n - 1], i])].sort();
  const vorf = i => vor[i].reduce((m, j) => new Set([...m, j, ...vorf(j)]), new Set());
  for (let i = 0; i < n; i++) vor[i] = vor[i].filter(j => !vor[i].some(k => k !== j && vorf(k).has(j)));
  const faz = [], fez = [];
  for (let i = 0; i < n; i++) { faz[i] = Math.max(0, ...vor[i].map(j => fez[j])); fez[i] = faz[i] + dauer[i]; }
  const ende = fez[n - 1], sez = [], saz = [];
  for (let i = n - 1; i >= 0; i--) { const nach = [...Array(n).keys()].filter(j => vor[j].includes(i)); sez[i] = nach.length ? Math.min(...nach.map(j => saz[j])) : ende; saz[i] = sez[i] - dauer[i]; }
  const gp = faz.map((f, i) => saz[i] - f), tg = x => `${x} ${x === 1 ? 'Tag' : 'Tage'}`;
  const gegeben = dauer.map((d, i) => [`Vorgang ${N[i]}`, `Dauer ${tg(d)}, Vorgänger: ${vor[i].map(j => N[j]).join(', ') || '–'}`]);
  const tabelle = { kopf: ['Vorgang', 'Dauer', 'FAZ', 'FEZ', 'SAZ', 'SEZ', 'GP'], zeilen: dauer.map((d, i) => [N[i], d, faz[i], fez[i], saz[i], sez[i], gp[i]].map(String)) };
  const schritte = ['Vorwärts: FAZ = größter FEZ der Vorgänger, FEZ = FAZ + Dauer', 'Rückwärts: SEZ = kleinster SAZ der Nachfolger, SAZ = SEZ − Dauer',
    'Gesamtpuffer GP = SAZ − FAZ; kritisch (GP 0): ' + N.slice(0, n).split('').filter((x, i) => gp[i] === 0).join(', ')];
  if (Math.random() < 0.34) return { gegeben, frage: 'Wie lange dauert das Projekt mindestens (in Tagen)?', einheit: 'Tage', beispiel: 'ganze Zahl', pruefen: zahlPruefer(ende, 0.01), loesung: tg(ende), schritte: schritte.concat(['Projektdauer = FEZ des letzten Vorgangs = ' + tg(ende)]), tabelle };
  const i = rnd(0, n - 2);
  return { gegeben, frage: `Wie groß ist der Gesamtpuffer von Vorgang ${N[i]} (in Tagen)?`, einheit: 'Tage', beispiel: 'ganze Zahl', pruefen: zahlPruefer(gp[i], 0.01), loesung: tg(gp[i]), schritte, tabelle,
    zwischen: [[`FAZ von ${N[i]}`, faz[i], 0.01, 'Tage'], [`SAZ von ${N[i]}`, saz[i], 0.01, 'Tage']] };
}
function aufgabeNutzwert() {

  const gew = wahl([[40, 30, 20, 10], [35, 25, 25, 15], [30, 30, 20, 20], [50, 20, 20, 10], [25, 25, 25, 25]]), ang = ['Angebot A', 'Angebot B', 'Angebot C'];
  let pk, nw;
  for (let v = 0; v < 50; v++) { pk = ang.map(() => kr.map(() => rnd(3, 10))); nw = pk.map(p => p.reduce((s, x, k) => s + x * gew[k] / 100, 0)); if (new Set(nw.map(x => x.toFixed(2))).size === 3) break; }
  const best = nw.indexOf(Math.max(...nw));
  const gegeben = [['Gewichtung', kr.map((k, i) => `${k} ${gew[i]} %`).join(', ')], ...ang.map((a, j) => [a, kr.map((k, i) => `${k} ${pk[j][i]} P.`).join(', ')])];
  const tabelle = { kopf: ['Angebot', ...kr.map((k, i) => `${k} (${gew[i]} %)`), 'Nutzwert'], zeilen: ang.map((a, j) => [a, ...kr.map((k, i) => deK(pk[j][i] * gew[i] / 100)), de(nw[j])]), markiert: ang[best] };
  const schritte = ['Je Kriterium: Punkte × Gewichtung (als Dezimalzahl)', 'Alle gewichteten Punkte eines Angebots addieren', 'Höchster Nutzwert = beste Wahl: ' + ang[best]];
  if (Math.random() < 0.5) { const j = rnd(0, 2); return { gegeben, frage: `Wie hoch ist der Nutzwert von ${ang[j]}?`, einheit: 'Punkte', beispiel: 'Zahl mit 2 Nachkommastellen', pruefen: zahlPruefer(nw[j], 0.011), loesung: de(nw[j]) + ' Punkte', schritte, tabelle,
    zwischen: kr.map((k, i) => [`${k}: ${pk[j][i]} × ${gew[i]} %`, pk[j][i] * gew[i] / 100, 0.011, '']) }; }
  return { gegeben, frage: 'Welches Angebot hat den höchsten Nutzwert?', auswahl: ang, richtig: best, loesung: ang[best], schritte, tabelle };
}
function aufgabeAngebot() {
  const neu = () => { const x = { lp: wahl([180, 220, 250, 280, 320, 450, 600]) * wahl([1, 1, 10]), rab: wahl([0, 5, 8, 10, 12, 15]), sk: wahl([0, 2, 3]), bk: wahl([0, 15, 25, 30, 45, 60]) };
    x.zep = r2(x.lp * (1 - x.rab / 100)); x.bep = r2(x.zep * (1 - x.sk / 100)); x.ep = r2(x.bep + x.bk); return x; };
  let a, b; for (let v = 0; v < 50; v++) { a = neu(); b = neu(); if (Math.abs(a.ep - b.ep) > 1 && Math.abs(a.lp - b.lp) < Math.max(a.lp, b.lp) * 0.25) break; }
  const anz = wahl([1, 5, 10]), nm = ['Lieferant 1', 'Lieferant 2'], g = a.ep < b.ep ? 0 : 1, x = [a, b][g], wert = r2(x.ep * anz);
  return { gegeben: [a, b].map((y, j) => [nm[j], `Listenpreis ${de(y.lp)} €, Rabatt ${y.rab} %, Skonto ${y.sk} %, Bezugskosten ${de(y.bk)} € je Stück`]).concat([['Menge', anz + ' Stück']]),
    frage: `Wie hoch ist der Einstandspreis für ${anz} Stück beim günstigeren Lieferanten?`, einheit: '€', beispiel: 'Betrag mit 2 Nachkommastellen', pruefen: zahlPruefer(wert, 0.06),
    loesung: `${de(wert)} € (${nm[g]})`, schritte: [a, b].map((y, j) => `${nm[j]}: ${de(y.lp)} € − ${y.rab} % = ${de(y.zep)} € − ${y.sk} % Skonto = ${de(y.bep)} € + ${de(y.bk)} € = ${de(y.ep)} € Einstandspreis`).concat([`Günstiger: ${nm[g]} → ${de(x.ep)} € × ${anz} = ${de(wert)} €`]),
    zwischen: [[`Einstandspreis je Stück ${nm[0]}`, a.ep, 0.011, '€'], [`Einstandspreis je Stück ${nm[1]}`, b.ep, 0.011, '€']] };
}
