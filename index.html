<style>

.kalk{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.kalk td{padding:2px 0}.kalk td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

.szenario p{margin:8px 0 0;font-size:14px}

.rliste{display:grid;gap:6px;margin-bottom:6px}.rzeile{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;background:var(--okf);font-size:15px}

.lueckentab tr:first-child th{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--leicht);background:var(--feldlesen)}

.lueckentab tr+tr th{white-space:nowrap}.lueckentab td.ok{background:var(--okf)}.lueckentab td.nein{background:var(--nf)}
.balken.schwach{background:var(--nf)}.rotschrift{color:var(--gefahr)}

.wleiste{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.wleiste .knopf{flex:1;margin:0}

<script>
const INHALTE = {"themen": {"hw": "Hardware", "spe": "Speicher, Backup & USV", "osi": "OSI, Ports & Switching", "ip": "IP & Subnetting", "wlan": "WLAN", "dienste": "Netzwerkdienste", "fw": "Firewall, NAT & VPN", "virt": "Virtualisierung & Cloud", "sec": "IT-Sicherheit", "dsgvo": "Datenschutz & DSGVO", "prog": "Programmieren & SQL", "pm": "Projektmanagement", "kauf": "Angebot & Kauf", "hk": "Handelskalkulation", "service": "IT-Service & Qualität", "green": "Entsorgung & Green IT", "wiso": "Wirtschaft (WiSo, AP2)"}, "kurz": {"hw": "Hardware", "spe": "Speicher & Backup", "osi": "OSI & Ports", "ip": "IP & Subnetting", "wlan": "WLAN", "dienste": "Netzwerkdienste", "fw": "Firewall & VPN", "virt": "Virtualisierung", "sec": "IT-Sicherheit", "dsgvo": "DSGVO", "prog": "Programmieren", "pm": "Projektmanagement", "kauf": "Angebot & Kauf", "hk": "Handelskalkulation", "service": "IT-Service", "green": "Green IT", "wiso": "WiSo (AP2)"}, "quiz": [["hw", "Welcher Cache ist am kleinsten und am schnellsten?", "L1-Cache", "L2-Cache|L3-Cache|Arbeitsspeicher (RAM)", "L1 ist am kleinsten und schnellsten, L3 am größten und langsamsten – alle sind schneller als RAM."], ["hw", "Aus welcher Speicherart besteht der CPU-Cache?", "SRAM", "DRAM|SDRAM|Flash-Speicher", "SRAM muss nicht aufgefrischt werden, ist schnell und teuer → ideal für den Cache. DRAM ist günstig → Arbeitsspeicher."], ["hw", "Mit welcher Spannung arbeitet DDR4-RAM?", "1,2 V", "1,5 V|1,1 V|1,8 V", "DDR3 = 1,5 V, DDR4 = 1,2 V, DDR5 = 1,1 V. Jede Generation braucht weniger Spannung."], ["hw", "Wie heißt das Modul zum Chip DDR4-3200?", "PC4-25600", "PC4-3200|PC4-12800|PC5-25600", "Rechentrick: Chip-Zahl × 8 Byte. 3200 × 8 = 25.600 MB/s → PC4-25600."], ["hw", "Welcher Teil der CPU rechnet und vergleicht?", "Rechenwerk (ALU)", "Steuerwerk (Control Unit)|Register|L3-Cache", "Die ALU rechnet arithmetisch und logisch. Das Steuerwerk holt und dekodiert Befehle."], ["hw", "Wo steckt die frühere North-Bridge in modernen PCs?", "In der CPU", "Auf der Grafikkarte|Im BIOS-Chip|Im Netzteil", "Die North-Bridge (CPU, RAM, Grafik) ist in die CPU gewandert. Übrig bleibt ein Chip: PCH (Intel) bzw. FCH (AMD)."], ["hw", "Wie viele GT/s pro Lane schafft PCIe 4.0?", "16 GT/s", "8 GT/s|32 GT/s|5 GT/s", "PCIe 3.0 = 8, 4.0 = 16, 5.0 = 32 GT/s. Faustregel: Jede Generation verdoppelt."], ["hw", "Wie schnell ist USB 2.0 (Hi-Speed)?", "480 Mbit/s", "12 Mbit/s|5 Gbit/s|100 Mbit/s", "USB 1.1 = 12 Mbit/s, USB 2.0 = 480 Mbit/s, USB 3.0 (3.2 Gen 1x1) = 5 Gbit/s."], ["hw", "Welcher Mainboard-Formfaktor misst ca. 17 × 17 cm?", "Mini-ITX", "Micro-ATX|ATX|Extended ATX", "Mini-ITX: 17 × 17 cm, sparsam, oft passiv gekühlt. Micro-ATX: 24,5 × 24,5 cm."], ["hw", "Was bedeutet Hyper-Threading (Intel) bzw. SMT (AMD)?", "Ein physischer Kern bearbeitet zwei Threads", "Zwei CPUs teilen sich ein Mainboard|Der Takt wird unter Last verdoppelt|Der RAM überträgt zweimal pro Takt", "Hyper-Threading/SMT: ein physischer Kern, zwei Threads. „Zweimal pro Takt“ ist DDR."], ["hw", "Bis zu welcher Leistung geht USB Power Delivery ab Version 3.1?", "240 W", "100 W|60 W|15 W", "USB-PD liefert bis 100 W, ab USB-PD 3.1 bis 240 W."], ["hw", "Was macht der RAM, wenn der Strom weg ist?", "Er verliert alle Daten (flüchtig)", "Er speichert alles im Cache|Er schreibt automatisch auf die SSD|Nichts, RAM ist nicht flüchtig", "RAM ist flüchtig. Wird er knapp, lagert das OS in die Auslagerungsdatei aus (virtueller Speicher)."], ["spe", "Welche Sicherungsart braucht zur Wiederherstellung die Vollsicherung plus ALLE folgenden Sicherungen der Reihe nach?", "Inkrementell", "Differenziell|Vollsicherung|Spiegelung (RAID 1)", "Inkrementell sichert nur Änderungen seit der letzten Sicherung – deshalb braucht man jedes Inkrement."], ["spe", "Eine differenzielle Sicherung sichert …", "Änderungen seit der letzten Vollsicherung", "Änderungen seit der letzten Sicherung (egal welcher)|immer alle Daten|nur geänderte Systemdateien", "Differenziell wächst täglich; Wiederherstellung = Vollsicherung + letzte differenzielle."], ["spe", "Was besagt die 3-2-1-Regel?", "3 Kopien, 2 verschiedene Medien, 1 Kopie außer Haus", "3 Backups pro Woche, 2 Admins, 1 Tresor|3 Platten im RAID, 2 Server, 1 Cloud|3 Generationen, 2 Bänder, 1 Vollsicherung", "3 Kopien, 2 Medien, 1 offline/extern – schützt vor Ransomware und Brand."], ["spe", "Was beschreibt der RPO?", "Wie viel Datenverlust maximal akzeptabel ist", "Wie schnell das System wieder laufen muss|Wie viele Kopien es gibt|Wie lange der USV-Akku hält", "RPO = maximaler Datenverlust (bestimmt, wie oft gesichert wird). RTO = wie schnell es wieder laufen muss."], ["spe", "Welche USV hat eine Umschaltzeit von 0 ms?", "Online / Doppelwandler (VFI)", "Offline / Standby (VFD)|Line-Interactive (VI)|Jede USV hat 0 ms", "Bei VFI läuft der Strom immer über Akku und Wechselrichter – es gibt nichts umzuschalten."], ["spe", "Eine USV hat 1500 VA bei cos φ = 0,6. Wie viel Wirkleistung liefert sie?", "900 W", "1500 W|2500 W|600 W", "Wirkleistung = VA × Leistungsfaktor = 1500 × 0,6 = 900 W."], ["spe", "Auf welcher Ebene greift ein Server auf ein SAN zu?", "Blockebene – wie eine lokale Platte", "Dateiebene über SMB oder NFS wie ein Netzlaufwerk|Nur über USB wie eine externe Platte|Über HTTP-Downloads vom Speichersystem", "SAN = eigenes Speichernetz (iSCSI, Fibre Channel), Blockebene. NAS = Dateiebene im LAN."], ["spe", "RAID 5 mit 4 Platten à 2 TB – wie viel ist nutzbar?", "6 TB", "8 TB|4 TB|2 TB", "RAID 5: (n − 1) × kleinste Platte = 3 × 2 TB = 6 TB."], ["spe", "Warum ersetzt RAID kein Backup?", "Es schützt nicht vor Löschen, Ransomware oder Brand", "Weil RAID die Daten langsamer schreibt als ein Backup|Weil RAID nur mit SSDs zuverlässig funktioniert|Weil RAID nur die Metadaten der Dateien speichert", "RAID schützt nur vor Plattenausfall."], ["spe", "Wie viele Platten braucht RAID 6 mindestens?", "4", "3|2|5", "RAID 6: mind. 4 Platten, (n − 2) × kleinste nutzbar, 2 Platten dürfen ausfallen."], ["spe", "Wofür steht beim Generationenprinzip der „Sohn“?", "Tägliche Sicherung", "Wöchentliche Sicherung|Monatliche Sicherung|Jährliche Sicherung", "Sohn = täglich, Vater = wöchentlich, Großvater = monatlich."], ["spe", "Wie löscht man eine SSD zuverlässig?", "Secure Erase oder physisch zerstören", "Mit einem Degausser|Einmal formatieren|In den Papierkorb verschieben", "Degausser und einfaches Überschreiben wirken bei SSDs nicht zuverlässig."], ["osi", "Auf welcher OSI-Schicht arbeitet ein (normaler) Switch?", "Schicht 2 – Sicherung", "Schicht 1 – Bitübertragung|Schicht 3 – Vermittlung|Schicht 4 – Transport", "Der Switch arbeitet mit MAC-Adressen → Schicht 2."], ["osi", "Auf welcher OSI-Schicht arbeitet ein Router?", "Schicht 3 – Vermittlung", "Schicht 2 – Sicherung|Schicht 4 – Transport|Schicht 7 – Anwendung", "Router arbeiten mit IP-Adressen und routen → Schicht 3."], ["osi", "Auf welcher OSI-Schicht arbeitet ein Hub?", "Schicht 1 – Bitübertragung", "Schicht 2 – Sicherung|Schicht 3 – Vermittlung|Schicht 5 – Sitzung", "Ein Hub schickt alles an alle → Schicht 1 (wie Repeater)."], ["osi", "Welche Schicht kümmert sich um Kodierung, Kompression und Verschlüsselung?", "Schicht 6 – Darstellung", "Schicht 5 – Sitzung|Schicht 4 – Transport|Schicht 2 – Sicherung", "Darstellung (Presentation): ASCII, UTF-8, JSON, TLS-Verschlüsselung."], ["osi", "Zu welcher Schicht gehören TCP und UDP?", "Schicht 4 – Transport", "Schicht 3 – Vermittlung|Schicht 5 – Sitzung|Schicht 7 – Anwendung", "Transport: Segmentierung, Reihenfolge, Zuordnung per Port."], ["osi", "Welcher Port gehört zu RDP?", "3389", "3306|5900|22", "3389 = RDP, 3306 = MySQL, 5900 = VNC, 22 = SSH."], ["osi", "Welcher Port gehört zu IMAPS?", "993", "995|143|999", "143 = IMAP, 993 = IMAPS. 995 = POP3S. (999 war ein Fehler in deinen Unterlagen!)"], ["osi", "Welcher Port wird für SMTP-Submission mit TLS genutzt?", "587", "25|110|143", "25 = SMTP Server zu Server, 465/587 = SMTPS/Submission mit TLS."], ["osi", "Welcher Port gehört zu Kerberos?", "88", "389|636|445", "88 = Kerberos (Domänenanmeldung), 389 = LDAP, 636 = LDAPS, 445 = SMB."], ["osi", "Welcher Port gehört zu DNS?", "53", "67|123|161", "53 = DNS, 67/68 = DHCP, 123 = NTP, 161 = SNMP."], ["osi", "Was ändert sich an jedem Router auf dem Weg durchs Netz?", "Die MAC-Adressen", "Die IP-Adressen|Die Ports|Die Nutzdaten", "IP-Adressen bleiben gleich, MAC-Adressen ändern sich an jedem Hop."], ["osi", "Wie groß ist ein Ethernet-Frame?", "Maximal 1518 Byte, mindestens 64 Byte", "Immer genau 1518 Byte, egal wie viele Nutzdaten|Maximal 1500 Byte, mindestens 46 Byte|Maximal 9000 Byte, mindestens 64 Byte", "Max. 1518 Byte, davon 1500 Byte Nutzdaten (MTU). Minimum 64 Byte."], ["osi", "Wie läuft der TCP-3-Wege-Handshake ab?", "SYN → SYN-ACK → ACK", "ACK → SYN → FIN|SYN → ACK → SYN-ACK|SYN → FIN → ACK", "Client SYN, Server SYN-ACK, Client ACK. Der dritte Schritt beweist den Rückweg."], ["osi", "Welcher dieser Dienste nutzt typischerweise UDP?", "NTP", "SSH|HTTPS|SMTP", "UDP: DNS, DHCP, NTP, SNMP, VoIP, Streaming. TCP: HTTP(S), Mail, FTP, SSH, RDP."], ["osi", "Wie lang darf ein Twisted-Pair-Kupferkabel maximal sein?", "100 m", "30 m|500 m|1000 m", "Max. 100 m wegen Dämpfung und Übersprechen."], ["osi", "Welche Kupferkategorie ist für 10GBASE-T bei 500 MHz spezifiziert?", "Cat 6A", "Cat 5e|Cat 6|Cat 8", "Cat 6A: 500 MHz, 10 Gbit/s. Cat 6 nur bis 55 m mit 10 Gbit/s."], ["osi", "Was stimmt zu Singlemode-Glasfaser?", "Dünner Kern, bis 10–100 km, höchste Bandbreite über Distanz", "Dicker Kern, nur ca. 300 m, für kurze Strecken|Langsamer als Multimode, dafür günstiger|Wird durch elektromagnetische Störungen stark beeinflusst", "Singlemode = dünn, weit, schnell. Multimode = dicker Kern, kürzere Strecken, günstiger."], ["osi", "Wie lang ist eine MAC-Adresse?", "48 Bit", "32 Bit|64 Bit|128 Bit", "48 Bit = 12 Hex-Zeichen. Erste 24 Bit Hersteller (OUI), letzte 24 Bit Gerätenummer."], ["osi", "Womit trennt man Broadcast-Domänen?", "Router oder VLAN", "Switch|Hub|Repeater", "Alles an einem Switch ist eine Broadcast-Domäne. Trennung nur per Router oder VLAN."], ["osi", "Welcher Standard beschreibt VLANs?", "IEEE 802.1Q", "IEEE 802.1X|IEEE 802.3af|IEEE 802.11ac", "802.1Q = VLAN-Tagging. 802.1X = Port-Anmeldung, 802.3af = PoE."], ["osi", "Was verhindert Spanning Tree (STP)?", "Schleifen und Broadcast-Stürme bei redundanter Verkabelung", "Doppelte IP-Adressen bei statischer Vergabe im Netz|Unverschlüsselten Verkehr zwischen zwei Switches|Zu lange Kabelwege durch automatisches Umleiten", "STP wählt eine Root Bridge und blockiert redundante Wege, bis einer ausfällt."], ["osi", "Was ist ein Trunk-Port?", "Ein Port, der mehrere VLANs getaggt überträgt", "Ein Port für genau ein Endgerät-VLAN|Ein deaktivierter Port|Ein Port mit PoE", "Trunk = tagged, mehrere VLANs (zwischen Switches/Router). Access = untagged, ein VLAN."], ["osi", "Was macht ICMP?", "Meldet Fehler und Diagnose (z. B. Ping)", "Sendet fehlerhafte Pakete erneut|Vergibt IP-Adressen|Übersetzt Namen in IPs", "ICMP meldet nur. Neusenden macht TCP."], ["osi", "Was ist ein Socket?", "IP-Adresse + Port + Protokoll", "MAC-Adresse + IP-Adresse|Nur die Portnummer|Ein Netzwerkkabel-Stecker", "Eine Verbindung ist eindeutig durch das 5-Tupel: Quell-IP, Quell-Port, Ziel-IP, Ziel-Port, Protokoll."], ["osi", "Wo gehören Bridge und CSMA/CD im OSI-Modell hin?", "Schicht 2", "Schicht 1|Schicht 3|Schicht 4", "Beides Schicht 2 (Sicherung). In deinen Unterlagen stand fälschlich Schicht 1."], ["ip", "Welcher private Adressbereich gehört zur Klasse B?", "172.16.0.0/12", "172.16.0.0/16|10.0.0.0/8|192.168.0.0/16", "172.16.0.0 bis 172.31.255.255 = /12. (In deinen Unterlagen stand fälschlich /16.)"], ["ip", "Ein PC hat die Adresse 169.254.12.7. Was bedeutet das?", "Kein DHCP-Server erreichbar (APIPA)", "Der PC ist im Internet|Das ist eine Loopback-Adresse|Der PC hat eine statische IP", "169.254.0.0/16 = APIPA, selbst vergeben, kein Gateway, nicht routbar."], ["ip", "Welche Subnetzmaske entspricht /26?", "255.255.255.192", "255.255.255.128|255.255.255.224|255.255.255.240", "26 Einsen: das letzte Oktett 11000000 = 192."], ["ip", "Wie viele nutzbare Hosts hat ein /27-Netz?", "30", "32|62|14", "Host-Bits = 32 − 27 = 5 → 2⁵ − 2 = 30."], ["ip", "Wie lautet die Netzadresse von 192.168.16.52/25?", "192.168.16.0", "192.168.16.128|192.168.16.52|192.168.0.0", "Blockgröße 128: 52 liegt im Block 0–127 → Netz .0, Broadcast .127."], ["ip", "Wie lautet die Broadcastadresse von 192.168.16.52/25?", "192.168.16.127", "192.168.16.255|192.168.16.128|192.168.16.126", "Alle Host-Bits auf 1 → .127. Nutzbar: .1 bis .126."], ["ip", "Wie lang ist eine IPv6-Adresse?", "128 Bit", "64 Bit|32 Bit|256 Bit", "8 Blöcke à 4 Hex-Ziffern = 128 Bit."], ["ip", "Welches Präfix hat eine IPv6-Link-Local-Adresse?", "fe80::/10", "fc00::/7|2000::/3|ff00::/8", "fe80::/10 = Link-Local (wie APIPA), fc00::/7 = ULA, 2000::/3 = Global Unicast, ff00::/8 = Multicast."], ["ip", "Wie kürzt man 2001:0db8:0000:0000:0000:8a2e:0370:7334 korrekt?", "2001:db8::8a2e:370:7334", "2001:db8:0:8a2e:370:7334|2001:db8::8a2e::370:7334|21:db8::8a2e:37:7334", "Führende Nullen weg, eine längste Null-Folge durch :: ersetzen – nur einmal pro Adresse."], ["ip", "Wie viele /64-Netze stecken in einem /48-Präfix?", "65.536", "256|16|4.096", "64 − 48 = 16 Bit → 2¹⁶ = 65.536 Netze."], ["ip", "Lokales Netz funktioniert, Internet nicht. Wahrscheinlichste Ursache?", "Gateway fehlt oder ist falsch", "DNS-Server fehlt oder ist falsch|IP-Adresse ist doppelt vergeben|Subnetzmaske ist zu groß gewählt", "Ohne Gateway kommt man nicht aus dem eigenen Netz raus."], ["ip", "Zugriff per IP klappt, per Name nicht. Ursache?", "DNS fehlt oder ist falsch", "Gateway fehlt oder ist falsch|DHCP-Server ist ausgefallen|Netzwerkkabel ist defekt", "Namensauflösung = DNS."], ["ip", "Ein /24 soll in 8 Subnetze geteilt werden. Welche neue CIDR?", "/27", "/25|/26|/28", "2³ = 8 → 3 Bits borgen: 24 + 3 = /27, je 30 Hosts, Blockgröße 32."], ["ip", "Was bedeutet Dual Stack?", "Geräte haben IPv4 und IPv6 parallel", "Zwei Router hintereinander|Zwei Netzwerkkarten pro PC|IPv6 wird in IPv4 getunnelt", "Dual Stack = beides parallel (DNS: A- und AAAA-Record). Tunneling = ein Protokoll im anderen."], ["ip", "Was ist die IPv6-Loopback-Adresse?", "::1", "fe80::1|127.0.0.1|ff02::1", "::1 entspricht 127.0.0.1. ff02::1 = alle Knoten (Multicast)."], ["ip", "Wie prüft ein Host, ob ein Ziel im eigenen Netz liegt?", "UND-Verknüpfung von IP und Subnetzmaske", "Per DNS-Anfrage an den eingetragenen DNS-Server|Per Ping an das Standardgateway und Auswertung der TTL|ODER-Verknüpfung von IP-Adresse und Gateway", "IP AND Maske = Netzadresse. Gleich → direkt per ARP, sonst über das Gateway."], ["wlan", "Welche Kanäle im 2,4-GHz-Band überlappen sich nicht?", "1, 6, 11", "1, 2, 3|1, 5, 9, 13|6, 7, 8", "Jeder Kanal ist 20 MHz breit, das Band nur ca. 83 MHz → nur 1, 6, 11 überlappungsfrei."], ["wlan", "Welcher Standard ist Wi-Fi 6?", "802.11ax", "802.11ac|802.11n|802.11g", "n = Wi-Fi 4, ac = Wi-Fi 5, ax = Wi-Fi 6/6E."], ["wlan", "Auf welcher Frequenz funkt 802.11ac?", "5 GHz", "2,4 GHz|60 GHz|2,4 und 5 GHz", "802.11ac nur 5 GHz. 802.11n nutzt 2,4 + 5 GHz."], ["wlan", "Welches Verfahren ist in Minuten geknackt?", "WEP", "WPA2|WPA3|WPA2-Enterprise", "WEP: gleicher Schlüssel für die ganze Sitzung – unsicher."], ["wlan", "Was bringt WPA3 neu?", "SAE als Schutz gegen Brute Force", "TKIP als neue Verschlüsselung|Versteckte SSID als Pflicht|MAC-Filter auf jedem Access Point", "WPA3 (seit 2018): SAE gegen Brute Force, OWE für offene Netze."], ["wlan", "Welche Rolle hat der Access Point bei 802.1X?", "Authenticator", "Supplicant|Authentication Server|Root Bridge", "Supplicant = Client, Authenticator = AP/Controller, Authentication Server = RADIUS."], ["wlan", "Warum ist ein MAC-Filter unsicher?", "Die MAC steht im Klartext und lässt sich fälschen", "Die MAC wird mit WEP verschlüsselt und ist dadurch schwach|Er blockiert alle Geräte, die IPv6 verwenden|Er funktioniert nur im 5-GHz-Band, nicht im 2,4-GHz-Band", "MAC-Adressen sind im Header lesbar und leicht zu spoofen."], ["wlan", "Welche EAP-Methode wird empfohlen?", "EAP-TLS mit Zertifikaten auf beiden Seiten", "PEAP mit WEP-Verschlüsselung für ältere Geräte|PSK mit möglichst langem gemeinsamem Passwort|MAC-Authentifizierung mit freigegebener Geräteliste", "EAP-TLS ist am sichersten. PEAP-MSCHAPv2 nutzt Benutzername/Passwort."], ["wlan", "Wofür steht AAA?", "Authentication, Authorization, Accounting", "Access, Admin, Audit|Authentication, Access, Availability|Account, Address, Alias", "Wer bist du? Was darfst du? Was hast du genutzt?"], ["wlan", "Warum ist WPA-Personal in Firmen problematisch?", "Ein geleakter PSK gibt allen Zugriff, jeder Wechsel betrifft alle Geräte", "Es ist deutlich langsamer als WPA-Enterprise, weil jedes Paket geprüft wird|Es funktioniert nicht mit Laptops, nur mit Smartphones und Tablets|Es verschlüsselt nur die Anmeldung, die Daten laufen danach im Klartext", "Enterprise = Einzelanmeldung, Konto sperren statt alle Geräte umstellen."], ["wlan", "Was ist ein Rogue Access Point?", "Ein gefälschtes WLAN, über das ein Angreifer mitliest", "Ein Access Point, der nur WPA3 unterstützt|Ein offizieller AP im Gäste-VLAN der Firma|Ein Mesh-Repeater, der das Signal verstärkt", "Rogue AP = gefälschtes WLAN."], ["wlan", "Was ist ein Nachteil von 5 GHz gegenüber 2,4 GHz?", "Schlechter durch Wände", "Mehr Störungen durch Mikrowellen|Weniger Kanäle|Langsamer", "5 GHz: schnell, weniger Störungen, aber geringere Reichweite durch Wände."], ["wlan", "Warum kommt bei WLAN in der Praxis weniger an als brutto?", "Overhead, Halbduplex, geteilte Bandbreite, Wände, Störungen", "Weil der Router den Durchsatz absichtlich drosselt|Weil WPA2 etwa die Hälfte der Bandbreite verbraucht|Weil der Provider WLAN-Verkehr extra begrenzt", "Bruttowerte sind Laborwerte; real oft nur die Hälfte oder weniger."], ["dienste", "In welcher Reihenfolge läuft DHCP ab?", "Discover → Offer → Request → Acknowledge", "Request → Offer → Discover → Acknowledge|Offer → Discover → Acknowledge → Request|Discover → Request → Offer → Acknowledge", "DORA: Discover, Offer, Request, Acknowledge."], ["dienste", "Wann versucht ein Client zuerst, seine DHCP-Lease zu verlängern?", "Bei 50 % der Laufzeit (T1)", "Bei 87,5 % der Laufzeit (T2)|Erst bei 100 % der Laufzeit|Bei 25 % der Laufzeit (T0)", "T1 = 50 % per Unicast, T2 = 87,5 % per Broadcast, danach neu mit DORA."], ["dienste", "Wofür steht DHCP-Option 3?", "Gateway (Router)", "DNS-Server|Domänenname|NTP-Server", "3 = Gateway, 6 = DNS, 15 = Domänenname, 42 = NTP, 66/67 = PXE."], ["dienste", "Warum braucht man ein DHCP-Relay?", "Router leiten keine Broadcasts weiter", "DHCP ist sonst unverschlüsselt|Damit Clients IPv6 bekommen|Weil Switches DHCP blockieren", "Das Relay („ip helper-address“) schickt die Anfrage als Unicast an den zentralen Server."], ["dienste", "Was steht in einem AAAA-Record?", "IPv6-Adresse", "IPv4-Adresse|Mailserver|Alias-Name", "A = IPv4, AAAA = IPv6, MX = Mail, CNAME = Alias, PTR = Reverse."], ["dienste", "Welcher DNS-Record zeigt auf den Mailserver?", "MX", "PTR|CNAME|SRV", "MX = Mail Exchanger. SRV findet z. B. Domänencontroller."], ["dienste", "Was prüft ein Client, bevor er den DNS-Server fragt?", "DNS-Cache und HOSTS-Datei", "Die ARP-Tabelle|Den DHCP-Server|Die Routingtabelle", "Die HOSTS-Datei ist lokal und hat Vorrang."], ["dienste", "Wie nennt man mehrere AD-Trees zusammen?", "Forest", "Domäne|OU|Site", "Domänen mit gemeinsamem Namensstamm = Tree, mehrere Trees = Forest."], ["dienste", "Wofür nutzt man OUs im Active Directory?", "Container für Gruppenrichtlinien und Delegation", "Als Ersatz für DNS-Zonen innerhalb der Domäne|Zum Speichern von Backups der Domänencontroller|Als zweite, getrennte Domäne im selben Forest", "OUs sortieren nach Abteilung/Standort, darauf wirken GPOs."], ["dienste", "Ab welcher Zeitabweichung scheitert die Kerberos-Anmeldung?", "Mehr als 5 Minuten", "Mehr als 5 Sekunden|Mehr als 1 Stunde|Mehr als 1 Tag", "Deshalb ist NTP so wichtig."], ["dienste", "Wofür steht SNMP?", "Simple Network Management Protocol", "Simple Network Monitoring Protocol|Secure Network Mail Protocol|Server Name Mapping Protocol", "Management, nicht Monitoring – ein Fehler aus deinen Unterlagen."], ["dienste", "Was ist passives Monitoring?", "Warten auf Meldungen wie SNMP-Traps oder Logs", "Regelmäßig alle Geräte per Ping abfragen|Port-Scans im Netz durchführen und auswerten|Agenten auf allen Servern installieren und abfragen", "Aktiv = selbst abfragen, passiv = warten auf Meldungen, beides = hybrid."], ["dienste", "Was unterscheidet IMAP von POP3?", "Bei IMAP bleiben die Mails auf dem Server, Sync über alle Geräte", "IMAP ist nur zum Senden da, POP3 nur zum Abrufen|Bei POP3 bleiben die Mails auf dem Server, Sync über alle Geräte|IMAP löscht die Mails nach dem Abruf vom Server", "POP3 holt ab und löscht meist. SMTP = senden."], ["dienste", "Welche SNMP-Version verschlüsselt?", "SNMPv3", "SNMPv1|SNMPv2c|Keine", "Alte Versionen sind unsicher, nur v3 verschlüsselt."], ["fw", "Welche Regel steht in einer Firewall-Regeltabelle immer am Ende?", "Deny All", "Allow All|Allow LAN to Any|Log All", "Alles, was nicht erlaubt ist, wird verworfen."], ["fw", "Was macht eine Stateful-Inspection-Firewall besonders?", "Sie merkt sich Verbindungen und lässt passende Antworten automatisch durch", "Sie liest den Inhalt jedes Pakets bis auf Schicht 7|Sie verschlüsselt den gesamten Verkehr nach außen|Sie vergibt den Clients automatisch IP-Adressen", "Nur die Startrichtung braucht eine Regel; das 5-Tupel steht in der State-Tabelle."], ["fw", "Wofür ist eine DMZ da?", "Eigenes Segment für öffentlich erreichbare Server", "Eigenes Segment ausschließlich für das Gäste-WLAN|Abgeschottetes Netz nur für Backups und NAS|Sicherer Bereich für interne Drucker und Scanner", "Von der DMZ nur minimale, kontrollierte Zugriffe ins LAN."], ["fw", "Was zeichnet eine Back-to-Back-Firewall aus?", "Zwei Firewalls (ideal von zwei Herstellern) mit DMZ dazwischen", "Eine Firewall mit drei Anschlüssen (LAN, DMZ, WAN)|Eine eigene Software-Firewall auf jedem PC|Zwei Firewalls parallel nur zur Lastverteilung", "Zwei Barrieren, hohe Sicherheit, aber teurer."], ["fw", "Was macht PAT (NAT Overload)?", "Viele private IPs teilen sich eine öffentliche, unterschieden über Ports", "Eine private IP wird fest auf eine öffentliche umgesetzt|Viele private IPs werden auf einen Pool öffentlicher IPs verteilt|Die Ports werden verschlüsselt, damit niemand mitliest", "Standard bei jedem DSL-Router."], ["fw", "Was ist Port Forwarding?", "Eine feste DNAT-Regel von außen nach innen", "Ein VPN-Tunnel zwischen zwei Standorten|Eine Firewall-Regel von innen nach außen|Ein VLAN-Trunk zwischen zwei Switches", "z. B. 212.31.20.125:3389 → 10.0.0.9:3389. Braucht zusätzlich eine erlaubende Regel."], ["fw", "Welche Aussage zu NAT stimmt?", "NAT ist kein Sicherheitsfeature", "NAT ersetzt eine Firewall|NAT verschlüsselt den Verkehr|NAT funktioniert nur mit IPv6", "Schutz bringt die Stateful-Policy, nicht NAT."], ["fw", "Welche Technik nutzt man typischerweise für Site-to-Site-VPN?", "IPsec zwischen zwei Routern", "RDP von einem PC zum anderen|SNMP zwischen den Routern|HTTPS im Browser des Benutzers", "Clients brauchen dafür keine Software."], ["fw", "Warum kommt ein SSL-VPN fast überall durch?", "Es nutzt Port 443", "Es nutzt Port 22|Es braucht keine Ports|Es nutzt ICMP", "443 ist fast nirgends gesperrt."], ["fw", "In welcher Reihenfolge werden Firewall-Regeln geprüft?", "Von oben nach unten, die erste passende gilt", "Von unten nach oben|Die spezifischste gilt|Alle gleichzeitig, Mehrheit entscheidet", "Daher gehört Deny All ans Ende."], ["fw", "Was ist East-West-Verkehr?", "Verkehr innerhalb des Netzes", "Verkehr rein und raus ins Internet|VPN-Verkehr|Verkehr zwischen zwei Firmen", "North-South = rein/raus, East-West = intern (Segmentierung, Host-Firewall)."], ["fw", "Welcher Firewall-Typ prüft auch den Inhalt (Payload)?", "Application-Filter / NGFW (Schicht 7)", "Paketfilter (Schicht 3 und 4)|Stateful Inspection (Schicht 4)|Portfilter auf dem Router (Schicht 4)", "NGFW/UTM: IDS/IPS, URL-Filter, TLS-Inspection."], ["fw", "Welchen Port nutzt WireGuard?", "51820 UDP", "1194 UDP|500 UDP|443 TCP", "1194 = OpenVPN, 500/4500 = IPsec."], ["virt", "Welcher Hypervisor ist Typ 1 (Bare Metal)?", "VMware ESXi", "VirtualBox|VMware Workstation|Parallels", "Typ 1: ESXi, Hyper-V, KVM. Typ 2: Workstation, VirtualBox, Parallels."], ["virt", "Wie läuft ein Typ-2-Hypervisor?", "Als Programm auf einem Host-Betriebssystem", "Direkt auf der Hardware ohne Host-Betriebssystem|Als Erweiterung im BIOS bzw. UEFI des Servers|Nur beim Cloud-Anbieter, nicht auf eigenen Geräten", "Hosted, mehr Overhead – gut für Desktop und Test."], ["virt", "Was teilen sich Container?", "Den Kernel des Host-Systems", "Nichts, jeder hat ein eigenes OS|Die Hardware-Firmware|Ein gemeinsames Gast-OS mit eigenem Kernel pro Container", "Container: App + Abhängigkeiten, gleicher Kernel, startet in Sekunden."], ["virt", "Welches Produkt ist ein Beispiel für Paravirtualisierung?", "Xen", "Docker|VirtualBox|App-V", "Bei Paravirtualisierung ist das Gast-OS angepasst und spricht direkt mit dem Hypervisor."], ["virt", "Was verwaltet der Kunde bei IaaS?", "Betriebssystem, Laufzeit, Anwendung und Daten", "Nur die Daten, alles andere der Anbieter|Nichts – alles übernimmt der Anbieter|Server, Speicher und Netzwerk-Hardware", "Bei IaaS stellt der Anbieter Hardware und Virtualisierung."], ["virt", "Was ist ein Beispiel für SaaS?", "Microsoft 365", "Eine gemietete VM|Eine Entwicklungsumgebung|Eigener Serverraum", "SaaS: fertige Anwendung. PaaS: Webserver, Datenbank, Entwicklungsumgebung."], ["virt", "Was verwaltet der Kunde bei PaaS?", "Anwendung und Daten", "Betriebssystem und Anwendung|Server und Speicher|Gar nichts", "Bei PaaS übernimmt der Anbieter alles bis einschließlich Laufzeit/Middleware."], ["virt", "Wer ist bei SaaS für den Inhalt der Daten nach DSGVO verantwortlich?", "Immer der Kunde", "Der Anbieter|Das Rechenzentrum|Niemand", "Die Verantwortung für den Dateninhalt bleibt immer beim Kunden."], ["virt", "Was ist eine Hybrid Cloud?", "Private/On-Prem plus Public Cloud, verbunden über VPN oder Standleitung", "Mehrere Public-Cloud-Anbieter, die parallel genutzt werden|Eine Cloud, die nur für Behörden zugelassen ist|Eine Cloud, die komplett ohne Internetzugang läuft", "Mehrere Public-Anbieter = Multi Cloud."], ["virt", "Was bedeutet Pay per Use?", "Nur zahlen, was gerade genutzt wird", "Fester Monatspreis, egal wie viel genutzt wird|Einmalkauf mit dauerhafter Lizenz|Zahlen pro Mitarbeiter, nicht pro Nutzung", "Pay as you Grow = Leistung wächst geplant mit."], ["virt", "Wofür steht DRaaS?", "Disaster Recovery as a Service", "Database Replication as a Service|Desktop Remote as a Service|Data Routing as a Service", "DaaS = virtuelle Desktops, DBaaS = Datenbank."], ["virt", "Was unterscheidet eine VM von einem Container?", "Die VM hat ein eigenes Betriebssystem und ist stärker isoliert", "Container haben ein eigenes Betriebssystem und sind stärker isoliert|VMs starten schneller, weil sie keinen eigenen Kernel laden|Container brauchen mehr RAM, weil sie das ganze OS kopieren", "Container: leichter und schneller, aber weniger isoliert."], ["virt", "Was ist ein Nachteil der Private Cloud gegenüber der Public Cloud?", "Kapazität für Lastspitzen muss dauerhaft gekauft werden", "Man hat weniger Kontrolle über Daten und Hardware|Sie bringt grundsätzlich DSGVO-Probleme mit sich|Man ist stärker vom Cloud-Anbieter abhängig", "Public: bei Bedarf zuschalten und wieder abbauen."], ["sec", "Welches Schutzziel bedroht Ransomware vor allem?", "Verfügbarkeit", "Vertraulichkeit|Integrität|Authentizität", "Daten sind verschlüsselt und nicht mehr nutzbar. Schutz: Offline-Backups."], ["sec", "Welches Schutzziel bedroht Sniffing?", "Vertraulichkeit", "Verfügbarkeit|Integrität|Authentizität", "Mitlesen = Einsicht. Schutz: Verschlüsselung (HTTPS, VPN)."], ["sec", "Welches Schutzziel sichern Hashwerte?", "Integrität", "Verfügbarkeit|Vertraulichkeit|Keines", "Kleinste Änderung = ganz anderer Hash → Veränderung erkennbar."], ["sec", "Welche Schadsoftware verbreitet sich eigenständig über das Netzwerk?", "Wurm", "Virus|Trojaner|Scareware", "Ein Virus wird erst beim Öffnen aktiv, ein Wurm verbreitet sich ohne Zutun."], ["sec", "Was gilt als eine der häufigsten Ursachen für Sicherheitsvorfälle?", "Insider (böswillig oder unachtsam)", "Zero-Day-Exploits (unbekannte Lücken)|DDoS-Angriffe auf Webserver|Honeypots im Firmennetz", "Schutz: Rechte nach Need-to-know, Protokollierung, Schulung."], ["sec", "Welches Verfahren ist symmetrisch?", "AES", "RSA|ECC|SHA-256", "RSA und ECC sind asymmetrisch, SHA-256 ist ein Hash."], ["sec", "Mit welchem Schlüssel verschlüsselt man eine Nachricht an Bob?", "Mit Bobs Public Key", "Mit Bobs Private Key|Mit dem eigenen Private Key|Mit dem eigenen Public Key", "Nur Bob kann dann mit seinem Private Key entschlüsseln."], ["sec", "Wie entsteht eine digitale Signatur?", "Hash bilden und mit dem eigenen Private Key verschlüsseln", "Hash mit dem Public Key des Empfängers verschlüsseln|Nachricht mit AES verschlüsseln|Eine Unterschrift einscannen", "Geprüft wird mit dem Public Key des Absenders → Integrität + Authentizität."], ["sec", "Wie viele Schlüssel braucht man symmetrisch bei 10 Personen?", "45", "10|20|90", "n·(n−1)/2 = 10·9/2 = 45."], ["sec", "Was ist ein Beispiel für hybride Verschlüsselung?", "TLS / HTTPS", "AES alleine|RSA alleine|MD5", "Asymmetrisch einen Sitzungsschlüssel austauschen, dann symmetrisch weiter."], ["sec", "Was besagt das Maximumprinzip (BSI)?", "Ein Server erbt den höchsten Schutzbedarf seiner Anwendungen", "Man wählt bei mehreren Möglichkeiten immer die teuerste Maßnahme|Es gilt der Durchschnitt des Schutzbedarfs aller Anwendungen|Redundanz senkt den Schutzbedarf automatisch eine Stufe", "Redundanz senkt = Verteilungseffekt. Viele kleine Schäden = Kumulationseffekt."], ["sec", "Welcher Hash gilt als unsicher?", "MD5", "SHA-256|SHA-384|SHA-512", "MD5 und SHA-1 gelten als unsicher."], ["sec", "Was ist ein Honeypot?", "Ein Köder-System, das Angreifer anlockt", "Ein Passwort-Tresor für Administratoren|Ein Virenscanner für E-Mail-Anhänge|Eine Backup-Methode mit Köderdateien", "Damit beobachtet man Angriffsmethoden."], ["sec", "Wer stellt ein X.509-Zertifikat aus?", "Eine Zertifizierungsstelle (CA)", "Der Browser des Benutzers|Der zuständige DNS-Server|Jeder Webserver ganz allein", "Das Gesamtsystem heißt PKI."], ["sec", "Was ist ein Zero-Day-Exploit?", "Ausnutzung einer Lücke, für die es noch keinen Patch gibt", "Ein Angriff, der genau um Mitternacht startet|Ein Virus, der keine Schadfunktion enthält|Ein Zertifikat, das heute abgelaufen ist", "Schutz: Verhaltenserkennung, Segmentierung, schnell patchen."], ["sec", "Was ist der Unterschied zwischen IDS und Honeypot?", "IDS erkennt verdächtigen Verkehr und alarmiert, Honeypot lockt Angreifer an", "Kein Unterschied – beides sind Namen für dasselbe System|IDS verschlüsselt den Verkehr, Honeypot entschlüsselt ihn|IDS gibt es nur für WLAN, Honeypot nur für kabelgebundene Netze", "NIDS überwacht das Netz, HIDS einen einzelnen Host."], ["dsgvo", "Seit wann gilt die DSGVO?", "25. Mai 2018", "1. Januar 2016|25. Mai 2020|1. Januar 2018", "EU-weit; das BDSG ergänzt sie in Deutschland."], ["dsgvo", "Binnen welcher Frist muss eine Datenpanne der Behörde gemeldet werden?", "72 Stunden", "24 Stunden|7 Tagen|30 Tagen", "Und ggf. die Betroffenen informieren."], ["dsgvo", "Wie hoch kann das Bußgeld bei schweren Verstößen sein?", "Bis 20 Mio. € oder 4 % des weltweiten Jahresumsatzes", "Bis 300.000 € unabhängig vom Umsatz|Bis 10 Mio. € oder 2 % des Jahresumsatzes|Bis 1 Mio. € oder 1 % des Jahresumsatzes", "10 Mio./2 % z. B. bei TOM und Dokumentation. (300.000 € war das alte BDSG.)"], ["dsgvo", "Ist eine IP-Adresse ein personenbezogenes Datum?", "Ja", "Nein, nie|Nur bei IPv6|Nur bei statischen Adressen", "Auch E-Mail, Standort, Cookie-ID gehören dazu."], ["dsgvo", "Abgeschlossener Serverraum und Pförtner sind Beispiele für …", "Zutrittskontrolle", "Zugangskontrolle|Zugriffskontrolle|Weitergabekontrolle", "Zutritt → Zugang → Zugriff: erst in den Raum, dann an den Rechner, dann an die Daten."], ["dsgvo", "Login mit MFA und Passwortrichtlinie sind …", "Zugangskontrolle", "Zutrittskontrolle|Zugriffskontrolle|Eingabekontrolle", "Zugang = wer kann sich am System anmelden."], ["dsgvo", "NTFS-Rechte und Rollen in Anwendungen sind …", "Zugriffskontrolle", "Zugangskontrolle|Zutrittskontrolle|Trennungsgebot", "Zugriff = wer darf welche Daten lesen/ändern."], ["dsgvo", "Protokollierung, wer wann was geändert hat, ist …", "Eingabekontrolle", "Weitergabekontrolle|Auftragskontrolle|Verfügbarkeitskontrolle", "z. B. Windows-Ereignisanzeige."], ["dsgvo", "Ein AV-Vertrag mit dem Steuerbüro gehört zu …", "Auftragskontrolle", "Weitergabekontrolle|Eingabekontrolle|Zutrittskontrolle", "Halten Dienstleister sich an die Vorgaben?"], ["dsgvo", "Was bedeutet Datenminimierung?", "Nur so viele Daten wie nötig, nicht mehr benötigte löschen", "Daten vor dem Speichern komprimieren|Daten nur noch in der Cloud speichern|Nur Daten von Minderjährigen besonders schützen", "Keine Speicherung „auf Vorrat“."], ["dsgvo", "Wann darf ein Unternehmen eine Löschung ablehnen?", "Wenn gesetzliche Aufbewahrungspflichten greifen", "Nie – eine Löschung muss immer sofort erfolgen|Wenn der Aufwand für die Löschung zu hoch ist|Wenn die Daten älter als ein Jahr sind", "z. B. Rechnungen 8 Jahre (seit 2025, vorher 10), Jahresabschlüsse 10 Jahre."], ["dsgvo", "Was schützt der Datenschutz – im Unterschied zur Datensicherheit?", "Die Person und ihre Privatsphäre", "Alle Daten des Unternehmens|Die Hardware|Die Netzwerkverbindung", "Datensicherheit schützt die Daten selbst (alle Daten, technische Umsetzung)."], ["dsgvo", "Verschlüsselung und VPN bei der Übertragung sind …", "Weitergabekontrolle", "Zugangskontrolle|E einer Datei in der Quarantäne des Virenscanners?", "Sie wird isoliert, damit sie keinen Schaden anrichten kann", "Sie wird an alle Kollegen geschickt|Sie wird sofort ausgeführt|Sie wird in die Cloud hochgeladen und gelöscht", "Nach Prüfung kann sie gelöscht oder wieder freigegeben werden."], ["sec", "Was erkennt die heuristische Analyse eines Virenscanners?", "Verdächtiges Verhalten – auch bei noch unbekannter Malware", "Nur Malware, deren Signatur bereits bekannt ist|Nur Dateien, die verschlüsselt gespeichert sind|Nur Makros in Office-Dokumenten", "Signaturen erkennen nur Bekanntes, deshalb kombinieren moderne Scanner beides."], ["sec", "Was ist ein typischer Nachteil eines IDS?", "Es kann Fehlalarme auslösen (falsch-positiv oder falsch-negativ)", "Es verschlüsselt alle Daten und bremst das Netz|Es ersetzt die Firewall und blockiert selbst|Es braucht nie Updates oder Wartung", "Deshalb immer in Kombination mit Firewall, Virenschutz usw."], ["sec", "Wodurch wird ein Man-in-the-Middle-Angriff häufig eingeleitet?", "Durch DNS-Spoofing, RIP-Poisoning oder Phishing", "Durch einen Stromausfall im Rechenzentrum|Durch den Ausfall einer Platte im RAID 5|Durch einen Akkuwechsel an der USV", "Schutz: VPN/Verschlüsselung, Härten von DNS, Routern und Switches."], ["sec", "Welchen Zusatznutzen kann ein Honeypot neben dem Beobachten haben?", "Er lenkt Angreifer von den echten Systemen ab", "Er beschleunigt das Netzwerk durch Caching|Er ersetzt das Backup der echten Server|Er vergibt den Angreifern IP-Adressen", "Ein High-Interaction-Honeypot ist realistischer, aber riskanter."], ["dsgvo", "Was ist eine Datenschutz-Folgenabschätzung?", "Eine Risikoprüfung vor besonders riskanten Datenverarbeitungen", "Eine Strafe der Aufsichtsbehörde nach einem Verstoß|Ein Backup-Konzept für personenbezogene Daten|Ein Vertrag mit einem externen Dienstleister", "Sie und die Dokumentation der Maßnahmen sind bei Prüfungen besonders wichtig."], ["dsgvo", "Braucht ein Datenschutzbeauftragter ein offizielles Zertifikat?", "Nein, er muss fachkundig sein, ein Nachweis wird nicht verlangt", "Ja, er braucht ein Zertifikat der IHK|Ja, er braucht ein Zertifikat des BSI|Nur, wenn mehr als 10 Mitarbeiter Daten verarbeiten", "Er kann intern (Problem: Befangenheit) oder extern (z. B. Anwalt) sein."], ["dsgvo", "Zu welcher Art personenbezogener Daten gehören Schul- und Arbeitszeugnisse?", "Werturteile", "Besitzermerkmale|Onlinedaten|Physische Merkmale", "Besitzermerkmale = Fahrzeug, Immobilie; Onlinedaten = IP, E-Mail, Cookie-ID."], ["dsgvo", "Welche konkreten technischen Maßnahmen schreibt die DSGVO vor?", "Keine konkreten – gefordert sind angemessene TOM nach dem Stand der Technik", "Genau 8 Maßnahmen, die alle umgesetzt werden müssen|BitLocker auf allen Geräten ist ausdrücklich Pflicht|Passwörter mit mindestens 12 Zeichen sind vorgeschrieben", "Gängig sind z. B. Passwörter, NTFS-Rechte, Verschlüsselung, automatische Bildschirmsperre."], ["dsgvo", "Was muss ein Unternehmen bei besonders gravierenden Datenschutzverstößen tun?", "Sich selbst beim Landesdatenschutzbeauftragten melden", "Nichts unternehmen, solange niemand klagt|Nur die zuständige IHK informieren|Die Daten sofort ins Ausland verschieben", "Bei Datenpannen gilt die Meldefrist von 72 Stunden."], ["virt", "Wofür eignet sich Container-Virtualisierung besonders?", "Microservices und Cloud-native Anwendungen", "Legacy-Systeme mit eigenem Kernel|Windows und Linux gleichzeitig auf einem Kernel|Hardware-Emulation alter Rechner", "Viele kleine, skalierbare Dienste auf einer Plattform."], ["virt", "Was ist ein Vorteil der Vollvirtualisierung?", "Das Gast-OS muss nicht angepasst werden – gut für Legacy-Systeme", "Sie hat von allen Arten den geringsten Overhead|Alle VMs teilen sich einen gemeinsamen Kernel|Sie kommt ganz ohne Hypervisor aus", "Nachteil: relativ hoher Overhead durch Hardware-Emulation."], ["virt", "Welche Sorge besteht bei Containern in Multi-Tenant-Umgebungen?", "Die Sicherheit, weil alle Container denselb rt mit AAAA-Record", "Der Router schickt RAs mit dem Präfix; die Interface-ID bildet der Host selbst (EUI-64 oder zufällig)."], ["ip", "Was ersetzt bei IPv6 den Broadcast?", "Multicast, z. B. ff02::1 für alle Knoten", "Anycast an die nächstgelegene Adresse|Unicast an die Link-Local-Adresse fe80::1|Der Broadcast bleibt wie bei IPv4 erhalten", "IPv6 kennt keinen Broadcast mehr. ff02::1 erreicht alle Knoten im Segment, ff02::2 alle Router."], ["ip", "Wie groß ist der IPv6-Basis-Header?", "Fest 40 Byte", "Variabel 20 bis 60 Byte|Fest 20 Byte|Fest 64 Byte", "IPv4 hat 20–60 Byte variabel. IPv6 hat einen festen 40-Byte-Header; Zusätze stehen in Extension Headern."], ["ip", "Welches IPv6-Feld ersetzt die TTL von IPv4?", "Hop Limit", "Flow Label|Traffic Class|Next Header", "Das Hop Limit wird an jedem Router um 1 verringert – bei 0 wird das Paket verworfen, wie bei der TTL."], ["ip", "Ein Router bekommt vom Provider ein /56. Wie viele /64-Netze kann er im LAN bilden?", "256", "64|128|65.536", "64 − 56 = 8 Bit für Subnetze → 2⁸ = 256 Netze mit je /64."], ["ip", "Was bewirken die IPv6 Privacy Extensions?", "Zufällige, wechselnde Interface-ID statt aus der MAC", "Verschlüsselung aller IPv6-Pakete mit IPsec|Verstecken der IPv6-Adresse hinter einem NAT|Sperren von Zugriffen aus dem Internet auf den Host", "Ohne sie ließe sich ein Gerät über die aus der MAC gebildete Interface-ID wiedererkennen."], ["ip", "Was ist bei DS-Lite typisch?", "Keine eigene öffentliche IPv4 – Portfreigaben von außen gehen nicht", "Keine IPv6-Adresse – nur IPv4 über Provider-NAT|Doppelte Geschwindigkeit durch zwei Protokolle|IPv4 und IPv6 laufen über getrennte Leitungen", "Bei DS-Lite läuft IPv4 getunnelt über ein Carrier-NAT beim Provider. Von außen ist der Anschluss per IPv4 nicht erreichbar."], ["ip", "Welche Route nimmt ein Router, wenn mehrere passen?", "Die mit dem längsten passenden Präfix", "Die zuerst eingetragene Route|Die mit dem kürzesten Präfix|Immer die Default-Route 0.0.0.0/0", "Longest Prefix Match: /24 ist genauer als /16 und gewinnt. Die Default-Route greift nur, wenn nichts anderes passt."], ["ip", "Welche Einordnung von OSPF stimmt?", "Link-State-Protokoll, Interior (IGP)", "Distanzvektor-Protokoll, Interior (IGP)|Link-State-Protokoll, Exterior (EGP)|Pfadvektor-Protokoll, Exterior (EGP)", "OSPF kennt die ganze Topologie (Link-State) und arbeitet innerhalb eines autonomen Systems (IGP)."], ["ip", "Welches Routingprotokoll verbindet die autonomen Systeme im Internet?", "BGP", "OSPF|RIP|EIGRP", "BGP ist das einzige EGP im Einsatz; es ist ein Pfadvektor-Protokoll und nutzt TCP Port 179."], ["ip", "Was ist die Metrik von RIP?", "Hop-Anzahl, maximal 15", "Bandbreite der Leitung|Verzögerung in Millisekunden|Kosten aus Bandbreite und Last", "RIP zählt Router auf dem Weg; 16 Hops gilt als unerreichbar. Deshalb taugt RIP nur für kleine Netze."], ["ip", "Wofür steht die Route 0.0.0.0/0?", "Default-Route: alles, wofür es keine genauere Route gibt", "Loopback: Verkehr an den eigenen Rechner|Broadcast an alle Netze gleichzeitig|Gesperrte Route für ungültige Adressen", "Die Default-Route zeigt meist zum Internet-Router."], ["ip", "Was ist ein Nachteil von statischem Routing?", "Kein automatisches Ausweichen bei einem Leitungsausfall", "Hohe Protokolllast durch regelmäßige Updates|Es funktioniert nur mit IPv6, nicht mit IPv4|Router müssen dafür denselben Hersteller haben", "Statische Routen trägt der Admin von Hand ein. Fällt eine Leitung aus, muss er selbst umstellen."], ["dienste", "Wie wird ein ARP-Request verschickt?", "Als Broadcast an ff:ff:ff:ff:ff:ff", "Als Unicast an das Standardgateway|Als Multicast an ff02::1|Als Unicast an den DNS-Server", "Der Fragende kennt die Ziel-MAC ja noch nicht. Die Antwort kommt dann per Unicast."], ["dienste", "Was ist ein Gratuitous ARP?", "Ein Gerät verkündet ungefragt die eigene IP und MAC", "Ein Router antwortet stellvertretend für ein anderes Netz|Eine ARP-Anfrage, die keine Antwort bekommt|Ein ARP-Eintrag, der nie aus dem Cache verfällt", "Wird nach dem Start, einem IP-Wechsel oder Failover gesendet – erkennt Adresskonflikte und aktualisiert Caches."], ["dienste", "Nach welcher MAC fragt ein PC per ARP, wenn das Ziel in einem anderen Netz liegt?", "Nach der MAC des Standardgateways", "Nach der MAC des Zielrechners|Nach der MAC des DNS-Servers|Nach gar keiner – dann wird kein ARP benutzt", "Pakete in fremde Netze gehen an den Router. Auf Schicht 2 braucht es also dessen MAC."], ["dienste", "Warum ist der DHCP-Request ein Broadcast?", "Damit andere DHCP-Server ihr Angebot zurückziehen", "Weil der Client die Server-IP nicht kennt|Weil Unicast in UDP nicht möglich ist|Damit der Router die Anfrage ins Internet leitet", "Der Client kennt die Server-IP aus dem Offer. Per Broadcast erfahren aber alle Server, welches Angebot er nimmt."], ["dienste", "Welche DHCP-Zuordnung passt für einen Netzwerkdrucker?", "Statisch per Reservierung (MAC → feste IP)", "Dynamisch mit kurzer Lease-Dauer|Automatisch über APIPA (169.254.x.x)|Gar keine – Drucker nutzen nur IPv6", "So bleibt die IP immer gleich, die Verwaltung aber zentral im DHCP-Server."], ["dienste", "Welche Ports nutzt DHCP (IPv4)?", "UDP 67 (Server) und 68 (Client)", "TCP 67 (Server) und 68 (Client)|UDP 53 (Server) und 54 (Client)|UDP 546 (Server) und 547 (Client)", "DHCP läuft über UDP 67/68. 546/547 sind die Ports von DHCPv6."], ["dienste", "Was macht ein Secondary-DNS-Server?", "Er hält eine Kopie der Zone per Zonentransfer", "Er leitet alle Anfragen an den Provider weiter|Er löst nur Rückwärtsanfragen (PTR) auf|Er ist nur für die Root-Zone zuständig", "Primary hält die bearbeitbare Zone, Secondary eine Kopie – das bringt Redundanz und verteilt Last."], ["dienste", "Was liefert ein PTR-Record?", "Zu einer IP-Adresse den Namen (Reverse Lookup)", "Zu einem Namen die IPv4-Adresse|Den Mailserver einer Domain|Die zuständigen Nameserver einer Zone", "PTR wird für Rückwärtsauflösung genutzt, z. B. von Mailservern zur Prüfung des Absenders."], ["dienste", "Wann nutzt DNS statt UDP das TCP-Protokoll?", "Bei großen Antworten und bei Zonentransfers", "Bei jeder Anfrage aus dem Internet|Nur bei IPv6-Anfragen (AAAA)|Wenn der Client keinen Cache hat", "Normale Anfragen laufen per UDP 53. Große Antworten und Zonentransfers (AXFR/IXFR) brauchen TCP 53."], ["dienste", "Wie fragt ein Resolver die Root-, TLD- und autoritativen Server ab?", "Iterativ – er bekommt jeweils einen Verweis", "Rekursiv – jeder Server fragt selbst weiter|Per Broadcast an alle Server gleichzeitig|Gar nicht – er nutzt nur die HOSTS-Datei", "Client → Resolver ist rekursiv (fertige Antwort). Resolver → Root/TLD/autoritativ ist iterativ."], ["dienste", "Was steht in einem TXT-Record häufig?", "SPF-, DKIM- oder DMARC-Angaben für E-Mail", "Die IPv6-Adresse des Webservers|Der Alias-Name für eine andere Domain|Die Seriennummer der Zone", "TXT-Records enthalten freien Text, z. B. welche Server Mails für die Domain senden dürfen (SPF)."], ["fw", "Was macht ein Reverse-Proxy?", "Er nimmt Anfragen für Server entgegen und verteilt sie, z. B. auf mehrere Webserver", "Er verbirgt die Clients eines Firmennetzes vor dem Internet|Er verschlüsselt den gesamten Verkehr zwischen zwei Standorten|Er vergibt den Clients automatisch Proxy-Einstellungen", "Reverse-Proxy steht vor den Servern: Lastverteilung, TLS-Terminierung, Caching, Schutz."], ["fw", "Wie kommt ein Client automatisch an die Proxy-Einstellungen?", "Über eine PAC-Datei per WPAD oder Gruppenrichtlinie", "Über den MX-Record der Domain|Über ARP-Anfragen an das Gateway|Über die HOSTS-Datei des Proxys", "WPAD findet die PAC-Datei per DHCP oder DNS; im Firmennetz geht es auch per GPO."], ["fw", "Was unterscheidet ein Secure Web Gateway von einem einfachen Proxy?", "Es prüft den Verkehr zusätzlich auf Malware, Richtlinien und Datenabfluss", "Es arbeitet nur auf Schicht 2 und filtert dort MAC-Adressen statt URLs|Es verschlüsselt alle Verbindungen der Clients automatisch per VPN-Tunnel|Es ersetzt den DNS-Server und löst alle Namen selbst auf", "SWG = Proxy plus Sicherheitsfunktionen: URL-Filter, Malware-Scan, TLS-Inspektion, DLP."], ["fw", "Was sieht der Zielserver bei einem Elite-Proxy (High Anonymity)?", "Weder die echte IP noch, dass ein Proxy benutzt wird", "Die echte IP und den Proxy-Hinweis|Die echte IP, aber keinen Proxy-Hinweis|Nur eine absichtlich falsche IP-Adresse", "Transparent: IP sichtbar. Anonym: IP verborgen, Proxy erkennbar. Elite: beides verborgen."], ["sec", "Was passiert beim ARP-Spoofing?", "Gefälschte ARP-Antworten leiten Verkehr über den Angreifer", "Der Angreifer überflutet den DNS-Server mit Anfragen|Gefälschte DHCP-Angebote verteilen falsche Gateways|Der Angreifer errät die WLAN-Passphrase per Wörterbuch", "Er behauptet z. B., die IP des Gateways gehöre zu seiner MAC – klassischer Einstieg für Man-in-the-Middle."], ["sec", "Was schützt am Switch gegen ARP-Spoofing?", "Dynamic ARP Inspection", "Spanning Tree Protocol|Link Aggregation (LACP)|Jumbo Frames", "DAI prüft ARP-Pakete gegen bekannte IP-MAC-Zuordnungen (z. B. aus DHCP Snooping)."], ["sec", "Was leistet DNSSEC?", "Es prüft per Signatur, ob DNS-Antworten echt sind", "Es verschlüsselt alle DNS-Anfragen|Es beschleunigt die Namensauflösung per Cache|Es ersetzt die Root-Server durch Blockchain", "DNSSEC sichert Echtheit und Integrität, verschlüsselt aber nicht. Vertraulichkeit bringen DoH und DoT."], ["sec", "Wie funktioniert SYN-Flooding?", "Viele SYN-Pakete mit gefälschten Absendern füllen die Verbindungstabelle", "Viele große ICMP-Pakete legen die Leitung lahm|Gefälschte DNS-Antworten füllen den Cache|Ein Wurm verbreitet sich über offene SMB-Freigaben", "Das Opfer wartet auf ACKs, die nie kommen. Gegenmittel: SYN-Cookies, Rate Limiting."], ["sec", "Welche Einträge schützen eine Domain gegen Mail-Spoofing?", "SPF, DKIM und DMARC", "MX, CNAME und PTR|A, AAAA und NS|SOA, SRV und CAA", "SPF nennt erlaubte Server, DKIM signiert Mails, DMARC legt fest, was mit Fälschungen passiert."], ["sec", "Was ist beim CEO-Fraud die wichtigste Gegenmaßnahme?", "Rückruf über eine bekannte Nummer und Vier-Augen-Prinzip", "Ein stärkerer Virenscanner auf dem Mailserver|Längere Passwörter für die Buchhaltung|Mails nur noch verschlüsselt senden", "Die Täter nutzen Zeitdruck und Autorität. Technik hilft wenig, feste Freigabeprozesse viel."], ["spe", "Was beschreibt der RTO?", "Wie lange ein System maximal ausfallen darf", "Wie viel Datenverlust maximal akzeptabel ist|Wie oft ein Restore-Test stattfinden muss|Wie lange Backups aufbewahrt werden", "RTO = Recovery Time Objective (Ausfallzeit). RPO = Recovery Point Objective (Datenverlust)."], ["spe", "Ein Prozess hat ein RPO von 1 Stunde. Was folgt daraus?", "Mindestens stündlich sichern", "Restore muss in 1 Stunde fertig sein|Backups 1 Stunde lang aufbewahren|Nur einmal am Tag voll sichern", "Das RPO bestimmt das Sicherungsintervall. Das RTO bestimmt die Wiederherstellungstechnik."], ["spe", "Was bedeutet die „0“ in der 3-2-1-1-0-Regel?", "Null Fehler beim Prüfen der Wiederherstellung", "Null Kopien in der Cloud|Null Kosten durch Open-Source-Software|Null Minuten Ausfallzeit", "3 Kopien, 2 Medien, 1 außer Haus, 1 offline/unveränderbar, 0 Fehler beim Restore-Test."], ["spe", "Was zeichnet CDP (Continuous Data Protection) aus?", "Jede Änderung wird sofort gesichert, RPO nahe null", "Einmal pro Woche ein Vollbackup auf Band|Nur geänderte Dateien seit dem letzten Vollbackup|Ein Snapshot vor jedem Windows-Update", "CDP schreibt Änderungen fortlaufend mit Zeitstempel ins Journal – Wiederherstellung auf fast jeden Zeitpunkt."], ["spe", "MTBF 500 h, MTTR 1,5 h. Wie hoch ist die Verfügbarkeit?", "ca. 99,7 %", "ca. 99,0 %|ca. 99,97 %|ca. 98,5 %", "500 ÷ (500 + 1,5) = 0,997 → 99,7 %."], ["spe", "Wie viel Ausfall pro Jahr erlaubt 99,99 % Verfügbarkeit?", "ca. 52,6 Minuten", "ca. 8,8 Stunden|ca. 5,3 Minuten|ca. 87,6 Stunden", "8.760 h × 0,0001 = 0,876 h ≈ 52,6 min."], ["spe", "Was misst die MTTD?", "Die mittlere Zeit, bis ein Fehler bemerkt wird", "Die mittlere Zeit zwischen zwei Ausfällen|Die mittlere Reparaturzeit|Die maximale Dauer eines Backups", "Mean Time To Detect – sagt viel über die Qualität des Monitorings."], ["spe", "Welchen Abstand empfiehlt das BSI für georedundante Rechenzentren?", "Mindestens 200 km", "Mindestens 5 km|Mindestens 50 km|Mindestens 1.000 km", "Im begründeten Einzelfall sollen 100 km nicht unterschritten werden. Die Empfehlung ist nicht rechtlich bindend."], ["spe", "Was ermittelt eine Business Impact Analysis (BIA)?", "Welche Prozesse kritisch sind und was ein Ausfall kostet", "Welche Firewall-Regeln überflüssig sind|Wie schnell ein Netzwerk-Switch umschaltet|Welche Mitarbeiter Adminrechte brauchen", "Aus der BIA ergeben sich RTO und RPO je Prozess."], ["spe", "Welche Medien-Rotation überschreibt Medien exponentiell seltener?", "Türme von Hanoi", "Großvater-Vater-Sohn|Forever Incremental|3-2-1-Regel", "Medium A jeden 2. Tag, B jeden 4., C jeden 8. Tag … – wenige Medien, trotzdem alte Stände."], ["osi", "Wie viele Leitungen braucht ein vollvermaschtes Netz mit 6 Knoten?", "15", "12|30|36", "n × (n − 1) ÷ 2 = 6 × 5 ÷ 2 = 15."], ["osi", "Welche Topologie ist im heutigen LAN Standard?", "Stern bzw. erweiterter Stern (Baum)", "Bus mit Abschlusswiderständen|Ring mit Token Passing|Vollvermaschung aller PCs", "Jedes Gerät hat eine eigene Leitung zum Switch; große Netze werden hierarchisch als Baum aufgebaut."], ["osi", "Wie viele Schichten hat das DoD- bzw. TCP/IP-Modell?", "4", "5|7|3", "Anwendung, Transport, Internet, Netzzugang."], ["osi", "Welcher OSI-Schicht entspricht die Internet-Schicht des DoD-Modells?", "Schicht 3 – Vermittlung", "Schicht 2 – Sicherung|Schicht 4 – Transport|Schicht 7 – Anwendung", "Internet-Schicht = IP, ICMP = OSI-Schicht 3."], ["osi", "Wie heißt die Dateneinheit auf Schicht 2?", "Frame (Rahmen)", "Paket|Segment|Datagramm", "Schicht 4: Segment/Datagramm, Schicht 3: Paket, Schicht 2: Frame, Schicht 1: Bits."], ["osi", "Wozu dient ein Patchfeld?", "Feste Leitungen enden dort und werden per Patchkabel flexibel auf Switchports gelegt", "Es verstärkt das Signal aktiv, damit Strecken über 100 m möglich werden|Es trennt Broadcast-Domänen und leitet zwischen VLANs weiter wie ein Router|Es versorgt alle angeschlossenen Endgeräte per PoE mit Strom", "Das Patchfeld ist passiv. Umstecken ändert die Zuordnung, ohne die Verkabelung anzufassen."], ["osi", "Welches Zugriffsverfahren nutzt WLAN?", "CSMA/CA – Kollisionen vermeiden", "CSMA/CD – Kollisionen erkennen|Token Passing – nur mit Token senden|Polling – der AP fragt jeden Client ab", "Funk kann Kollisionen nicht zuverlässig erkennen. Deshalb: abhören, zufällig warten, senden, ACK abwarten."], ["osi", "Was ist der Unterschied zwischen Gateway und Router?", "Ein Gateway kann auch zwischen verschiedenen Protokollen übersetzen", "Ein Router arbeitet auf Schicht 2, ein Gateway auf Schicht 1|Ein Gateway verbindet nur Geräte im selben Netz|Es gibt keinen – beides sind exakt dasselbe Gerät", "Jeder Router ist ein Gateway, aber nicht jedes Gateway ist ein Router (z. B. VoIP-Gateway)."], ["wiso", "Was ist „Bedarf“?", "Ein Bedürfnis, das mit Kaufkraft gedeckt ist", "Ein Wunsch, der unrealistisch ist|Die Menge, die tatsächlich gekauft wurde|Ein Grundbedürfnis wie Essen und Trinken", "Wunsch → Bedürfnis → Bedarf (mit Geld) → Nachfrage (tritt am Markt auf)."], ["wiso", "Mit 1.000 € soll der leistungsstärkste PC gekauft werden. Welches Prinzip ist das?", "Maximalprinzip", "Minimalprinzip|Optimumprinzip|Maximumprinzip (BSI)", "Mittel fest, Nutzen maximal = Maximalprinzip. Ziel fest, Mittel minimal = Minimalprinzip."], ["wiso", "Zu welchem Sektor gehört ein IT-Systemhaus?", "Tertiärer Sektor (Dienstleistung)", "Primärer Sektor (Urproduktion)|Sekundärer Sektor (Weiterverarbeitung)|Gar keinem Sektor", "Dienstleistungen gehören zum tertiären Sektor; manche zählen IT-Dienste als quartären Sektor."], ["wiso", "Drucker und Toner sind …", "Komplementärgüter", "Substitutionsgüter|Inferiore Güter|Freie Güter", "Komplementärgüter ergänzen sich, Substitutionsgüter ersetzen sich (z. B. Butter/Margarine)."], ["wiso", "Der Preis liegt über dem Gleichgewichtspreis. Was entsteht?", "Ein Angebotsüberhang – der Preis sinkt", "Ein Nachfrageüberhang – der Preis steigt|Ein Gleichgewicht – nichts ändert sich|Ein Monopol – der Preis bleibt fest", "Bei zu hohem Preis wollen mehr verkaufen als kaufen. Anbieter senken den Preis."], ["wiso", "Wenige Anbieter, viele Nachfrager – welche Marktform?", "Angebotsoligopol", "Polypol|Angebotsmonopol|Nachfrageoligopol", "Beispiele: Mobilfunknetze, Mineralöl, Betriebssysteme."], ["wiso", "Welcher Produktionsfaktor ist abgeleitet (derivativ)?", "Kapital", "Boden|Arbeit|Natur (Umwelt)", "Kapital (Maschinen, Gebäude) entsteht erst aus Boden und Arbeit."], ["wiso", "Was ist ein Zielkonflikt im Unternehmen?", "Höhere Löhne senken den Gewinn", "Energie sparen senkt Kosten und schont die Umwelt|Mehr Umsatz erhöht den Gewinn|Weiterbildung hat keinen Einfluss auf den Gewinn", "Zielkonflikt: ein Ziel behindert ein anderes. Energie sparen wäre Zielharmonie, das letzte Zielneutralität."], ["wiso", "Was beschreibt die Konsumentenrente?", "Käufer hätten mehr gezahlt und sparen die Differenz", "Anbieter verkaufen teurer, als sie müssten|Der Staat erstattet Verbrauchern Steuern|Rentner bekommen Rabatt beim Einkauf", "Gegenstück: Produzentenrente – Anbieter hätten auch billiger verkauft."], ["wiso", "Was sind inferiore Güter?", "Güter, deren Nachfrage bei steigendem Einkommen sinkt", "Güter, die besonders hochwertig verarbeitet sind|Güter, die nichts kosten, wie Luft|Güter, die sich gegenseitig ergänzen", "Bei mehr Einkommen steigen Menschen auf bessere Produkte um (z. B. vom Discount-Produkt zur Marke)."], ["wiso", "Welche Stufe steht in der Maslow-Pyramide ganz oben?", "Selbstverwirklichung", "Sicherheitsbedürfnisse|Soziale Bedürfnisse|Ich-Bedürfnisse (Wertschätzung)", "Von unten: physiologische, Sicherheits-, soziale, Ich-Bedürfnisse, Selbstverwirklichung."], ["wiso", "Was kennzeichnet die soziale Marktwirtschaft?", "Markt plus Staat, der Wettbewerb und sozialen Ausgleich sichert", "Der Staat plant Produktion, Mengen und Preise für alle Unternehmen|Der Staat greift nie ein, der Markt regelt alles allein|Alle großen Unternehmen gehören dem Staat und werden zentral gelenkt", "Beispiele: Kartellamt, Sozialversicherung, Kündigungsschutz."], ["prog", "Welcher SQL-Befehl ändert vorhandene Datensätze?", "UPDATE … SET … WHERE …", "ALTER TABLE … MODIFY …|INSERT INTO … VALUES …|CHANGE … TO …", "UPDATE ändert Daten, ALTER TABLE ändert die Struktur der Tabelle."], ["prog", "Was liefert ein INNER JOIN?", "Nur Zeilen, die in beiden Tabellen einen passenden Partner haben", "Alle Zeilen der linken Tabelle, auch ohne Partner|Alle Zeilen beider Tabellen, auch ohne Partner|Nur Zeilen ohne passenden Partner", "LEFT JOIN nimmt zusätzlich die linke Tabelle vollständig, FULL OUTER JOIN beide."], ["prog", "Welche Funktion bildet den Durchschnitt einer Spalte?", "AVG()", "SUM()|MEAN()|COUNT()", "AVG = average. MEAN gibt es in Standard-SQL nicht."], ["prog", "Wie sortiert man absteigend?", "ORDER BY spalte DESC", "ORDER BY spalte ASC|SORT BY spalte DOWN|GROUP BY spalte DESC", "ASC (aufsteigend) ist Standard, DESC absteigend."], ["prog", "Was ist ein Array?", "Eine Datenstruktur mit mehreren Werten gleichen Typs über einen Index", "Ein einzelner Wahrheitswert, der nur wahr oder falsch sein kann|Eine Schleife mit einer festen Anzahl von Durchläufen|Eine Funktion, die keinen Rückgabewert liefert", "In vielen Sprachen beginnt der Index bei 0."], ["prog", "Was ist der Unterschied zwischen = und == in vielen Programmiersprachen?", "= weist zu, == vergleicht", "= vergleicht, == weist zu|Beides weist zu, == nur bei Zahlen|Es gibt keinen Unterschied", "x = 5 setzt x auf 5. x == 5 prüft, ob x gleich 5 ist (wahr/falsch)."], ["prog", "Welcher Datentyp passt für einen Preis wie 19,99?", "Kommazahl (float/double, für Geld besser decimal)", "Integer (ganze Zahl), weil Preise immer ganzzahlig sind|Boolean (wahr/falsch)|Char (einzelnes Zeichen)", "Für Geldbeträge nimmt man in Datenbanken oft DECIMAL, um Rundungsfehler zu vermeiden."], ["prog", "Was bedeutet die 1. Normalform?", "Jedes Feld enthält nur einen einzelnen (atomaren) Wert", "Jede Tabelle hat genau einen Fremdschlüssel|Es gibt keine transitiven Abhängigkeiten|Alle Tabellen haben dieselben Spalten", "2. NF: volle Abhängigkeit vom Schlüssel; 3. NF: keine transitiven Abhängigkeiten."], ["prog", "Welches Symbol steht im PAP für Start und Ende?", "Abgerundetes Rechteck (Oval)", "Raute|Parallelogramm|Rechteck mit doppelten Seitenlinien", "Rechteck = Anweisung, Raute = Verzweigung, Parallelogramm = Ein-/Ausgabe, doppelte Seitenlinien = Unterprogramm."], ["prog", "Was bewirkt eine Zählschleife FÜR i VON 1 BIS 5?", "Sie läuft genau fünfmal", "Sie läuft viermal|Sie läuft sechsmal|Sie läuft, bis i größer als 6 ist", "i nimmt nacheinander 1, 2, 3, 4, 5 an."], ["prog", "Wozu dient ein Primärschlüssel?", "Er identifiziert jeden Datensatz eindeutig", "Er verschlüsselt die Tabelle|Er sortiert die Tabelle automatisch|Er verweist auf eine andere Tabelle", "Der Verweis auf eine andere Tabelle ist der Fremdschlüssel."], ["prog", "Was ist eine Variable?", "Ein benannter Speicherplatz für einen Wert, der sich ändern kann", "Ein fester Wert, der sich während des Programms nie ändert|Eine Bedingung, die in einer Verzweigung geprüft wird|Ein Kommentar im Quelltext, den der Compiler ignoriert", "Ein Wert, der sich nicht ändern darf, heißt Konstante."], ["pm", "Welche Phase kommt im klassischen Projektablauf nach der Planung?", "Durchführung", "Initialisierung|Abschluss|Definition", "Initialisierung → Definition → Planung → Durchführung → Abschluss (Controlling begleitend)."], ["pm", "Was ist ein Meilenstein?", "Ein wichtiges Ereignis ohne Dauer, an dem geprüft wird", "Ein Vorgang mit besonders langer Dauer|Der teuerste Arbeitsschritt im Projekt|Die Person, die das Projekt leitet", "Meilensteine markieren z. B. das Ende einer Phase und haben die Dauer 0."], ["pm", "Was ist der freie Puffer eines Vorgangs?", "Wie weit er sich verschieben lässt, ohne den Nachfolger zu verzögern", "Wie weit er sich verschieben lässt, ohne das Projektende zu verzögern|Die Zeit zwischen zwei Meilensteinen|Die Pause zwischen zwei Sprints", "FP = kleinster FAZ der Nachfolger − FEZ. Der Gesamtpuffer bezieht sich auf das Projektende."], ["pm", "Wer priorisiert in Scrum das Product Backlog?", "Der Product Owner", "Der Scrum Master|Das Entwicklungsteam|Der Kunde selbst", "Der Scrum Master sorgt für den Prozess, das Team setzt um."], ["pm", "Was ist ein Daily Scrum?", "Ein tägliches, kurzes Abstimmungstreffen (ca. 15 Minuten)", "Ein tägliches Review mit dem Kunden|Die tägliche Planung des ganzen Sprints|Ein täglicher Bericht an die Geschäftsführung", "Typisch (klassisch): Was habe ich gemacht, was mache ich heute, was hindert mich? Der Scrum Guide 2020 schreibt die Fragen nicht mehr vor."], ["pm", "Was zeigt ein Projektstrukturplan (PSP)?", "Alle Arbeitspakete des Projekts hierarchisch gegliedert", "Die zeitliche Abfolge als Balken|Die Kosten pro Monat|Die Zuständigkeiten nach Hierarchie im Unternehmen", "Der PSP sagt, WAS zu tun ist. Wann – das zeigen Netzplan und Gantt-Diagramm."], ["pm", "Was gehört in eine Stakeholder-Analyse?", "Wer betroffen ist, welchen Einfluss und welche Haltung er hat", "Welche Aktien die Firma besitzt|Welche Hardware im Projekt gekauft wird|Welche Arbeitspakete kritisch sind", "Stakeholder sind alle, die vom Projekt betroffen sind oder es beeinflussen können."], ["pm", "Was ist ein Risiko im Projektmanagement?", "Ein mögliches Ereignis mit negativen Folgen für das Projekt", "Ein bereits eingetretenes Problem, das sofort gelöst werden muss|Eine sichere Kostensteigerung, die schon feststeht|Ein Fehler im Pflichtenheft, der vor der Abnahme auffällt", "Risiko = Eintrittswahrscheinlichkeit × Schadenshöhe; man plant Maßnahmen dagegen."], ["pm", "Was zeichnet agiles Vorgehen gegenüber dem Wasserfall aus?", "Kurze Zyklen mit Feedback, Anforderungen dürfen sich ändern", "Alle Anforderungen stehen am Anfang fest|Es gibt keine Tests und keine Planung|Nur der Kunde darf Aufgaben erledigen", "Wasserfall: Phasen nacheinander, Änderungen teuer. Agil: iterativ, z. B. Scrum mit Sprints."], ["pm", "Vier Vorgänge auf dem kritischen Pfad – was gilt für sie?", "Jede Verzögerung verschiebt das Projektende", "Sie dürfen beliebig verschoben werden|Sie haben einen hohen freien Puffer|Sie können parallel weggelassen werden", "Auf dem kritischen Pfad ist der Gesamtpuffer 0."], ["pm", "Was ist eine Lessons-Learned-Runde?", "Rückblick am Projektende: was lief gut, was verbessern wir", "Schulung der Anwender vor dem Go-live|Erste Besprechung zum Projektstart|Abnahme durch den Auftraggeber", "Die Erkenntnisse fließen in künftige Projekte ein."], ["pm", "Wozu dient die Abnahme am Projektende?", "Der Auftraggeber bestätigt, dass die Leistung den Anforderungen entspricht", "Der Projektleiter verteilt die Arbeitspakete an das Team|Das Team schätzt gemeinsam die Dauer der Vorgänge|Der Lieferant schickt die Schlussrechnung an den Kunden", "Mit dem Abnahmeprotokoll geht die Verantwortung über, oft beginnt die Gewährleistung."], ["service", "Was ist ein Major Incident?", "Eine Störung mit großer Auswirkung, die sofort mit höchster Priorität bearbeitet wird", "Eine dauerhafte Ursache hinter vielen wiederkehrenden Störungen|Ein großer, geplanter Change, der am Wochenende eingespielt wird|Eine dringende Anfrage einer Führungskraft nach neuer Software", "Major Incidents haben meist einen eigenen, beschleunigten Ablauf und Kommunikationsplan."], ["service", "Wonach richtet sich die Priorität eines Tickets?", "Nach Auswirkung (Impact) und Dringlichkeit (Urgency)", "Nach der Reihenfolge des Eingangs|Nach dem Rang des Anrufers im Unternehmen|Nach der Länge der Fehlerbeschreibung", "Priorität = Impact × Urgency, oft als Matrix dargestellt."], ["service", "Was ist ein Workaround?", "Eine vorläufige Umgehungslösung, bis die Ursache behoben ist", "Die endgültige Lösung eines Problems|Eine Änderung, die vorher genehmigt wurde|Ein Ticket, das an den 2nd Level geht", "Beispiel: anderen Drucker zuweisen, bis der Treiber repariert ist."], ["service", "Was ist eine funktionale Eskalation?", "Weitergabe an Fachleute mit mehr Know-how (1st → 2nd Level)", "Weitergabe an die Geschäftsführung|Abschluss des Tickets ohne Lösung|Rückgabe des Tickets an den Kunden", "Hierarchisch geht es nach oben in der Führung, funktional zur Fachkompetenz."], ["service", "Was regelt das Change Management?", "Änderungen geplant, bewertet und genehmigt durchführen", "Störungen möglichst schnell beheben|Neue Mitarbeiter einarbeiten|Lizenzen nach Ablauf verlängern", "Ziel: Risiken durch Änderungen klein halten; Freigabe oft durch ein CAB (Change Advisory Board)."], ["service", "Was ist ein Single Point of Contact (SPOC)?", "Eine zentrale Anlaufstelle für alle Anfragen der Anwender", "Ein Server, dessen Ausfall alles lahmlegt|Ein Admin mit allen Rechten|Ein einzelner Switchport für das Management", "In der Regel der Service Desk. Nicht verwechseln mit dem Single Point of Failure."], ["service", "Was gehört in eine gute Ticketbeschreibung?", "Wer, was genau, seit wann, welche Fehlermeldung, schon versucht", "Nur Name und Abteilung des Anrufers, der Rest kommt später|Vor allem die eigene Vermutung über die Ursache|Die Telefonnummer und Vertragsnummer des Herstellers", "Je genauer die Beschreibung, desto schneller die Lösung – ohne Rückfragen."], ["service", "Was ist bei einem Kundengespräch am Telefon wichtig?", "Aktiv zuhören, nachfragen, zusammenfassen, Ergebnis vereinbaren", "Möglichst viele Fachbegriffe verwenden|Den Kunden bei Fehlern korrigieren|Das Gespräch schnell beenden", "Am Ende fasst man zusammen, was passiert und bis wann der Kunde Rückmeldung bekommt."], ["service", "Was beschreibt eine CMDB?", "Eine Datenbank mit allen IT-Komponenten und ihren Beziehungen", "Eine Liste aller offenen und geschlossenen Tickets|Ein verschlüsseltes Dokument mit allen Admin-Passwörtern|Ein Vertrag zwischen IT-Dienstleister und Kunde", "CMDB = Configuration Management Database; Einträge heißen Configuration Items (CI)."], ["service", "Welche Lizenzart erlaubt es, die Software beliebig zu nutzen, zu ändern und weiterzugeben, auch ohne die Änderungen offenzulegen?", "MIT-Lizenz (permissive Open Source)", "GPL (Copyleft)|OEM-Lizenz|Proprietäre Einzelplatzlizenz", "MIT/BSD sind freizügig. Die GPL verlangt, dass Änderungen wieder offen sind."], ["service", "Was ist ein Vorteil eines Self-Service-Portals?", "Anwender lösen einfache Anliegen selbst, rund um die Uhr", "Es ersetzt das komplette Service-Desk-Team|Es braucht keinerlei Pflege|Es verhindert alle Störungen", "Typisch: Passwort zurücksetzen, Software bestellen, Wissensdatenbank."], ["service", "Was regelt ein Underpinning Contract (UC)?", "Leistungen eines externen Dienstleisters für die IT", "Interne Absprachen zwischen zwei Abteilungen|Die Lizenzbedingungen eines Betriebssystems|Den Arbeitsvertrag eines Service-Mitarbeiters", "SLA: IT ↔ Kunde, OLA: intern, UC: IT ↔ externer Lieferant."], ["dsgvo", "Fall: Eine Arztpraxis sichert Patientendaten auf ein NAS. Welcher Schutzbedarf bei Vertraulichkeit?", "Hoch bis sehr hoch – Gesundheitsdaten sind besonders schutzwürdig", "Normal – es sind nur Namen und Adressen|Hoch – aber nur wegen der Verfügbarkeit|Kein Schutzbedarf – das NAS steht im Haus", "Gesundheitsdaten sind besondere Kategorien nach Art. 9 DSGVO; eine Offenlegung hätte gravierende Folgen."], ["dsgvo", "Fall: Mitarbeiter sollen nur die Ordner ihrer Abteilung öffnen können. Welche TOM?", "Zugriffskontrolle (Berechtigungen)", "Zutrittskontrolle (Gebäude)|Zugangskontrolle (Anmeldung)|Weitergabekontrolle (Transport)", "Zutritt = Räume, Zugang = Systeme, Zugriff = Daten innerhalb der Systeme."], ["dsgvo", "Fall: Laptops von Außendienstlern gehen gelegentlich verloren. Welche Maßnahme schützt die Daten am besten?", "Festplattenverschlüsselung, z. B. BitLocker", "Ein Aufkleber mit der Firmenadresse|Ein BIOS-Passwort allein|Tägliches Backup auf ein NAS", "Backup schützt die Verfügbarkeit, nicht die Vertraulichkeit. Ein BIOS-Passwort lässt sich umgehen, wenn die Platte ausgebaut wird."], ["dsgvo", "Fall: Ein externer Dienstleister wartet die Kundendatenbank per Fernzugriff. Was ist rechtlich nötig?", "Ein Vertrag zur Auftragsverarbeitung (AV-Vertrag)", "Eine Einwilligung jedes einzelnen Kunden|Eine Meldung an die Aufsichtsbehörde|Nichts, Wartung ist keine Verarbeitung", "Wer im Auftrag personenbezogene Daten verarbeitet oder darauf zugreifen kann, braucht einen AV-Vertrag nach Art. 28 DSGVO."], ["sec", "Fall: Ein Webshop darf höchstens 4 Stunden ausfallen. Welches Schutzziel steht im Vordergrund?", "Verfügbarkeit", "Vertraulichkeit|Integrität|Authentizität", "Die maximale Ausfallzeit beschreibt die Verfügbarkeit (→ RTO)."], ["sec", "Fall: Ein Server betreibt den Webshop (Schutzbedarf hoch) und das Intranet (normal). Welchen Schutzbedarf hat der Server?", "Hoch – nach dem Maximumprinzip", "Normal – nach dem Durchschnitt|Sehr hoch – wegen der Kumulation immer|Gar keinen – nur Anwendungen haben Schutzbedarf", "Das System erbt den höchsten Schutzbedarf seiner Anwendungen. Kumulation kann ihn zusätzlich erhöhen."]], "wf": [["hw", "L3-Cache ist schneller als L1-Cache.", false, "Umgekehrt: L1 ist am schnellsten."], ["hw", "DDR-RAM überträgt zweimal pro Takt.", true, "Daher „Double Data Rate“."], ["hw", "DDR6 ist ein fertiger Standard für Arbeitsspeicher.", false, "DDR6 ist noch in Entwicklung. GDDR6 ist Grafikspeicher."], ["hw", "Jede PCIe-Generation verdoppelt ungefähr die Geschwindigkeit.", true, "Faustregel aus der Tabelle."], ["hw", "USB 3.0-Buchsen sind meist blau.", true, "USB 2.0 schwarz, 3.0 blau, 3.1 türkis."], ["hw", "DRAM muss ständig aufgefrischt werden.", true, "Deshalb dynamisch – SRAM nicht."], ["spe", "RAID ersetzt ein Ba ternet · Satellit"], ["dienste", "Drei Arten von Diensten (Layer 7)", "Infrastruktur (DHCP, DNS, NTP, AD, PKI) → Netz funktioniert\nManagement (Monitoring, Logging, Softwareverteilung, Proxy) → beherrschbar\nKommunikation (Web, Mail, Dateien, VoIP/Teams) → Nutzen"], ["dienste", "DHCP-Scope (Beispiel)", "Bereich, Lease (Standard 8 Tage), Ausschlüsse, Reservierungen per MAC, Optionen 3/6/15/42/66/67, IP-Überwachung (Konflikterkennung)"], ["wlan", "802.1X-Ablauf", "Client assoziiert sich → EAPOL zum AP → AP leitet EAP an RADIUS → Prüfung (EAP-TLS/PEAP) → 4-Way-Handshake → optional VLAN/ACL → Netz frei"], ["wlan", "Vorteile WPA-Enterprise", "Pro Person/Gerät nachvollziehbar · schnelles Offboarding · dynamische VLANs/ACLs · eigene Schlüssel je Sitzung · zentrales Logging · skalierbar"], ["wlan", "Segmentiertes WLAN-Design", "APs im Management-Netz hinter der Firewall · je SSID ein VLAN (Mitarbeiter, Gäste, IoT) · Gäste nur Internet · Captive Portal optional · stoppt Lateral Movement"], ["sec", "Berühmte Angriffe", "ILOVEYOU 2000 (Mail-Wurm) · Code Red 2001 (Server-Wurm) · Zeus ab 2007 (Banking-Trojaner) · Dyn 2016 (DDoS mit IoT-Botnetz) · WannaCry 2017 (Ransomware)"], ["sec", "Arbeitsweise Virenscanner", "Dateien scannen → Signaturen vergleichen → Verhalten analysieren (Heuristik) → Bereinigen oder Quarantäne · oft mit Machine Learning"], ["dsgvo", "Kategorien personenbezogener Daten", "Bankdaten · Kennnummern · physische Merkmale · allgemeine Personendaten · Besitzermerkmale · Onlinedaten (IP, Cookie) · Gesundheit · Werturteile (Zeugnisse)"], ["dsgvo", "Datenschutzbeauftragter", "Unter bestimmten Umständen Pflicht · intern (Befangenheit) oder extern (Anwalt, IT-Dienstleister) · Fachkunde nötig, kein Zertifikat vorgeschrieben"], ["virt", "Einsatz der Virtualisierungsarten", "Voll: Legacy, Testumgebungen · Para: Hochleistungs-RZ · Container: Microservices · App-Virtualisierung: Versionskonflikte vermeiden · Netzwerk/Storage: Rechenzentrum"], ["hk", "Handlungskosten", "Betriebliche Kosten: Gehälter, Miete, Strom, Versicherungen, Abschreibungen, Werbung, Buchhaltung · Zuschlag aus der Kostenrechnung, nicht schätzen"], ["ip", "IPv6 kürzen nach RFC 5952", "Führende Nullen weg · längste Null-Folge durch :: (nur einmal) · einzelner Null-Block bleibt 0 · bei Gleichstand die linke · Kleinbuchstaben"], ["ip", "NDP-Nachrichten", "RS (Host sucht Router) · RA (Router meldet Präfix) · NS (fragt MAC, auch DAD) · NA (Antwort) · Redirect"], ["ip", "SLAAC vs. DHCPv6", "SLAAC: Präfix per RA, Interface-ID bildet der Host selbst.\nDHCPv6 zustandsbehaftet: Server vergibt Adressen.\nDHCPv6 zustandslos: nur Zusatzinfos wie DNS."], ["ip", "IGP vs. EGP", "IGP: innerhalb eines autonomen Systems (RIP, OSPF, EIGRP, IS-IS).\nEGP: zwischen autonomen Systemen (BGP)."], ["ip", "Distanzvektor vs. Link-State", "Distanzvektor: kennt nur Entfernung/Richtung, schickt Tabelle regelmäßig (RIP).\nLink-State: kennt die ganze Topologie, Updates nur bei Änderungen, Dijkstra (OSPF)."], ["dienste", "ARP-Arten", "Proxy-ARP (Router antwortet stellvertretend) · Gratuitous ARP (ungefragt melden) · RARP (MAC → IP, veraltet) · InARP (IP der WAN-Gegenstelle)"], ["dienste", "DHCP-Zuordnungsarten", "Statisch: Reservierung MAC → IP\nAutomatisch: einmal vergeben, dann dauerhaft\nDynamisch: nur für die Lease-Dauer"], ["dienste", "DNS-Servertypen", "Root → TLD → autoritativ (Primary/Secondary) · rekursiver Resolver mit Cache · Caching-only · Forwarder"], ["dienste", "DNS rekursiv vs. iterativ", "Rekursiv: Client fragt einmal, bekommt die fertige Antwort.\nIterativ: Resolver fragt Root, TLD, autoritativ nacheinander und bekommt Verweise."], ["fw", "Forward- vs. Reverse-Proxy", "Forward: vor den Clients – Webfilter, Caching, Anonymisierung.\nReverse: vor den Servern – Lastverteilung, TLS-Terminierung, Schutz."], ["sec", "Spoofing-Arten", "ARP-Spoofing · IP-Spoofing · DNS-Spoofing/Cache Poisoning · Mail-Spoofing · URL-Spoofing"], ["sec", "DNSSEC in einem Satz", "Signiert DNS-Einträge, damit Resolver ihre Echtheit prüfen können – verschlüsselt aber nicht (dafür DoH/DoT)."], ["spe", "RPO vs. RTO", "RPO: wie viel Datenverlust (→ Sicherungsintervall).\nRTO: wie lange Ausfall (→ Wiederherstellungstechnik)."], ["spe", "MTBF · MTTR · MTTD", "MTBF: Zeit zwischen Ausfällen · MTTR: Reparaturzeit · MTTD: Zeit bis zur Erkennung\nVerfügbarkeit = MTBF ÷ (MTBF + MTTR)"], ["spe", "3-2-1-1-0", "3 Kopien · 2 Medien · 1 außer Haus · 1 offline/unveränderbar · 0 Fehler beim Restore-Test"], ["spe", "Verfügbarkeit → Ausfall pro Jahr", "99 % ≈ 87,6 h · 99,9 % ≈ 8,76 h · 99,99 % ≈ 52,6 min · 99,999 % ≈ 5,3 min"], ["osi", "DoD-Modell", "4 Anwendung (OSI 5–7) · 3 Transport (4) · 2 Internet (3) · 1 Netzzugang (1–2)"], ["osi", "Dateneinheiten (PDU)", "Schicht 4: Segment/Datagramm · 3: Paket · 2: Frame · 1: Bits"], ["osi", "CSMA/CD vs. CSMA/CA", "CD: Kollision erkennen (altes Ethernet, Halbduplex).\nCA: Kollision vermeiden (WLAN, mit ACK, optional RTS/CTS)."], ["wiso", "Wunsch → Bedarf → Nachfrage", "Wunsch (Vorstellung) → Bedürfnis (Mangelgefühl) → Bedarf (mit Kaufkraft) → Nachfrage (am Markt)"], ["wiso", "Ökonomisches Prinzip", "Maximalprinzip: Mittel fest, Nutzen maximal.\nMinimalprinzip: Ziel fest, Mittel minimal."], ["wiso", "Wirtschaftssektoren", "Primär: Urproduktion · Sekundär: Weiterverarbeitung · Tertiär: Dienstleistung"], ["wiso", "Marktformen", "Viele Anbieter: Polypol · wenige: Oligopol · einer: Monopol (jeweils Angebots- oder Nachfrageseite)"], ["wiso", "Zielbereiche", "Ökonomisch · sozial · ökologisch – Zielharmonie, Zielkonflikt oder Zielneutralität"], ["service", "SLA · OLA · UC", "SLA: IT ↔ Kunde · OLA: IT-intern zwischen Abteilungen · UC: IT ↔ externer Dienstleister"]], "zuordnen": [{"name": "Ports & Dienste", "t": "osi", "paare": [["22", "SSH / SFTP"], ["25", "SMTP"], ["53", "DNS"], ["67/68", "DHCP"], ["80", "HTTP"], ["443", "HTTPS"], ["3389", "RDP"], ["88", "Kerberos"], ["389", "LDAP"], ["636", "LDAPS"], ["445", "SMB"], ["123", "NTP"], ["161", "SNMP"], ["993", " "Gateway"], ["Option 6", "DNS-Server"], ["Option 15", "Domänenname"], ["Option 42", "NTP-Server"]]}, {"name": "ITIL & Lizenzen", "t": "service", "paare": [["Incident", "Drucker druckt nicht"], ["Problem", "Treiber stürzt immer wieder ab"], ["Change", "Firmware-Update ausrollen"], ["Service Request", "Passwort zurücksetzen"], ["OEM", "an ein Gerät gebunden"], ["Retail", "übertragbar"], ["Subscription", "monatlich/jährlich"], ["GPL", "Copyleft"], ["OLA", "interne Vereinbarung"], ["UC", "Vertrag mit Lieferant"]]}, {"name": "Hardware-Werte", "t": "hw", "paare": [["DDR3", "1,5 V"], ["DDR4", "1,2 V"], ["DDR5", "1,1 V"], ["DDR2", "1,8 V"], ["USB 2.0", "480 Mbit/s"], ["USB 3.0", "5 Gbit/s"], ["USB4", "40 Gbit/s"], ["PCIe 3.0", "8 GT/s"], ["PCIe 5.0", "32 GT/s"], ["Mini-ITX", "17 × 17 cm"], ["ATX", "30,5 × 24,5 cm"]]}, {"name": "Hex ↔ Dezimal", "t": "ip", "paare": [["A", "10"], ["C", "12"], ["F", "15"], ["C0", "192"], ["FF", "255"], ["80", "128"], ["E0", "224"], ["10", "16"], ["1F", "31"], ["64", "100"]]}, {"name": "Handelskalkulation", "t": "hk", "paare": [["Listeneinkaufspreis − Rabatt", "Zieleinkaufspreis"], ["Zieleinkaufspreis − Skonto", "Bareinkaufspreis"], ["Bareinkaufspreis + Bezugskosten", "Einstandspreis"], ["Einstandspreis + Handlungskosten", "Selbstkostenpreis"], ["Selbstkosten + Gewinn", "Barverkaufspreis"], ["Barverkaufspreis + Kundenskonto", "Zielverkaufspreis"], ["Zielverkaufspreis + Kundenrabatt", "Nettoverkaufspreis"], ["Nettoverkaufspreis + USt", "Bruttoverkaufspreis"]]}, {"name": "Kabel & Header-Felder", "t": "osi", "paare": [["10BaseT", "10 Mbit/s, Cat 3"], ["100BaseT", "100 Mbit/s, Cat 5"], ["10GBaseT", "10 Gbit/s, Cat 6A"], ["UTP", "ohne Schirmung"], ["TTL", "verhindert endloses Kreisen"], ["Fragment Offset", "Position des Fragments"], ["Fenstergröße", "Bytes bis zur Bestätigung"], ["FCS", "Prüfsumme im Ethernet-Frame"], ["Sequenznummer", "Reihenfolge der TCP-Segmente"], ["Type of Service", "Priorität des Pakets"]]}, {"name": "Berühmte Angriffe", "t": "
